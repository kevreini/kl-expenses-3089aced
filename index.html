<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#fbd3b0">
<title>Expenses</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fbf7f3;
    --ink: #2b1d14;
    --muted: #6b5a4e;
    --rule: #eadfd5;
    --accent: #a64a18;
    --tint: #fde6d2;
    --cover: #fbd3b0;
    --on-cover: #3a2213;
    --on-cover-muted: #6e4a33;
    --on-cover-line: rgba(58, 34, 19, 0.55);
    --on-cover-fill: rgba(58, 34, 19, 0.08);
    --gutter: 20px;
    --bar-h: 57px;
    /* To do who chips: one look per person, none of them the muted age chip */
    --kev-bg: #d7ebf1;
    --kev-ink: #114a5f;
    --lili-bg: #f0e1f4;
    --lili-ink: #622873;
    --couple-bg: #dff0d8;
    --couple-ink: #2c5420;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums lining-nums;
    overflow-wrap: anywhere;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }

  /* The cover: the PIN screen, the loading state and the top of every screen share one apricot panel. */
  .cover {
    min-height: 100vh;
    background: var(--cover);
    color: var(--on-cover);
    display: flex;
    align-items: center;
  }
  .cover .wrap { width: 100%; padding-top: 32px; padding-bottom: 64px; }
  .names { font-size: 15px; color: var(--on-cover-muted); }
  .cover h1 { font-size: 40px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 36px; }
  .cover :focus-visible, .panel :focus-visible { outline-color: var(--on-cover); }
  .cover label { display: block; font-size: 15px; color: var(--on-cover-muted); margin-bottom: 8px; }
  #pin {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 10px 16px;
    font: inherit;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: var(--on-cover);
    background: var(--on-cover-fill);
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
  }
  #go, #retry {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    color: var(--cover);
    background: var(--on-cover);
  }
  #go:disabled { opacity: 0.55; cursor: default; }
  #msg { margin-top: 16px; min-height: 1.45em; }
  #pulse {
    width: 64px;
    height: 2px;
    margin-bottom: 18px;
    background: var(--on-cover);
    animation: pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; opacity: 0.6; } }

  .panel { background: var(--cover); color: var(--on-cover); padding: 16px 0 28px; }
  .panel-top { display: flex; align-items: center; min-height: 44px; margin-bottom: 14px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    min-width: 44px;
    padding-right: 12px;
    color: var(--on-cover);
  }
  .back::before {
    content: "";
    width: 9px;
    height: 9px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }
  .panel h1 { font-size: 17px; font-weight: 500; }
  .panel h1.title-mid { font-size: 26px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.25; }
  .panel h1.title-big { font-size: 40px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; }
  .hero { font-weight: 300; font-size: 54px; line-height: 1.1; letter-spacing: -0.025em; margin-top: 6px; }
  .hero-cur { font-size: 20px; font-weight: 400; letter-spacing: 0; margin-right: 8px; color: var(--on-cover-muted); }
  .hero-idr { font-size: 17px; color: var(--on-cover-muted); margin-top: 2px; }
  .ruler { display: flex; justify-content: space-between; align-items: flex-end; height: 16px; margin-top: 22px; }
  .tick { width: 2px; height: 8px; background: var(--on-cover); opacity: 0.28; }
  .tick-past { opacity: 1; }
  .tick-today { height: 16px; opacity: 1; }
  .panel-note { margin-top: 8px; font-size: 15px; }
  .panel-small { margin-top: 8px; font-size: 14px; color: var(--on-cover-muted); }
  .panel-verdict { margin-top: 20px; font-size: 18px; font-weight: 500; line-height: 1.3; }
  .panel-action {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 16px;
    padding: 0 16px;
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
    font-size: 15px;
  }

  section { padding-top: 34px; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .small { font-size: 14px; color: var(--muted); }
  .textbtn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  /* Months */
  .scroller { overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .chips {
    display: flex;
    gap: 8px;
    margin: 0 calc(var(--gutter) * -1);
    padding: 0 var(--gutter) 6px;
    scroll-padding: 0 var(--gutter);
  }
  .chip {
    flex: 0 0 auto;
    min-width: 122px;
    min-height: 44px;
    padding: 11px 14px 12px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .chip-month { font-size: 14px; color: var(--muted); }
  .chip-eur { font-size: 17px; font-weight: 500; white-space: nowrap; }
  .chip-part { font-size: 13px; color: var(--muted); }
  .chip:active, .barcol:active { background: var(--tint); }

  /* Balance */
  .balance-line {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    font-size: 21px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.005em;
  }
  .balance-line small { display: block; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .month-owes { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .month-owes span:last-child { text-align: right; }
  .why { margin-top: -6px; }
  .why h3 { font-size: 15px; font-weight: 600; margin: 18px 0 2px; }
  .why-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 15px;
  }
  .why-amt { white-space: nowrap; flex: none; }
  .why-total { font-weight: 600; border-bottom: 0; }
  .why-end { margin-top: 12px; font-weight: 500; }

  /* Monthly bars */
  .barsin { display: flex; position: relative; min-width: 100%; width: max-content; }
  .barcol { display: block; flex: 1 0 54px; min-height: 44px; border-radius: 6px; }
  .barplot {
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid var(--muted);
  }
  .barval { position: relative; z-index: 2; padding: 0 3px; margin-bottom: 3px; font-size: 13px; background: var(--paper); border-radius: 3px; }
  .bar { width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-partial { background: var(--tint); border: 1.5px dashed var(--accent); border-bottom: 0; }
  .barlabel { height: 40px; padding-top: 5px; text-align: center; font-size: 13px; line-height: 1.2; }
  .barlabel span { display: block; color: var(--muted); font-size: 12px; }
  .usualline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--ink); z-index: 1; pointer-events: none; }
  .caption { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .caption + .caption { margin-top: 4px; }

  .linkrow {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .linkrow b { display: block; font-weight: 600; font-size: 17px; }
  .chev {
    flex: none;
    width: 9px;
    height: 9px;
    margin-right: 4px;
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    transform: rotate(45deg);
  }
  .foot { padding: 20px 0 48px; }
  .notice { font-size: 15px; }
  .notice b { font-weight: 600; }

  /* Categories */
  .cat {
    display: block;
    width: calc(100% + 16px);
    margin: 0 -8px;
    min-height: 44px;
    padding: 10px 8px 11px;
    border-radius: 8px;
  }
  .cat[aria-pressed="true"] { background: var(--tint); }
  .cat:active { background: var(--tint); }
  .cat-top, .cat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .cat-name { font-weight: 500; }
  .cat-share { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .cat-eur { white-space: nowrap; font-weight: 500; flex: none; }
  .cat-bottom { align-items: center; margin-top: 3px; }
  .cat-track { flex: 1; min-width: 0; }
  .catbar { display: block; height: 6px; background: var(--accent); border-radius: 3px; min-width: 2px; }
  .cat-idr { font-size: 14px; color: var(--muted); white-space: nowrap; flex: none; }

  /* Donut */
  .dchips { position: relative; margin-top: 2px; }
  .dchip {
    flex: 0 0 auto;
    min-width: 56px;
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid var(--rule);
    border-radius: 22px;
    font-size: 15px;
    white-space: nowrap;
  }
  .dchip[aria-pressed="true"] { color: var(--paper); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .dn-head { margin-top: 12px; font-size: 15px; font-weight: 600; }
  .dn-fig { position: relative; width: 200px; height: 200px; margin: 16px auto 12px; }
  .dn-fig svg { display: block; width: 200px; height: 200px; }
  .dn-slice { stroke: var(--paper); stroke-width: 2px; stroke-linejoin: round; }
  .dn-centre {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    pointer-events: none;
  }
  .dn-c-cur { font-size: 13px; color: var(--muted); }
  .dn-c-eur { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .dn-c-idr { margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dn-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: calc(100% + 16px);
    margin: 0 -8px;
    min-height: 44px;
    padding: 9px 8px;
    border-radius: 8px;
  }
  .dn-tap:active { background: var(--tint); }
  .dn-sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
  .dn-sw-none { border: 1.5px solid var(--muted); }
  .dn-words { flex: 1; min-width: 0; }
  .dn-name { font-weight: 500; }
  .dn-share { margin-left: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .dn-amts { flex: none; text-align: right; }
  .dn-eur { display: block; font-weight: 500; white-space: nowrap; }
  .dn-idr { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dn-empty { padding: 16px 0 4px; font-size: 15px; color: var(--muted); }

  /* Icons */
  .icon { display: block; flex: none; width: 20px; height: 20px; color: var(--muted); }
  .cat-name-box { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-type { display: flex; align-items: center; gap: 8px; }

  /* Every expense */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 2px; }
  .list-head h2 { margin: 0; }
  .day { font-size: 14px; font-weight: 600; color: var(--muted); padding: 18px 0 4px; border-bottom: 1px solid var(--rule); }
  .row-wrap { border-bottom: 1px solid var(--rule); }
  .row { display: flex; width: 100%; justify-content: space-between; gap: 10px; min-height: 44px; padding: 11px 0; }
  .row-btn:active { background: var(--tint); }
  .back:disabled, .cat:disabled, .textbtn:disabled { opacity: 0.55; cursor: default; }
  .row-btn:disabled { cursor: default; color: inherit; }
  .row-open { width: calc(100% + 16px); margin: 0 -8px; padding-left: 8px; padding-right: 8px; background: var(--tint); }
  .row .icon { margin-top: 1px; }
  .row-left { min-width: 0; flex: 1; }
  .row-right { flex: none; text-align: right; max-width: 52%; }
  .row-item, .row-meta, .row-main, .row-sub { display: block; }
  .row-item { font-weight: 500; }
  .row-meta { font-size: 14px; color: var(--muted); }
  .row-main { font-weight: 500; white-space: nowrap; }
  .row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; }

  /* Fixing an expense */
  .editor { padding: 6px 0 16px; }
  .editor label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .select-line { display: flex; align-items: center; gap: 10px; }
  .type-icon { flex: none; width: 20px; height: 20px; }
  select {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  select:disabled { opacity: 0.55; }
  .editor input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  .editor input:disabled { opacity: 0.55; }
  .editor-delete {
    display: block;
    min-height: 44px;
    margin-top: 10px;
    padding: 0 4px;
    font-size: 14px;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .editor-delete:disabled { opacity: 0.55; cursor: default; }
  .editor-note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .editor-error { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .editor-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-main, .btn-plain {
    flex: 1;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-main { color: var(--paper); background: var(--accent); }
  .btn-plain { border: 1px solid var(--rule); }
  .btn-main:disabled, .btn-plain:disabled { opacity: 0.55; cursor: default; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: calc(100% - 32px);
    max-width: 520px;
    min-height: 52px;
    padding: 4px 16px;
    border-radius: 10px;
    color: var(--on-cover);
    background: var(--cover);
    border: 1px solid var(--on-cover-line);
  }
  .toast button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 6px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toast button:disabled { opacity: 0.55; cursor: default; }
  .toast :focus-visible { outline-color: var(--on-cover); }
  .list-end { height: 84px; }
  .flag {
    display: inline-block;
    margin: 5px 0 0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--tint);
  }
  .receipt {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: -8px 0 2px 30px;
    font-size: 14px;
    color: var(--accent);
    text-underline-offset: 3px;
  }

  /* Tendencies */
  .lead { font-size: 21px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; }
  .sentence { margin-top: 12px; }
  .units { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .unit { min-height: 44px; min-width: 88px; padding: 0 14px; text-align: center; font-size: 15px; }
  .unit[aria-pressed="true"] { background: var(--accent); color: var(--paper); font-weight: 600; }
  .tablewrap { margin: 12px calc(var(--gutter) * -1) 0; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; overflow-wrap: normal; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  thead th { vertical-align: bottom; font-weight: 600; font-size: 13px; }
  thead span { display: block; font-weight: 400; color: var(--muted); }
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    padding-left: var(--gutter);
    text-align: left;
    white-space: normal;
    min-width: 112px;
    max-width: 128px;
    background: var(--paper);
    font-weight: 500;
    border-right: 1px solid var(--rule);
  }
  tbody td.col-usual { font-weight: 500; background: var(--tint); }
  thead th.col-usual { background: var(--tint); }
  tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--muted); }
  tfoot td.col-usual { background: var(--tint); }
  td.zero { color: var(--muted); }
  .rolling-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .rolling-row span:last-child { text-align: right; }

  /* The bottom bar: Money, To do, Groceries. Fixed, above the phone's home bar. Toasts and the dock sit above it. */
  #app { padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom)); }
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    justify-content: center;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--paper);
    border-top: 1px solid var(--rule);
  }
  .tab {
    flex: 1 1 0;
    max-width: 180px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .tab .icon { width: 22px; height: 22px; color: currentColor; }
  .tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

  /* Lists shell: the phone's identity, the settings line and the dock above the bar */
  .who-card { margin-top: 24px; padding: 16px; border: 1px solid var(--rule); border-radius: 10px; }
  .who-card h2 { margin-bottom: 10px; }
  .who-choices { display: flex; gap: 8px; margin-bottom: 10px; }
  .lists-main { padding-top: 24px; }
  .lists-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 28px; }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 520px;
    pointer-events: none;
  }

    'Subscriptions': 'repeat', 'Phone & subscriptions': 'phone', 'Pets': 'paw', 'Rent': 'key', 'Visa & admin': 'paper', 'Travel': 'plane',
    'Gifts': 'gift', 'Business': 'briefcase', 'Other': 'dots', 'Settlement': 'swap'
  };
  var known = typeof name === 'string' && Object.prototype.hasOwnProperty.call(byName, name);
  return shapes[known ? byName[name] : 'tag'];
}

// What Save would send, in a fixed order. old is what Undo sends back. A field missing from draft is left alone.
function pendingChanges(row, draft) {
  // Currency before amount: the server recomputes euros from the currency already on the row.
  var fields = [['item', 'Item'], ['currency', 'Currency'], ['amount', 'Amount'], ['date', 'Date'], ['category', 'Type'], ['paidBy', 'Paid by'], ['paidFor', 'Paid for']];
  var out = [];
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i][0];
    if (draft[f] !== undefined && draft[f] !== row[f]) out.push({ field: f, label: fields[i][1], old: row[f], value: draft[f] });
  }
  return out;
}

// The day after a yyyy-MM-dd day.
function nextDay(iso) {
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)) + 1));
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// What a one-line text input holds for a value: browsers drop line breaks from it.
function inputText(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[\r\n]/g, '');
}

// An item name the server takes: 1 to 100 characters after trimming, no control characters.
function itemOk(s) {
  if (typeof s !== 'string' || s.length > 200 || /[\u0000-\u001f\u007f]/.test(s)) return false;
  var t = s.replace(/^\s+|\s+$/g, '');
  return t.length >= 1 && t.length <= 100;
}

function currencyOk(c) {
  return c === 'IDR' || c === 'EUR' || c === 'USD';
}

// The edit sheet's typed values, checked: {values} for pendingChanges, or {error} in plain words. Item, amount and
// date are left out when they match the row, so a blank stays blank. Days run from 2020 to tomorrow (the server
// checks again in Bali time).
function editDraftValues(row, draft, todayIso) {
  var out = { currency: draft.currency, category: draft.category, paidBy: draft.paidBy, paidFor: draft.paidFor };
  var item = String(draft.item === undefined || draft.item === null ? '' : draft.item).replace(/^\s+|\s+$/g, '');
  if (item !== inputText(row.item).replace(/^\s+|\s+$/g, '')) {
    if (!item) return { error: 'Give it a name.' };
    if (item.length > 100) return { error: 'Keep the name to 100 characters.' };
    out.item = item;
  }
  var amount = String(draft.amount === undefined || draft.amount === null ? '' : draft.amount).replace(/\s/g, '');
  var shown = row.amount === null || row.amount === undefined ? '' : String(row.amount);
  if (amount !== shown) {
    var digits = 'Type the amount as digits, like 85000 or 4.50.';
    if (!/^\d+([.,]\d{1,2})?$/.test(amount)) return { error: digits };
    var n = Number(amount.replace(',', '.'));
    if (!(n > 0) || n >= 1e12) return { error: digits };
    if (n !== row.amount) out.amount = n;
  }
  // Only an amount being sent needs a usable currency (the server refuses it otherwise); other fields go through.
  if (out.amount !== undefined && !currencyOk(draft.currency)) return { error: 'Pick a currency.' };
  var day = String(draft.date === undefined || draft.date === null ? '' : draft.date);
  if (day !== (row.date || '')) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
    var real = !!m && dateOk(Number(m[1]), Number(m[2]), Number(m[3]));
    if (!real) return { error: 'Pick a real day.' };
    if (day < '2020-01-01' || day > nextDay(todayIso)) return { error: 'Pick a day from 2020 up to tomorrow.' };
    out.date = day;
  }
  return { values: out };
}

function dateOk(y, m, d) {
  var t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

// The row as it should read once changes have landed. Euros are then unknown if amount, currency or date moved.
function applyChanges(row, changes) {
  var out = {};
  for (var k in row) out[k] = row[k];
  for (var i = 0; i < changes.length; i++) {
    out[changes[i].field] = changes[i].value;
    if (changes[i].field === 'amount' || changes[i].field === 'currency' || changes[i].field === 'date') out.eurUnknown = true;
  }
  return out;
}

// Undo is offered only when the server would take every old value back: the same rules as Edit.gs.
// todayIso and categories are used when given (the day range, and the Type list).
function canUndo(changes, todayIso, categories) {
  for (var i = 0; i < changes.length; i++) {
    var c = changes[i];
    var v = c.old;
    if (c.field === 'amount') {
      if (typeof v !== 'number' || !isFinite(v) || !(v > 0) || v >= 1e12 || Math.round(v * 100) / 100 !== v) return false;
    } else if (c.field === 'currency') {
      if (!currencyOk(v)) return false;
    } else if (c.field === 'date') {
      var m = typeof v === 'string' ? /^(\d{4})-(\d{2})-(\d{2})$/.exec(v) : null;
      if (!m || !dateOk(Number(m[1]), Number(m[2]), Number(m[3])) || v < '2020-01-01') return false;
      if (todayIso && v > nextDay(todayIso)) return false;
    } else if (c.field === 'item') {
      if (!itemOk(v)) return false;
    } else if (c.field === 'category') {
      if (typeof v !== 'string' || v === '' || v.length > 100 || v === 'Settlement') return false;
      if (categories && categories.indexOf(v) < 0) return false;
    } else if (v !== 'Couple' && v !== 'Kev' && v !== 'Lili') {
      return false;
    }
  }
  return true;
}

function saveFailText(doneLabels, failLabel, reason) {
  if (!doneLabels.length) return reason;
  return andList(doneLabels) + (doneLabels.length === 1 ? ' was' : ' were') + ' saved. ' + failLabel + ' was not. ' + reason;
}

function rowByNumber(months, rowNumber) {
  for (var i = 0; i < months.length; i++) {
    for (var j = 0; j < months[i].rows.length; j++) {
      if (months[i].rows[j].rowNumber === rowNumber) return months[i].rows[j];
    }
  }
  return null;
}

// Options as [value, label]. A current value off the list still shows, so the editor never misstates a row.
function editOptions(options, current) {
  for (var i = 0; i < options.length; i++) {
    if (options[i][0] === current) return options;
  }
  return [[current, current === '' ? 'Not set' : current]].concat(options);
}

function partialLabel(m, todayIso) {
  if (!m.partial) return '';
  return m.key >= todayIso.slice(0, 7) ? 'so far' : 'part month';
}

function comparison(m, usual, rate, todayIso) {
  var v = m.vsUsual;
  if (v) {
    if (v.direction === 'same' || v.diffIdr === 0) return { verdict: 'same', text: 'The same as your usual.' };
    var abs = Math.abs(v.diffIdr);
    return { verdict: v.direction, text: fmtIdr(abs) + ' (' + fmtEur(abs / rate) + ') ' + v.direction + ' your usual.' };
  }
  if (m.partial && m.key >= todayIso.slice(0, 7)) {
    return { verdict: null, text: 'So far: ' + dayText(todayIso) + '. No comparison until the month ends.' };
  }
  if (m.partial) return { verdict: null, text: 'Not a full month, so it is not compared with your usual.' };
  return { verdict: null, text: 'Too few full months yet to compare.' };
}

// What was actually paid comes first, the other currency second.
function rowAmounts(r) {
  function paid() {
    if (r.currency === 'IDR') return fmtIdr(r.amount);
    if (r.currency === 'EUR') return fmtEur(r.amount);
    return (r.currency ? r.currency + ' ' : '') + fixed2(r.amount);
  }
  if (r.needsAmount) return { main: r.amount === null ? 'No amount' : paid(), sub: [] };
  if (r.currency === 'IDR') return { main: paid(), sub: [fmtEur(r.eur)] };
  if (r.currency === 'EUR') return { main: paid(), sub: [fmtIdr(r.idr)] };
  return { main: paid(), sub: [fmtIdr(r.idr), fmtEur(r.eur)] };
}

function rowsFor(m, filter) {
  if (filter === null) return m.rows;
  return m.rows.filter(function (r) {
    return filter === NEEDS ? r.needsAmount : r.category === filter;
  });
}

function shareText(share) {
  if (share > 0 && share < 0.01) return 'under 1%';
  return Math.round(share * 100) + '%';
}

function trendSentences(p) {
  var t = p.tendencies;
  var rate = t.rate;
  var out = [];
  function both(idr) { return fmtIdr(idr) + ' (' + fmtEur(idr / rate) + ')'; }
  if (t.change) {
    out.push(t.change.sentence + ': ' + (t.change.diffIdr < 0 ? 'down ' : 'up ') + both(Math.abs(t.change.diffIdr)) + '.');
  }
  if (p.usual) {
    out.push('Your usual month is ' + both(p.usual.avgIdr) + ', the average of ' + andList(p.usual.keys.map(monthName)) + '.');
  } else {
    out.push('Your usual month appears once there are 3 full months.');
  }
  if (t.rows.length && t.rows[0].totalIdr > 0) {
    out.push('Over all months, the most went on ' + t.rows[0].category + ': ' + both(t.rows[0].totalIdr) + '.');
  }
  return out;
}

function rateNote(months) {
  var out = [];
  for (var i = 0; i < months.length; i++) {
    if (Math.abs(months[i].totalEur - months[i].comparisonEur) >= 1) {
      out.push(months[i].label + ' is ' + fmtEur(months[i].totalEur) + ' in the sheet, at the rate used that month.');
    }
  }
  return out.join(' ');
}

// ---- token: kept in memory, and in browser storage when the browser allows it ----
function store(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }

function unstore() { try { localStorage.removeItem(KEY); } catch (e) {} }

// ---- lists storage: four kl.* keys, each read and write inside try, so the page works without storage ----

function lsSet_(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel_(k) { try { localStorage.removeItem(k); } catch (e) {} }

  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

// ---- DOM helpers: every value goes in as text --------------------------------
function $(id) { return document.getElementById(id); }

function el(tag, cls, text) {

// Bottom bar icons. Paths are constant strings in this file, never data. Groceries reuses the cart.

  return ['M3.5 6.5h17v11h-17z', 'M14.5 12a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0z', 'M6.5 9.5v5', 'M17.5 9.5v5'];
}

var SVG_NS = 'http://www.w3.org/2000/svg';

function svgIcon_(paths) {
  var ns = SVG_NS;

// True while a save or undo is on its way. Back, filters and rows wait for it.
function busy() {
  return !!((EDIT && EDIT.saving) || (TOAST && TOAST.busy));
}

function monthByKey(key) {
  for (var i = 0; i < DATA.months.length; i++) {
    if (DATA.months[i].key === key) return DATA.months[i];
  }
  return null;
}

// Keeps a currency next to its number when a sentence wraps.
function nb(s) {
  return s.replace(/(Rp|EUR) (?=[-\d])/g, '$1\u00a0');
}

function rateText() {
  return 'Euros at a fixed rate of ' + group(DATA.rate) + ' so months compare fairly.';
}

// ---- talking to the script ------------------------------------------------------
// Every call comes through here. credentials: 'omit' is the point: Google's multi-account cookies are never sent.
// Resolves with the result. Rejects with {code}: NO_SESSION, NOT_CONFIGURED, BAD_REQUEST or SERVER from the
// script, TIMEOUT after 30 seconds, UNREACHED for anything else, such as no connection or a page that is not JSON.
function call_(action, payload) {
  var body = { action: action };
  for (var k in payload) body[k] = payload[k];
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 30000);
  return fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    credentials: 'omit',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(function (res) {
    if (!res.ok) throw { code: 'UNREACHED' };
    return res.json();
  }).then(function (reply) {
    clearTimeout(timer);
    if (reply && reply.ok === true) {
      // Sliding session: keep the fresh token, unless this phone has been locked out meanwhile.
      if (typeof reply.token === 'string' && reply.token && TOKEN) {
        TOKEN = reply.token;
        store(reply.token);
      }
      return reply.result;
    }
    throw { code: (reply && typeof reply.error === 'string') ? reply.error : 'SERVER' };
  }, function (err) {
    clearTimeout(timer);
    if (err && typeof err.code === 'string') throw err;
    throw { code: err && err.name === 'AbortError' ? 'TIMEOUT' : 'UNREACHED' };
  });
}

// True when the reply never arrived, so a save may or may not have landed.
function unreached(err) {
  return !!err && (err.code === 'TIMEOUT' || err.code === 'UNREACHED');
}

var REACH_TEXT = 'Could not reach the server. Try again.';

// ---- cover: PIN, loading and load errors --------------------------------------
function msg(t) { $('msg').textContent = t; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function clock(ms) {
  var d = new Date(ms);
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return d.toDateString() === new Date().toDateString() ? t : 'tomorrow at ' + t;
}

function showCover(mode, text) {
  APP_ON = false;
  $('app').hidden = true;
  $('cover').hidden = false;
  $('gate').hidden = mode !== 'gate';
  $('pulse').hidden = mode !== 'loading';
  $('retry').hidden = mode !== 'error';
  msg(text || '');
}

function submit() {
  var pin = $('pin').value;
  if (!pin) return;
  var go = $('go');
  if (go.disabled) return;
  go.disabled = true;
  $('pin').value = '';
  msg('Checking...');
  call_('unlock', { pin: pin }).then(function (r) {
    go.disabled = false;
    if (r && r.ok) {
      TOKEN = r.token;
      store(r.token);
      openSession_();
    }
    else if (r && r.locked) { msg('Locked until ' + clock(r.untilMs) + '.'); }
    else if (r && r.notReady) { msg('Not set up yet.'); }
    else if (r && r.retry) { msg('Could not check. Try again.'); }
    else { msg('Wrong PIN.'); }
  }, function (err) {
    go.disabled = false;
    msg(unreached(err) ? REACH_TEXT : 'Something went wrong. Try again.');
  });
}

function clearScreens() {
  $('home').textContent = '';
  $('month').textContent = '';
  $('trends').textContent = '';
  $('balance').textContent = '';
  $('todo').textContent = '';
  groClear_();
  $('tabbar').textContent = '';
}

function lockOut() {
  SESSION++;
  LOADING = false;
  TOKEN = null;
  closeItemSheet_('lock'); // Task 7: an open sheet's change goes into the queue, sent after the unlock
  DATA = null;
  VIEW = { screen: 'home', key: null };
  FILTER = null;
  DONUT_KEY = null;
  EDIT = null;
  TOAST = null;
  FIRST_LOAD = true;
  listsLockOut_();
  todoLeave_();
  groLeave_();
  GRO_DRAFT = '';
  unstore();
  try { location.hash = ''; } catch (e) {}
  clearScreens();
  showCover('gate', 'Please enter your PIN.');
}

function loadFailed(quiet, err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  if (quiet && !DATA && APP_ON) {
    MONEY_FAILED = true;
    render(true);
    return;
  }
  if (quiet && DATA) {
    if (TOAST && TOAST.refreshing) {
      TOAST = { text: (TOAST.after ? TOAST.after + ' ' : '') + 'Could not refresh. These are the last numbers loaded.', key: TOAST.key };
    }
    render(true);
    homeStatus('Could not update. These are the last numbers loaded.');
    return;
  }
  if (code === 'NOT_CONFIGURED') {
    showCover('error', 'Your PIN works, but the expenses sheet is not connected yet.');
    return;
  }
  if (unreached(err)) {
    showCover('error', REACH_TEXT);
    return;
  }
  showCover('error', 'Could not load your expenses. Check the connection and try again.');
}

function loadData(quiet) {
  if (LOADING) return;
  LOADING = true;
  if (quiet) homeStatus('Updating...');
  else showCover('loading', 'Opening your expenses. The first load can take a few seconds.');
  var session = SESSION;
  var slow = setTimeout(function () {
    if (LOADING && !quiet) msg('Still working. If nothing changes soon, close this page and open it again.');
  }, 15000);
  call_('data', { token: TOKEN }).then(function (p) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    if (!p || !p.months) { loadFailed(quiet, ''); return; }
    DATA = p;
    if (FIRST_LOAD) {
      FIRST_LOAD = false;
      VIEW = viewFromHash(location.hash);
    }
    showApp_();
    // A month emptied by a delete stays while its Undo bar is up.
    var undoHere = TOAST && TOAST.restore && TOAST.key === VIEW.key;
    if (VIEW.screen === 'month' && !monthByKey(VIEW.key) && !undoHere) VIEW = { screen: 'home', key: null };
    if (TOAST && TOAST.refreshing) TOAST = TOAST.after ? { text: TOAST.after, key: TOAST.key } : null;
    render(true);
  }, function (err) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    loadFailed(quiet, err);
  });
}

function homeStatus(text) {
  var s = HOME_STATUS;
  if (s) s.textContent = text;
}
var HOME_STATUS = null;

// ---- navigation ---------------------------------------------------------------
// The screen lives in the address after #, so the phone's back button steps through screens.
function remember(view) {
  try {
    var h = viewHash(view);
    if (location.hash !== h) location.hash = h;
  } catch (e) {}
}

function go(view, fromHistory) {
  if (SHEET) closeItemSheet_('nav');
  if (VIEW.screen === 'home') HOME_Y = window.scrollY || 0;
  if (VIEW.screen === 'todo' && view.screen !== 'todo') todoLeave_();
  if (VIEW.screen === 'groceries' && view.screen !== 'groceries') groLeave_();
  if (view.screen !== 'month' || view.key !== VIEW.key) FILTER = null;
  VIEW = view;
  EDIT = null;
  TOAST = null;
  LISTS_TOAST = '';
  listsUndoClear_();
  // Money opened for the first time this session (the page started on a list tab): load its numbers first.
  if (tabOf_(view.screen) === 'money' && !DATA) {
    if (!fromHistory) remember(view);
    if (!APP_ON) { loadData(false); return; }
    // M1: the app and its bar stay; the money screen says it is loading, or why it could not.
    MONEY_FAILED = false;
    render(false);
    loadData(true);
    return;
  }
  if (isListScreen_(view.screen)) {
    if (!LISTS_BASE) listsFromCache_();
    showApp_();
  }
  if (view.editRow) {
    var r = rowByNumber(DATA.months, view.editRow);
    if (r) startEdit(r);
  }
  if (!fromHistory) remember(view);
  render(false);
  if (view.editRow && EDIT_EL) EDIT_EL.scrollIntoView({ block: 'center' });
  if (isListScreen_(view.screen)) listsLoad_(false);
}

function goHome() { go({ screen: 'home', key: null }); }
function goMonth(key) { go({ screen: 'month', key: key }); }

function render(keepScroll) {
  clearScreens();
  HOME_STATUS = null;
  $('home').hidden = VIEW.screen !== 'home';
  $('month').hidden = VIEW.screen !== 'month';
  $('trends').hidden = VIEW.screen !== 'trends';
  $('balance').hidden = VIEW.screen !== 'balance';
  $('todo').hidden = VIEW.screen !== 'todo';
  $('groceries').hidden = VIEW.screen !== 'groceries';
  LISTS_NOTE = null;
  rememberTab_(tabOf_(VIEW.screen));
  renderTabs_();
  var title = null;
  EDIT_EL = null;
  if (VIEW.screen === 'todo') title = renderTodo_();
  else if (VIEW.screen === 'groceries') title = renderGroceries_();
  else if (!DATA) title = renderMoneyWaiting_();
  else if (VIEW.screen === 'month') title = renderMonth();
  else if (VIEW.screen === 'trends') title = renderTrends();

  else renderHome();
  if (!keepScroll) {
    window.scrollTo(0, VIEW.screen === 'home' ? HOME_Y : 0);
    if (title && !SHEET) title.focus({ preventScroll: true });
  }
  if (SHEET) sheetClaimFocus_();
}

// ---- where the money goes (home donut, ruling R65) ---------------------------------
var DONUT_KEY = null; // the chip chosen on the home screen, kept for this visit only; null is the current month

// Six type colours, by a type's rank in All, then Other (R69): apricot, terracotta, dusty teal, sand, brick, sage,
// warm grey. Each is at least 3:1 on --paper and every pair is at least 15 apart in OKLab for normal vision, since a
// month's own size order can put any two side by side. The largest types get the most distinct ones.
function donutColors_() {
  return ['#da720d', '#781d00', '#136c7a', '#765d00', '#b93d42', '#22462a', '#8c857f'];
}

// Every month added up per type, in cents and Rp, largest first (same order rule as Calc.gs).
function donutAll_(months) {
  var by = Object.create(null);
  var list = [];
  var totalCents = 0;
  var totalIdr = 0;
  months.forEach(function (m) {
    totalCents += Math.round(m.totalEur * 100);
    totalIdr += m.totalIdr;
    m.categories.forEach(function (c) {
      if (!by[c.name]) { by[c.name] = { name: c.name, cents: 0, idr: 0 }; list.push(by[c.name]); }
      by[c.name].cents += Math.round(c.eur * 100);
      by[c.name].idr += c.idr;
    });
  });
  var cats = list.map(function (c) {
    return { name: c.name, eur: c.cents / 100, idr: c.idr, share: totalCents > 0 ? Math.round(c.cents / totalCents * 10000) / 10000 : 0 };
  });
  cats.sort(function (a, b) {
    if (b.eur !== a.eur) return b.eur - a.eur;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  return { cats: cats, totalCents: totalCents, totalIdr: totalIdr };
}

// R68: a type's colour is its rank among the top 6 of All, so it is the same in every month.
function donutColourMap_(allCats) {
  var colours = donutColors_();
  var map = Object.create(null);
  var n = 0;
  allCats.forEach(function (c) {
    if (n < 6 && c.eur > 0 && c.name !== 'Other') { map[c.name] = colours[n]; n++; }
  });
  return map;
}

function donutChipLabel_(key, todayIso) {
  return key.slice(0, 4) === todayIso.slice(0, 4) ? monthName(key).slice(0, 3) : shortMonth(key);
}

// One month (by key) or 'all': the header, the totals and the list rows. Month numbers are the payload's own,
// so they match the month screen; All adds every month up in cents.
function donutModel_(months, key, todayIso) {
  var cur = todayIso.slice(0, 7);
  var cats = [];
  var totalCents = 0;
  var totalIdr = 0;
  var head;
  var emptyText;
  var all = donutAll_(months);
  var colourOf = donutColourMap_(all.cats);
  if (key === 'all') {
    cats = all.cats;
    totalCents = all.totalCents;
    totalIdr = all.totalIdr;
    head = months.length ? 'All, since ' + shortMonth(months[months.length - 1].key) : 'All';
    emptyText = 'Nothing spent yet.';
  } else {
    var m = null;
    for (var i = 0; i < months.length; i++) if (months[i].key === key) m = months[i];
    var part = m ? partialLabel(m, todayIso) : (key === cur ? 'so far' : '');
    if (m) {
      cats = m.categories;
      totalCents = Math.round(m.totalEur * 100);
      totalIdr = m.totalIdr;
    }
    head = monthName(key) + ' ' + key.slice(0, 4) + (part ? ', ' + part : '');
    emptyText = key === cur ? 'Nothing spent yet this month.' : 'Nothing spent this month.';
  }
  var colours = donutColors_();
  var own = [];
  var rest = [];
  var tail = [];
  // In this view's size order: a top 6 type of All keeps its slice and colour, every other type goes into Other.
  cats.forEach(function (c) {
    if (c.name === 'Other') rest.push(c); // a real Other always joins the one Other row, whatever its sign
    else if (!(c.eur > 0)) tail.push(c);
    else if (colourOf[c.name]) own.push(c);
    else rest.push(c);
  });
  var rows = own.map(function (c) {
    return { name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: colourOf[c.name] };
  });
  if (rest.length) {
    var oc = 0;
    var oi = 0;
    rest.forEach(function (c) { oc += Math.round(c.eur * 100); oi += c.idr; });
    rows.push({ name: 'Other', eur: oc / 100, idr: oi, share: totalCents > 0 ? Math.round(oc / totalCents * 10000) / 10000 : 0, color: oc > 0 ? colours[6] : null });
  }
  // A type that came out at zero or below (refunds) has no slice; it is still listed, without a colour.
  tail.forEach(function (c) { rows.push({ name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: null }); });
  return {
    key: key, head: head, emptyText: emptyText, totalEur: totalCents / 100, totalIdr: totalIdr, rows: rows,
    empty: !rows.some(function (r) { return r.color; })
  };
}

// Start and end of each slice in degrees, clockwise from the top. The last one ends at exactly 360.
function donutSlices_(values) {
  var total = 0;
  values.forEach(function (v) { total += v; });
  var at = 0;
  return values.map(function (v, i) {
    var start = at;
    at = i === values.length - 1 ? 360 : at + v / total * 360;
    return { start: start, end: at };
  });
}

function donutPoint_(deg, rad, c) {
  var a = deg * Math.PI / 180;
  return String(Math.round((c + rad * Math.sin(a)) * 100) / 100) + ' ' + String(Math.round((c - rad * Math.cos(a)) * 100) / 100);
}

// An annular sector from start to end degrees, outer radius R, inner radius r, centred on (c, c). Each arc is
// drawn in two halves split at the midpoint, so no arc ever starts where it ends (SVG drops such an arc, and a
// slice of nearly 360 degrees would fill the hole).
function donutPath_(start, end, R, r, c) {
  var mid = (start + end) / 2;
  var outer = ' A ' + R + ' ' + R + ' 0 0 1 ';
  var inner = ' A ' + r + ' ' + r + ' 0 0 0 ';
  return 'M ' + donutPoint_(start, R, c) + outer + donutPoint_(mid, R, c) + outer + donutPoint_(end, R, c) +
    ' L ' + donutPoint_(end, r, c) + inner + donutPoint_(mid, r, c) + inner + donutPoint_(start, r, c) + ' Z';
}

// Brings the chosen chip into the visible part of its sideways-scrolling row (no animation).
function donutReveal_(row, el) {
  var left = el.offsetLeft;
  var w = el.offsetWidth;
  var view = row.clientWidth;
  if (typeof left !== 'number' || typeof w !== 'number' || !view) return;
  var pad = 20;
  if (left - pad < row.scrollLeft) row.scrollLeft = Math.max(0, left - pad);
  else if (left + w + pad > row.scrollLeft + view) row.scrollLeft = left + w + pad - view;
}

function renderDonut_(s) {
  var today = DATA.today;
  var cur = today.slice(0, 7);
  var keys = DATA.months.map(function (m) { return m.key; });
  if (keys.indexOf(cur) < 0) { keys.push(cur); keys.sort().reverse(); }
  var chosen = DONUT_KEY === 'all' || keys.indexOf(DONUT_KEY) >= 0 ? DONUT_KEY : cur;
  var row = add(s, 'div', 'scroller chips dchips');
  row.setAttribute('role', 'group');
  row.setAttribute('aria-label', 'Choose a month, or all months');
  var chips = [];
  keys.concat(['all']).forEach(function (k) {
    var c = btn(row, 'dchip', k === 'all' ? 'All' : donutChipLabel_(k, today), function () {
      DONUT_KEY = k;
      chosen = k;
      paint();
    });
    c.setAttribute('aria-label', k === 'all' ? 'All months' : monthName(k) + ' ' + k.slice(0, 4));
    chips.push({ key: k, el: c });
  });
  var body = add(s, 'div', 'dn-body');
  function paint() {
    chips.forEach(function (x) {
      x.el.setAttribute('aria-pressed', x.key === chosen ? 'true' : 'false');
      if (x.key === chosen) donutReveal_(row, x.el);
    });
    body.textContent = '';
    drawDonut_(body, donutModel_(DATA.months, chosen, today));
  }
  paint();
}

function drawDonut_(body, model) {
  add(body, 'p', 'dn-head', model.head);
  if (model.empty) {
    add(body, 'p', 'dn-empty', model.emptyText);
    return;
  }
  var open = model.key === 'all' ? null : function () { goMonth(model.key); };
  var parts = model.rows.filter(function (r) { return r.color; });
  var fig = add(body, 'div', 'dn-fig');
  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  svg.setAttribute('role', 'img');
  svg.setAttribute('focusable', 'false');
  svg.setAttribute('aria-label', 'Where the money goes, ' + model.head + ': ' + parts.slice(0, 3).map(function (r) {
    return r.name + ' ' + shareText(r.share);
  }).join(', ') + '.');
  fig.appendChild(svg);
  var mark;
  var spans = donutSlices_(parts.map(function (r) { return r.eur; }));
  var whole = -1; // a part of 359.5 degrees or more is drawn as the full ring; the rest would vanish under the gaps
  spans.forEach(function (a, i) { if (a.end - a.start >= 359.5) whole = i; });
  if (whole >= 0) {
    mark = document.createElementNS(SVG_NS, 'circle');
    mark.setAttribute('class', 'dn-ring');
    mark.setAttribute('cx', '100');
    mark.setAttribute('cy', '100');
    mark.setAttribute('r', '83');
    mark.setAttribute('fill', 'none');
    mark.setAttribute('stroke', parts[whole].color);
    mark.setAttribute('stroke-width', '26');
    if (open) mark.addEventListener('click', open);
    svg.appendChild(mark);
  } else {
    spans.forEach(function (a, i) {
      mark = document.createElementNS(SVG_NS, 'path');
      mark.setAttribute('class', 'dn-slice');
      mark.setAttribute('d', donutPath_(a.start, a.end, 96, 70, 100));
      mark.setAttribute('fill', parts[i].color);
      if (open) mark.addEventListener('click', open);
      svg.appendChild(mark);
    });
  }
  var mid = add(fig, 'div', 'dn-centre');
  add(mid, 'span', 'dn-c-cur', 'EUR');
  add(mid, 'span', 'dn-c-eur', (model.totalEur < 0 ? '-' : '') + fixed2(model.totalEur));
  add(mid, 'span', 'dn-c-idr', fmtIdr(model.totalIdr));
  var list = add(body, 'div', 'dn-list');
  model.rows.forEach(function (r) {
    var line = open ? btn(list, 'dn-row dn-tap', null, open) : add(list, 'div', 'dn-row');
    var sw = add(line, 'span', r.color ? 'dn-sw' : 'dn-sw dn-sw-none');
    sw.setAttribute('aria-hidden', 'true');
    if (r.color) sw.style.background = r.color;
    var words = add(line, 'span', 'dn-words');
    add(words, 'span', 'dn-name', r.name);
    add(words, 'span', 'dn-share', shareText(r.share));
    var amts = add(line, 'span', 'dn-amts');
    add(amts, 'span', 'dn-eur', fmtEur(r.eur));
    add(amts, 'span', 'dn-idr', fmtIdr(r.idr));
  });
}

function renderBalance(s) {
  var line = btn(s, 'balance-line', null, function () { go({ screen: 'balance', key: null }); });
  var words = add(line, 'span');
  add(words, 'span', '', nb(balanceText(DATA.balance.net)));
  add(words, 'small', '', 'See how it adds up');
  add(line, 'span', 'chev').setAttribute('aria-hidden', 'true');
}

function renderBars(s) {
  var PLOT = 118; // px height of the tallest bar; the rest of the plot leaves room for its label
  var usual = DATA.usual;
  var max = usual ? usual.avgIdr : 0;
  DATA.months.forEach(function (m) { if (m.totalIdr > max) max = m.totalIdr; });
  function px(idr) { return max > 0 ? Math.max(0, Math.round(idr / max * PLOT)) : 0; }

  var sc = add(s, 'div', 'scroller');
  sc.setAttribute('tabindex', '0');
  sc.setAttribute('role', 'group');
  sc.setAttribute('aria-label', 'Spending by month. Tap a month to open it.');
  var inner = add(sc, 'div', 'barsin');
  if (usual) {
    var line = add(inner, 'div', 'usualline');
    line.style.bottom = (40 + px(usual.avgIdr)) + 'px';
  }
  var today = DATA.today;
  DATA.months.slice().reverse().forEach(function (m) {
    var part = partialLabel(m, today);
    var col = btn(inner, 'barcol', null, function () { goMonth(m.key); });
    col.setAttribute('aria-label', m.label + ': ' + fmtEur(m.comparisonEur) + (part ? ', ' + part : '') + '. Open this month.');
    var plot = add(col, 'div', 'barplot');
    add(plot, 'span', 'barval', group(Math.round(m.comparisonEur)));
    var bar = add(plot, 'div', 'bar' + (m.partial ? ' bar-partial' : ''));
    bar.style.height = px(m.totalIdr) + 'px';
    var lab = add(col, 'div', 'barlabel', monthName(m.key).slice(0, 3));
    if (part) add(lab, 'span', '', part === 'so far' ? 'so far' : 'part');
  });

  add(s, 'p', 'caption', nb(rateText() + ' ' + rateNote(DATA.months)));
  var hasPartial = DATA.months.some(function (m) { return m.partial; });
  var legend = [];
  if (usual) legend.push('The line is your usual month, ' + fmtEur(usual.avgEur) + '.');
  if (hasPartial) legend.push('Dashed bars are not full months.');
  if (legend.length) add(s, 'p', 'caption', nb(legend.join(' ')));
  return sc;
}

// ---- month ----------------------------------------------------------------------
// A month the last change emptied out of the data (its only expense deleted or moved): shown empty, so the
// screen and its Undo bar stay.
function emptyMonth(key) {
  return {
    key: key, label: monthName(key) + ' ' + key.slice(0, 4), totalEur: 0, totalIdr: 0, comparisonEur: 0, partial: true,
    categories: [], rows: [], needsAmountCount: 0, vsUsual: null
  };
}

function renderMonth() {
  var root = $('month');
  var m = monthByKey(VIEW.key) || emptyMonth(VIEW.key);
  var today = DATA.today;
  var w = panel(root);
  panelBack(w);
  var title = add(w, 'h1', '', m.label);
  title.setAttribute('tabindex', '-1');
  heroAmount(w, m);

  var cmp = comparison(m, DATA.usual, DATA.rate, today);
  if (m.partial && m.key === today.slice(0, 7)) dayRuler(w, today);
  if (cmp.verdict) {
    add(w, 'p', 'panel-verdict', nb(cmp.text));
    add(w, 'p', 'panel-small', nb('Your usual is ' + fmtIdr(DATA.usual.avgIdr) + ' (' + fmtEur(DATA.usual.avgEur) + '), the average of ' + andList(DATA.usual.keys.map(monthName)) + '.'));
    add(w, 'p', 'panel-small', rateText());
  } else {
    add(w, 'p', 'panel-note', cmp.text);
  }
  if (m.needsAmountCount > 0) {
    add(w, 'p', 'panel-note', m.needsAmountCount === 1
      ? '1 expense needs an amount. It is not in the total.'
      : m.needsAmountCount + ' expenses need an amount. They are not in the total.');
  }

  var body = add(root, 'div', 'wrap');
  function choose(value) {
    var was = FILTER;
    FILTER = FILTER === value ? null : value;
    FOCUS_FILTER = value;
    render(true);
    if (FILTER !== null && was !== FILTER && LIST_TOP) {
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      LIST_TOP.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    }
  }

  if (m.categories.length || m.needsAmountCount > 0) {
    var cs = section(body, 'By type of expense');
    var top = m.categories.length ? m.categories[0].share : 0;
    m.categories.forEach(function (c) {
      var b = btn(cs, 'cat', null, function () { choose(c.name); });
      b.disabled = busy();
      b.setAttribute('aria-pressed', FILTER === c.name ? 'true' : 'false');
      var line1 = add(b, 'span', 'cat-top');

      add(nameBox, 'span', 'cat-name', c.name);
      add(nameBox, 'span', 'cat-share', shareText(c.share));
      add(line1, 'span', 'cat-eur', fmtEur(c.eur));
      var line2 = add(b, 'span', 'cat-bottom');
      var track = add(line2, 'span', 'cat-track');
      var fill = add(track, 'span', 'catbar');
      fill.style.width = (top > 0 ? Math.round(c.share / top * 100) : 0) + '%';
      add(line2, 'span', 'cat-idr', fmtIdr(c.idr));
      if (FOCUS_FILTER === c.name) { b.focus({ preventScroll: true }); FOCUS_FILTER = null; }
    });
    if (m.needsAmountCount > 0) {
      var needBtn = btn(cs, 'cat', null, function () { choose(NEEDS); });
      needBtn.disabled = busy();
      needBtn.setAttribute('aria-pressed', FILTER === NEEDS ? 'true' : 'false');
      var nl = add(needBtn, 'span', 'cat-top');
      add(nl, 'span', 'cat-name', 'Needs an amount');
      add(nl, 'span', 'cat-eur', m.needsAmountCount + (m.needsAmountCount === 1 ? ' expense' : ' expenses'));
      if (FOCUS_FILTER === NEEDS) { needBtn.focus({ preventScroll: true }); FOCUS_FILTER = null; }
    }
  }

  var rows = rowsFor(m, FILTER);
  var ls = add(body, 'section');
  LIST_TOP = ls;
  var head = add(ls, 'div', 'list-head');
  var name = FILTER === null ? 'Every expense' : (FILTER === NEEDS ? 'Needs an amount' : FILTER + ' only');
  add(head, 'h2', '', name);
  if (FILTER !== null) btn(head, 'textbtn', 'Show all', function () { FILTER = null; render(true); }).disabled = busy();
  else add(head, 'span', 'small', rows.length + (rows.length === 1 ? ' expense' : ' expenses'));

  if (!rows.length) add(ls, 'p', 'small', FILTER === null ? 'No expenses in this month.' : 'No expenses left here.');
  var lastDate;
  rows.forEach(function (r) {
    if (r.date !== lastDate) {
      add(ls, 'div', 'day', dateLabel(r.date));
      lastDate = r.date;
    }
    renderRow(ls, r);
  });
  add(body, 'div', 'list-end');
  renderToast(root);
  return title;
}
var LIST_TOP = null;
var EDIT_EL = null;

function renderRow(parent, r) {
  var wrap = add(parent, 'div', 'row-wrap');
  var editable = r.rowNumber && r.fingerprint && !r.settlement;
  var open = editable && EDIT && EDIT.rowNumber === r.rowNumber;
  var row;
  if (editable) {
    row = btn(wrap, 'row row-btn' + (open ? ' row-open' : ''), null, function () { toggleEdit(r); });
    row.disabled = busy();
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (FOCUS_ROW === r.rowNumber) { row.focus({ preventScroll: true }); FOCUS_ROW = null; }
  } else {
    row = add(wrap, 'div', 'row');
  }
  row.appendChild(icon(r.category));
  var left = add(row, 'span', 'row-left');
  add(left, 'span', 'row-item', r.item || 'No name');
  var who = whoText(r) + '.';
  add(left, 'span', 'row-meta', (FILTER === null || FILTER === NEEDS) ? r.category + '. ' + who : who);
  if (r.needsAmount) add(left, 'span', 'flag', 'Needs an amount');
  var right = add(row, 'span', 'row-right');
  var amt = rowAmounts(r);
  add(right, 'span', 'row-main', amt.main);
  amt.sub.forEach(function (t) { add(right, 'span', 'row-sub', t); });
  if (r.receipt && /^https:\/\/(drive|docs)\.google\.com\//.test(r.receipt)) {
    var a = add(wrap, 'a', 'receipt', 'Receipt');
    a.setAttribute('href', r.receipt);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  }
  if (open) {
    EDIT_EL = wrap;
    renderEditor(wrap, r);
  }
}

// ---- fixing an expense ----------------------------------------------------------
function startEdit(r) {
  EDIT_SEQ++;
  EDIT = {
    id: EDIT_SEQ,
    rowNumber: r.rowNumber,
    draft: {
      item: inputText(r.item), amount: r.amount === null || r.amount === undefined ? '' : String(r.amount), currency: r.currency || '',
      date: r.date || '', category: r.category, paidBy: r.paidBy, paidFor: r.paidFor
    },
    saving: false,
    deleting: false,
    error: ''
  };
}

function toggleEdit(r) {
  if (EDIT && EDIT.saving) return;
  if (EDIT && EDIT.rowNumber === r.rowNumber) {
    EDIT = null;
    FOCUS_ROW = r.rowNumber;
  } else {
    startEdit(r);
  }
  TOAST = null;
  render(true);
}

function fieldDef(name) {
  for (var i = 0; i < FIELDS.length; i++) if (FIELDS[i].field === name) return FIELDS[i];
  return null;
}

function renderEditor(parent, r) {
  var box = add(parent, 'div', 'editor');
  var controls = {};
  function typed(f, type, extra) {
    var id = 'edit-' + f.field;
    var lab = add(box, 'label', '', f.label);
    lab.setAttribute('for', id);
    var input = add(box, 'input');
    input.setAttribute('id', id);
    input.setAttribute('type', type);
    input.setAttribute('autocomplete', 'off');
    for (var k in extra) input.setAttribute(k, extra[k]);
    input.value = EDIT.draft[f.field];
    input.disabled = EDIT.saving;
    input.addEventListener('input', function () { EDIT.draft[f.field] = input.value; });
    controls[f.field] = input;
    return input;
  }
  function picker(f, options, typeSlot, locked) {
    var id = 'edit-' + f.field;
    var lab = add(box, 'label', '', f.label);
    lab.setAttribute('for', id);
    var line = add(box, 'div', 'select-line');
    var slot = typeSlot ? add(line, 'span', 'type-icon') : null;
    if (slot) slot.appendChild(icon(EDIT.draft[f.field]));
    var sel = add(line, 'select');
    sel.setAttribute('id', id);
    editOptions(options, EDIT.draft[f.field]).forEach(function (o) {
      var opt = add(sel, 'option', '', o[1]);
      opt.value = o[0];
    });
    sel.value = EDIT.draft[f.field];
    sel.disabled = EDIT.saving || !!locked;
    sel.addEventListener('change', function () {
      EDIT.draft[f.field] = sel.value;
      if (slot) {
        slot.textContent = '';
        slot.appendChild(icon(sel.value));
      }
    });
    controls[f.field] = sel;
    return sel;
  }
  var cats = (DATA.categories || []).map(function (c) { return [c, c]; });
  var typeLocked = !DATA.canChangeType;
  typed(fieldDef('item'), 'text', { maxlength: '100' });
  typed(fieldDef('amount'), 'text', { inputmode: 'decimal' });
  picker(fieldDef('currency'), CURRENCIES);
  typed(fieldDef('date'), 'date', {});
  picker(fieldDef('category'), typeLocked ? [] : cats, true, typeLocked);
  if (typeLocked) add(box, 'p', 'editor-note', 'Type cannot be changed right now.');
  picker(fieldDef('paidBy'), [['Couple', 'Joint money'], ['Kev', 'Kev'], ['Lili', 'Lili']]);
  picker(fieldDef('paidFor'), [['Couple', 'Both'], ['Kev', 'Kev'], ['Lili', 'Lili']]);
  if (EDIT.error) add(box, 'p', 'editor-error', EDIT.error).setAttribute('role', 'alert');
  var actions = add(box, 'div', 'editor-actions');
  var save = btn(actions, 'btn-main', EDIT.saving && !EDIT.deleting ? 'Saving...' : 'Save', function () {
    FIELDS.forEach(function (f) { EDIT.draft[f.field] = controls[f.field].value; });
    var row = rowByNumber(DATA.months, r.rowNumber);
    var checked = row ? editDraftValues(row, EDIT.draft, DATA.today) : { values: {} };
    if (checked.error) {
      EDIT.error = checked.error;
      render(true);
      return;
    }
    saveEdit(r.rowNumber, checked.values);
  });
  var cancel = btn(actions, 'btn-plain', 'Cancel', function () { toggleEdit(r); });
  save.disabled = EDIT.saving;
  cancel.disabled = EDIT.saving;
  var del = btn(box, 'editor-delete', EDIT.deleting ? 'Deleting...' : 'Delete', function () { deleteExpense(r.rowNumber); });
  del.disabled = EDIT.saving;
}

function refusalText(res) {
  if (res && res.retry) return 'Could not save. Try again.';
  if (res && res.settlement) return 'A settlement cannot be changed here.';
  if (res && res.invalid && res.reason === 'needsCurrency') return 'Pick a currency.';
  if (res && res.invalid) return 'That choice is not allowed.';
  return 'Could not save. Try again.';
}

function labelsOf(changes) {
  return changes.map(function (c) { return c.label; });
}

function setToast(t, key) {
  t.key = key;
  TOAST = t;
}

// The expense itself: columns A to E, as a (from applyChanges) expects them. Euros are skipped once a change moved them.
function sameExpense(a, b) {
  return !!a && !!b && a.date === b.date && a.item === b.item && a.amount === b.amount && a.currency === b.currency && (!!a.eurUnknown || a.eur === b.eur);
}

// Sends job.changes one after another. Each one needs the fingerprint from the reply before it, and stops
// if a different expense has moved into the row. job: {rowNumber, fingerprint, expect, changes, saved,
// done(saved, fingerprint), failed(saved, change, res, fingerprint), noData(saved, rest), unsure(saved, change, rest)}.
function sendChanges(job) {
  if (!job.changes.length) { job.done(job.saved, job.fingerprint); return; }
  var change = job.changes[0];
  var session = SESSION;
  call_('update', {
    token: TOKEN,
    rowNumber: job.rowNumber,
    fingerprint: job.fingerprint,
    field: change.field,
    value: change.value
  }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) { job.failed(job.saved, change, res, job.fingerprint); return; }
    job.saved = job.saved.concat([change]);
    job.changes = job.changes.slice(1);
    if (!res.data) { job.noData(job.saved, job.changes); return; }
    DATA = res.data;
    var now = rowByNumber(DATA.months, job.rowNumber);
    job.fingerprint = sameExpense(applyChanges(job.expect, job.saved), now) ? now.fingerprint : null;
    if (job.fingerprint === null && job.changes.length) {
      job.failed(job.saved, job.changes[0], { conflict: true }, null);
      return;
    }
    sendChanges(job);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    // The save may have landed, so it is never sent again. The page refreshes and says to check.
    if (unreached(err)) { job.unsure(job.saved, change, job.changes.slice(1)); return; }
    job.failed(job.saved, change, null, job.fingerprint);
  });
}

// Closes the editor a reply belongs to, never one opened since.
function closeEdit(editId) {
  if (EDIT && EDIT.id === editId) EDIT = null;
}

function conflictRefresh(saved, label, key, editId) {
  var labels = labelsOf(saved);
  closeEdit(editId);
  setToast({
    text: saveFailText(labels, label, 'This expense changed. Refreshing.'),
    refreshing: true,
    after: labels.length ? saveFailText(labels, label, 'This expense changed.') : null
  }, key);
  render(true);
  loadData(true);
}

function savedNoDataRefresh(saved, rest, key, editId) {
  var labels = labelsOf(saved);
  var text = rest.length
    ? andList(labels) + (labels.length === 1 ? ' was' : ' were') + ' saved. ' + andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.'
    : null;
  closeEdit(editId);
  setToast({ text: (text || 'Saved.') + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

function savedUnsureRefresh(saved, change, rest, key, editId) {
  var parts = [];
  if (saved.length) parts.push(andList(labelsOf(saved)) + (saved.length === 1 ? ' was' : ' were') + ' saved.');
  parts.push('Could not reach the server, so check whether ' + change.label + ' saved.');
  if (rest.length) parts.push(andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.');
  var text = parts.join(' ');
  closeEdit(editId);
  setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

// after: the row as it reads once changes landed (applyChanges), which the undo checks the row against.
function undoFor(rowNumber, fingerprint, after, changes) {
  var cats = DATA && DATA.canChangeType ? DATA.categories : null;
  return (fingerprint && changes.length && canUndo(changes, DATA && DATA.today, cats)) ? { rowNumber: rowNumber, fingerprint: fingerprint, expect: after, changes: changes } : null;
}

function saveEdit(rowNumber, values) {
  var row = rowByNumber(DATA.months, rowNumber);
  var changes = row ? pendingChanges(row, values) : [];
  if (!changes.length) {
    EDIT = null;
    FOCUS_ROW = rowNumber;
    render(true);
    return;
  }
  var key = VIEW.key;
  var editId = EDIT.id;
  EDIT.saving = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  sendChanges({
    rowNumber: rowNumber,
    fingerprint: row.fingerprint,
    expect: row,
    changes: changes,
    saved: [],
    done: function (saved, fingerprint) {
      closeEdit(editId);
      setToast({ text: 'Changed.', undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh(saved, change.label, key, editId); return; }
      var reason = refusalText(res);
      if (saved.length) {
        setToast({ text: saveFailText(labelsOf(saved), change.label, reason), undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key);
      }
      if (EDIT && EDIT.id === editId) {
        // A saved Type can take the row out of the filtered list. The bar above still says what happened.
        var m = monthByKey(key);
        var listed = m && rowsFor(m, FILTER).some(function (r) { return r.rowNumber === rowNumber; });
        if (listed) {
          EDIT.saving = false;
          EDIT.error = reason;
        } else {
          EDIT = null;
        }
      }
      render(true);
    },
    noData: function (saved, rest) { savedNoDataRefresh(saved, rest, key, editId); },
    unsure: function (saved, change, rest) { savedUnsureRefresh(saved, change, rest, key, editId); }
  });
}

function undoLast() {
  var undo = TOAST.undo;
  var key = TOAST.key;
  TOAST.busy = true;
  render(true);
  var back = undo.changes.slice().reverse().map(function (c) {
    return { field: c.field, label: c.label, old: c.value, value: c.old };
  });
  sendChanges({
    rowNumber: undo.rowNumber,
    fingerprint: undo.fingerprint,
    expect: undo.expect,
    changes: back,
    saved: [],
    done: function () {
      setToast({ text: 'Changed back.' }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh([], change.label, key, null); return; }
      var left = undo.changes.slice(0, undo.changes.length - saved.length);
      var why = res && res.invalid ? 'That choice is not allowed.' : 'Try again.';
      setToast({ text: 'Could not undo. ' + why, undo: undoFor(undo.rowNumber, fingerprint, applyChanges(undo.expect, saved), left) }, key);
      render(true);
    },
    noData: function (saved, rest) {
      if (rest.length) {
        setToast({ text: 'Could not finish the undo. Refreshing.', refreshing: true, after: 'Could not finish the undo.' }, key);
      } else {
        setToast({ text: 'Changed back. Refreshing.', refreshing: true, after: 'Changed back.' }, key);
      }
      render(true);
      loadData(true);
    },
    unsure: function () {
      var text = 'Could not reach the server, so check whether the undo went through.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
    }
  });
}

// ---- deleting an expense ----------------------------------------------------------
// The row moves to the sheet's hidden Deleted tab. "Deleted. Undo" stays 6 seconds; Undo puts it back.
function deletedToast(text, deletedId, key) {
  var t = { text: text, restore: deletedId };
  setToast(t, key);
  setTimeout(function () {
    if (TOAST === t && !t.busy) {
      TOAST = null;
      render(true);
    }
  }, 6000);
}

function deleteExpense(rowNumber) {
  var row = rowByNumber(DATA.months, rowNumber);
  if (!row || !EDIT || EDIT.saving) return;
  var key = VIEW.key;
  var editId = EDIT.id;
  var session = SESSION;
  EDIT.saving = true;
  EDIT.deleting = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  function stay(text) {
    if (EDIT && EDIT.id === editId) {
      EDIT.saving = false;
      EDIT.deleting = false;
      EDIT.error = text;
    }
    render(true);
  }
  call_('deleteExpense', { token: TOKEN, rowNumber: rowNumber, fingerprint: row.fingerprint }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) {
      if (res && res.conflict) { conflictRefresh([], 'Delete', key, editId); return; }
      stay(res && res.settlement ? 'A settlement cannot be deleted here.' : 'Could not delete. Try again.');
      return;
    }
    closeEdit(editId);
    if (res.data) DATA = res.data;
    deletedToast('Deleted.', res.deletedId, key);
    render(true);
    if (!res.data) loadData(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it was deleted. If it was, it can be put back from the Deleted tab in the sheet.';
      closeEdit(editId);
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    stay('Could not delete. Try again.');
  });
}

function restoreLast() {
  var t = TOAST;
  var key = t.key;
  var session = SESSION;
  t.busy = true;
  render(true);
  call_('restoreExpense', { token: TOKEN, deletedId: t.restore }).then(function (res) {
    if (session !== SESSION) return;
    if (res && res.ok) {
      if (res.data) {
        DATA = res.data;
        setToast({ text: 'Put back.' }, key);
        render(true);
      } else {
        setToast({ text: 'Put back. Refreshing.', refreshing: true, after: 'Put back.' }, key);
        render(true);
        loadData(true);
      }
      return;
    }
    if (res && res.invalid) setToast({ text: 'Could not undo. It is no longer in Deleted.' }, key);
    else deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it came back.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  });
}

function renderToast(root) {
  if (!TOAST || TOAST.key !== VIEW.key) return;
  var bar = add(root, 'div', 'toast');
  bar.setAttribute('role', 'status');
  add(bar, 'span', '', TOAST.text);
  if (TOAST.undo || TOAST.restore) {
    var b = btn(bar, '', 'Undo', TOAST.restore ? restoreLast : undoLast);
    b.disabled = !!TOAST.busy;
    if (!TOAST.busy && !EDIT) b.focus({ preventScroll: true });
  }
}

function renderBalanceScreen() {

  foot.setAttribute('aria-hidden', 'true');
  return title;

var APP_ON = false; // true while the screens are on show, false while the cover is
var MONEY_FAILED = false; // Money's first load, started from a list tab, failed

// What Save would send, in a fixed order. old is what Undo sends back. A field missing from draft is left alone.
function pendingChanges(row, draft) {
  // Currency before amount: the server recomputes euros from the currency already on the row.
  var fields = [['item', 'Item'], ['currency', 'Currency'], ['amount', 'Amount'], ['date', 'Date'], ['category', 'Type'], ['paidBy', 'Paid by'], ['paidFor', 'Paid for']];
  var out = [];
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i][0];
    if (draft[f] !== undefined && draft[f] !== row[f]) out.push({ field: f, label: fields[i][1], old: row[f], value: draft[f] });
  }
  return out;
}

// The day after a yyyy-MM-dd day.
function nextDay(iso) {
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)) + 1));
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// What a one-line text input holds for a value: browsers drop line breaks from it.
function inputText(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[\r\n]/g, '');
}

// An item name the server takes: 1 to 100 characters after trimming, no control characters.
function itemOk(s) {
  if (typeof s !== 'string' || s.length > 200 || /[\u0000-\u001f\u007f]/.test(s)) return false;
  var t = s.replace(/^\s+|\s+$/g, '');
  return t.length >= 1 && t.length <= 100;
}

function currencyOk(c) {
  return c === 'IDR' || c === 'EUR' || c === 'USD';
}

// The edit sheet's typed values, checked: {values} for pendingChanges, or {error} in plain words. Item, amount and
// date are left out when they match the row, so a blank stays blank. Days run from 2020 to tomorrow (the server
// checks again in Bali time).
function editDraftValues(row, draft, todayIso) {
  var out = { currency: draft.currency, category: draft.category, paidBy: draft.paidBy, paidFor: draft.paidFor };
  var item = String(draft.item === undefined || draft.item === null ? '' : draft.item).replace(/^\s+|\s+$/g, '');
  if (item !== inputText(row.item).replace(/^\s+|\s+$/g, '')) {
    if (!item) return { error: 'Give it a name.' };
    if (item.length > 100) return { error: 'Keep the name to 100 characters.' };
    out.item = item;
  }
  var amount = String(draft.amount === undefined || draft.amount === null ? '' : draft.amount).replace(/\s/g, '');
  var shown = row.amount === null || row.amount === undefined ? '' : String(row.amount);
  if (amount !== shown) {
    var digits = 'Type the amount as digits, like 85000 or 4.50.';
    if (!/^\d+([.,]\d{1,2})?$/.test(amount)) return { error: digits };
    var n = Number(amount.replace(',', '.'));
    if (!(n > 0) || n >= 1e12) return { error: digits };
    if (n !== row.amount) out.amount = n;
  }
  // Only an amount being sent needs a usable currency (the server refuses it otherwise); other fields go through.
  if (out.amount !== undefined && !currencyOk(draft.currency)) return { error: 'Pick a currency.' };
  var day = String(draft.date === undefined || draft.date === null ? '' : draft.date);
  if (day !== (row.date || '')) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
    var real = !!m && dateOk(Number(m[1]), Number(m[2]), Number(m[3]));
    if (!real) return { error: 'Pick a real day.' };
    if (day < '2020-01-01' || day > nextDay(todayIso)) return { error: 'Pick a day from 2020 up to tomorrow.' };
    out.date = day;
  }
  return { values: out };
}

function dateOk(y, m, d) {
  var t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

// The row as it should read once changes have landed. Euros are then unknown if amount, currency or date moved.
function applyChanges(row, changes) {
  var out = {};
  for (var k in row) out[k] = row[k];
  for (var i = 0; i < changes.length; i++) {
    out[changes[i].field] = changes[i].value;
    if (changes[i].field === 'amount' || changes[i].field === 'currency' || changes[i].field === 'date') out.eurUnknown = true;
  }
  return out;
}

// Undo is offered only when the server would take every old value back: the same rules as Edit.gs.
// todayIso and categories are used when given (the day range, and the Type list).
function canUndo(changes, todayIso, categories) {
  for (var i = 0; i < changes.length; i++) {
    var c = changes[i];
    var v = c.old;
    if (c.field === 'amount') {
      if (typeof v !== 'number' || !isFinite(v) || !(v > 0) || v >= 1e12 || Math.round(v * 100) / 100 !== v) return false;
    } else if (c.field === 'currency') {
      if (!currencyOk(v)) return false;
    } else if (c.field === 'date') {
      var m = typeof v === 'string' ? /^(\d{4})-(\d{2})-(\d{2})$/.exec(v) : null;
      if (!m || !dateOk(Number(m[1]), Number(m[2]), Number(m[3])) || v < '2020-01-01') return false;
      if (todayIso && v > nextDay(todayIso)) return false;
    } else if (c.field === 'item') {
      if (!itemOk(v)) return false;
    } else if (c.field === 'category') {
      if (typeof v !== 'string' || v === '' || v.length > 100 || v === 'Settlement') return false;
      if (categories && categories.indexOf(v) < 0) return false;
    } else if (v !== 'Couple' && v !== 'Kev' && v !== 'Lili') {
      return false;
    }
  }
  return true;
}

function saveFailText(doneLabels, failLabel, reason) {
  if (!doneLabels.length) return reason;
  return andList(doneLabels) + (doneLabels.length === 1 ? ' was' : ' were') + ' saved. ' + failLabel + ' was not. ' + reason;
}

function rowByNumber(months, rowNumber) {
  for (var i = 0; i < months.length; i++) {
    for (var j = 0; j < months[i].rows.length; j++) {
      if (months[i].rows[j].rowNumber === rowNumber) return months[i].rows[j];
    }
  }
  return null;
}

// Options as [value, label]. A current value off the list still shows, so the editor never misstates a row.
function editOptions(options, current) {
  for (var i = 0; i < options.length; i++) {
    if (options[i][0] === current) return options;
  }
  return [[current, current === '' ? 'Not set' : current]].concat(options);
}

function partialLabel(m, todayIso) {
  if (!m.partial) return '';
  return m.key >= todayIso.slice(0, 7) ? 'so far' : 'part month';
}

function comparison(m, usual, rate, todayIso) {
  var v = m.vsUsual;
  if (v) {
    if (v.direction === 'same' || v.diffIdr === 0) return { verdict: 'same', text: 'The same as your usual.' };
    var abs = Math.abs(v.diffIdr);
    return { verdict: v.direction, text: fmtIdr(abs) + ' (' + fmtEur(abs / rate) + ') ' + v.direction + ' your usual.' };
  }
  if (m.partial && m.key >= todayIso.slice(0, 7)) {
    return { verdict: null, text: 'So far: ' + dayText(todayIso) + '. No comparison until the month ends.' };
  }
  if (m.partial) return { verdict: null, text: 'Not a full month, so it is not compared with your usual.' };
  return { verdict: null, text: 'Too few full months yet to compare.' };
}

// A1-T4: rupiah big, EUR small (rowIdr_: an IDR row's own amount, others from the stored euros at the rate). A USD
// row also shows what was paid. With no rate, a row that is not in rupiah shows its euros big and no rupiah.
function rowAmounts(r, rate) {
  function paid() {
    if (r.currency === 'IDR') return fmtIdr(r.amount);
    if (r.currency === 'EUR') return fmtEur(r.amount);
    return (r.currency ? r.currency + ' ' : '') + fixed2(r.amount);
  }
  if (r.needsAmount) return { main: r.amount === null ? 'No amount' : paid(), sub: [] };
  var idr = rowIdr_(r, rate);
  if (idr === null) return { main: fmtEur(r.eur), sub: r.currency === 'EUR' ? [] : [paid()] };
  if (r.currency === 'IDR' || r.currency === 'EUR') return { main: fmtIdr(idr), sub: [fmtEur(r.eur)] };
  return { main: fmtIdr(idr), sub: [fmtEur(r.eur), paid()] };
}

function rowsFor(m, filter) {
  if (filter === null) return m.rows;
  return m.rows.filter(function (r) {
    return filter === NEEDS ? r.needsAmount : r.category === filter;
  });
}

function shareText(share) {
  if (share > 0 && share < 0.01) return 'under 1%';
  return Math.round(share * 100) + '%';
}

function trendSentences(p) {
  var t = p.tendencies;
  var rate = t.rate;
  var out = [];
  function both(idr) { return fmtIdr(idr) + ' (' + fmtEur(idr / rate) + ')'; }
  if (t.change) {
    out.push(t.change.sentence + ': ' + (t.change.diffIdr < 0 ? 'down ' : 'up ') + both(Math.abs(t.change.diffIdr)) + '.');
  }
  if (p.usual) {
    out.push('Your usual month is ' + both(p.usual.avgIdr) + ', the average of ' + andList(p.usual.keys.map(monthName)) + '.');
  } else {
    out.push('Your usual month appears once there are 3 full months.');
  }
  if (t.rows.length && t.rows[0].totalIdr > 0) {
    out.push('Over all months, the most went on ' + t.rows[0].category + ': ' + both(t.rows[0].totalIdr) + '.');
  }
  return out;
}

function rateNote(months) {
  var out = [];
  for (var i = 0; i < months.length; i++) {
    if (Math.abs(months[i].totalEur - months[i].comparisonEur) >= 1) {
      out.push(months[i].label + ' is ' + fmtEur(months[i].totalEur) + ' in the sheet, at the rate used that month.');
    }
  }
  return out.join(' ');
}

function viewHash(view) {
  if (view.screen === 'month') return '#month=' + view.key;
  if (view.screen === 'trends') return '#tendencies';
  if (view.screen === 'balance') return '#balance';
  if (view.screen === 'todo') return '#todo';
  if (view.screen === 'groceries') return '#groceries';
  return '';
}

function viewFromHash(hash) {
  var m = /^#month=(\d{4}-\d{2})$/.exec(hash || '');
  if (m) return { screen: 'month', key: m[1] };
  if (hash === '#tendencies') return { screen: 'trends', key: null };
  if (hash === '#balance') return { screen: 'balance', key: null };
  if (hash === '#todo') return { screen: 'todo', key: null };
  if (hash === '#groceries') return { screen: 'groceries', key: null };
  return { screen: 'home', key: null };
}

// The bottom bar tab a screen belongs to: every money screen is under Money.
function tabOf_(screen) {
  if (screen === 'todo' || screen === 'groceries') return screen;
  return 'money';
}

function isListScreen_(screen) {
  return screen === 'todo' || screen === 'groceries';
}

// ---- token: kept in memory, and in browser storage when the browser allows it ----
function store(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function unstore() { try { localStorage.removeItem(KEY); } catch (e) {} }

// ---- page storage: the kl.* keys, each read and write inside try, so the page works without storage ----
var LS_TAB = 'kl.tab';     // the last bottom bar tab: money, todo or groceries
var LS_ME = 'kl.me';       // who this phone is: Kev or Lili
var LS_LISTS = 'kl.lists'; // the last lists reply, as {at, result}
var LS_QUEUE = 'kl.queue'; // the list ops not yet answered, oldest first
var LS_MONEY = 'kl.money'; // A1-T3: the last data reply, as {v, at, data}; drawn first, then refreshed
var LS_KEPT = 'kl.kept';   // A1-T5: expenses the server refused, as [{key, at, draft}], kept until saved again
var MONEY_V = 2;           // A1-T4: version 2, Money reads data.fx; a version 1 snapshot is ignored
function lsGet_(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet_(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel_(k) { try { localStorage.removeItem(k); } catch (e) {} }
function lsJson_(k) {
  var t = lsGet_(k);
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

// ---- DOM helpers: every value goes in as text --------------------------------
function $(id) { return document.getElementById(id); }

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function add(parent, tag, cls, text) {
  return parent.appendChild(el(tag, cls, text));
}

function btn(parent, cls, text, onClick) {
  var b = add(parent, 'button', cls, text);
  b.setAttribute('type', 'button');
  b.addEventListener('click', onClick);
  return b;
}

function icon(name) {
  return svgIcon_(iconPaths(name));
}

// Bottom bar icons. Paths are constant strings in this file, never data. Groceries reuses the cart.
function tabIconPaths_(tab) {
  if (tab === 'todo') return ['M4.5 4.5h15v15h-15z', 'M8.5 12.5l2.5 2.5l4.5-5.5'];
  if (tab === 'groceries') return iconPaths('Groceries');
  return ['M3.5 6.5h17v11h-17z', 'M14.5 12a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0z', 'M6.5 9.5v5', 'M17.5 9.5v5'];
}

var SVG_NS = 'http://www.w3.org/2000/svg';

function svgIcon_(paths) {
  var ns = SVG_NS;
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '20');
  svg.setAttribute('height', '20');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.6');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  paths.forEach(function (d) {
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
  });
  return svg;
}

// True while a save or undo is on its way. Back, filters and rows wait for it.
function busy() {
  return !!((EDIT && EDIT.saving) || (TOAST && TOAST.busy));
}

function monthByKey(key) {
  for (var i = 0; i < DATA.months.length; i++) {
    if (DATA.months[i].key === key) return DATA.months[i];
  }
  return null;
}

// Keeps a currency next to its number when a sentence wraps.
function nb(s) {
  return s.replace(/(Rp|EUR) (?=[-\d])/g, '$1\u00a0').replace(/(\d) M\b/g, '$1\u00a0M'); // MC: never break before the M
}

function rateText() {
  return 'Euros at a fixed rate of ' + group(DATA.rate) + ' so months compare fairly.';
}

// ---- talking to the script ------------------------------------------------------
// Every call comes through here. credentials: 'omit' is the point: Google's multi-account cookies are never sent.
// Resolves with the result. Rejects with {code}: NO_SESSION, NOT_CONFIGURED, BAD_REQUEST or SERVER from the
// script, TIMEOUT after 30 seconds, UNREACHED for anything else, such as no connection or a page that is not JSON.
function call_(action, payload) {
  var body = { action: action };
  for (var k in payload) body[k] = payload[k];
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 30000);
  return fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    credentials: 'omit',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(function (res) {
    if (!res.ok) throw { code: 'UNREACHED' };
    return res.json();
  }).then(function (reply) {
    clearTimeout(timer);
    if (reply && reply.ok === true) {
      // Sliding session: keep the fresh token, unless this phone has been locked out meanwhile.
      if (typeof reply.token === 'string' && reply.token && TOKEN) {
        TOKEN = reply.token;
        store(reply.token);
      }
      return reply.result;
    }
    throw { code: (reply && typeof reply.error === 'string') ? reply.error : 'SERVER' };
  }, function (err) {
    clearTimeout(timer);
    if (err && typeof err.code === 'string') throw err;
    throw { code: err && err.name === 'AbortError' ? 'TIMEOUT' : 'UNREACHED' };
  });
}

// True when the reply never arrived, so a save may or may not have landed.
function unreached(err) {
  return !!err && (err.code === 'TIMEOUT' || err.code === 'UNREACHED');
}

var REACH_TEXT = 'Could not reach the server. Try again.';

// ---- cover: PIN, loading and load errors --------------------------------------
function msg(t) { $('msg').textContent = t; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function clock(ms) {
  var d = new Date(ms);
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return d.toDateString() === new Date().toDateString() ? t : 'tomorrow at ' + t;
}

function showCover(mode, text) {
  APP_ON = false;
  $('app').hidden = true;
  $('cover').hidden = false;
  $('gate').hidden = mode !== 'gate';
  $('pulse').hidden = mode !== 'loading';
  $('retry').hidden = mode !== 'error';
  msg(text || '');
}

function submit() {
  var pin = $('pin').value;
  if (!pin) return;
  var go = $('go');
  if (go.disabled) return;
  go.disabled = true;
  $('pin').value = '';
  msg('Checking...');
  call_('unlock', { pin: pin }).then(function (r) {
    go.disabled = false;
    if (r && r.ok) {
      TOKEN = r.token;
      store(r.token);
      openSession_();
    }
    else if (r && r.locked) { msg('Locked until ' + clock(r.untilMs) + '.'); }
    else if (r && r.notReady) { msg('Not set up yet.'); }
    else if (r && r.retry) { msg('Could not check. Try again.'); }
    else { msg('Wrong PIN.'); }
  }, function (err) {
    go.disabled = false;
    msg(unreached(err) ? REACH_TEXT : 'Something went wrong. Try again.');
  });
}

function clearScreens() {
  $('home').textContent = '';
  $('month').textContent = '';
  $('trends').textContent = '';
  $('balance').textContent = '';
  $('todo').textContent = '';
  groClear_();
  $('tabbar').textContent = '';
}

function lockOut() {
  SESSION++;
  LOADING = false;
  TOKEN = null;
  closeItemSheet_('lock'); // Task 7: an open edit goes into the queue, sent after the unlock (A3-T2A: a new item is not added)
  whoShut_();
  QA_DRAFT = null; // A1-T5: an unsaved expense goes with the session; a queued one stays for after the PIN
  // A1 final fix 3: so does one kept as 'unsaved' in kl.kept; refused ones stay, as the queue does.
  if (qaKept_().some(function (e) { return e.why === 'unsaved'; })) {
    qaKeptChange_(function (list) { for (var i = list.length - 1; i >= 0; i--) if (list[i].why === 'unsaved') list.splice(i, 1); });
  }
  qaToastSet_(null);
  DATA = null;
  MONEY_AT = 0;
  MONEY_LIVE = false;
  MONEY_STALE = null;
  lsDel_(LS_MONEY); // A1-T3: the Money snapshot goes with the token
  VIEW = { screen: 'home', key: null };
  FILTER = null;
  DONUT_VIEW = 'cur';
  DONUT_MORE = false;
  DONUT_SMALL = false;
  MONTH_MORE = false;
  EDIT = null;
  TOAST = null;
  FIRST_LOAD = true;
  listsLockOut_();
  todoLeave_();
  groLeave_();
  GRO_DRAFT = '';
  unstore();
  try { location.hash = ''; } catch (e) {}
  clearScreens();
  showCover('gate', 'Please enter your PIN.');
}

function loadFailed(quiet, err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  if (quiet && !DATA && APP_ON) {
    MONEY_FAILED = true;
    render(true);
    return;
  }
  if (quiet && DATA) {
    if (TOAST && TOAST.refreshing) {
      TOAST = { text: (TOAST.after ? TOAST.after + ' ' : '') + 'Could not refresh. These are the last numbers loaded.', key: TOAST.key };
    }
    // A3-T2B M6: the failed refresh is said under the large title of every Money screen, with the time of the
    // numbers on show ("Offline. Numbers from 10:42."); the bottom warning is gone.
    MONEY_STALE = { offline: unreached(err) };
    render(true);
    return;
  }
  if (code === 'NOT_CONFIGURED') {
    showCover('error', 'Your PIN works, but the expenses sheet is not connected yet.');
    return;
  }
  if (unreached(err)) {
    showCover('error', REACH_TEXT);
    return;
  }
  showCover('error', 'Could not load your expenses. Check the connection and try again.');
}

function loadData(quiet) {
  if (LOADING) return;
  LOADING = true;
  if (quiet) homeStatus('Updating...');
  else showCover('loading', 'Opening your expenses. The first load can take a few seconds.');
  var session = SESSION;
  var slow = setTimeout(function () {
    if (LOADING && !quiet) msg('Still working. If nothing changes soon, close this page and open it again.');
  }, 15000);
  call_('data', { token: TOKEN }).then(function (p) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    if (!p || !p.months) { loadFailed(quiet, ''); return; }
    moneySet_(p);
    if (FIRST_LOAD) {
      FIRST_LOAD = false;
      VIEW = viewFromHash(location.hash);
    }
    showApp_();
    // A month emptied by a delete stays while its Undo bar is up.
    var undoHere = TOAST && TOAST.restore && TOAST.key === VIEW.key;
    if (VIEW.screen === 'month' && !monthByKey(VIEW.key) && !undoHere) VIEW = { screen: 'home', key: null };
    if (TOAST && TOAST.refreshing) TOAST = TOAST.after ? { text: TOAST.after, key: TOAST.key } : null;
    render(true);
  }, function (err) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    loadFailed(quiet, err);
  });
}

function homeStatus(text) {
  var s = HOME_STATUS;
  if (s) s.textContent = text;
}
var HOME_STATUS = null;

// ---- the Money snapshot (kl.money, A1-T3): drawn at once on the next visit, then refreshed ---------------
var MONEY_AT = 0; // when the numbers on show were read from the server (ms)
var MONEY_STALE = null; // A3-T2B M6: the last Money refresh failed: {offline}; cleared by the next data reply
// A1 final fix 2: true once a data reply from the server has been on show in this session (the snapshot alone
// never sets it). Settle up waits for it, so a settlement is never confirmed from figures the server has not just sent.
var MONEY_LIVE = false;

// A1 final fix 8: the session token's first segment is its expiry in ms (Auth.gs signToken_). True only while that
// expiry is ahead; a token that cannot be read counts as expired.
function tokenLive_(t) {
  var m = typeof t === 'string' ? /^([0-9]{1,15})\./.exec(t) : null;
  return !!m && Number(m[1]) > Date.now();
}

// A data reply from the server: on show from now, and kept as the snapshot.
function moneySet_(p) {
  // A1-T4: fx is kept only as a usable rate, else null, so the screens and the snapshot read one shape.
  if (p && typeof p === 'object') p.fx = pageRate_(p) ? p.fx : null;
  DATA = p;
  MONEY_AT = Date.now();
  MONEY_LIVE = true;
  MONEY_STALE = null;
  // A write that fails (storage full) drops the older snapshot, so a later visit never draws stale numbers.
  if (!lsSet_(LS_MONEY, JSON.stringify({ v: MONEY_V, at: MONEY_AT, data: p }))) lsDel_(LS_MONEY);
}

// The snapshot's data when it is this version and has the parts every Money screen reads; otherwise null.
function moneyCacheData_(c) {
  if (!c || typeof c !== 'object' || c.v !== MONEY_V || typeof c.at !== 'number' || !isFinite(c.at)) return null;
  var d = c.data;
  if (!d || typeof d !== 'object' || !Array.isArray(d.months)) return null;
  if (typeof d.today !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.today)) return null;
  if (!d.balance || typeof d.balance.net !== 'number') return null;
  if (d.fx !== null && !pageRate_(d)) return null; // A1-T4: fx is null or a usable rate
  return d;
}

// Shows view v from the snapshot, before the server answers. False when there is no usable snapshot: a broken,
// older or unreadable one (one that cannot be drawn) is dropped and nothing of it stays on screen.
function moneyFromCache_(v) {
  if (!tokenLive_(TOKEN)) return false; // A1 final fix 8: an expired session draws nothing; the server decides
  var c = lsJson_(LS_MONEY);
  var d = moneyCacheData_(c);
  if (!d) return false;
  try {
    DATA = d;
    MONEY_AT = c.at;
    FIRST_LOAD = false;
    VIEW = (v.screen === 'month' && !monthByKey(v.key)) ? { screen: 'home', key: null } : v;
    showApp_();
    render(false);
    return true;
  } catch (e) {
    DATA = null;
    MONEY_AT = 0;
    FIRST_LOAD = true;
    VIEW = v;
    lsDel_(LS_MONEY);
    clearScreens();
    return false;
  }
}

// "Updated N min ago" for numbers over 10 minutes old; nothing while they are fresh.
function moneyAgeText_() {
  var now = Date.now();
  return MONEY_AT && now - MONEY_AT > 600000 ? updatedText_(MONEY_AT, now) + '.' : '';
}

// A3-T2B M6: the clock time data was read at, '10:42', with the day when it was not today ('12 Nov, 10:42').
function staleClock_(at, now) {
  var d = new Date(at);
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.toDateString() === new Date(now).toDateString()) return t;
  return d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + ', ' + t;
}

// A3-T2B M6: one line under the large title when the last refresh failed: 'Offline. Numbers from 10:42.' (or Lists).
// A refresh the server answered with an error is not called offline: 'Could not refresh. Lists from 10:42.'
function staleNote_(wrap, what, at, offline) {
  if (!at) return null;
  // A plain line, not a live region: every repaint draws it again, and it must not be said again each time.
  return add(wrap, 'p', 'title-note offline-note', (offline ? 'Offline.' : 'Could not refresh.') + ' ' + what + ' from ' + staleClock_(at, Date.now()) + '.');
}

function moneyStaleNote_(wrap) {
  return MONEY_STALE && DATA ? staleNote_(wrap, 'Numbers', MONEY_AT, MONEY_STALE.offline) : null;
}

// ---- navigation ---------------------------------------------------------------
// The screen lives in the address after #, so the phone's back button steps through screens.
function remember(view) {
  try {
    var h = viewHash(view);
    if (location.hash !== h) location.hash = h;
  } catch (e) {}
}

function go(view, fromHistory) {
  if (SHEET) closeItemSheet_('nav');
  whoShut_();
  var newTab = tabOf_(view.screen) !== tabOf_(VIEW.screen);
  if (VIEW.screen === 'home') HOME_Y = window.scrollY || 0;
  if (VIEW.screen === 'todo' && view.screen !== 'todo') todoLeave_();
  if (VIEW.screen === 'groceries' && view.screen !== 'groceries') groLeave_();
  if (view.screen !== 'month' || view.key !== VIEW.key) { FILTER = null; MONTH_MORE = false; }
  if (view.screen === 'month' && typeof view.filter === 'string') FILTER = view.filter; // A3-T2B m1: a category tapped on Money
  VIEW = view;
  EDIT = null;
  TOAST = null;
  LISTS_TOAST = '';
  listsUndoClear_();
  // Money opened for the first time this session (the page started on a list tab): load its numbers first.
  if (tabOf_(view.screen) === 'money' && !DATA) {
    if (!fromHistory) remember(view);
    // A1-T3: the Money snapshot shows at once, then the numbers refresh quietly.
    if (moneyFromCache_(view)) { loadData(true); return; }
    if (!APP_ON) { loadData(false); return; }
    // M1: the app and its bar stay; the money screen says it is loading, or why it could not.
    MONEY_FAILED = false;
    render(false);
    loadData(true);
    return;
  }
  if (isListScreen_(view.screen)) {
    if (!LISTS_BASE) listsFromCache_();
    showApp_();
  }
  if (view.editRow) {
    var r = rowByNumber(DATA.months, view.editRow);
    if (r) startEdit(r);
  }
  if (!fromHistory) remember(view);
  if (newTab && !view.editRow) withTransition_(function () { render(false); });
  else render(false);
  if (view.editRow && EDIT_EL) EDIT_EL.scrollIntoView({ block: 'center' });
  if (isListScreen_(view.screen)) listsLoad_(false);
}

// A1-T3: a tab switch through the View Transitions API (a cross-fade) when the browser has it and motion is
// welcome; otherwise paint at once and the CSS fade on .screen plays. A refusing API still paints.
function withTransition_(paint) {
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && typeof document.startViewTransition === 'function') {
    var t = null;
    try { t = document.startViewTransition(paint); } catch (e) { t = null; }
    if (t) {
      ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) {
        if (t[k] && typeof t[k].then === 'function') t[k].then(null, function () {});
      });
      return;
    }
  }
  paint();
}

function goHome() { go({ screen: 'home', key: null }); }
function goMonth(key) { go({ screen: 'month', key: key }); }

function render(keepScroll) {
  // A3-T2B M7: the Edit expense sheet follows EDIT, before the screens are drawn, so a row or an Undo the repaint
  // focuses is no longer inert behind it.
  if (DATA && tabOf_(VIEW.screen) === 'money') editSheetPaint_();
  else if (SHEET && SHEET.list === 'editexp') sheetShut_('close');
  clearScreens();
  HOME_STATUS = null;
  $('home').hidden = VIEW.screen !== 'home';
  $('month').hidden = VIEW.screen !== 'month';
  $('trends').hidden = VIEW.screen !== 'trends';
  $('balance').hidden = VIEW.screen !== 'balance';
  $('todo').hidden = VIEW.screen !== 'todo';
  $('groceries').hidden = VIEW.screen !== 'groceries';
  LISTS_NOTE = null;
  rememberTab_(tabOf_(VIEW.screen));
  renderTabs_();
  var title = null;
  EDIT_EL = null;
  if (VIEW.screen === 'todo') title = renderTodo_();
  else if (VIEW.screen === 'groceries') title = renderGroceries_();
  else if (!DATA) title = renderMoneyWaiting_();
  else if (VIEW.screen === 'month') title = renderMonth();
  else if (VIEW.screen === 'trends') title = renderTrends();
  else if (VIEW.screen === 'balance') title = renderBalanceScreen();
  else renderHome();
  if (!keepScroll) {
    window.scrollTo(0, VIEW.screen === 'home' ? HOME_Y : 0);
    if (title && !modalOpen_()) title.focus({ preventScroll: true });
  }
  if (SHEET) sheetClaimFocus_();
  if (SHEET && SHEET.list === 'expense') qaSync_(SHEET); // A1-T5: the preview reads the numbers just loaded
  // A1-T3: the first open of a list tab asks who uses this phone, once per visit.
  if (isListScreen_(VIEW.screen) && APP_ON && !whoAmI_() && !WHO_ASKED && !modalOpen_()) openWhoSheet_();
}

// True while a sheet (the item sheet or the who sheet) is open: a repaint behind it never takes focus.
function modalOpen_() {
  return !!SHEET || WHO_OPEN;
}

// ---- shared pieces --------------------------------------------------------------
// A1-T3: the top of a screen is a large title on the page colour, with an optional node on its right (the
// list headers put the avatar there). Returns the title, focusable for the screen change.
function largeTitle_(root, title, rightNode) {
  return largeTitleBox_(root, title, rightNode).h;
}

function largeTitleBox_(root, title, rightNode) {

  (Array.isArray(rightNode) ? rightNode : [rightNode]).forEach(function (n) { if (n) row.appendChild(n); });
  return { wrap: w, h: h };
}

// A screen under Money: Back, then its title (title-big unless cls says otherwise). Returns {wrap, h}.
function subTop_(root, title, cls) {

  panelBack(w);
  var h = add(w, 'h1', cls || 'title-big', title);
  h.setAttribute('tabindex', '-1');

  return { wrap: w, h: h };
}

// A1-T3: a calm empty state: one disc, a title and an optional line, all as text.
function emptyState_(root, title, line) {
  var box = add(root, 'div', 'empty');
  var disc = add(box, 'span', 'empty-disc');
  disc.setAttribute('aria-hidden', 'true');
  disc.appendChild(svgIcon_(['M8 12.3l2.8 2.8l5.2-5.8']));
  add(box, 'p', 'empty-title', title);
  if (line) add(box, 'p', 'empty-line', line);
  return box;
}

function panelBack(w) {
  var top = add(w, 'div', 'panel-top');
  var back = btn(top, 'back', 'Back', function () {
    if (VIEW.from === 'balance') go({ screen: 'balance', key: null });
    else goHome();
  });
  back.disabled = busy();
}

function section(parent, title) {
  var s = add(parent, 'section');
  if (title) add(s, 'h2', '', title);
  return s;
}

// ---- A1-T4: rupiah first --------------------------------------------------------------------
// The rate the page turns euros into rupiah with: data.fx.idrPerEur (Task 2: the month's ECB average, the
// FX row of this Bali month or the latest one before it). null when the payload has no usable rate.
function pageRate_(d) {
  var fx = d && d.fx;
  if (!fx || typeof fx !== 'object') return null;
  var n = fx.idrPerEur;
  return typeof n === 'number' && isFinite(n) && n > 0 ? n : null;
}

// Rupiah of one row. An IDR row is its own amount, exact. An EUR or USD row is its stored euros (column E) at the
// rate, rounded to the nearest 1000: a display figure only, never written anywhere. null when the row needs an
// amount, or when there is no rate, so the page never shows a rupiah figure it cannot stand behind.
function rowIdr_(r, rate) {
  if (!r || r.needsAmount || typeof r.amount !== 'number' || !isFinite(r.amount)) return null;
  if (r.currency === 'IDR') return Math.round(r.amount);
  if (!rate || typeof r.eur !== 'number' || !isFinite(r.eur)) return null;
  return Math.round(r.eur * rate / 1000) * 1000;
}

// Rupiah total of rows: the sum of each counted row's rupiah (rows needing an amount and settlements are not
// counted, as in every total). null without a rate: the page then shows euros big.
function totalIdr_(rows, rate) {
  if (!rate) return null;
  var sum = 0;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r || r.needsAmount || r.settlement) continue;
    var v = rowIdr_(r, rate);
    if (v === null) return null;
    sum += v;
  }
  return sum;
}

// Categories of rows, largest first by euros, then by name (the order rule of Calc.gs): {name, eur, idr, share}.
// idr is the sum of the rows' rupiah, or null without a rate.
function catsOf_(rows, rate) {
  var by = Object.create(null);
  var list = [];
  var total = 0;
  rows.forEach(function (r) {
    if (!r || r.needsAmount || r.settlement) return;
    var cents = Math.round(r.eur * 100);
    var name = r.category;
    total += cents;
    if (!by[name]) { by[name] = { name: name, cents: 0, idr: 0 }; list.push(by[name]); }
    by[name].cents += cents;
    by[name].idr += rowIdr_(r, rate) || 0;
  });
  var cats = list.map(function (c) {
    return { name: c.name, eur: c.cents / 100, idr: rate ? c.idr : null, share: total > 0 ? Math.round(c.cents / total * 10000) / 10000 : 0 };
  });
  cats.sort(function (a, b) {
    if (b.eur !== a.eur) return b.eur - a.eur;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  return cats;
}

// The big and the small figure of an amount: rupiah big and EUR small, or EUR big alone when there is no rupiah.
function bigSmall_(idr, eur) {
  if (idr === null || idr === undefined) return { big: fmtEur(eur), small: '' };
  return { big: fmtIdr(idr), small: fmtEur(eur) };
}

// Rupiah in millions with one decimal, for the bar labels: 12755000 reads 12.8.
function millions_(n) {
  return (Math.round(n / 100000) / 10).toFixed(1);
}

// The calendar month before a yyyy-MM key.
function monthBefore_(key) {
  var y = Number(key.slice(0, 4));
  var m = Number(key.slice(5, 7)) - 1;
  if (m < 1) { m = 12; y -= 1; }
  return y + '-' + (m < 10 ? '0' : '') + m;
}

// One colour per category name, the same on every screen and in every month (A1-T4). Hues follow the bot's
// CAT_PALETTE in Code.gs, darkened so each is at least 3:1 on the white cards. Other is the warm grey. A name off
// the list gets one of four spare colours, picked from its letters, so it always wears the same one.
function catColour_(name) {
  var map = {
    'Groceries': '#448335', 'Restaurant': '#ba5d1d', 'Eating out': '#ba5d1d', 'Utilities': '#b5820c', 'Transport': '#116d8a',
    'Health': '#b9454c', 'Leisure': '#7555a8', 'Shopping': '#ac4785', 'Decoration': '#9d6762', 'Furniture': '#5d3f35',
    'Subscriptions': '#1b8278', 'Phone & subscriptions': '#1b8278', 'Pets': '#8b551c', 'Household': '#3f602a', 'Home': '#3f602a',
    'Rent': '#42428c', 'Visa & admin': '#7d7728', 'Travel': '#2d78bd', 'Gifts': '#90314e', 'Business': '#364452',
    'Other': '#8c857f', 'Settlement': '#8c857f'
  };
  if (typeof name === 'string' && Object.prototype.hasOwnProperty.call(map, name)) return map[name];
  var spare = ['#6a5f8f', '#4d6f7c', '#8a5b4c', '#5c6b3c'];
  var s = typeof name === 'string' ? name : '';
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return spare[h % spare.length];
}

// A category's avatar: its icon in its colour on a pale disc of the same colour. Drawing only (the name is text).
function catAvatar_(parent, name) {
  var col = catColour_(name);
  var a = add(parent, 'span', 'cav');
  a.setAttribute('aria-hidden', 'true');
  a.style.color = col;
  a.style.background = col + '1f';
  a.appendChild(icon(name));
  return a;
}

// The usual month in the unit on show: the average of the payload's usual months (Calc.gs picks them), each added
// up the same way as every other total on the page. null when there is no usual month yet.
function usualOf_(rate) {
  var u = DATA.usual;
  if (!u || !u.keys || !u.keys.length) return null;
  var sum = 0;
  var n = 0;
  u.keys.forEach(function (k) {
    var m = monthByKey(k);
    if (!m) return;
    var v = rate ? totalIdr_(m.rows, rate) : m.totalEur;
    if (v === null) return;
    sum += v;
    n++;
  });
  if (!n) return null;
  return rate ? Math.round(sum / n) : Math.round(sum / n * 100) / 100;
}

// ---- MC rows: Money in simple rows (Lili: the big number was too big) ----------------------------------------
// Like the phone's Settings: plain rows, label left, value right, all at reading size. Totals read rounded: from a
// million, millions with one decimal (an M after the figure); under a million, in full.
function roundIdr_(n) {
  var a = Math.abs(Math.round(n));
  var sign = n < 0 && a > 0 ? '-' : '';
  if (a < 1000000) return sign + 'Rp ' + group(a);
  var parts = (Math.round(a / 100000) / 10).toFixed(1).split('.');
  return sign + 'Rp ' + group(parts[0]) + '.' + parts[1] + ' M';
}

// A total for a row: rupiah rounded, or the euros as they are when there is no rupiah (no rate).
function moneyShort_(idr, eur) {
  if (idr === null || idr === undefined) return fmtEur(eur);
  return roundIdr_(idr);
}

// The card of rows under a Money title.
function mrowsCard_(parent, cls) {
  return add(parent, 'div', 'card mrows' + (cls ? ' ' + cls : ''));
}

// One plain row: the label, then the value (soft for the usual month). No value: the label alone.
function mrow_(card, label, value, soft) {
  var r = add(card, 'div', 'mrow');
  add(r, 'span', 'mrow-label', label);
  if (value !== null && value !== undefined) add(r, 'span', 'mrow-val' + (soft ? ' mrow-soft' : ''), value);
  return r;
}

// "A usual month", rounded, in the unit on show. Absent while there is no usual month yet.
function usualRow_(card, rate) {
  var u = usualOf_(rate);
  if (u === null || !(u > 0)) return null;
  return mrow_(card, 'A usual month', rate ? roundIdr_(u) : fmtEur(u), true);
}

// The balance as a row on the balance screen: who pays whom and the euros (they settle in euros, exact to the cent).
// All square has no amount. After Mark as settled the figure counts down to zero once, then reads All square (not
// when the phone asks for no motion). F4: the home shows the balance card instead (renderBalanceCard_).
function balanceRow_(card) {
  var side = balanceSide_(DATA.balance.net);
  var square = side.square;
  if (!square) SETTLE_ANIM = null;
  var counting = square && SETTLE_ANIM && Date.now() - SETTLE_ANIM.at < 20000 && !settleCalm_();
  if (SETTLE_ANIM && (settleCalm_() || (square && !counting))) SETTLE_ANIM = null;
  var row = add(card, 'div', 'mrow');
  var words = add(row, 'span', 'mrow-label');
  if (counting) {
    add(words, 'span', '', 'Settled');
    SETTLE_EL = add(row, 'span', 'mrow-val', fmtEur(SETTLE_ANIM.from));
    if (!SETTLE_ANIM.running) {
      SETTLE_ANIM.running = true;
      setTimeout(function () { settleStep_(0); }, 40);
    }
  } else if (square) {
    add(words, 'span', '', 'All square');
  } else {
    add(words, 'span', '', side.who);
    add(row, 'span', 'mrow-val', fmtEur(side.eur));
  }
  return row;
}

// ---- F4: the home top restored (Kevin 2026-11-14), from the page before MC, on today's guards
// The big number of the hero: a small currency, then the figure; EUR small underneath when it is rupiah.
function heroNumber_(w, idr, eur) {
  var h = add(w, 'p', 'hero');
  var v = idr !== null ? idr : eur;
  add(h, 'span', 'hero-cur', idr !== null ? 'Rp' : 'EUR');
  h.appendChild(document.createTextNode((v < 0 ? '-' : '') + (idr !== null ? group(Math.abs(Math.round(idr))) : fixed2(eur))));
  if (idr !== null) add(w, 'p', 'hero-sub', nb(eurRound_(eur))); // F4 pick B: whole euros under the rupiah
}

// The hero card on the home (Kevin's pick B, "White, papaya thread"): the month so far, rupiah in full and EUR small,
// "Day N of M", one fine line against the usual month with today marked on it, and the usual month rounded. Past
// the usual month the line is simply full: no warning words, no percentage.
function moneyHero_(wrap, m, label, today, rate) {
  var w = add(wrap, 'div', 'hero-card');
  var d = dayOfMonth(today);
  var top = add(w, 'div', 'hero-top');
  add(top, 'span', '', label);
  add(top, 'span', '', 'Day ' + d.day + ' of ' + d.days);
  var idr = totalIdr_(m.rows, rate);
  heroNumber_(w, idr, m.totalEur);
  var usual = usualOf_(rate);
  if (usual === null || !(usual > 0)) return w; // F4 pick B: no usual month yet, no line and no foot
  var now = idr !== null ? idr : m.totalEur;
  var pct = Math.round(Math.max(0, now) / usual * 100);
  var bar = add(w, 'div', 'pace');
  bar.setAttribute('aria-hidden', 'true');
  add(bar, 'span', 'pace-fill').style.width = Math.min(100, pct) + '%';
  add(bar, 'span', 'pace-day').style.left = Math.round(d.day / d.days * 1000) / 10 + '%';
  add(w, 'p', 'hero-foot', nb('A usual month is ' + (rate ? roundIdr_(usual) : fmtEur(usual)))); // no percentage
  return w;
}

// The balance card on the home: who pays whom, euros big (they settle in euros, to the cent), rupiah small at the
// month's rate. The card opens the balance screen; Settle up sits on it (the same button and guards as the balance
// screen: gone when square or while a settlement waits, disabled with its reason until the numbers are the server's).
// After Mark as settled the euros count down once, then it reads All square.
function renderBalanceCard_(parent, rate) {
  var side = balanceSide_(DATA.balance.net);
  var square = side.square;
  var bal = add(parent, 'div', 'card bal');
  var open = btn(bal, 'bal-open', null, function () { go({ screen: 'balance', key: null }); });
  var words = add(open, 'span', 'bal-words');
  if (!square) SETTLE_ANIM = null;
  var counting = square && SETTLE_ANIM && Date.now() - SETTLE_ANIM.at < 20000 && !settleCalm_();
  if (SETTLE_ANIM && (settleCalm_() || (square && !counting))) SETTLE_ANIM = null;
  if (counting) {
    add(words, 'span', 'bal-label', 'Settled');
    SETTLE_EL = add(words, 'span', 'bal-big', fmtEur(SETTLE_ANIM.from));
    if (!SETTLE_ANIM.running) {
      SETTLE_ANIM.running = true;
      setTimeout(function () { settleStep_(0); }, 40);
    }
  } else if (square) {
    add(words, 'span', 'bal-label', 'All square');
    add(words, 'span', 'bal-note', 'Nothing to settle. See how it adds up');
  } else {
    add(words, 'span', 'bal-label', side.who);
    add(words, 'span', 'bal-big', fmtEur(side.eur));
    if (rate) add(words, 'span', 'bal-small', fmtIdr(Math.round(side.eur * rate / 1000) * 1000));
    if (settlePending_()) add(words, 'span', 'bal-note', 'Settling up. Waiting to be sent.');
  }
  add(open, 'span', 'chev').setAttribute('aria-hidden', 'true');
  if (!counting) settleButton_(bal, words);
  return bal;
}
// ---- MC end

// ---- settle up (A1-T6) ------------------------------------------------------------------------
// The confirm sheet, then one Settlement expense through the same queued op as quick add. A settlement row credits
// its payer in full: the debtor pays, the creditor is paid for. No Undo (the server refuses to delete Settlement
// rows); the sheet is the safety.
var SETTLE_ANIM = null; // {from, at}: a settlement was saved; the balance row counts down once it is square
var SETTLE_EL = null;   // the balance figure that is counting (MC: the balance row)

function settlePending_() {
  return QUEUE.some(function (q) { return q.op === 'expense' && q.settle === true; });
}

// A1 final fix 2: the figures on show are the server's own: a data reply came in this session and no plain expense
// is queued or on its way (it is in QUEUE until answered), so the balance holds every expense typed here.
function settleReady_() {
  return MONEY_LIVE && !QUEUE.some(function (q) { return q.op === 'expense' && q.settle !== true; });
}
var SETTLE_WAIT = 'Checking the latest numbers.';
var SETTLE_OFFLINE = 'Settle up works when you are back online.';

// A3-T2B M6: why Settle up waits, in words that never hang: while a read or a send is on its way, the numbers are
// being checked; once the last refresh failed, or a send waits for its retry, it works when the phone is back online.
function settleWaitText_() {
  if ((!MONEY_LIVE && MONEY_STALE) || RETRY_TIMER !== null) return SETTLE_OFFLINE;
  return SETTLE_WAIT;
}

function openSettle_() {
  if (!DATA || !DATA.balance || settlePending_() || !settleReady_()) return;
  var side = balanceSide_(DATA.balance.net);
  if (side.square) return;
  whoShut_();
  if (SHEET) closeItemSheet_('replace');
  var rate = pageRate_(DATA);
  var s = { list: 'settle', side: side, done: false, els: {}, ctls: [], sync: [], focusEl: null, touch: null };
  var p = sheetFrame_(s, 'Settle up');
  var head = add(p, 'div', 'qa-head settle-head');
  add(head, 'h2', 'settle-title', 'Settle up');
  s.els.who = add(p, 'p', 'settle-who', side.who);
  s.els.big = add(p, 'p', 'settle-big');
  s.els.small = add(p, 'p', 'settle-small');
  settleShow_(s);
  s.els.status = add(p, 'p', 'settle-note');
  s.els.status.setAttribute('role', 'status');
  s.focusEl = sheetCtl_(s, btn(p, 'btn-main settle-go', 'Mark as settled', function () { settleConfirm_(s); }));
  sheetCtl_(s, btn(p, 'settle-later', 'Not now', function () { if (SHEET === s) closeItemSheet_('close'); }));
  SHEET = s;
  $('sheet').hidden = false;
  sheetInert_(true);
  sheetHistory_();
  s.focusEl.focus({ preventScroll: true });
}

// The figures on the sheet, from s.side.
function settleShow_(s) {
  var rate = pageRate_(DATA);
  var eur = settleAmount_(s.side.eur);
  s.els.who.textContent = s.side.who;
  s.els.big.textContent = fmtEur(eur);
  s.els.small.textContent = rate ? fmtIdr(Math.round(eur * rate / 1000) * 1000) : '';
}

function settleAmount_(eur) {
  return Math.round(eur * 100) / 100;
}

// Mark as settled. The balance is read again from the latest data: square or turned round since the sheet opened
// means no row.
function settleConfirm_(s) {
  if (SHEET !== s || s.done) return;
  if (!settleReady_()) { // A1 final fix 2: an expense still waits (another tab), or the numbers are not the server's
    s.els.status.textContent = settleWaitText_();
    return;
  }
  s.done = true;
  var now = DATA && DATA.balance ? balanceSide_(DATA.balance.net) : null;
  if (!now || now.square || now.who !== s.side.who) {
    sheetShut_('close');
    if (now && !now.square) qaToastSet_({ text: 'The balance changed: ' + now.who + ' ' + fmtEur(settleAmount_(now.eur)) + '.' });
    moneyRepaint_();
    return;
  }
  if (settleAmount_(now.eur) !== settleAmount_(s.side.eur)) {
    // Same direction, other figure: show it and wait for one more tap. Never save a figure that was not seen.
    s.side = now;
    settleShow_(s);
    s.els.status.textContent = 'The amount changed. Check it, then confirm.';
    s.done = false;
    return;
  }
  var lili = DATA.balance.net < 0; // net < 0: Lili owes Kev
  var op = expenseOp_({
    amount: settleAmount_(now.eur), currency: 'EUR', item: 'Settle up', category: 'Settlement',
    paidBy: lili ? 'Lili' : 'Kev', paidFor: lili ? 'Kev' : 'Lili', date: qaToday_()
  }, {});
  op.settle = true;
  sheetShut_('close');
  expenseEnqueue_(op);
  moneyRepaint_();
  qaFocusAdd_();
}

// The saved settlement: the balance row counts the old figure down to zero, then reads All square (no motion when the
// phone asks for none).
function settleCalm_() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function settleStep_(i) {
  var a = SETTLE_ANIM;
  if (!a) return;
  var n = 12;
  if (i >= n) {
    SETTLE_ANIM = null;
    SETTLE_EL = null;
    moneyRepaint_();
    return;
  }
  var left = a.from * (1 - (i + 1) / n);
  if (SETTLE_EL) SETTLE_EL.textContent = fmtEur(settleAmount_(left));
  setTimeout(function () { settleStep_(i + 1); }, 40);
}

// A3-T2B: Settle up (MC: on the balance screen only, under The difference). Gone when square or while a settlement waits
// to be sent (never twice); visible but disabled, with the reason as a line, until the server's own numbers are on
// show and no expense waits (M6, the guard of A1 final fix 2); otherwise it opens the confirm sheet.
function settleButton_(parent, noteParent) {
  var side = balanceSide_(DATA.balance.net);
  if (side.square || settlePending_()) return null;
  var ready = settleReady_();
  var b = btn(parent, 'bal-settle', 'Settle up', function () { if (settleReady_()) openSettle_(); });
  b.disabled = !ready;
  if (!ready) add(noteParent, 'span', 'bal-note', settleWaitText_());
  return b;
}

// ---- home -----------------------------------------------------------------------
// MC: the rows card (the month so far, a usual month, the balance), where it goes, month by month. The bars are
// the only month picker.
function renderHome() {
  var root = $('home');
  var today = DATA.today;

  renderBalanceCard_(top.wrap, rate); // F4: the balance card, Settle up on it

    var un = section(body);
    add(un, 'p', 'notice', DATA.unplacedRows + (DATA.unplacedRows === 1 ? ' row has no date' : ' rows have no date') + ' in the sheet, so no month includes ' + (DATA.unplacedRows === 1 ? 'it.' : 'them.'));
  }

  var ls = section(body);
  var link = btn(ls, 'linkrow', null, function () { go({ screen: 'trends', key: null }); });
  var lt = add(link, 'span');
  add(lt, 'b', '', 'Tendencies');
  add(lt, 'span', 'small', 'Every month by type of expense');

}

// ---- where it goes (home donut, ruling R65; A1-T4 segmented control and fixed colours) ---------------
var DONUT_VIEW = 'cur'; // This month ('cur'), Last month ('last') or All time ('all'); for this visit only
var DONUT_MORE = false; // the list past the top 5 is open
var DONUT_SMALL = false; // MC: the "Other small" row is open and lists what it holds
var DONUT_PICK = '';     // F4: the category picked in the ring or its list ('Other small' for the group); '' for none
var DONUT_FOCUS = '';    // F4 (was MC fix 3): the control tapped ('row:', 'slice:' or 'see:' and a name); it keeps the focus after the repaint
var SMALL_SHARE = 0.03;  // MC (audit p6): slices under 3 percent are grouped into one "Other small" slice
var SMALL_COLOUR = '#9890b0'; // its own fixed colour: 3:1 on white, apart from every category colour

// One view: the header, the totals and the list rows. Every figure is added up from the rows, the same way as the
// rows card and the month screen, so the numbers match. Each category with a positive total has its own slice in its
// own colour; one at zero or below (refunds) is listed without a slice.
function donutModel_(months, view, todayIso, rate) {
  var cur = todayIso.slice(0, 7);
  var key = view === 'all' ? 'all' : (view === 'last' ? monthBefore_(cur) : cur);
  var rows = [];
  var totalEur = 0;
  var head;
  var emptyText;
  if (key === 'all') {
    var cents = 0;
    months.forEach(function (m) {
      rows = rows.concat(m.rows);
      cents += Math.round(m.totalEur * 100);
    });
    totalEur = cents / 100;
    head = months.length ? 'All, since ' + shortMonth(months[months.length - 1].key) : 'All';
    emptyText = 'Nothing spent yet.';
  } else {
    var m = null;
    for (var i = 0; i < months.length; i++) if (months[i].key === key) m = months[i];
    var part = m ? partialLabel(m, todayIso) : (key === cur ? 'so far' : '');
    if (m) { rows = m.rows; totalEur = m.totalEur; }
    head = monthName(key) + ' ' + key.slice(0, 4) + (part ? ', ' + part : '');
    emptyText = key === cur ? 'Nothing spent yet this month.' : 'Nothing spent this month.';
  }
  var cats = catsOf_(rows, rate);
  var pos = cats.filter(function (c) { return c.eur > 0; }).map(function (c) {
    return { name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: catColour_(c.name) };
  });
  // MC (audit p6): two or more slices under 3 percent of the ring become one "Other small" slice, last; its row
  // lists them. A single small one stays itself.
  var posCents = 0;
  pos.forEach(function (r) { posCents += Math.round(r.eur * 100); });
  var small = pos.filter(function (r) { return Math.round(r.eur * 100) < posCents * SMALL_SHARE; });
  if (small.length >= 2) {
    var g = { name: 'Other small', eur: 0, idr: rate ? 0 : null, share: 0, color: SMALL_COLOUR, group: small };
    var gc = 0;
    small.forEach(function (r) {
      gc += Math.round(r.eur * 100);
      if (rate) g.idr += r.idr || 0;
      g.share += r.share;
    });
    g.eur = gc / 100;
    g.share = Math.round(g.share * 10000) / 10000;
    pos = pos.filter(function (r) { return small.indexOf(r) < 0; }).concat([g]);
  }
  var list = pos.concat(cats.filter(function (c) { return !(c.eur > 0); }).map(function (c) {
    return { name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: null };
  }));
  // F4: the line in the ring's centre over the period's total.
  var first = months.length ? months[months.length - 1].key : '';
  var centre = key === 'all' ? (first ? 'Since ' + monthName(first) + (first.slice(0, 4) !== cur.slice(0, 4) ? ' ' + first.slice(0, 4) : '') : 'All time')
    : (key === cur ? 'This month' : 'Last month');
  return {
    key: key, head: head, centre: centre, emptyText: emptyText, totalEur: totalEur, totalIdr: totalIdr_(rows, rate), rows: list,
    empty: !list.some(function (r) { return r.color; })
  };
}

// Start and end of each slice in degrees, clockwise from the top. The last one ends at exactly 360.
function donutSlices_(values) {
  var total = 0;
  values.forEach(function (v) { total += v; });
  var at = 0;
  return values.map(function (v, i) {
    var start = at;
    at = i === values.length - 1 ? 360 : at + v / total * 360;
    return { start: start, end: at };
  });
}

function donutPoint_(deg, rad, c) {
  var a = deg * Math.PI / 180;
  return String(Math.round((c + rad * Math.sin(a)) * 100) / 100) + ' ' + String(Math.round((c - rad * Math.cos(a)) * 100) / 100);
}

// An annular sector from start to end degrees, outer radius R, inner radius r, centred on (c, c). Each arc is
// drawn in two halves split at the midpoint, so no arc ever starts where it ends (SVG drops such an arc, and a
// slice of nearly 360 degrees would fill the hole).
function donutPath_(start, end, R, r, c) {
  var mid = (start + end) / 2;
  var outer = ' A ' + R + ' ' + R + ' 0 0 1 ';
  var inner = ' A ' + r + ' ' + r + ' 0 0 0 ';
  return 'M ' + donutPoint_(start, R, c) + outer + donutPoint_(mid, R, c) + outer + donutPoint_(end, R, c) +
    ' L ' + donutPoint_(end, r, c) + inner + donutPoint_(mid, r, c) + inner + donutPoint_(start, r, c) + ' Z';
}

function renderDonut_(s) {
  var today = DATA.today;
  var rate = pageRate_(DATA);
  var seg = add(s, 'div', 'seg');
  seg.setAttribute('role', 'group');
  seg.setAttribute('aria-label', 'Show this month, last month or all time');
  var segs = [];
  [['cur', 'This month'], ['last', 'Last month'], ['all', 'All time']].forEach(function (o) {
    var b = btn(seg, 'seg-btn', o[1], function () {
      if (DONUT_VIEW !== o[0]) { DONUT_MORE = false; DONUT_SMALL = false; DONUT_PICK = ''; } // F4: a new period clears the pick
      DONUT_VIEW = o[0];
      paint();
    });
    segs.push({ view: o[0], el: b });
  });
  var card = add(s, 'div', 'card dn-card');
  var body = add(card, 'div', 'dn-body');
  function paint() {

}

// F4: euros as a whole number, for a total under a rupiah figure.
function eurRound_(n) {
  var a = Math.round(Math.abs(n));
  return (n < 0 && a > 0 ? '-' : '') + 'EUR ' + group(a);
}

// F4 (Kevin 2026-11-14): the centre shows the period's total; a tap on a slice or a list line picks that category
// (the others fade, its slice is thicker, the centre shows its share and total, its line offers "See its expenses");
// the same tap again, or another period, clears it. "Other small" is picked like a category and lists what it holds.
function donutOpenCat_(model, name) {
  if (model.key !== 'all') return function () { go({ screen: 'month', key: model.key, filter: name }); };
  // All time: there is no view of one category across months, so the newest month that has it, filtered to it.
  var m = null;
  for (var i = 0; i < DATA.months.length && !m; i++) {
    if ((DATA.months[i].rows || []).some(function (r) { return r.category === name && !r.settlement; })) m = DATA.months[i];
  }
  return m ? function () { go({ screen: 'month', key: m.key, filter: name }); } : null;
}

function drawDonut_(body, model, repaint) {
  if (model.empty) {
    add(body, 'p', 'dn-head', model.head);
    add(body, 'p', 'dn-empty', model.emptyText);
    return;
  }
  var parts = model.rows.filter(function (r) { return r.color; });
  var picked = null;
  model.rows.forEach(function (r) { if (r.color && r.name === DONUT_PICK) picked = r; });
  if (!picked) DONUT_PICK = '';
  var at = -1;
  model.rows.forEach(function (r, i) { if (r.group) at = i; });
  var focusEl = null;
  var keyed = function (e, k) { if (DONUT_FOCUS === k) focusEl = e; return e; };
  var pick = function (r, k) {
    return function () {
      DONUT_PICK = DONUT_PICK === r.name ? '' : r.name;
      DONUT_SMALL = !!(r.group && DONUT_PICK);
      if (DONUT_PICK && model.rows.indexOf(r) >= 5) DONUT_MORE = true; // its line shows
      DONUT_FOCUS = k;
      repaint();
    };
  };
  var fig = add(body, 'div', 'dn-fig');
  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200');
  svg.setAttribute('width', '176');
  svg.setAttribute('height', '176');
  svg.setAttribute('role', 'group');
  svg.setAttribute('focusable', 'false');
  svg.setAttribute('aria-label', 'Where it goes, ' + model.head + ': ' + parts.slice(0, 3).map(function (r) {
    return r.name + ' ' + shareText(r.share);
  }).join(', ') + '.');
  fig.appendChild(svg);
  // A slice is a button for the keyboard and the screen reader: its name and share, pressed when picked.
  var asButton = function (mark, r) {
    var tap = pick(r, 'slice:' + r.name);
    mark.setAttribute('role', 'button');
    mark.setAttribute('tabindex', '0');
    mark.setAttribute('aria-pressed', r === picked ? 'true' : 'false');
    mark.setAttribute('aria-label', r.name + ', ' + shareText(r.share));
    mark.addEventListener('click', tap);
    mark.addEventListener('keydown', function (e) {
      if (e && (e.key === 'Enter' || e.key === ' ')) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        tap();
      }
    });
    keyed(mark, 'slice:' + r.name);
  };
  var spans = donutSlices_(parts.map(function (r) { return r.eur; }));
  var whole = -1; // a part of 359.5 degrees or more is drawn as the full ring; the rest would vanish under the gaps
  spans.forEach(function (a, i) { if (a.end - a.start >= 359.5) whole = i; });
  var mark;
  if (whole >= 0) {
    mark = document.createElementNS(SVG_NS, 'circle');
    mark.setAttribute('class', 'dn-ring');
    mark.setAttribute('cx', '100');
    mark.setAttribute('cy', '100');
    mark.setAttribute('r', '88');
    mark.setAttribute('fill', 'none');
    mark.setAttribute('stroke', parts[whole].color);
    mark.setAttribute('stroke-width', parts[whole] === picked ? '22' : '16');
    asButton(mark, parts[whole]);
    svg.appendChild(mark);
  } else {
    spans.forEach(function (a, i) {
      var on = parts[i] === picked;
      mark = document.createElementNS(SVG_NS, 'path');
      mark.setAttribute('class', 'dn-slice' + (picked && !on ? ' dn-dim' : ''));
      mark.setAttribute('d', on ? donutPath_(a.start, a.end, 99, 77, 100) : donutPath_(a.start, a.end, 96, 80, 100));
      mark.setAttribute('fill', parts[i].color);
      asButton(mark, parts[i]);
      svg.appendChild(mark);
    });
  }
  // The centre: the period's total, or the picked category's share and total; EUR small under rupiah.
  var c = add(fig, 'div', 'dn-centre');
  c.setAttribute('aria-live', 'polite');
  add(c, 'p', 'dn-c-what', picked ? picked.name + ', ' + Math.round(picked.share * 100) + ' percent' : model.centre);
  var idr = picked ? picked.idr : model.totalIdr;
  var eur = picked ? picked.eur : model.totalEur;
  var hasIdr = idr !== null && idr !== undefined;
  add(c, 'p', 'dn-c-amt', nb(hasIdr ? roundIdr_(idr) : fmtEur(eur)));
  if (hasIdr) add(c, 'p', 'dn-c-eur', nb(eurRound_(eur)));
  // Legend lines: a dot in the category colour, the name, one rounded value. Each picks; the picked one is
  // highlighted and offers "See its expenses" (Other small lists what it holds instead).
  var legend = function (line, r, noVal) {
    var dot = add(line, 'span', 'dn-dot');
    dot.setAttribute('aria-hidden', 'true');
    dot.style.background = r.color || '';
    var words = add(line, 'span', 'dn-words');
    add(words, 'span', 'dn-name', r.name);
    if (!noVal) add(line, 'span', 'dn-val', moneyShort_(r.idr, r.eur));
    return words;
  };
  var list = add(body, 'div', 'dn-list');
  var many = model.rows.length > 5;
  model.rows.slice(0, many && !DONUT_MORE ? 5 : model.rows.length).forEach(function (r) {
    if (!r.color) { // at zero or below: no slice, nothing to pick
      legend(add(list, 'div', 'dn-row'), r);
      return;
    }
    var on = r === picked;
    var box = on ? add(list, 'div', 'dn-row dn-picked') : list;
    var b = keyed(btn(box, on ? 'dn-tap dn-pick' : 'dn-row dn-tap', null, pick(r, 'row:' + r.name)), 'row:' + r.name);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (r.group) {
      b.className += ' dn-group';
      b.setAttribute('aria-expanded', on ? 'true' : 'false');
      add(legend(b, r, on), 'span', 'dn-fold' + (on ? ' dn-fold-open' : '')).setAttribute('aria-hidden', 'true');
      if (on) {
        r.group.forEach(function (m) {
          var go1 = donutOpenCat_(model, m.name);
          legend(go1 ? btn(list, 'dn-row dn-sub dn-tap', null, go1) : add(list, 'div', 'dn-row dn-sub'), m);
        });
      }
      return;
    }
    legend(b, r, on);
    if (on) {
      var see = donutOpenCat_(model, r.name);
      if (see) {
        var sb = keyed(btn(box, 'dn-see', 'See its expenses', see), 'see:' + r.name);
        add(sb, 'span', 'chev').setAttribute('aria-hidden', 'true');
      }
    }
  });
  if (many) {
    var more = btn(body, 'dn-more', DONUT_MORE ? 'Show less' : 'Show ' + (model.rows.length - 5) + ' more', function () {
      DONUT_MORE = !DONUT_MORE;
      repaint();
    });
    more.setAttribute('aria-expanded', DONUT_MORE ? 'true' : 'false');
  }
  DONUT_FOCUS = '';
  if (focusEl && typeof focusEl.focus === 'function') focusEl.focus({ preventScroll: true });
}

// Month by month: one bar per month, the only month picker. Rupiah in millions (added up from the rows like every
// other total), or euros when there is no rate. The line is the usual month.
function renderBars(s, rate) {
  var PLOT = 118; // px height of the tallest bar; the rest of the plot leaves room for its label
  var usual = usualOf_(rate);
  function value(m) { var v = rate ? totalIdr_(m.rows, rate) : m.totalEur; return v === null ? 0 : v; }
  var max = usual || 0;
  DATA.months.forEach(function (m) { if (value(m) > max) max = value(m); });
  function px(v) { return max > 0 ? Math.max(0, Math.round(v / max * PLOT)) : 0; }

  var card = add(s, 'div', 'card bars-card');
  var sc = add(card, 'div', 'scroller');
  sc.setAttribute('tabindex', '0');
  sc.setAttribute('role', 'group');
  sc.setAttribute('aria-label', 'Spending by month. Tap a month to open it.');
  var inner = add(sc, 'div', 'barsin');
  if (usual) {
    var line = add(inner, 'div', 'usualline');
    line.style.bottom = (40 + px(usual)) + 'px';
  }
  var today = DATA.today;
  DATA.months.slice().reverse().forEach(function (m) {
    var part = partialLabel(m, today);
    var v = value(m);
    var col = btn(inner, 'barcol', null, function () { goMonth(m.key); });
    col.setAttribute('aria-label', m.label + ': ' + (rate ? roundIdr_(v) : fmtEur(v)) + (part ? ', ' + part : '') + '. Open this month.');
    var plot = add(col, 'div', 'barplot');
    add(plot, 'span', 'barval', rate ? millions_(v) : group(Math.round(v)));
    var bar = add(plot, 'div', 'bar' + (m.partial ? ' bar-partial' : ''));
    bar.style.height = px(v) + 'px';
    var lab = add(col, 'div', 'barlabel', monthName(m.key).slice(0, 3));
    if (part) add(lab, 'span', '', part === 'so far' ? 'so far' : 'part');
  });

  var legend = [rate ? 'Rupiah, in millions.' : 'Euros, as in the sheet.'];
  if (usual) legend.push('The line is your usual month, ' + (rate ? roundIdr_(usual) : fmtEur(usual)) + '.');
  if (DATA.months.some(function (m) { return m.partial; })) legend.push('Dashed bars are not full months.');
  add(s, 'p', 'caption', nb(legend.join(' ')));
  return sc;
}

// The sheet in line with EDIT: saving disables everything, the error line, the button words.
function editSheetSync_(s) {
  var busyNow = !!(EDIT && EDIT.saving);
  s.els.save.textContent = busyNow && !EDIT.deleting ? 'Saving...' : 'Save';
  s.els.save.disabled = busyNow;
  s.els.del.textContent = EDIT && EDIT.deleting ? 'Deleting...' : 'Delete';
  s.els.del.disabled = busyNow;

  s.els.error.hidden = !(EDIT && EDIT.error);

// Save, a tap outside, Escape, back: the typed values are checked, then sent field by field (saveEdit). Nothing
// changed closes it. A bad value says so and the sheet stays.
function editSheetSave_(s) {
  if (SHEET !== s || !EDIT || EDIT.saving || EDIT.id !== s.editId) return;
  ['item', 'amount', 'date'].forEach(function (f) { EDIT.draft[f] = s.inputs[f].value; });
  var row = rowByNumber(DATA.months, s.rowNumber);
  var checked = row ? editDraftValues(row, EDIT.draft, DATA.today) : { values: {} };
  if (checked.error) {
    EDIT.error = checked.error;
    editSheetSync_(s);
    return;
  }
  saveEdit(s.rowNumber, checked.values);
}

function refusalText(res) {
  if (res && res.retry) return 'Could not save. Try again.';
  if (res && res.settlement) return 'A settlement cannot be changed here.';
  if (res && res.invalid && res.reason === 'needsCurrency') return 'Pick a currency.';
  if (res && res.invalid) return 'That choice is not allowed.';
  return 'Could not save. Try again.';
}

function labelsOf(changes) {
  return changes.map(function (c) { return c.label; });
}

function setToast(t, key) {
  t.key = key;
  TOAST = t;
}

// The expense itself: columns A to E, as a (from applyChanges) expects them. Euros are skipped once a change moved them.
function sameExpense(a, b) {
  return !!a && !!b && a.date === b.date && a.item === b.item && a.amount === b.amount && a.currency === b.currency && (!!a.eurUnknown || a.eur === b.eur);
}

// Sends job.changes one after another. Each one needs the fingerprint from the reply before it, and stops
// if a different expense has moved into the row. job: {rowNumber, fingerprint, expect, changes, saved,
// done(saved, fingerprint), failed(saved, change, res, fingerprint), noData(saved, rest), unsure(saved, change, rest)}.
function sendChanges(job) {
  if (!job.changes.length) { job.done(job.saved, job.fingerprint); return; }
  var change = job.changes[0];
  var session = SESSION;
  call_('update', {
    token: TOKEN,
    rowNumber: job.rowNumber,
    fingerprint: job.fingerprint,
    field: change.field,
    value: change.value
  }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) { job.failed(job.saved, change, res, job.fingerprint); return; }
    job.saved = job.saved.concat([change]);
    job.changes = job.changes.slice(1);
    if (!res.data) { job.noData(job.saved, job.changes); return; }
    moneySet_(res.data);
    var now = rowByNumber(DATA.months, job.rowNumber);
    job.fingerprint = sameExpense(applyChanges(job.expect, job.saved), now) ? now.fingerprint : null;
    if (job.fingerprint === null && job.changes.length) {
      job.failed(job.saved, job.changes[0], { conflict: true }, null);
      return;
    }
    sendChanges(job);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    // The save may have landed, so it is never sent again. The page refreshes and says to check.
    if (unreached(err)) { job.unsure(job.saved, change, job.changes.slice(1)); return; }
    job.failed(job.saved, change, null, job.fingerprint);
  });
}

// Closes the editor a reply belongs to, never one opened since.
function closeEdit(editId) {
  if (EDIT && EDIT.id === editId) EDIT = null;
}

function conflictRefresh(saved, label, key, editId) {
  var labels = labelsOf(saved);
  closeEdit(editId);
  setToast({
    text: saveFailText(labels, label, 'This expense changed. Refreshing.'),
    refreshing: true,
    after: labels.length ? saveFailText(labels, label, 'This expense changed.') : null
  }, key);
  render(true);
  loadData(true);
}

function savedNoDataRefresh(saved, rest, key, editId) {
  var labels = labelsOf(saved);
  var text = rest.length
    ? andList(labels) + (labels.length === 1 ? ' was' : ' were') + ' saved. ' + andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.'
    : null;
  closeEdit(editId);
  setToast({ text: (text || 'Saved.') + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

function savedUnsureRefresh(saved, change, rest, key, editId) {
  var parts = [];
  if (saved.length) parts.push(andList(labelsOf(saved)) + (saved.length === 1 ? ' was' : ' were') + ' saved.');
  parts.push('Could not reach the server, so check whether ' + change.label + ' saved.');
  if (rest.length) parts.push(andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.');
  var text = parts.join(' ');
  closeEdit(editId);
  setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

// after: the row as it reads once changes landed (applyChanges), which the undo checks the row against.
function undoFor(rowNumber, fingerprint, after, changes) {
  var cats = DATA && DATA.canChangeType ? DATA.categories : null;
  return (fingerprint && changes.length && canUndo(changes, DATA && DATA.today, cats)) ? { rowNumber: rowNumber, fingerprint: fingerprint, expect: after, changes: changes } : null;
}

function saveEdit(rowNumber, values) {
  var row = rowByNumber(DATA.months, rowNumber);
  var changes = row ? pendingChanges(row, values) : [];
  if (!changes.length) {
    EDIT = null;
    FOCUS_ROW = rowNumber;
    render(true);
    return;
  }
  var key = VIEW.key;
  var editId = EDIT.id;
  EDIT.saving = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  sendChanges({
    rowNumber: rowNumber,
    fingerprint: row.fingerprint,
    expect: row,
    changes: changes,
    saved: [],
    done: function (saved, fingerprint) {
      closeEdit(editId);
      setToast({ text: 'Saved.', undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key); // A3-T2A M3
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh(saved, change.label, key, editId); return; }
      var reason = refusalText(res);
      if (saved.length) {
        setToast({ text: saveFailText(labelsOf(saved), change.label, reason), undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key);
      }
      if (EDIT && EDIT.id === editId) {
        // A saved Type can take the row out of the filtered list. The bar above still says what happened.
        var m = monthByKey(key);
        var listed = m && rowsFor(m, FILTER).some(function (r) { return r.rowNumber === rowNumber; });
        if (listed) {
          EDIT.saving = false;
          EDIT.error = reason;
        } else {
          EDIT = null;
        }
      }
      render(true);
    },
    noData: function (saved, rest) { savedNoDataRefresh(saved, rest, key, editId); },
    unsure: function (saved, change, rest) { savedUnsureRefresh(saved, change, rest, key, editId); }
  });
}

function undoLast() {
  var undo = TOAST.undo;
  var key = TOAST.key;
  TOAST.busy = true;
  render(true);
  var back = undo.changes.slice().reverse().map(function (c) {
    return { field: c.field, label: c.label, old: c.value, value: c.old };
  });
  sendChanges({
    rowNumber: undo.rowNumber,
    fingerprint: undo.fingerprint,
    expect: undo.expect,
    changes: back,
    saved: [],
    done: function () {
      setToast({ text: 'Changed back.' }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh([], change.label, key, null); return; }
      var left = undo.changes.slice(0, undo.changes.length - saved.length);
      var why = res && res.invalid ? 'That choice is not allowed.' : 'Try again.';
      setToast({ text: 'Could not undo. ' + why, undo: undoFor(undo.rowNumber, fingerprint, applyChanges(undo.expect, saved), left) }, key);
      render(true);
    },
    noData: function (saved, rest) {
      if (rest.length) {
        setToast({ text: 'Could not finish the undo. Refreshing.', refreshing: true, after: 'Could not finish the undo.' }, key);
      } else {
        setToast({ text: 'Changed back. Refreshing.', refreshing: true, after: 'Changed back.' }, key);
      }
      render(true);
      loadData(true);
    },
    unsure: function () {
      var text = 'Could not reach the server, so check whether the undo went through.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
    }
  });
}

// ---- deleting an expense ----------------------------------------------------------
// The row moves to the sheet's hidden Deleted tab. "Deleted. Undo" stays 6 seconds; Undo puts it back.
function deletedToast(text, deletedId, key) {
  var t = { text: text, restore: deletedId };
  setToast(t, key);
  setTimeout(function () {
    if (TOAST === t && !t.busy) {
      TOAST = null;
      render(true);
    }
  }, 6000);
}

function deleteExpense(rowNumber) {
  var row = rowByNumber(DATA.months, rowNumber);
  if (!row || !EDIT || EDIT.saving) return;
  var key = VIEW.key;
  var editId = EDIT.id;
  var session = SESSION;
  EDIT.saving = true;
  EDIT.deleting = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  function stay(text) {
    if (EDIT && EDIT.id === editId) {
      EDIT.saving = false;
      EDIT.deleting = false;
      EDIT.error = text;
    }
    render(true);
  }
  call_('deleteExpense', { token: TOKEN, rowNumber: rowNumber, fingerprint: row.fingerprint }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) {
      if (res && res.conflict) { conflictRefresh([], 'Delete', key, editId); return; }
      stay(res && res.settlement ? 'A settlement cannot be deleted here.' : 'Could not delete. Try again.');
      return;
    }
    closeEdit(editId);
    if (res.data) moneySet_(res.data);
    deletedToast(listsDeletedText_({ text: row.item }), res.deletedId, key); // A3-T2B m5: the line names the expense
    render(true);
    if (!res.data) loadData(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it was deleted. If it was, it can be put back from the Deleted tab in the sheet.';
      closeEdit(editId);
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    stay('Could not delete. Try again.');
  });
}

function restoreLast() {
  var t = TOAST;
  var key = t.key;
  var session = SESSION;
  t.busy = true;
  render(true);
  call_('restoreExpense', { token: TOKEN, deletedId: t.restore }).then(function (res) {
    if (session !== SESSION) return;
    if (res && res.ok) {
      if (res.data) {
        moneySet_(res.data);
        setToast({ text: 'Put back.' }, key);
        render(true);
      } else {
        setToast({ text: 'Put back. Refreshing.', refreshing: true, after: 'Put back.' }, key);
        render(true);
        loadData(true);
      }
      return;
    }
    if (res && res.invalid) setToast({ text: 'Could not undo. It is no longer in Deleted.' }, key);
    else deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it came back.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  });
}

function renderToast(root) {
  if (!TOAST || TOAST.key !== VIEW.key) return;
  var bar = add(root, 'div', 'toast');
  bar.setAttribute('role', 'status');
  add(bar, 'span', '', TOAST.text);
  if (TOAST.undo || TOAST.restore) {
    var b = btn(bar, '', 'Undo', TOAST.restore ? restoreLast : undoLast);
    b.disabled = !!TOAST.busy;
    if (!TOAST.busy && !EDIT) b.focus({ preventScroll: true });
  }
}

  $('cover').hidden = true;
  $('app').hidden = false;
}

// Runs on load with a stored token and after each unlock. The queue is sent again here too.
function openSession_() {
  var v = viewFromHash(location.hash);
  if (!location.hash || location.hash === '#') {
    var t = lsGet_(LS_TAB);
    if (t === 'todo' || t === 'groceries') v = { screen: t, key: null };
  }
  if (isListScreen_(v.screen)) {
    VIEW = v;
    remember(v);
    listsEnter_();
  } else if (moneyFromCache_(v)) {
    loadData(true); // A1-T3: the snapshot is on show; the numbers refresh quietly
  } else {
    loadData(false);
  }
  if (QUEUE.length) setTimeout(listsNoteUpdate_, 10000);
  listsFlush_();
  // fix round 1: an expense the server refused earlier still waits in Add (A3-T2A: else a kept to-do or item)
  qaKeptToast_(qaKeptNext_('expense') ? 'expense' : (qaKeptNext_('todo') ? 'todo' : 'grocery'));
}

// Writes kl.tab only when it changes, so a Money-only visit stores nothing new.
function rememberTab_(tab) {
  if ((lsGet_(LS_TAB) || 'money') !== tab) lsSet_(LS_TAB, tab);
}

// ---- bottom bar -------------------------------------------------------------------------
// A1-T3: Money, Add, To do, Groceries. Add is the same rust slot on every tab and opens the quick add on the
// current tab's type (Money screens: an expense).
function renderTabs_() {
  var bar = $('tabbar');
  var cur = tabOf_(VIEW.screen);
  var segment = cur === 'todo' ? 'todo' : (cur === 'groceries' ? 'grocery' : 'expense');
  [['money', 'Money'], ['add', 'Add'], ['todo', 'To do'], ['groceries', 'Groceries']].forEach(function (t) {
    var isAdd = t[0] === 'add';
    var b = btn(bar, isAdd ? 'tab tab-add' : 'tab', null, function () {
      if (isAdd) openQuickAdd_(segment);
      else if (t[0] === 'groceries' && VIEW.screen === 'groceries' && !SHEET && groHere_()) groLeaveHere_(groHere_()); // A2-T3 fix 1
      else go(t[0] === 'money' ? { screen: 'home', key: null } : { screen: t[0], key: null });
    });
    if (t[0] === cur) b.setAttribute('aria-current', 'page');
    var pill = add(b, 'span', 'tab-pill');
    pill.appendChild(svgIcon_(isAdd ? PLUS_PATHS : tabIconPaths_(t[0])));
    add(b, 'span', 'tab-label', t[1]);
    if (isAdd) {
      ADD_SLOT = b;
      ADD_DOT = add(pill, 'span', 'tab-dot'); // A3-T2B m9
      ADD_DOT.setAttribute('aria-hidden', 'true');
      qaAddDot_();
    }
  });
}

// A1-T5: the quick add. To-do and Grocery are the item sheet for a new item (the existing add, unchanged) with the
// segments on top; Expense is its own sheet. Closing either gives focus back to the Add slot.
function openQuickAdd_(segment) {
  // A2-T3: on Groceries, Add is the docked field: the cursor goes there (the keyboard comes up), no sheet.
  if (segment === 'grocery' && VIEW.screen === 'groceries' && GRO && GRO.field && !SHEET) {
    whoShut_();
    GRO.field.focus();
    return;
  }
  if (segment === 'todo' || segment === 'grocery') {
    if (segment === 'todo') TODO_FOCUS = 'add';
    else GRO_FOCUS = 'add';
    openItemSheet_(null, segment, null, true);
    return;
  }
  openExpenseSheet_();
}

// ---- this phone's identity: sets the default Who for new to-dos ------------------------------
var ME = null; // memory copy of kl.me, so the choice holds for this visit even without storage

function whoAmI_() {
  if (ME === null) {
    var v = lsGet_(LS_ME);
    ME = (v === 'Kev' || v === 'Lili') ? v : '';
  }
  return ME;
}

// Kev or Lili; anything else clears it, so the card asks again.
function setWhoAmI_(v) {
  if (v === 'Kev' || v === 'Lili') {
    ME = v;
    lsSet_(LS_ME, v);
  } else {
    ME = '';
    lsDel_(LS_ME);
  }
}

// ---- lists: pure helpers (no page state) ------------------------------------------------------
function updatedText_(at, now) {
  var mins = Math.floor((now - at) / 60000);
  if (!(mins >= 1)) return 'Updated just now';
  if (mins < 60) return 'Updated ' + mins + ' min ago';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return 'Updated ' + hours + ' h ago';
  var days = Math.floor(hours / 24);
  return 'Updated ' + days + (days === 1 ? ' day ago' : ' days ago');
}

// The wait before send attempt n + 1, after n failures in a row.
function backoffMs_(n) {
  if (n <= 1) return 2000;
  if (n === 2) return 5000;
  if (n === 3) return 15000;
  return 30000;
}

// 16 random bytes as a lowercase version 4 uuid.
function uuidFromBytes_(bytes) {
  var b = Array.prototype.slice.call(bytes, 0, 16);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  var hex = b.map(function (x) { return (x < 16 ? '0' : '') + x.toString(16); }).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}

// The lists reply key for an op's list.
function listsKey_(list) {
  return list === 'grocery' ? 'groceries' : 'todo';
}

// Applies one op to a lists object, the way the server will, and returns it. Used for the screens (the
// server's lists plus every queued op) and for keeping the server copy current from op replies. Matching is by
// id only, so applying an op twice changes nothing more.
function listsApplyOp_(lists, op) {
  function at(arr, id) {
    for (var i = 0; i < arr.length; i++) if (arr[i] && arr[i].id === id) return i;
    return -1;
  }
  function copy(o) {
    var out = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }
  if (op.op === 'expense') return lists; // A1-T5: an expense in the queue changes no list
  var f = op.fields || {};
  if (op.op === 'pause') {
    if (!lists.prefs || typeof lists.prefs !== 'object') lists.prefs = {};
    if (f.person === 'Kev' || f.person === 'Lili') lists.prefs[f.person] = { pausedUntil: f.until || '' };
    return lists;
  }
  var arr = lists[listsKey_(op.list)];
  if (!Array.isArray(arr)) return lists;
  if (!Array.isArray(lists.doneToday)) lists.doneToday = [];
  var i = at(arr, op.id);
  var isTodo = op.list === 'todo';
  if (op.op === 'add') {
    if (i < 0) {
      arr.push({
        id: op.id, list: op.list, text: f.text || '', who: isTodo ? (f.who || 'Either') : '', due: isTodo ? (f.due || '') : '',
        time: isTodo ? (f.time || '') : '', shop: isTodo ? '' : (f.shop || ''), shopFrom: (!isTodo && f.shop) ? 'hand' : '',
        added: lists.today || '', ageDays: 0, priority: isTodo ? (f.priority || '') : '',
        kind: '', minutes: '', firstStep: '', fp: ''
      });
    }
  } else if (op.op === 'edit') {
    if (i >= 0) {
      // A2-T3: a shop set in the sheet is a hand shop. A rename drops a learned or guessed shop: it was for the old
      // text (the screen places the new text from shopMap, as the server will).
      var had = arr[i];
      var fold = function (v) {
        var t = String(v === undefined || v === null ? '' : v);
        if (typeof t.normalize === 'function') t = t.normalize('NFD');
        return t.replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, '\u0027').toLowerCase().replace(/\s+/g, ' ').trim();
      };
      if (!isTodo && Object.prototype.hasOwnProperty.call(f, 'shop')) {
        // A2 final: Any shop (once No shop, A3-T2B p7) on a hand-shop item drops shopMap's entry for that very item when it names the shop
        // being cleared (it came from this row), so the placement does not put it straight back; the next read
        // brings the server's own map.
        var map = lists.shopMap;
        var mk = fold(had.text);
        if (!f.shop && had.shopFrom === 'hand' && fold(had.shop) !== '' && map && typeof map === 'object' &&
          Object.prototype.hasOwnProperty.call(map, mk) && typeof map[mk] === 'string' && fold(map[mk]) === fold(had.shop)) {
          delete map[mk];
        }
        had.shopFrom = f.shop ? 'hand' : '';
      } else if (!isTodo && Object.prototype.hasOwnProperty.call(f, 'text') && (had.shopFrom === 'learned' || had.shopFrom === 'guess') &&
        fold(f.text) !== fold(had.text)) {
        had.shop = '';
        had.shopFrom = '';
      }
      for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) arr[i][k] = f[k];
    }
  } else if (op.op === 'tick' || op.op === 'delete') {
    if (i >= 0) {
      var gone = arr.splice(i, 1)[0];
      if (op.op === 'tick' && at(lists.doneToday, op.id) < 0) {
        var done = copy(gone);
        done.fp = '';
        lists.doneToday.unshift(done);
      }
    }
  } else if (op.op === 'restore') {
    var d = at(lists.doneToday, op.id);
    var back = d >= 0 ? lists.doneToday.splice(d, 1)[0] : (op.item || null);
    if (back && i < 0) {
      var item = copy(back);
      item.list = op.list;
      arr.push(item);
    }
  }
  return lists;
}

// ---- lists: state -----------------------------------------------------------------------------
// LISTS_BASE is the server's lists as last known (the lists reply, kept current by each op reply). LISTS is what
// the screens show: LISTS_BASE with every queued op applied on top. Screens read LISTS only.
var LISTS = null;
var LISTS_BASE = null;
var LISTS_AT = 0;        // when LISTS_BASE was read from the server (ms); the "Updated N min ago" line
var LISTS_FETCHED = 0;   // when this page itself last loaded the lists (ms); 0 when only the cache is known
var LISTS_LOADING = false;
var LISTS_AGAIN = false; // a forced load asked for while one was on its way
var LISTS_FAILED = false;
var LISTS_OFFLINE = false; // A3-T2B M6: the failed refresh never reached the server (offline), so the line says Offline
var LISTS_TOAST = '';    // one short line in the dock; cleared on every navigation
var LISTS_NOTE = null;   // the dock's "Not saved yet" element on screen now
var QUEUE = [];          // ops not yet answered, oldest first; mirrored in kl.queue, shared with other tabs
var KNOWN = {};          // uids seen in kl.queue: one gone from there was settled by another tab
var QUEUE_UNSAVED = false; // the last kl.queue write failed: the queue lives only in this page
var INFLIGHT = '';       // uid of the op on its way. Ops go strictly one at a time; this outlives a lock-out.
var RETRY_TIMER = null;
var RETRY_N = 0;         // failed sends in a row, for the backoff
// R70: SERVER replies in a row for the queue head (HEAD_FAIL_UID). After HEAD_FAIL_MAX the op is dropped, so one op
// the server can never take does not hold the queue forever. TIMEOUT, UNREACHED and offline never count.
var HEAD_FAIL_UID = '';
var HEAD_FAIL_N = 0;
var HEAD_FAIL_MAX = 8;
// R46: SETTLE_N counts settled ops. A read remembers SETTLE_N when it is sent (READ_N); ops settled while it is
// on its way are kept in SETTLED and applied again onto it when it lands, so an older read never undoes them.
var SETTLE_N = 0;
var READ_N = 0;
var SETTLED = [];
// R47, R50: after an unsure success (saved, but the reply has no item to take fp and id from), or when the queue
// head has no fp, the head waits for a read sent at or after WAIT_KEYS[list + '|' + id] (a SETTLE_N), then takes
// its fp from it. Only the head is ever resolved: an op behind an earlier op for the same item is retargeted by
// that op's reply instead. LANDED_N is the newest landed read's READ_N, -1 before any lands in this session.
var WAIT_KEYS = {};
var LANDED_N = -1;
var WAITING_READ = false; // the head waits for a read: a failed read then retries on the backoff

// Fills in what an older or partial reply leaves out. null when it is not a lists reply at all.
function listsShape_(r) {
  if (!r || typeof r !== 'object' || !Array.isArray(r.todo) || !Array.isArray(r.groceries)) return null;
  ['doneToday', 'boughtRecently', 'shops', 'problems'].forEach(function (k) { if (!Array.isArray(r[k])) r[k] = []; });
  if (!r.shopMap || typeof r.shopMap !== 'object' || Array.isArray(r.shopMap)) r.shopMap = {}; // A2-T3: folded item -> shop
  if (!Array.isArray(r.staples)) r.staples = []; // PB-T3: {text, shop, lastDays, gapDays}, most overdue first
  if (!r.prefs || typeof r.prefs !== 'object') r.prefs = { Kev: { pausedUntil: '' }, Lili: { pausedUntil: '' } };
  return r;
}

function listsRebuild_() {
  if (!LISTS_BASE) { LISTS = null; return; }
  var view = JSON.parse(JSON.stringify(LISTS_BASE));
  QUEUE.forEach(function (op) { listsApplyOp_(view, op); });
  groPlace_(view); // A2-T3: an item with no shop yet (added here, renamed) is placed from shopMap
  LISTS = view;
}

function listsFind_(lists, list, id) {
  var arr = lists ? lists[listsKey_(list)] : null;
  if (!Array.isArray(arr)) return null;
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return null;
}

function listsItem_(list, id) {
  return listsFind_(LISTS, list, id);
}

// ---- lists: cache (kl.lists) -------------------------------------------------------------------
function listsFromCache_() {
  var c = lsJson_(LS_LISTS);
  var r = (c && typeof c.at === 'number') ? listsShape_(c.result) : null;
  if (!r) return;
  LISTS_BASE = r;
  LISTS_AT = c.at;
  listsRebuild_();
}

function listsSaveCache_() {
  if (LISTS_BASE) lsSet_(LS_LISTS, JSON.stringify({ at: LISTS_AT, result: LISTS_BASE }));
}

// ---- lists: loading ------------------------------------------------------------------------
// Every lists call comes through here, with the session token. call_ does the rest.
function listsCall_(action, payload) {
  payload.token = TOKEN;
  return call_(action, payload);
}

// The cached lists show at once when there are any; otherwise the loading cover. Then a refresh.
function listsEnter_() {
  if (!LISTS_BASE) listsFromCache_();
  if (LISTS || APP_ON) {
    showApp_();
    render(false);
  } else {
    showCover('loading', 'Opening your lists. The first load can take a few seconds.');
  }
  listsLoad_(false);
}

// force false: load unless one is on its way or this page loaded the lists under 15 s ago.
// force true: load now, or right after the one on its way.
function listsLoad_(force) {
  if (!TOKEN) return;
  if (!LISTS_BASE) listsFromCache_();
  if (LISTS_LOADING) {
    if (force) LISTS_AGAIN = true;
    return;
  }
  if (!force && LISTS_FETCHED && Date.now() - LISTS_FETCHED < 15000) return;
  LISTS_LOADING = true;
  READ_N = SETTLE_N;
  SETTLED = [];
  var sentN = READ_N;
  var session = SESSION;
  listsCall_('lists', {}).then(function (r) {
    if (session !== SESSION) return;
    LISTS_LOADING = false;
    var shaped = listsShape_(r);
    if (!shaped) { LISTS_AGAIN = false; listsLoadFailed_(null); return; }
    // R46: what settled while this read was on its way goes on top of it again.
    SETTLED.forEach(function (s) { listsSettleInto_(shaped, s.op, s.res); });
    SETTLED = [];
    LISTS_BASE = shaped;
    LISTS_AT = Date.now();
    LISTS_FETCHED = LISTS_AT;
    LISTS_FAILED = false;
    listsSaveCache_();
    if (sentN > LANDED_N) LANDED_N = sentN;
    listsDropIdleWaits_();
    listsRebuild_();
    if (LISTS_AGAIN) {
      LISTS_AGAIN = false;
      listsLoad_(true);
    }
    if (isListScreen_(VIEW.screen)) {
      showApp_();
      render(true);
    }
    listsFlush_();
  }, function (err) {
    if (session !== SESSION) return;
    LISTS_LOADING = false;
    LISTS_AGAIN = false;
    SETTLED = [];
    listsLoadFailed_(err);
  });
}

// With lists on screen, a failed refresh only changes the status line. Without, the cover says why.
function listsLoadFailed_(err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  LISTS_FAILED = true;
  LISTS_OFFLINE = unreached(err);
  // A head waiting for this read tries again on the backoff (listsFlush_ asks for the read).
  if (WAITING_READ && RETRY_TIMER === null) listsRetryLater_();
  if (!isListScreen_(VIEW.screen)) return;
  if (LISTS || APP_ON) { listsPaint_(); return; }
  if (code === 'NOT_CONFIGURED') showCover('error', 'Your PIN works, but the lists are not connected yet.');
  else if (unreached(err)) showCover('error', REACH_TEXT);
  else showCover('error', 'Could not load your lists. Check the connection and try again.');
}

// Repaints a list screen that is on show. Screen state that must survive (an open sheet, a focused field)
// lives in the screen's own variables, because this rebuilds the screen.
function listsPaint_() {
  if (isListScreen_(VIEW.screen) && APP_ON) render(true);
}

// ---- lists: the queue (kl.queue, shared by every open tab) ----------------------------------------
// Ops that kl.queue holds now, oldest first. An op with no uid (none should exist) gets a fixed one.
function listsReadQueue_() {
  var q = lsJson_(LS_QUEUE);
  if (!Array.isArray(q)) return [];
  return q.filter(function (o) { return !!o && typeof o === 'object' && typeof o.op === 'string'; }).map(function (o) {
    if (typeof o.uid !== 'string' || !o.uid) o.uid = 'u:' + [o.op, o.list, o.id, o.at].join('|');
    return o;
  });
}

// R48: the queue is read, changed and written back on every change, so another tab's ops are never lost.
// change(arr) is applied to this page's queue and to what kl.queue holds now. What is written also carries this
// page's ops that never made it into kl.queue, in their own order.
function listsQueueChange_(change) {
  change(QUEUE);
  var stored = listsReadQueue_();
  change(stored);
  var next = listsMerge_(stored);
  QUEUE_UNSAVED = !lsSet_(LS_QUEUE, JSON.stringify(next));
  if (!QUEUE_UNSAVED) listsAdopt_(next, next);
}

// What the queue should be: kl.queue's ops in its order (this page's copies take its fields; another tab may
// have added or retargeted some), plus this page's ops that never made it into kl.queue, each placed right after
// the op before it here, so the order this page made them in holds. An op this page knew from kl.queue and no
// longer finds there was settled by another tab, so it is left out.
function listsMerge_(stored) {
  var local = {};
  QUEUE.forEach(function (q) { local[q.uid] = q; });
  var there = {};
  stored.forEach(function (s) { there[s.uid] = true; });
  var out = stored.map(function (s) {
    var q = local[s.uid];
    if (!q) return s;
    for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) q[k] = s[k];
    return q;
  });
  var prev = null;
  QUEUE.forEach(function (q) {
    if (there[q.uid]) { prev = q.uid; return; }
    if (KNOWN[q.uid]) return;
    var at = 0;
    if (prev !== null) {
      for (var i = 0; i < out.length; i++) if (out[i].uid === prev) { at = i + 1; break; }
    }
    out.splice(at, 0, q);
    prev = q.uid;
  });
  return out;
}

// Takes next as this page's queue. inStore is what kl.queue holds now: only those ops count as known, so an op
// that never made it there is never mistaken for one another tab settled. The op on its way stays at the front
// until its reply, even when another tab settled it.
function listsAdopt_(next, inStore) {
  var keep = [];
  if (INFLIGHT && !next.some(function (q) { return q.uid === INFLIGHT; })) {
    QUEUE.forEach(function (q) { if (q.uid === INFLIGHT) keep.push(q); });
  }
  inStore.forEach(function (q) { KNOWN[q.uid] = true; });
  QUEUE = keep.concat(next);
}

function listsQueueInit_() {
  QUEUE = [];
  var stored = listsReadQueue_();
  listsAdopt_(listsMerge_(stored), stored);
}

function listsQueueRemove_(uid) {
  listsQueueChange_(function (arr) {
    for (var i = arr.length - 1; i >= 0; i--) if (arr[i].uid === uid) arr.splice(i, 1);
  });
}

// 'd:' + a lowercase uuid, made here so a replayed add is recognised and never duplicates.
function newId_() {
  var c = window.crypto;
  if (c && typeof c.randomUUID === 'function') return 'd:' + String(c.randomUUID()).toLowerCase();
  var bytes = [];
  if (c && typeof c.getRandomValues === 'function') {
    bytes = c.getRandomValues(new Uint8Array(16));
  } else {
    for (var i = 0; i < 16; i++) bytes.push(Math.floor(Math.random() * 256));
  }
  return 'd:' + uuidFromBytes_(bytes);
}

// op: {op, list, id, fp, fields, item}. add gets its id here and, on To do, this phone's Who unless fields
// says one; edit, tick and delete take the fp of the item on screen unless given. item (restore only, never
// sent) is the item to show again when it is not in doneToday, as after a delete. Shows the change at once,
// saves the queue and sends it. Returns the queued op, with its id.
function listsQueue_(input) {
  var op = { op: String(input.op), at: Date.now() };
  if (op.op !== 'pause') {
    op.list = input.list;
    op.id = input.id || (op.op === 'add' ? newId_() : '');
  }
  op.uid = 'u' + newId_().slice(1);
  if (input.fields && typeof input.fields === 'object') {
    op.fields = {};
    for (var k in input.fields) if (Object.prototype.hasOwnProperty.call(input.fields, k)) op.fields[k] = input.fields[k];
  }
  if (op.op === 'add' && op.list === 'todo') {
    if (!op.fields) op.fields = {};
    if (!op.fields.who && whoAmI_()) op.fields.who = whoAmI_();
  }
  // R66b: an add (both lists) says which phone it came from, only as exactly Kev or Lili; nothing else
  // ever carries from (the server refuses it on any other op, and any other value).
  if (op.fields) delete op.fields.from;
  if (op.op === 'add') {
    var me = whoAmI_();
    if (me === 'Kev' || me === 'Lili') {
      if (!op.fields) op.fields = {};
      op.fields.from = me;
    }
  }
  if (op.op === 'edit' || op.op === 'tick' || op.op === 'delete') {
    var cur = listsItem_(op.list, op.id);
    op.fp = (typeof input.fp === 'string' && input.fp) ? input.fp : (cur ? cur.fp : '');
  }
  if (op.op === 'restore' && input.item) op.item = input.item;
  listsQueueChange_(function (arr) { arr.push(op); });
  listsRebuild_();
  setTimeout(listsNoteUpdate_, 10000);
  listsPaint_();
  listsFlush_();
  return op;
}

// What goes over the wire: no queue bookkeeping, and only the keys each op takes.
function listsBody_(op) {
  var b = { op: op.op };
  if (op.op !== 'pause') {
    b.list = op.list;
    b.id = op.id;
  }
  if (op.op === 'edit' || op.op === 'tick' || op.op === 'delete') b.fp = op.fp;
  if (op.op === 'add' || op.op === 'edit' || op.op === 'pause') b.fields = op.fields || {};
  // A2-T3: a grocery tick says the shop the item was shown under, so the Done row learns it (older servers ignore it).
  if (op.op === 'tick' && op.fields && typeof op.fields.shop === 'string' && op.fields.shop) b.fields = { shop: op.fields.shop };
  return b;
}

function listsNeedsFp_(op) {
  return op.op === 'edit' || op.op === 'tick' || op.op === 'delete';
}

function listsWaitKey_(op) {
  return op.list + '|' + op.id;
}

// R47, R50: what the queue head needs before it can go. 'go'; 'wait' (a fresh read is asked for); or 'dropped'
// (a tick or delete whose item the fresh read no longer lists is done; an edit of a gone item is dropped as a
// conflict would be). Only ever called for the head with nothing in flight, so no earlier op for its item exists.
function listsHeadReady_(op) {
  if (op.op === 'pause' || op.op === 'expense') return 'go';
  var key = listsWaitKey_(op);
  var blank = listsNeedsFp_(op) && !op.fp;
  if (!Object.prototype.hasOwnProperty.call(WAIT_KEYS, key)) {
    if (!blank) return 'go';
    WAIT_KEYS[key] = SETTLE_N;
  }
  if (!LISTS_BASE || LANDED_N < WAIT_KEYS[key]) {
    WAITING_READ = true;
    if (!(LISTS_LOADING && READ_N >= WAIT_KEYS[key])) listsLoad_(true);
    return 'wait';
  }
  delete WAIT_KEYS[key];
  if (!listsNeedsFp_(op)) return 'go';
  var it = listsFind_(LISTS_BASE, op.list, op.id);
  if (it) {
    listsQueueChange_(function (arr) {
      arr.forEach(function (q) { if (q.uid === op.uid) q.fp = it.fp; });
    });
    return 'go';
  }
  if (op.op === 'edit') LISTS_TOAST = 'This item changed. Refreshed.';
  listsQueueRemove_(op.uid);
  listsRebuild_();
  listsPaint_();
  return 'dropped';
}

// Wait marks for items with no queued op left are dropped once a read sent at or after the mark lands. An older
// read keeps the mark: its fp predates the unsure change, so an op queued later must still wait (case G).
function listsDropIdleWaits_() {
  var used = {};
  QUEUE.forEach(function (q) { if (q.op !== 'pause' && q.op !== 'expense') used[listsWaitKey_(q)] = true; });
  for (var k in WAIT_KEYS) {
    if (Object.prototype.hasOwnProperty.call(WAIT_KEYS, k) && !used[k] && WAIT_KEYS[k] <= LANDED_N) delete WAIT_KEYS[k];
  }
}

function listsByUid_(uid) {
  for (var i = 0; i < QUEUE.length; i++) if (QUEUE[i].uid === uid) return QUEUE[i];
  return null;
}

// Sends the oldest op, one at a time, in order. Called on load, on online, on another tab's queue change, after
// each enqueue, after each read and after each reply.
function listsFlush_() {
  if (INFLIGHT || RETRY_TIMER !== null || !TOKEN || !QUEUE.length) return;
  var ready = listsHeadReady_(QUEUE[0]);
  if (ready === 'dropped') { listsFlush_(); return; }
  if (ready === 'wait') return;
  WAITING_READ = false;
  var op = QUEUE[0];
  if (op.op === 'expense') { expenseSend_(op); return; } // A1-T5 (R-A5): on its own, through addExpense
  LISTS_TRIED[op.uid] = true; // A3-T2A fix 1: sent once, so an Undo knows the item may exist (memory only)
  var sent = JSON.parse(JSON.stringify(op));
  if (HEAD_FAIL_UID !== op.uid) { HEAD_FAIL_UID = op.uid; HEAD_FAIL_N = 0; } // a new head starts from zero
  INFLIGHT = op.uid;
  var session = SESSION;
  listsCall_('listOp', listsBody_(sent)).then(function (res) {
    INFLIGHT = '';
    // M3: a reply from before a lock-out only frees the line; the op stays queued and goes again.
    if (session !== SESSION) { listsFlush_(); return; }
    listsReply_(sent, res);
  }, function (err) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    var code = err ? err.code : '';
    if (code === 'NO_SESSION') { lockOut(); return; }
    if (code === 'BAD_REQUEST') { listsRefused_(sent, false); return; }
    // R70: a server that fails this op 8 times in a row will not take it; it goes, so the ops behind it can.
    if (code === 'SERVER' && HEAD_FAIL_UID === sent.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { listsRefused_(sent, false); return; }
    listsRetryLater_(); // TIMEOUT, UNREACHED, SERVER, NOT_CONFIGURED: every op is safe to send again
  });
}

function listsReply_(op, res) {
  if (!res || typeof res !== 'object') { listsRetryLater_(); return; }
  if (res.ok === true) {
    var item = (res.item && typeof res.item === 'object') ? res.item : null;
    if (item) listsRetarget_(op, item);
    listsRecord_(op, res);
    var unsure = op.op !== 'pause' && ((Object.prototype.hasOwnProperty.call(res, 'item') && res.item === null) || (op.op === 'add' && res.gone));
    if (unsure) listsWaitFor_(op);
    listsDone_(op, unsure || (op.op === 'pause' && !res.prefs));
    return;
  }
  if (res.conflict) {
    listsRecord_(op, res);
    LISTS_TOAST = 'This item changed. Refreshed.';
    listsDone_(op, false);
    return;
  }
  // A retried restore after a success answers invalid: it is done, but its fp is unknown.
  if (res.invalid && op.op === 'restore') {
    listsRecord_(op, res);
    listsWaitFor_(op);
    listsDone_(op, true);
    return;
  }
  // R70 deploy-order safety net: a server from before R66b refuses an add that says which phone it came from. The
  // add goes once more without from (same id, so it can never duplicate); only that answer is final.
  if (res.invalid && op.op === 'add' && op.fields && Object.prototype.hasOwnProperty.call(op.fields, 'from')) {
    listsQueueChange_(function (arr) {
      arr.forEach(function (q) { if (q.uid === op.uid && q.fields) delete q.fields.from; });
    });
    listsFlush_();
    return;
  }
  // PB-T3 fix 1: a server from before the Priority column refuses an add with a priority. After the from retry, the
  // add goes once more without it (same id): the to-do is kept, only its priority is lost. Only that answer is final.
  if (res.invalid && op.op === 'add' && op.fields && Object.prototype.hasOwnProperty.call(op.fields, 'priority')) {
    listsQueueChange_(function (arr) {
      arr.forEach(function (q) { if (q.uid === op.uid && q.fields) delete q.fields.priority; });
    });
    listsRebuild_();
    listsPaint_();
    listsFlush_();
    return;
  }
  if (res.invalid || res.capped) { listsRefused_(op, !!res.capped); return; }
  listsRetryLater_();
}

function listsWaitFor_(op) {
  WAIT_KEYS[listsWaitKey_(op)] = SETTLE_N;
}

// A settled op goes into the server copy, and is kept for a read on its way (R46).
function listsRecord_(op, res) {
  SETTLE_N++;
  if (LISTS_BASE) listsSettleInto_(LISTS_BASE, op, res);
  if (LISTS_LOADING) SETTLED.push({ op: op, res: res });
}

// What a settled op means for a lists object. Matching is by id, so applying it twice changes nothing more.
function listsSettleInto_(base, op, res) {
  var item = (res.item && typeof res.item === 'object') ? res.item : null;
  if (res.conflict) {
    if (op.op === 'pause') return;
    if (item) listsUpsert_(base, op.list, item, op.id);
    else listsRemove_(base, op.list, op.id);
    return;
  }
  if (res.ok !== true) {
    listsApplyOp_(base, op); // a restore answered invalid on replay
    return;
  }
  if (res.gone) {
    if (op.op !== 'pause') listsRemove_(base, op.list, op.id);
    return;
  }
  if (op.op === 'pause') {
    if (res.prefs && typeof res.prefs === 'object') base.prefs = res.prefs;
    else listsApplyOp_(base, op);
    return;
  }
  listsApplyOp_(base, op);
  if (item) listsUpsert_(base, op.list, item, op.id);
}

// Later queued ops for the same item go with the reply's id and fp, so they never trip over the change just saved.
function listsRetarget_(op, item) {
  listsQueueChange_(function (arr) {
    arr.forEach(function (q) {
      if (q.uid === op.uid || q.op === 'pause' || q.list !== op.list || q.id !== op.id) return;
      q.id = item.id;
      if (listsNeedsFp_(q)) q.fp = item.fp;
    });
  });
}

// Puts the server's item where the old one was (found by the op's id, or the item's own), else at the end.
function listsUpsert_(base, list, item, oldId) {
  var arr = base[listsKey_(list)];
  if (!Array.isArray(arr)) return;
  var i = -1;
  for (var j = 0; j < arr.length && i < 0; j++) if (arr[j].id === oldId) i = j;
  for (var k = 0; k < arr.length && i < 0; k++) if (arr[k].id === item.id) i = k;
  if (i >= 0 && list === 'grocery') item = groKeepShop_(arr[i], item);
  if (i >= 0) arr[i] = item;
  else arr.push(item);
}

// A2-T3: a write reply carries only the hand shop. When it has none, the learned or guessed shop the item had stays,
// as long as the text is the same item (a rename has dropped it already), so a row never jumps to Any shop.
function groKeepShop_(had, item) {
  if (!had || !item || sheetOneLine_(item.shop) || !sheetOneLine_(had.shop)) return item;
  if (had.shopFrom !== 'learned' && had.shopFrom !== 'guess') return item;
  if (foldKey_(had.text) !== foldKey_(item.text)) return item;
  var out = {};
  for (var k in item) if (Object.prototype.hasOwnProperty.call(item, k)) out[k] = item[k];
  out.shop = had.shop;
  out.shopFrom = had.shopFrom;
  return out;
}

function listsRemove_(base, list, id) {
  var arr = base[listsKey_(list)];
  if (!Array.isArray(arr)) return;
  for (var i = arr.length - 1; i >= 0; i--) if (arr[i].id === id) arr.splice(i, 1);
}

// The op is answered: off the queue (its own uid only), screens rebuilt, the next one sent. refresh forces a
// lists load first.
function listsDone_(op, refresh) {
  listsQueueRemove_(op.uid);
  RETRY_N = 0;
  HEAD_FAIL_UID = '';
  HEAD_FAIL_N = 0;
  listsSaveCache_();
  listsRebuild_();
  if (refresh) listsLoad_(true);
  listsPaint_();
  listsFlush_();
}

function listsRefused_(op, capped) {
  LISTS_TOAST = capped ? 'Too many new items today. This one was not saved.' : 'That change was not saved.';
  listsDone_(op, true);
}

function listsRetryLater_() {
  RETRY_N++;
  RETRY_TIMER = setTimeout(function () {
    RETRY_TIMER = null;
    listsFlush_();
  }, backoffMs_(RETRY_N));
  listsNoteUpdate_();
}

// True once the oldest op has waited 10 s unsent.
function listsPendingLong_() {
  return QUEUE.length > 0 && Date.now() - (Number(QUEUE[0].at) || 0) >= 10000;
}

function listsNoteUpdate_() {
  if (!LISTS_NOTE) return;
  var late = listsPendingLong_();
  LISTS_NOTE.textContent = late ? 'Not saved yet, retrying' : '';
  LISTS_NOTE.hidden = !late;
}

// Another tab changed kl.queue: take its ops, drop the ones it settled, send what is ours to send.
function listsStorageChanged_(e) {
  if (e && e.key !== LS_QUEUE && e.key !== null) return;
  var stored = listsReadQueue_();
  listsAdopt_(listsMerge_(stored), stored);
  listsRebuild_();
  listsPaint_();
  listsFlush_();
}

// At lock-out: nothing on screen, no read pending. The queue stays, in memory and in kl.queue. A send on its way
// is left to finish (INFLIGHT), so the next one never overtakes it (M3).
function listsLockOut_() {
  if (RETRY_TIMER !== null) clearTimeout(RETRY_TIMER);
  RETRY_TIMER = null;
  RETRY_N = 0;
  LISTS_LOADING = false;
  LISTS_AGAIN = false;
  LISTS_FAILED = false;
  LISTS = null;
  LISTS_BASE = null;
  LISTS_AT = 0;
  LISTS_FETCHED = 0;
  LISTS_TOAST = '';
  listsUndoClear_();
  LISTS_NEW = null; // A3-T2A
  LISTS_NEW_EL = null;
  LISTS_NOTE = null;
  SETTLED = [];
  LANDED_N = -1;     // the next read must land before a waiting head is resolved against anything
  WAITING_READ = false;
}

// ---- lists: screens (Tasks 6 to 8 fill the lists-main container) ---------------------------------
// A1-T3: the large title with this phone's avatar on its right. Under it, line (In the shop), and the age
// of the lists only when they are over 10 minutes old or a refresh failed. A3-T2B: extra (To do's Mine) sits on
// the title row before the avatar; the "Today: N" line is gone (p9).
function listsPanel_(root, title, line, extra) {
  var top = largeTitleBox_(root, title, [extra || null, whoAvatar_()]);
  if (line) add(top.wrap, 'p', 'title-note', line);
  var now = Date.now();
  if (LISTS_AT && LISTS_FAILED) staleNote_(top.wrap, 'Lists', LISTS_AT, LISTS_OFFLINE); // A3-T2B M6
  else if (LISTS_AT && now - LISTS_AT > 600000) add(top.wrap, 'p', 'title-note', updatedText_(LISTS_AT, now) + '.');
  return top.h;
}

// ---- who uses this phone (A1-T3): a first-run sheet, then a small avatar in the list headers ------------------
var WHO_ASKED = false;  // the sheet opened on this visit already: the first open of a list tab asks once
var WHO_OPEN = false;
var WHO_AVATAR = null;  // the header avatar on show now; it gets focus back when the sheet closes
var WHO_CTLS = [];      // the two choices, for the Tab loop

// A3-T2B m3: before the choice, a person icon labelled "Who?" (a bare "?" read as Help).
var PERSON_PATHS = ['M12 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7z', 'M5 19.5c0-3.6 3.1-6 7-6s7 2.4 7 6'];
function whoAvatar_() {
  var me = whoAmI_();
  var b = el('button', me ? 'avatar avatar-' + me.toLowerCase() : 'avatar avatar-who');
  b.setAttribute('type', 'button');
  b.setAttribute('aria-label', me ? 'This phone: ' + me + '. Change' : 'Who uses this phone?');
  if (!me) b.appendChild(svgIcon_(PERSON_PATHS));
  add(b, 'span', '', me ? me.charAt(0) : 'Who?').setAttribute('aria-hidden', 'true');
  b.addEventListener('click', openWhoSheet_);
  WHO_AVATAR = b;
  return b;
}

// A bottom sheet with two big choices. A choice sets this phone's person (kl.me); a tap outside or Escape
// closes it with no change. It lives in the static #who, so repaints behind it never rebuild it.
function openWhoSheet_() {
  if (SHEET) return;
  WHO_ASKED = true;
  WHO_OPEN = true;
  var root = $('who');
  root.textContent = '';
  add(root, 'div', 'sheet-backdrop').addEventListener('click', function () { closeWhoSheet_(); });
  var p = add(root, 'div', 'sheet-panel');
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-modal', 'true');
  p.setAttribute('aria-labelledby', 'who-title');
  p.setAttribute('tabindex', '-1');
  add(p, 'div', 'sheet-handle').setAttribute('aria-hidden', 'true');
  add(p, 'h2', 'who-title', 'Who uses this phone?').setAttribute('id', 'who-title');
  add(p, 'p', 'who-line', 'New to-dos from this phone are for this person unless you pick someone else.');
  var row = add(p, 'div', 'who-choices');
  var me = whoAmI_();
  WHO_CTLS = [];
  ['Kev', 'Lili'].forEach(function (name) {
    var b = btn(row, 'who-choice', null, function () {
      setWhoAmI_(name);
      closeWhoSheet_();
    });
    b.setAttribute('aria-pressed', me === name ? 'true' : 'false');
    add(b, 'span', 'avatar-dot avatar-' + name.toLowerCase(), name.charAt(0)).setAttribute('aria-hidden', 'true');
    add(b, 'span', '', name);
    WHO_CTLS.push(b);
  });
  add(p, 'p', 'who-foot', 'Change it any time: tap your letter, top right.');
  root.hidden = false;
  sheetInert_(true);
  p.focus({ preventScroll: true });
}

// Closes the sheet with nothing on screen changed but the avatar; focus goes back to it.
function closeWhoSheet_() {
  if (!WHO_OPEN) return;
  whoShut_();
  listsPaint_();
  if (WHO_AVATAR && !SHEET) WHO_AVATAR.focus({ preventScroll: true });
}

// Takes the sheet off the screen, quietly (a screen change, a lock-out, an item sheet opening).
function whoShut_() {
  if (!WHO_OPEN) return;
  WHO_OPEN = false;
  WHO_CTLS = [];
  var root = $('who');
  root.textContent = '';
  root.hidden = true;
  sheetInert_(false);
}

function whoKey_(e) {
  if (!WHO_OPEN || !e) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeWhoSheet_();
    return;
  }
  // Tab stays on the two choices.
  if (e.key !== 'Tab' || WHO_CTLS.length < 2) return;
  e.preventDefault();
  var i = WHO_CTLS.indexOf(e.target);
  // From the panel itself: Tab goes to the first choice, Shift+Tab to the last.
  if (i < 0) WHO_CTLS[e.shiftKey ? 1 : 0].focus();
  else WHO_CTLS[i === 0 ? 1 : 0].focus();
}

// True when there are no lists to show yet; it says why in parent.
function listsWaiting_(parent) {
  if (LISTS) return false;
  if (LISTS_FAILED) {
    add(parent, 'p', 'small', 'Could not load your lists.');
    btn(parent, 'textbtn', 'Try again', function () { listsLoad_(true); });
  } else {
    add(parent, 'p', 'small', 'Opening your lists...');
  }
  return true;
}

// R57: what the server found wrong with the list tabs (a blanked header cell), as one quiet line of text.
function listsProblems_(parent, lists) {
  var all = lists && Array.isArray(lists.problems) ? lists.problems : [];
  var lines = [];
  all.forEach(function (x) {
    var t = typeof x === 'string' ? sheetOneLine_(x) : '';
    if (t) lines.push(/[.]$/.test(t) ? t : t + '.');
  });
  return lines.length ? add(parent, 'p', 'lists-problem', lines.join(' ')) : null;
}

// A3-T2B m5: the delete line names the item: "Deleted: Clean the fridge." (its end punctuation dropped).
function listsDeletedText_(it) {
  var name = sheetOneLine_(it && it.text).replace(/[\s.!?,;:\u2026]+$/, '');
  return name ? 'Deleted: ' + name + '.' : 'Deleted.';
}

// The fixed strip above the bar: "Not saved yet", the lists toast and the "Deleted: <item>. Undo" line.
function listsDock_(root) {
  var dock = add(root, 'div', 'dock');
  LISTS_NOTE = add(dock, 'p', 'dock-note');
  LISTS_NOTE.setAttribute('role', 'status');
  listsNoteUpdate_();
  if (QUEUE_UNSAVED && QUEUE.length) add(dock, 'p', 'dock-note', 'Changes are kept only while this page is open.');
  if (LISTS_TOAST) {
    var t = add(dock, 'div', 'dock-toast');
    t.setAttribute('role', 'status');
    add(t, 'span', '', LISTS_TOAST);
  }
  if (LISTS_UNDO) {
    // M2: only "Deleted." is the live region, and it is said once: it goes on screen empty and is filled
    // 100 ms later on the line then on screen; every repaint after that draws it filled.
    var u = add(dock, 'div', 'dock-toast dock-undo');
    var said = add(u, 'span', '', LISTS_UNDO.said ? listsDeletedText_(LISTS_UNDO.item) : '');
    said.setAttribute('role', 'status');
    LISTS_UNDO_SAY = said;
    if (!LISTS_UNDO.said && !LISTS_UNDO.saying) {
      var undo = LISTS_UNDO;
      undo.saying = true;
      setTimeout(function () {
        if (LISTS_UNDO !== undo) return;
        undo.said = true;
        if (LISTS_UNDO_SAY) LISTS_UNDO_SAY.textContent = listsDeletedText_(undo.item);
      }, 100);
    }
    todoKey_(btn(u, '', 'Undo', listsUndo_), 'undo');
  }
  return dock;
}

// ---- To do screen (Task 6) -------------------------------------------------------------------
// Days are 'yyyy-MM-dd' text in Bali time. Every section and age comes from the server's today, never the
// phone clock. The pure helpers below take everything they use as arguments.

// iso plus n days, as 'yyyy-MM-dd'.
function isoAddDays_(iso, n) {
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)) + n));
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// True for a real calendar day as 'yyyy-MM-dd' (2026-02-30 and 2026-13-01 are not).
function todoValidDay_(v) {
  return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && isoAddDays_(v, 0) === v;
}

// The Bali day ('yyyy-MM-dd') at ms on the phone's clock: Asia/Makassar is UTC+8 all year (no DST). '' for a bad clock.
function baliDay_(ms) {
  var d = new Date(Number(ms) + 8 * 3600000);
  if (isNaN(d.getTime())) return '';
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// R70: the page's today, the later of the lists' server day (maybe from the cache) and the Bali day of the phone's
// clock. A cache from yesterday moves on at Bali midnight; a phone clock behind the server never moves it back.
function listsToday_(lists) {
  var server = lists && todoValidDay_(lists.today) ? lists.today : '';
  var phone = baliDay_(Date.now());
  if (!todoValidDay_(phone)) return server;
  return phone > server ? phone : server;
}

// 'Fri 14'; the month is added when the day is not in today's month: 'Tue 1 Dec'.
function todoDayLabel_(iso, today) {
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))));
  var out = days[d.getUTCDay()] + ' ' + d.getUTCDate();
  if (iso.slice(0, 7) !== String(today || '').slice(0, 7)) out += ' ' + months[d.getUTCMonth()];
  return out;
}

// A3-T2B p2: 'Today', 'Tomorrow', else the short day ('Fri 14', 'Tue 1 Dec').
function todoWhenLabel_(iso, today) {
  if (iso === today) return 'Today';
  if (todoValidDay_(today) && iso === isoAddDays_(today, 1)) return 'Tomorrow';
  return todoDayLabel_(iso, today);
}

// The muted age chip: nothing under 7 days, then '7 days' to '13 days', then '2+ weeks' and no higher.
function todoAgeText_(ageDays) {
  var n = Math.floor(Number(ageDays) || 0);
  if (n < 7) return '';
  if (n < 14) return n + ' days';
  return '2+ weeks';
}

// The who chip. Either (and the old stored Both) is the default and shows no chip.
function todoWho_(who) {
  return (who === 'Kev' || who === 'Lili' || who === 'Couple') ? who : '';
}

// The first step still worth offering, or ''. R70: an item whose text already is its first step (it was made
// smaller to it) is already small: no chip, never named by the note, no "Make it smaller".
function todoStep_(it) {
  var step = String((it && it.firstStep) || '');
  if (!step || foldKey_(it.text) === foldKey_(step)) return '';
  return step;
}

// '5 min' for a quick item, 'First step: ...' for a bigger one that is not already small, else nothing.
function todoEffortText_(it) {
  var mins = Number(it.minutes);
  if (it.kind === 'quick') return (isFinite(mins) && mins > 0) ? mins + ' min' : '';
  var step = todoStep_(it);
  if (it.kind === 'bigger' && step) return 'First step: ' + step;
  return '';
}

// Soonest due first; on one day a set time comes first (earliest first), then the one that waited longest.
function todoCmpDue_(a, b) {
  if (a.due !== b.due) return a.due < b.due ? -1 : 1;
  var ta = a.time || '';
  var tb = b.time || '';
  if (ta !== tb) {
    if (!ta) return 1;
    if (!tb) return -1;
    return ta < tb ? -1 : 1;
  }
  return todoCmpAge_(a, b);
}

// Oldest first: the most days waited, then the earliest added, then by id. The id makes the order total, so a
// row unticked here (restore puts it at the end of the list) comes back to the same place.
function todoCmpAge_(a, b) {
  var d = (Number(b.ageDays) || 0) - (Number(a.ageDays) || 0);
  if (d) return d;
  var x = a.added || '';
  var y = b.added || '';
  if (x !== y) return x < y ? -1 : 1;
  var i = String(a.id);
  var j = String(b.id);
  return i === j ? 0 : (i < j ? -1 : 1);
}

// The five To do sections. today: due on or before today (the earlier days folded in); week: the next 7 days,
// grouped by day as {due, label, items}; later: after that; anytime: no date, under 30 days; parked: no date,
// 30 days or more. A due that is not a real 'yyyy-MM-dd' day counts as no date. items is not changed.
function todoSections_(items, today) {
  var end = isoAddDays_(today, 7);
  var out = { today: [], week: [], later: [], anytime: [], parked: [] };
  var week = [];
  (items || []).forEach(function (it) {
    var due = todoValidDay_(it.due) ? it.due : '';
    if (!due) {
      if ((Number(it.ageDays) || 0) >= 30) out.parked.push(it);
      else out.anytime.push(it);
    } else if (due <= today) {
      out.today.push(it);
    } else if (due <= end) {
      week.push(it);
    } else {
      out.later.push(it);
    }
  });
  out.today.sort(todoCmpDue_);
  week.sort(todoCmpDue_);
  out.later.sort(todoCmpDue_);
  out.anytime.sort(todoCmpAge_);
  out.parked.sort(todoCmpAge_);
  week.forEach(function (it) {
    var g = out.week[out.week.length - 1];
    if (!g || g.due !== it.due) {
      g = { due: it.due, label: todoWhenLabel_(it.due, today), items: [] };
      out.week.push(g);
    }
    g.items.push(it);
  });
  return out;
}

// The one item the note names: of those that waited 7 days or more, the oldest quick one, else the oldest. An item
// already made small (todoStep_) is never named (R70).
function todoNotePick_(items) {
  var waited = (items || []).filter(function (it) {
    return (Number(it.ageDays) || 0) >= 7 && !(it.firstStep && !todoStep_(it));
  }).sort(todoCmpAge_);
  for (var i = 0; i < waited.length; i++) if (waited[i].kind === 'quick') return waited[i];
  return waited[0] || null;
}

// The note: '<text> has waited a while.' (a trailing punctuation mark of the text dropped). F4 fix 4 (Kevin: "no
// need to tell me how to do it"): no first step and no minutes; the row's First step chip and the sheet keep them.
function todoNoteText_(it) {
  return String(it.text).replace(/[\s.!?,;:\u2026]+$/, '') + ' has waited a while.';
}

// Mine: the items for me, plus Either and Couple. With no phone identity, everything.
function todoMine_(items, me) {
  if (!me) return items.slice();
  return items.filter(function (it) { return it.who === me || it.who === 'Couple' || todoWho_(it.who) === ''; });
}

// PB-T3: the stored priority: 'Important', 'Later' (shown as Someday) or '' (Normal). Anything else reads as Normal.
function todoPriority_(v) {
  return v === 'Important' || v === 'Later' ? v : '';
}

// PB-T3: a priority word at the start or the end of a to-do ("urgent: appeler banque", "call mom today"), as a whole
// word, case ignored. urgent, important, dringend, belangrijk give Important; today, aujourd'hui, vandaag give
// Important and today. A word in the middle is just a word. -> {priority, today, text (the word cut)} or null (also
// when nothing would be left). The date words are read after, on the cut text, by parseWhen_ (kept identical to the
// bot's, so this lives outside it). Fix 1, as the bot: at the start, important, belangrijk and today need a separator
// (: , . or " - ") before more text ("Important documents to send" is plain text); urgent, dringend, aujourd'hui and
// vandaag need none. At the end, a word after pas, not, niet, non or geen ("pas urgent") is not read.
function sheetPriWords_(text) {
  var t = typeof text === 'string' ? text : '';
  var FREE = "urgent|dringend|aujourd['\u2019\u2018`]?\\s?hui|vandaag";
  var WORDS = FREE + '|important|belangrijk|today';
  var head = new RegExp('^\\s*(' + WORDS + ')(?:\\s*[:,.]\\s*|\\s+-\\s+)(?=\\S)', 'i').exec(t) ||
    new RegExp('^\\s*(' + FREE + ')\\s+(?=\\S)', 'i').exec(t);
  var word = '';
  var rest = '';
  if (head) {
    word = head[1];
    rest = t.slice(head[0].length);
  } else {
    var tail = new RegExp('(?:^|[\\s,;:]+|\\s+-\\s+)(' + WORDS + ')[\\s.,;:]*$', 'i').exec(t);
    if (tail && tail.index > 0) {
      var before = /(\S+)$/.exec(t.slice(0, tail.index).replace(/[\s,;:.\-]+$/, ''));
      if (!before || !/^(?:pas|not|niet|non|geen)$/i.test(before[1])) {
        word = tail[1];
        rest = t.slice(0, tail.index);
      }
    }
  }
  if (!word) return null;
  rest = rest.replace(/^[\s:,.\-]+|[\s:,;\-]+$/g, '').trim();
  if (!rest) return null;
  var w = word.toLowerCase();
  var today = /^(today|aujourd|vandaag)/.test(w);
  return { priority: 'Important', today: today, text: rest };
}

// PB-T3: the To do filter as stored on this phone: {p: '' (All) or 'important', t: 0 (Any time), 5 or 30 minutes}.
function todoFilterRead_(raw) {
  var v = null;
  try { v = raw ? JSON.parse(raw) : null; } catch (e) { v = null; }
  var p = v && v.p === 'important' ? 'important' : '';
  var t = v && (v.t === 5 || v.t === 30) ? v.t : 0;
  return { p: p, t: t };
}

// The items the filter keeps. A time filter keeps only items with a known effort of that many minutes or less.
function todoFilterKeep_(items, f) {
  return (items || []).filter(function (it) {
    if (f.p === 'important' && todoPriority_(it.priority) !== 'Important') return false;
    if (f.t) {
      var m = Number(it.minutes);
      if (it.minutes === '' || it.minutes === null || it.minutes === undefined || !isFinite(m) || m <= 0 || m > f.t) return false;
    }
    return true;
  });
}

var LS_NOTE = 'kl.noteSnooze'; // the Bali day the Anytime note shows again (yyyy-MM-dd)
var NOTE_SNOOZE = null;  // memory copy of kl.noteSnooze, so "Not now" holds for this visit even without storage

var TODO_MINE = null;    // memory copy of kl.mine (null: not read yet), so Mine holds for this visit even without storage
var TODO_STEP_OPEN = {}; // A3-T2B: id -> true, the First step chips unfolded on this visit
var TODO_NOTE_ID = '';   // A3-T2B m10: the item the "has waited a while" card names on this paint (its age chip is not shown)

var LS_FILTER = 'kl.todoFilter'; // PB-T3: the To do filter on this phone, as {p, t} (todoFilterRead_)
var TODO_FILTER = null;  // memory copy of kl.todoFilter (null: not read yet), so the filter holds for this visit even without storage
var PLUS_PATHS = ['M12 5v14', 'M5 12h14'];
var TICK_OPEN_PATHS = ['M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17z'];
var TICK_DONE_PATHS = ['M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17z', 'M8 12.3l2.8 2.8l5.2-5.8'];

// Leaving To do: struck items go to Done today, the folds close, the Pause menu closes.
function todoLeave_() {

// Marks a control with a focus key. Tapping it (its handler) or focusing it (the focusin listener on #todo)
// makes it the one a repaint gives focus back to; focusing anything without a key clears the key.
function todoKey_(e, key) {
  e.setAttribute('data-focus', key);
  if (key === TODO_FOCUS) TODO_FOCUS_EL = e;
  if (key === GRO_FOCUS) GRO_FOCUS_EL = e; // Groceries uses the same keys (the dock's Undo is keyed here)
  return e;
}

function todoIsDay_(v) {

}

function todoMineOn_() {

}

function todoFilterOn_() {
  if (TODO_FILTER === null) TODO_FILTER = todoFilterRead_(lsGet_(LS_FILTER));

}

function todoFilterSet_(f) {

  lsSet_(LS_FILTER, JSON.stringify(TODO_FILTER));

// PB-T3: the Important group: dated items soonest first (a set time first on a day), then the undated, oldest first.
function todoCmpImportant_(a, b) {
  var da = todoValidDay_(a.due);
  var db = todoValidDay_(b.due);
  if (da !== db) return da ? -1 : 1;
  return da ? todoCmpDue_(a, b) : todoCmpAge_(a, b);
}

function todoSnoozedUntil_() {
  if (NOTE_SNOOZE === null) {

// Opens the edit sheet (Task 7) on a row tap, or with the text set to the first step ("Make it smaller").
function todoOpen_(it, prefill) {

}

// "Not today": Tomorrow or No date (which clears the time too).
function todoMove_(it, due) {

  var fields = { due: due };
  if (!due && it.time) fields.time = '';

}

function todoCopy_(it) {
  var c = JSON.parse(JSON.stringify(it));
  c.fp = '';
  return c;
}

function todoTick_(it) {
  var at = 0;
  var open = (LISTS && LISTS.todo) || [];
  for (var i = 0; i < open.length; i++) if (open[i].id === it.id) at = i;
  TODO_STRUCK[it.id] = { item: todoCopy_(it), at: at };
  listsQueue_({ op: 'tick', list: 'todo', id: it.id });
}

// Unticks a struck item, or brings one back from Done today.
function todoUntick_(it) {
  delete TODO_STRUCK[it.id];
  listsQueue_({ op: 'restore', list: 'todo', id: it.id, item: todoCopy_(it) });
}

function todoPause_(until) {
  TODO_PAUSE = '';
  TODO_PAUSE_DAY = '';
  TODO_PAUSE_ERR = '';

}

// The day this phone's reminders are paused until, or '' when they are on (a pause that ended is on again).
function todoPausedUntil_(lists, me) {
  var p = lists && lists.prefs && lists.prefs[me];
  var u = p ? p.pausedUntil : '';
  var today = listsToday_(lists);
  return (todoIsDay_(u) && todoIsDay_(today) && u >= today) ? u : '';
}

// What the screen shows: the open items with the struck ones back in their places, Mine applied, in sections.
function todoView_(lists, me, mineOnly) {
  var open = Array.isArray(lists.todo) ? lists.todo : [];
  var openIds = {};
  open.forEach(function (it) { openIds[it.id] = true; });
  var struck = [];
  Object.keys(TODO_STRUCK).forEach(function (id) {
    // Open again (a conflict, or brought back elsewhere): it is not struck any more.
    if (openIds[id]) delete TODO_STRUCK[id];
    else struck.push(TODO_STRUCK[id]);
  });
  struck.sort(function (a, b) { return a.at - b.at; });
  var all = open.slice();
  struck.forEach(function (s) { all.splice(Math.min(s.at, all.length), 0, s.item); });
  var done = (Array.isArray(lists.doneToday) ? lists.doneToday : []).filter(function (it) {
    return it && it.list === 'todo' && !TODO_STRUCK[it.id];
  });
  if (mineOnly && me) {
    all = todoMine_(all, me);
    done = todoMine_(done, me);
  }
  // PB-T3: the filter, then Important on top and Someday at the bottom; the rest go in their date sections.
  var total = all.length;
  var f = todoFilterOn_();
  var filtered = !!(f.p || f.t);
  if (filtered) {
    all = todoFilterKeep_(all, f);
    done = todoFilterKeep_(done, f);
  }
  var today = listsToday_(lists);
  var important = all.filter(function (it) { return todoPriority_(it.priority) === 'Important'; }).sort(todoCmpImportant_);
  var someday = all.filter(function (it) { return todoPriority_(it.priority) === 'Later'; }).sort(todoCmpAge_);
  var sections = todoSections_(all.filter(function (it) { return !todoPriority_(it.priority); }), today);
  sections.important = important;
  sections.someday = someday;
  return { today: today, sections: sections, done: done, count: all.length, total: total, filtered: filtered };
}

function renderTodo_(data, me, mineOnly) {
  var root = $('todo');
  var lists = data === undefined ? LISTS : data;
  if (me === undefined) me = whoAmI_();
  if (mineOnly === undefined) mineOnly = todoMineOn_();
  var view = lists ? todoView_(lists, me, mineOnly) : null;
  TODO_FOCUS_EL = null;
  // A3-T2B m4: Mine sits on the title row, before the avatar, and is remembered on this phone (kl.mine).
  var mine = null;
  if (view && me) {
    mine = todoKey_(el('button', 'mine', 'Mine'), 'mine');
    mine.setAttribute('type', 'button');
    mine.setAttribute('aria-pressed', mineOnly ? 'true' : 'false');
    mine.addEventListener('click', function () {
      TODO_FOCUS = 'mine';
      todoMineSet_(!todoMineOn_());
      render(true);
    });
  }
  var title = listsPanel_(root, 'To do', '', mine);
  var body = add(root, 'div', 'wrap');
  listsProblems_(body, lists);
  if (view && (view.total || view.filtered)) todoFilters_(body); // PB-T3: under the title (the problems line stays first)
  var main = add(body, 'div', 'lists-main');
  if (!view) listsWaiting_(main);
  else todoMain_(main, view);
  if (me) todoSettings_(body, lists, me);
  add(body, 'div', 'list-end');
  listsDock_(root);
  // A1-T5: one Add button. The To do "+" is gone; a new to-do starts from the Add slot, and focus goes back there.
  if (!TODO_FOCUS_EL && TODO_FOCUS === 'add' && ADD_SLOT) TODO_FOCUS_EL = ADD_SLOT;
  // An open sheet keeps focus: a repaint behind it never moves focus (iOS would close the keyboard).
  if (TODO_FOCUS_EL && !modalOpen_()) TODO_FOCUS_EL.focus({ preventScroll: true });
  listsNewScroll_(); // A3-T2A M4
  return title;
}

function todoMain_(main, view) {
  var s = view.sections;
  var today = view.today;
  // A3-T2B m10: the item the Anytime card names, picked first so its row (wherever it is) shows no age chip.
  var pick = !s.anytime.length || (todoSnoozedUntil_() && today < todoSnoozedUntil_()) ? null
    : todoNotePick_(s.anytime.filter(function (it) { return !TODO_STRUCK[it.id]; }));
  TODO_NOTE_ID = pick ? pick.id : '';
  // A1-T7: nothing open is the calm "All clear" state, never an error; the line points to the Add slot below.
  // PB-T3: when only the filter hides everything, a calm line and Show all instead.
  if (!view.count && view.filtered && view.total) {
    var none = add(main, 'div', 'todo-none');
    add(none, 'p', 'empty-line', 'Nothing fits this filter.');
    todoKey_(btn(none, 'btn-plain', 'Show all', function () {
      TODO_FOCUS = 'filter:all';
      todoFilterSet_({ p: '', t: 0 });
      render(true);
    }), 'filter:none');
  } else if (!view.count) emptyState_(main, 'All clear', 'Nothing planned. Add one with the button below, or tell the bot.');
  if (s.important.length) {
    var im = todoSection_(main, 'important', 'Important');
    s.important.forEach(function (it) { todoRow_(im, it, today, 'important'); });
  }
  if (s.today.length) {
    var t = todoSection_(main, 'today', 'Today');
    s.today.forEach(function (it) { todoRow_(t, it, today, 'today'); });
  }
  if (s.week.length) {
    var w = todoSection_(main, 'week', 'This week');
    s.week.forEach(function (g) {
      add(w, 'p', 'todo-day', g.label);
      g.items.forEach(function (it) { todoRow_(w, it, today, 'week'); });
    });
  }
  // A3-T2B m2: the dates after this week are "Coming up", open by default when there are 3 or fewer.
  if (s.later.length) {
    var l = add(main, 'div', 'todo-sec todo-sec-later');
    if (todoFold_(l, 'later', 'Coming up', s.later.length <= 3)) {
      var lc = listCard_(l);
      s.later.forEach(function (it) { todoRow_(lc, it, today, 'later'); });
    }
  }
  if (s.anytime.length) {
    var a = todoSection_(main, 'anytime', 'Anytime');
    if (pick) todoNote_(a, pick, today);
    s.anytime.forEach(function (it) { todoRow_(a, it, today, 'anytime'); });
  }
  if (s.parked.length) {
    var p = add(main, 'div', 'todo-sec todo-sec-parked');
    if (todoFold_(p, 'parked', 'Parked')) {
      var pc = listCard_(p);
      s.parked.forEach(function (it) { todoRow_(pc, it, today, 'parked'); });
    }
  }
  // PB-T3: Someday, folded at the bottom; its label carries no count.
  if (s.someday.length) {
    var sd = add(main, 'div', 'todo-sec todo-sec-someday');
    if (todoFold_(sd, 'someday', 'Someday')) {
      var sc = listCard_(sd);
      s.someday.forEach(function (it) { todoRow_(sc, it, today, 'someday'); });
    }
  }
  if (view.done.length) {
    var d = add(main, 'div', 'todo-sec todo-sec-done');
    if (todoFold_(d, 'done', 'Done today')) {
      var dc = listCard_(d);
      view.done.forEach(function (it) { todoRow_(dc, it, today, 'done'); });
    }
  }
}

// A1-T7: the section label on the page, then the section itself as one white card holding its rows.

// A collapsed section's header. True when it is open. dflt (A3-T2B): open until it is folded by hand on this visit.

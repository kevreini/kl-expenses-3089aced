// The segments on top of a quick add sheet. A tap on another one switches in place.
function qaSegments_(p, s) {
  var g = add(p, 'div', 'qa-seg');
  g.setAttribute('role', 'group');
  g.setAttribute('aria-label', 'Add');
  QA_SEGMENTS.forEach(function (seg) {
    var b = sheetCtl_(s, btn(g, 'qa-segbtn', null, function () { qaSwitch_(s, seg[0]); }));
    b.setAttribute('aria-pressed', seg[0] === s.list ? 'true' : 'false');
    b.appendChild(svgIcon_(tabIconPaths_(seg[0] === 'expense' ? 'money' : (seg[0] === 'todo' ? 'todo' : 'groceries'))));
    add(b, 'span', '', seg[1]);
  });
}

// Switching segments saves nothing and carries the words. An expense switched away from keeps its amount and
// choices for the next Add (the words go along).
function qaSwitch_(s, to) {
  if (SHEET !== s || to === s.list) return;
  var words = s.list === 'expense' ? s.draft.item : s.draft.text;
  if (s.list === 'expense') {
    if (s.kept) qaKeptPut_(s.kept, s.draft); // a refused one keeps everything, words too
    else {
      s.draft.item = '';
      QA_DRAFT = s.draft;
    }
    s.done = true;
  }
  sheetShut_('replace');
  if (to === 'expense') {
    openExpenseSheet_(words);
    return;
  }
  if (to === 'todo') TODO_FOCUS = 'add';
  else GRO_FOCUS = 'add';
  openItemSheet_(null, to, { text: sheetOneLine_(words) }, true);
}

// The expense sheet. Save sits in the header row, above the amount, so the phone keyboard never covers it.
function qaBuild_(s) {
  var p = sheetFrame_(s, 'New expense');
  var head = add(p, 'div', 'qa-head');
  add(head, 'h2', 'qa-title', 'New expense');
  sheetCtl_(s, btn(head, 'qa-save btn-main', 'Save', function () { qaSave_(s); }));
  qaSegments_(p, s);

  var line = add(p, 'div', 'qa-amtline');
  s.els.cur = sheetCtl_(s, btn(line, 'qa-cur', s.draft.currency, function () {
    if (SHEET !== s) return;
    var i = QA_CURRENCIES.indexOf(s.draft.currency);
    s.draft.currency = QA_CURRENCIES[(i + 1) % QA_CURRENCIES.length];
    qaSync_(s);
  }));
  var amount = sheetCtl_(s, add(line, 'input', 'qa-amount'));
  amount.setAttribute('type', 'text');
  amount.setAttribute('inputmode', 'decimal');
  amount.setAttribute('autocomplete', 'off');
  amount.setAttribute('maxlength', '20');
  amount.setAttribute('aria-label', 'Amount');
  amount.setAttribute('placeholder', '0');
  amount.value = s.draft.amount;
  amount.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.amount = amount.value;
    s.els.status.textContent = '';
    qaSync_(s);
  });
  s.els.amount = amount;
  s.els.preview = add(p, 'p', 'qa-preview');
  s.els.status = add(p, 'p', 'qa-status');
  s.els.status.setAttribute('role', 'status');

  var what = sheetCtl_(s, add(p, 'input', 'qa-what'));
  what.setAttribute('type', 'text');
  what.setAttribute('autocomplete', 'off');
  what.setAttribute('maxlength', '100');
  what.setAttribute('enterkeyhint', 'done');
  what.setAttribute('aria-label', 'What');
  what.setAttribute('placeholder', 'What was it?');
  what.value = s.draft.item;
  what.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.item = what.value;
    qaSync_(s);
  });
  what.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      qaSave_(s);
    }
  });
  s.els.hint = add(p, 'p', 'qa-hint');

  var row = function (id, label) {
    var r = add(p, 'div', 'qa-row');
    add(r, 'p', 'qa-label', label).setAttribute('id', id);
    return r;
  };
  var typeRow = row('qa-type-label', 'Type');
  s.els.type = sheetCtl_(s, btn(typeRow, 'qa-type', null, function () {
    if (SHEET !== s) return;
    s.grid = !s.grid;
    qaSync_(s);
  }));
  var grid = add(p, 'div', 'qa-grid');
  grid.setAttribute('role', 'group');
  grid.setAttribute('aria-labelledby', 'qa-type-label');
  s.cats.forEach(function (name) {
    var b = sheetCtl_(s, btn(grid, 'qa-cat', null, function () {
      if (SHEET !== s) return;
      s.draft.category = name;
      s.draft.hand = true;
      s.grid = false;
      qaSync_(s);
      s.els.type.focus({ preventScroll: true });
    }), function () { return s.grid; });
    catAvatar_(b, name);
    add(b, 'span', '', name);
    s.sync.push(function () { b.setAttribute('aria-pressed', qaCategory_(s) === name ? 'true' : 'false'); });
  });
  s.sync.push(function () {
    grid.hidden = !s.grid;
    s.els.type.setAttribute('aria-expanded', s.grid ? 'true' : 'false');
  });

  var chips = function (cls, label, options, key) {
    var r = row(cls + '-label', label);
    var g = add(r, 'div', 'sheet-chips ' + cls);
    g.setAttribute('role', 'group');
    g.setAttribute('aria-labelledby', cls + '-label');
    options.forEach(function (o) {
      var value = typeof o === 'string' ? o : o[0];
      var b = sheetCtl_(s, btn(g, 'schip', typeof o === 'string' ? o : o[1], function () {
        if (SHEET !== s) return;
        s.draft[key] = value;
        if (key === 'when' && value === 'pick' && !todoValidDay_(s.draft.day)) s.draft.day = s.today;
        qaSync_(s);
      }));
      s.sync.push(function () { b.setAttribute('aria-pressed', s.draft[key] === value ? 'true' : 'false'); });
    });
  };
  chips('qa-by', 'Paid by', QA_WHO, 'paidBy');
  chips('qa-for', 'For', QA_WHO, 'paidFor');
  chips('qa-when', 'When', QA_WHEN, 'when');
  var day = sheetCtl_(s, add(p, 'input', 'qa-day'), function () { return s.draft.when === 'pick'; });
  day.setAttribute('type', 'date');
  day.setAttribute('aria-label', 'Pick a day');
  day.setAttribute('min', '2020-01-01');
  if (s.today) day.setAttribute('max', s.today);
  var takeDay = function (resync) {
    if (SHEET !== s) return;
    var v = day.value;
    if (todoValidDay_(v) && v >= '2020-01-01' && (!s.today || v <= s.today)) s.draft.day = v;
    if (resync) qaSync_(s);
  };
  day.addEventListener('input', function () { takeDay(false); });
  day.addEventListener('change', function () { takeDay(true); });
  s.sync.push(function () {
    day.hidden = s.draft.when !== 'pick';
    if (s.draft.when === 'pick') day.value = s.draft.day;
  });
  $('sheet').hidden = false;
  qaSync_(s);
}

// Brings the sheet in line with its draft: the currency, the preview, the type chip, the hint, the chips.
function qaSync_(s) {
  if (!s || !s.els.amount) return;
  var e = s.els;
  e.cur.textContent = s.draft.currency;
  e.cur.setAttribute('aria-label', 'Currency: ' + s.draft.currency + '. Change');
  var d = qaData_();
  e.preview.textContent = qaPreview_(qaAmount_(s.draft.amount, s.draft.currency), s.draft.currency, d ? d.fx : null);
  var cat = qaCategory_(s);
  e.type.textContent = '';
  catAvatar_(e.type, cat);
  add(e.type, 'span', '', cat);
  add(e.type, 'span', 'chev').setAttribute('aria-hidden', 'true');
  e.type.setAttribute('aria-label', 'Type: ' + cat + '. Change');
  var guessed = !(s.draft.hand && s.cats.indexOf(s.draft.category) >= 0) && !!qaFold_(s.draft.item).trim();
  e.hint.textContent = guessed ? 'Type guessed from the words.' : '';
  sheetSync_(s);
}

// Save: an amount is needed (the sheet says so and stays). Otherwise the expense joins the queue, the sheet closes
// and the toast offers Undo. A second tap finds the sheet closed and does nothing.
function qaSave_(s) {
  if (SHEET !== s || s.done) return;
  var amount = qaAmount_(s.draft.amount, s.draft.currency);
  if (amount === null) {
    s.els.status.textContent = 'Needs an amount';
    s.els.amount.focus({ preventScroll: true });
    return;
  }
  var cat = qaCategory_(s);
  var item = sheetOneLine_(s.draft.item).replace(/[\u0000-\u001f\u007f]/g, '').slice(0, 100).trim() || cat;
  var op = expenseOp_({
    amount: amount, currency: s.draft.currency, item: item, category: cat,
    paidBy: s.draft.paidBy, paidFor: s.draft.paidFor, date: qaDate_(s)
  }, s.draft);
  s.done = true;
  if (s.kept) qaKeptDrop_(s.kept);
  else QA_DRAFT = null;
  sheetShut_('close');
  qaToastSet_({ text: 'Added ' + qaPreview_(amount, op.fields.currency, null) + ' · ' + cat + qaWhoText_(op.fields) + '.', action: 'undo', uid: op.uid });
  expenseEnqueue_(op);
  moneyRepaint_();
  qaFocusAdd_(); // after the repaint, which draws a new Add slot
}

// A1 final fix 5: who paid and who it was for, named in the Added line when not Couple: ", paid by Kev for Lili".
function qaWhoText_(f) {
  var parts = [];
  if (f.paidBy && f.paidBy !== 'Couple') parts.push('paid by ' + f.paidBy);
  if (f.paidFor && f.paidFor !== 'Couple') parts.push('for ' + f.paidFor);
  return parts.length ? ', ' + parts.join(' ') : '';
}

// The queue op: the fields addExpense takes, its 'x:' id, from (only ever Kev or Lili, else left out), and the
// draft as typed (never sent), so a refused add can be put back in the sheet.
// fix round 1: a draft the server gave back carries its first id (draft.id), and saving it again uses that id.
function expenseOp_(fields, draft) {
  var again = typeof draft.id === 'string' && /^x:[0-9a-f-]{36}$/.test(draft.id);
  var op = { op: 'expense', at: Date.now(), id: again ? draft.id : 'x' + newId_().slice(1), fields: fields, draft: JSON.parse(JSON.stringify(draft)) };
  if (again) op.again = true;
  op.uid = 'u' + newId_().slice(1);
  var me = whoAmI_();
  if (me === 'Kev' || me === 'Lili') op.from = me;
  return op;
}

function expenseEnqueue_(op) {
  listsQueueChange_(function (arr) { arr.push(op); });
  setTimeout(listsNoteUpdate_, 10000);
  listsFlush_();
}

// Sends the queue head when it is an expense: alone, through addExpense, never inside a listOp. tried marks an op
// that went out at least once, so Undo knows the row may exist.
function expenseSend_(op) {
  if (HEAD_FAIL_UID !== op.uid) { HEAD_FAIL_UID = op.uid; HEAD_FAIL_N = 0; }
  if (!op.tried) {
    listsQueueChange_(function (arr) { arr.forEach(function (q) { if (q.uid === op.uid) q.tried = true; }); });
  }
  var sent = JSON.parse(JSON.stringify(op));
  var body = { id: sent.id, fields: sent.fields };
  if (sent.from === 'Kev' || sent.from === 'Lili') body.from = sent.from;
  INFLIGHT = op.uid;
  var session = SESSION;
  listsCall_('addExpense', body).then(function (res) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    expenseReply_(sent, res);
  }, function (err) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    var code = err ? err.code : '';
    if (code === 'NO_SESSION') { lockOut(); return; }
    if (code === 'BAD_REQUEST') { expenseRefused_(sent, 'invalid'); return; }
    if (code === 'SERVER' && HEAD_FAIL_UID === sent.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { expenseRefused_(sent, 'invalid'); return; }
    expenseRetry_(); // TIMEOUT, UNREACHED, SERVER, NOT_CONFIGURED: the id makes another send safe
  });
}

function expenseRetry_() {
  listsRetryLater_();
  moneyRepaint_();
}

// {rowNumber, fingerprint} from a reply, or null.
function qaRow_(r) {
  if (!r || typeof r !== 'object' || typeof r.rowNumber !== 'number' || !(r.rowNumber >= 2) || typeof r.fingerprint !== 'string' || !r.fingerprint) return null;
  return { rowNumber: r.rowNumber, fingerprint: r.fingerprint };
}

// The op asked for Undo (the toast's Undo came while it was out, or before a reload).
function expenseUndoWanted_(op) {
  var cur = listsByUid_(op.uid);
  return !!((cur && cur.undo) || op.undo);
}

function expenseReply_(op, res) {
  if (!res || typeof res !== 'object') { expenseRetry_(); return; }
  if (res.ok === true) {
    // Saved now, or saved before (existed: a replay): the same success, and the toast already on show stays.
    var undo = expenseUndoWanted_(op);
    var row = qaRow_(res.row);
    expenseDone_(op);
    if (op.settle && op.fields) SETTLE_ANIM = { from: op.fields.amount, at: Date.now(), running: false };
    if (res.data && typeof res.data === 'object' && Array.isArray(res.data.months)) moneySet_(res.data);
    else if (DATA) {
      MONEY_LIVE = false; // A1 final fix 2: the figures on show lack this row until the refresh answers
      loadData(true);
    }
    if (undo) qaDeleteRow_(row);
    else if (QA_TOAST && QA_TOAST.uid === op.uid) {
      QA_TOAST.row = row;
      QA_TOAST.answered = true;
      // A returned draft saved again whose first try had landed after all: the row from then stands.
      if (res.existed && op.again) qaToastSet_({ text: 'It was saved already. Check it in the month.', action: 'undo', uid: op.uid, row: row, answered: true });
    }
    moneyRepaint_();
    return;
  }
  if (res.invalid || res.capped) { expenseRefused_(op, res.capped ? 'capped' : 'invalid'); return; }
  // retry (the sheet was busy), historyFailed, failed: nothing was added. A server that never takes it lets it go.
  if (HEAD_FAIL_UID === op.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { expenseRefused_(op, 'invalid'); return; }
  expenseRetry_();
}

// The op is answered: off the queue (its own uid only), the next one sent.
function expenseDone_(op) {
  listsQueueRemove_(op.uid);
  RETRY_N = 0;
  HEAD_FAIL_UID = '';
  HEAD_FAIL_N = 0;
  listsNoteUpdate_();
  listsFlush_();
}

// The server will not take it: nothing was saved. What was typed goes back into Add, and one calm line says so.
function expenseRefused_(op, why) {
  if (op.settle) { // A1-T6: nothing was saved, the balance is as it was; nothing goes back into Add
    expenseDone_(op);
    moneyRepaint_();
    qaToastSet_({ text: 'Not settled. The balance is as it was.' });
    if (DATA && TOKEN) loadData(true); // A1 final fix 2: the server may know a newer balance (balanceChanged)
    return;
  }
  var undo = expenseUndoWanted_(op);
  expenseDone_(op);
  moneyRepaint_();
  if (undo) { qaToastSet_({ text: 'Removed.' }); return; }
  var d = op.draft && typeof op.draft === 'object' ? JSON.parse(JSON.stringify(op.draft)) : null;
  if (!d) {
    var f = op.fields || {};
    d = qaFresh_();
    d.amount = String(f.amount || '');
    d.currency = QA_CURRENCIES.indexOf(f.currency) >= 0 ? f.currency : 'IDR';
    d.item = String(f.item || '');
  }
  d.id = op.id; // saved again with this id, so a row that landed after all is never added twice
  qaPin_(d, op.fields && op.fields.date); // A1 final fix 4: never re-dated to a later day
  qaKeptAdd_(op.uid, d, why === 'capped' ? 'capped' : 'invalid');
  qaToastSet_({ text: QA_KEPT_TEXT[why === 'capped' ? 'capped' : 'invalid'], action: 'open' });
}

// Undo from the toast. Never sent: the op is simply dropped. Sent at least once (or on its way): the row may exist,
// so the op is marked, and its reply is followed by the delete. Answered: the delete of the row the reply named.
function qaUndo_() {
  var t = QA_TOAST;
  if (!t || !t.uid) return;
  var q = listsByUid_(t.uid);
  if (q && !q.tried && INFLIGHT !== q.uid) {
    listsQueueRemove_(q.uid);
    listsNoteUpdate_();
    qaToastSet_({ text: 'Removed.' });
    moneyRepaint_();
    return;
  }
  if (q) {
    listsQueueChange_(function (arr) { arr.forEach(function (o) { if (o.uid === q.uid) o.undo = true; }); });
    qaToastSet_({ text: 'Undoing...' });
    return;
  }
  qaDeleteRow_(t.answered ? t.row : null);
}

// The delete of an added row (deleteExpense with the reply's row and fingerprint). No row, or a delete that does
// not go through: one calm line; the expense stays and can be deleted from its month.
function qaDeleteRow_(row) {
  if (!row || !TOKEN) { qaToastSet_({ text: QA_UNDO_FAIL }); return; }
  qaToastSet_({ text: 'Undoing...' });
  var session = SESSION;
  call_('deleteExpense', { token: TOKEN, rowNumber: row.rowNumber, fingerprint: row.fingerprint }).then(function (res) {
    if (session !== SESSION) return;
    if (res && res.ok) {
      if (res.data && typeof res.data === 'object' && Array.isArray(res.data.months)) moneySet_(res.data);
      else if (DATA) loadData(true);
      qaToastSet_({ text: 'Removed.' });
      moneyRepaint_();
      return;
    }
    qaToastSet_({ text: QA_UNDO_FAIL });
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    qaToastSet_({ text: QA_UNDO_FAIL });
    if (unreached(err) && DATA) loadData(true); // it may have gone through: the numbers say
  });
}

// The toast: one line above the bar on every tab, for 6 s. null takes it away.
function qaToastSet_(t) {
  if (QA_TOAST_TIMER !== null) clearTimeout(QA_TOAST_TIMER);
  QA_TOAST_TIMER = null;
  QA_TOAST = t;
  if (t) {
    QA_TOAST_TIMER = setTimeout(function () {
      QA_TOAST_TIMER = null;
      if (QA_TOAST === t) { QA_TOAST = null; qaToastPaint_(); }
    }, 6000);
  }
  qaToastPaint_();
}

function qaToastPaint_() {
  var root = $('qa-toast');
  root.textContent = '';
  var t = QA_TOAST;
  root.hidden = !t;
  if (!t) return;
  add(root, 'span', '', t.text);
  if (t.action === 'undo') btn(root, '', 'Undo', qaUndo_);
  else if (t.action === 'open') {
    btn(root, '', 'Open', function () {
      qaToastSet_(null);
      openExpenseSheet_();
    });
  }
}

// Money on show is drawn again (a new expense in its numbers, or the waiting line).
function moneyRepaint_() {
  if (APP_ON && DATA && tabOf_(VIEW.screen) === 'money') render(true);
}

// ---- Groceries screen (Task 8) -----------------------------------------------------------------
// A plain list: no shop names unless a shop is picked. The pinned "Add an item" field is built once per visit
// and kept through every repaint (only the parts above and below it are rebuilt), so a reply or the 60 s
// refresh never takes the phone keyboard away while someone types the next item.

// The compare key for item and shop names: lowercase, accents removed, the typographic apostrophe as a
// plain one, ends trimmed, inner spaces collapsed ("Pépito " is "pepito").
function foldKey_(s) {
  var t = String(s === undefined || s === null ? '' : s);
  if (typeof t.normalize === 'function') t = t.normalize('NFD');
  return t.replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, '\u0027').toLowerCase().replace(/\s+/g, ' ').trim();
}

// The shops known to this phone, one per folded name: the server's list (newest spelling first), then any
// shop on an open item that it does not have yet.
function groKnownShops_(lists) {
  var out = [];
  var seen = {};
  var take = function (v) {
    if (typeof v !== 'string') return;
    var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
    var k = foldKey_(t);
    if (!k || seen[k]) return;
    seen[k] = true;
    out.push(t);
  };
  (lists && Array.isArray(lists.shops) ? lists.shops : []).forEach(take);
  (lists && Array.isArray(lists.groceries) ? lists.groceries : []).forEach(function (it) { if (it) take(it.shop); });
  return out;
}

// How many open items each shop has, in the order of shops.
function groShopCounts_(items, shops) {
  return shops.map(function (shop) {
    var k = foldKey_(shop);
    return { shop: shop, n: items.filter(function (it) { return !!k && foldKey_(it.shop) === k; }).length };
  });
}

// The filtered view: that shop's items, then items with no shop, then the rest. Order is kept in each part.
function groSplit_(items, shop) {
  var k = foldKey_(shop);
  var out = { here: [], any: [], elsewhere: [] };
  items.forEach(function (it) {
    var s = foldKey_(it.shop);
    if (!s) out.any.push(it);
    else if (s === k) out.here.push(it);
    else out.elsewhere.push(it);
  });
  return out;
}

// The shop in a stored kl.shop value ({shop, at}), or '' when there is none, it is malformed, or it was set
// more than 3 hours before now (a time well ahead of the clock is not trusted either).
function groShopFrom_(raw, now) {
  if (!raw || typeof raw !== 'string') return '';
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { return ''; }
  if (!o || typeof o.shop !== 'string' || typeof o.at !== 'number') return '';
  var shop = sheetOneLine_(o.shop);
  if (!shop || shop.length > 40) return '';
  var age = now - o.at;
  return (age >= -60000 && age <= 3 * 3600 * 1000) ? shop : '';
}

// A shop as typed: one line, inner spaces collapsed, 40 characters at most; a known shop that matches it
// without case or accents gives its own spelling.
function groShopCanon_(v, shops) {
  var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
  var k = foldKey_(t);
  if (!k) return '';
  for (var i = 0; i < shops.length; i++) if (foldKey_(shops[i]) === k) return String(shops[i]).slice(0, 40);
  return t;
}

var LS_SHOP = 'kl.shop';  // the shop filter, as {shop, at}; ignored 3 hours after it was set
var GRO_SHOP_RAW = null;  // memory copy of kl.shop, so the filter holds for this visit even without storage
var GRO = null;           // the screen's kept parts on show now: {head, box, field, note, rest}
var GRO_DRAFT = '';       // what is typed in the add field, kept in memory across visits (never stored)
var GRO_NOTE = '';        // the line under the add field ("Already on the list")
var GRO_STRUCK = {};      // id -> {item}: ticked here, struck in place until the screen is left
var GRO_POS = {};         // id -> place on this visit, so an item ticked and unticked comes back in its place
var GRO_SEQ = 0;
var GRO_MENU = false;     // the Shop menu is open
var GRO_ELSEWHERE = false; // the "N more elsewhere" items are shown
var GRO_DONE_OPEN = false; // the collapsed Bought today section is open
var GRO_FOCUS = '';       // the keyed control that had focus, given back after a repaint
var GRO_FOCUS_EL = null;
var GRO_TIMER = null;     // the 60 s refresh while Groceries is on show and the page is visible

// Leaving Groceries: struck items go to Bought today, the menu and folds close, the refresh stops.
function groLeave_() {
  GRO_STRUCK = {};
  GRO_POS = {};
  GRO_SEQ = 0;
  GRO_MENU = false;
  GRO_ELSEWHERE = false;
  GRO_DONE_OPEN = false;
  GRO_FOCUS = '';
  GRO_NOTE = '';
  groTimerStop_();
}

// clearScreens: a repaint of Groceries keeps the add field (and its focus and text); anything else empties it.
function groClear_() {
  if (GRO && VIEW.screen === 'groceries' && TOKEN) {
    GRO.head.textContent = '';
    GRO.rest.textContent = '';
    if (GRO.toasts) GRO.toasts.textContent = ''; // A1-T7: the dock keeps the field; its two slots are refilled
    if (GRO.recent) GRO.recent.textContent = '';
    return;
  }
  $('groceries').textContent = '';
  GRO = null;
}

function groKey_(e, key) {
  e.setAttribute('data-focus', key);
  if (key === GRO_FOCUS) GRO_FOCUS_EL = e;
  return e;
}

function groShop_() {
  if (GRO_SHOP_RAW === null) GRO_SHOP_RAW = lsGet_(LS_SHOP) || '';
  var shop = groShopFrom_(GRO_SHOP_RAW, Date.now());
  if (!shop && GRO_SHOP_RAW) {
    GRO_SHOP_RAW = '';
    GRO_ELSEWHERE = false;
    lsDel_(LS_SHOP);
  }
  return shop;
}

function groSetShop_(shop) {
  GRO_ELSEWHERE = false;
  if (shop) {
    GRO_SHOP_RAW = JSON.stringify({ shop: shop, at: Date.now() });
    lsSet_(LS_SHOP, GRO_SHOP_RAW);
  } else {
    GRO_SHOP_RAW = '';
    lsDel_(LS_SHOP);
  }
}

function groSay_(t) {
  GRO_NOTE = t;
  if (GRO && GRO.note) GRO.note.textContent = t;
}

// One add, unless that text (without case or accents) is already on the list.
function groAdd_(raw) {
  var text = sheetOneLine_(raw).slice(0, 500).trim();
  if (!text) return false;
  var key = foldKey_(text);
  var open = (LISTS && Array.isArray(LISTS.groceries)) ? LISTS.groceries : [];
  if (open.some(function (it) { return foldKey_(it.text) === key; })) {
    groSay_('Already on the list');
    return false;
  }
  groSay_('');
  listsQueue_({ op: 'add', list: 'grocery', fields: { text: text } });
  return true;
}

function groTick_(it) {
  GRO_STRUCK[it.id] = { item: todoCopy_(it) };
  listsQueue_({ op: 'tick', list: 'grocery', id: it.id });
}

function groUntick_(it) {
  delete GRO_STRUCK[it.id];
  listsQueue_({ op: 'restore', list: 'grocery', id: it.id, item: todoCopy_(it) });
}

// The open items with the struck ones back in their places, in the order first seen on this visit.
function groItems_(lists) {
  var open = Array.isArray(lists.groceries) ? lists.groceries : [];
  var ids = {};
  open.forEach(function (it) { ids[it.id] = true; });
  var all = open.slice();
  Object.keys(GRO_STRUCK).forEach(function (id) {
    if (ids[id]) delete GRO_STRUCK[id]; // open again (a conflict, or brought back elsewhere)
    else all.push(GRO_STRUCK[id].item);
  });
  all.forEach(function (it) {
    if (!Object.prototype.hasOwnProperty.call(GRO_POS, it.id)) GRO_POS[it.id] = GRO_SEQ++;
  });
  return all.map(function (it, i) { return { it: it, i: i }; }).sort(function (a, b) {
    return (GRO_POS[a.it.id] - GRO_POS[b.it.id]) || (a.i - b.i);
  }).map(function (x) { return x.it; });
}

// ---- the 60 s refresh: only while Groceries is on show and the page is visible, always through the shell
function groVisible_() {
  return document.visibilityState !== 'hidden';
}

function groOnShow_() {
  return VIEW.screen === 'groceries' && !!TOKEN && APP_ON;
}

function groTimerEnsure_() {
  if (GRO_TIMER === null && groOnShow_() && groVisible_()) GRO_TIMER = setTimeout(groRefresh_, 60000);
}

function groTimerStop_() {
  if (GRO_TIMER !== null) clearTimeout(GRO_TIMER);
  GRO_TIMER = null;
}

function groRefresh_() {
  GRO_TIMER = null;
  if (!groOnShow_() || !groVisible_()) return;
  listsLoad_(true);
  groTimerEnsure_();
}

// Hidden: no refresh. On show again: refreshed at once (unless this page loaded under 15 s ago), then every 60 s.
function groVisibility_() {
  if (!groVisible_()) { groTimerStop_(); return; }
  if (!groOnShow_()) return;
  listsLoad_(false);
  groTimerEnsure_();
}

// ---- drawing
// A1-T7: the dock above the tab bar, near the thumb: the lists' lines (Undo, Not saved yet), the Bought recently
// chips, then the add field and its line. It is built once per visit like the field, so a repaint never takes the
// focus or the keyboard away; only the toasts and chips slots are refilled. With the keyboard up it rides on top
// of the keyboard (groDockPlace_).
function groAddBox_(root) {
  var box = add(root, 'div', 'gro-dock');
  var toasts = add(box, 'div', 'gro-dock-slot');
  var recent = add(box, 'div', 'gro-dock-slot');
  // A label: a tap anywhere on the pill (the plus too) puts the cursor in the field.
  var w = add(box, 'label', 'gro-add');
  var plus = add(w, 'span', 'gro-add-plus');
  plus.setAttribute('aria-hidden', 'true');
  plus.appendChild(svgIcon_(['M12 6v12', 'M6 12h12']));
  var f = add(w, 'input', '');
  f.setAttribute('type', 'text');
  f.setAttribute('aria-label', 'Add an item');
  f.setAttribute('placeholder', 'Add an item');
  f.setAttribute('maxlength', '500');
  f.setAttribute('enterkeyhint', 'enter');
  f.setAttribute('autocomplete', 'off');
  f.setAttribute('data-focus', 'field');
  f.value = GRO_DRAFT;
  var note = add(box, 'p', 'gro-note', GRO_NOTE);
  note.setAttribute('role', 'status');
  f.addEventListener('input', function () {
    GRO_DRAFT = f.value;
    if (GRO_NOTE) groSay_('');
  });
  // Enter adds and keeps the field focused for the next item; lists come in bursts.
  f.addEventListener('keydown', function (e) {
    if (!e || e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (!sheetOneLine_(f.value)) return;
    var v = f.value;
    f.value = '';
    GRO_DRAFT = '';
    groAdd_(v);
  });
  return { box: box, field: f, note: note, toasts: toasts, recent: recent };
}

// A1-T7: how much of the layout viewport the phone keyboard covers now, from the visual viewport (0: no keyboard).
// Under 120 px is the browser's own bar moving, never a keyboard. Older browsers without it: always 0.
var GRO_KB = 0;
function groDockPlace_() {
  var vv = window.visualViewport;
  var ih = Number(window.innerHeight) || 0;
  var cover = vv && ih > 0 ? Math.round(ih - (Number(vv.height) || 0) - (Number(vv.offsetTop) || 0)) : 0;
  GRO_KB = cover > 120 ? cover : 0;
  if (!GRO || !GRO.box) return;
  GRO.box.style.bottom = GRO_KB ? GRO_KB + 'px' : ''; // right on the keyboard; '' is the CSS place above the bar
  GRO.box.className = 'gro-dock' + (GRO_KB ? ' is-kb' : '');
  // The dock's height, so the end of the list and the quick add toast clear it.
  var h = Number(GRO.box.offsetHeight) || 0;
  var rootStyle = document.documentElement && document.documentElement.style;
  if (h > 0 && rootStyle && typeof rootStyle.setProperty === 'function') rootStyle.setProperty('--gro-dock-h', h + 'px');
}

function renderGroceries_(data, shopFilter) {
  var root = $('groceries');
  var lists = data === undefined ? LISTS : data;
  if (shopFilter === undefined) shopFilter = groShop_();
  GRO_FOCUS_EL = null;
  if (GRO && lists && !GRO.field) { root.textContent = ''; GRO = null; } // the lists arrived: build the field
  if (!GRO) {
    root.textContent = '';
    GRO = { head: add(root, 'div', ''), box: null, field: null, note: null, rest: null, toasts: null, recent: null };
    GRO.rest = add(root, 'div', '');
    if (lists) { // A1-T7: the dock comes after the list, where it shows (at the bottom)
      var a = groAddBox_(root);
      GRO.box = a.box;
      GRO.field = a.field;
      GRO.note = a.note;
      GRO.toasts = a.toasts;
      GRO.recent = a.recent;
    }
  }
  var title = listsPanel_(GRO.head, 'Groceries');
  var top = add(GRO.head, 'div', 'wrap');
  listsProblems_(top, lists);
  var body = add(GRO.rest, 'div', 'wrap');
  var main = add(body, 'div', 'lists-main gro-main');
  if (!lists) listsWaiting_(main);
  else groMain_(main, lists, shopFilter, GRO.recent);
  add(body, 'div', GRO.box ? 'list-end gro-end' : 'list-end');
  listsDock_(GRO.toasts || GRO.rest);
  groDockPlace_();
  if (!GRO_FOCUS_EL && GRO_FOCUS === 'add' && ADD_SLOT) GRO_FOCUS_EL = ADD_SLOT; // A1-T5: back to the Add slot
  // The add field is never rebuilt, so it is never focused from here (that would raise the keyboard).
  if (GRO_FOCUS_EL && !modalOpen_()) GRO_FOCUS_EL.focus({ preventScroll: true });
  groTimerEnsure_();
  return title;
}

function groMain_(main, lists, shop, recentSlot) {
  var open = Array.isArray(lists.groceries) ? lists.groceries : [];
  var known = groKnownShops_(lists);
  if (shop) shop = groShopCanon_(shop, known);
  // Open items plus the ones struck in place on this visit: what decides the layout, so a tick moves nothing.
  var all = groItems_(lists);
  // Bought recently: one tap adds; what is on the list, or was ticked on this visit (M2), gets no chip.
  var onList = {};
  all.forEach(function (it) { onList[foldKey_(it.text)] = true; });
  var recent = [];
  (Array.isArray(lists.boughtRecently) ? lists.boughtRecently : []).forEach(function (t) {
    var v = typeof t === 'string' ? sheetOneLine_(t) : '';
    if (v && !onList[foldKey_(v)]) {
      onList[foldKey_(v)] = true;
      recent.push(v);
    }
  });
  if (recent.length) {
    var r = add(recentSlot || main, 'div', 'gro-recent'); // A1-T7: in the dock, above the add field
    add(r, 'p', 'gro-label', 'Bought recently').setAttribute('id', 'gro-recent-label');
    var row = add(r, 'div', 'gro-chips');
    row.setAttribute('role', 'group');
    row.setAttribute('aria-labelledby', 'gro-recent-label');
    recent.forEach(function (t, i) {
      groKey_(btn(row, 'gchip', t, function () {
        var next = recent[i + 1] || recent[i - 1];
        GRO_FOCUS = next ? 'recent:' + foldKey_(next) : '';
        groAdd_(t);
      }), 'recent:' + foldKey_(t));
    });
  }
  // The Shop filter, only once some item on screen has a shop (or a filter is on). I1: struck items count, so
  // ticking the last item with a shop does not remove the button and move every row under the finger.
  if (shop || all.some(function (it) { return !!foldKey_(it.shop); })) {
    var tools = add(main, 'div', 'gro-tools');
    var sb = groKey_(btn(tools, 'gro-shop', 'Shop: ' + (shop || 'all'), function () {
      GRO_FOCUS = 'shop';
      GRO_MENU = !GRO_MENU;
      render(true);
    }), 'shop');
    sb.setAttribute('aria-expanded', GRO_MENU ? 'true' : 'false');
    if (GRO_MENU) groMenu_(main, open, known, shop);
  }
  if (!all.length) emptyState_(main, 'All clear', 'Nothing on the list.'); // A1-T7: the calm empty state
  // A1-T7: each run of rows is one white card: the list, or the shop's items, Any shop, the rest elsewhere.
  var cardRows = function (items) {
    if (!items.length) return;
    var c = listCard_(main);
    items.forEach(function (it) { groRow_(c, it, !!GRO_STRUCK[it.id]); });
  };
  if (!shop) {
    cardRows(all);
  } else {
    var sp = groSplit_(all, shop);
    cardRows(sp.here);
    if (sp.any.length) {
      add(main, 'h2', 'gro-head', 'Any shop');
      cardRows(sp.any);
    }
    if (sp.elsewhere.length) {
      // M1: the count is of open items, as in the menu; struck ones stay shown, and the line stays without a 0.
      var n = sp.elsewhere.filter(function (it) { return !GRO_STRUCK[it.id]; }).length;
      var more = groKey_(btn(main, 'gro-more', n ? n + ' more elsewhere' : 'More elsewhere', function () {
        GRO_FOCUS = 'elsewhere';
        GRO_ELSEWHERE = !GRO_ELSEWHERE;
        render(true);
      }), 'elsewhere');
      more.setAttribute('aria-expanded', GRO_ELSEWHERE ? 'true' : 'false');
      if (GRO_ELSEWHERE) cardRows(sp.elsewhere);
    }
  }
  var done = (Array.isArray(lists.doneToday) ? lists.doneToday : []).filter(function (it) {
    return it && it.list === 'grocery' && !GRO_STRUCK[it.id];
  });
  if (done.length) {
    var d = add(main, 'div', 'gro-done');
    var h = add(d, 'h2', 'todo-fold-h');
    var fold = groKey_(btn(h, 'todo-fold', 'Bought today', function () {
      GRO_FOCUS = 'fold:done';
      GRO_DONE_OPEN = !GRO_DONE_OPEN;
      render(true);
    }), 'fold:done');
    fold.setAttribute('aria-expanded', GRO_DONE_OPEN ? 'true' : 'false');
    if (GRO_DONE_OPEN) {
      var dc = listCard_(d);
      done.forEach(function (it) { groRow_(dc, it, true); });
    }
  }
}

// The Shop menu: All, then each shop with open items and how many (R60), plus the current filter.
function groMenu_(main, open, known, shop) {
  var menu = add(main, 'div', 'gro-menu');
  menu.setAttribute('role', 'group');
  menu.setAttribute('aria-label', 'Shop');
  var cur = foldKey_(shop);
  if (cur && !known.some(function (k) { return foldKey_(k) === cur; })) known = known.concat([shop]);
  var pick = function (name) {
    GRO_MENU = false;
    GRO_FOCUS = 'shop';
    groSetShop_(name);
    render(true);
  };
  var all = groKey_(btn(menu, 'schip', 'All', function () { pick(''); }), 'shopopt:');
  all.setAttribute('aria-pressed', cur ? 'false' : 'true');
  groShopCounts_(open, known).forEach(function (c) {
    var k = foldKey_(c.shop);
    if (!c.n && k !== cur) return; // R60: only shops with open items, plus the current filter
    var b = groKey_(btn(menu, 'schip', c.n ? c.shop + ' · ' + c.n : c.shop, function () { pick(c.shop); }), 'shopopt:' + k);
    b.setAttribute('aria-pressed', k === cur ? 'true' : 'false');
  });
}

// One row: the tick zone, then the text (2 lines at most). No shop name.
function groRow_(parent, it, done) {
  var row = add(parent, 'div', 'gro-row' + (done ? ' is-done' : ''));
  listsSwipe_(row, function () {
    GRO_FOCUS = 'tick:' + it.id;
    if (done) groUntick_(it);
    else groTick_(it);
  }, done ? null : function () { listsDelete_('grocery', it); });
  var tick = groKey_(btn(row, 'tick-zone', null, function () {
    GRO_FOCUS = 'tick:' + it.id;
    if (done) groUntick_(it);
    else groTick_(it);
  }), 'tick:' + it.id);
  tick.setAttribute('aria-label', 'Bought: ' + it.text);
  tick.setAttribute('aria-pressed', done ? 'true' : 'false');
  tick.appendChild(svgIcon_(done ? TICK_DONE_PATHS : TICK_OPEN_PATHS));
  var main = done ? add(row, 'div', 'gro-open') : groKey_(btn(row, 'gro-open', null, function () {
    GRO_FOCUS = 'open:' + it.id;
    openItemSheet_(it, 'grocery');
  }), 'open:' + it.id);
  add(main, 'span', 'gro-text', it.text);
}

// The edit sheet's Shop field (called by sheetBuild_): a text field, then No shop and a chip for each of the
// 12 newest shops the server knows.
// Matching ignores case and accents; a typed known shop is saved with its known spelling; the same shop
// typed differently is no change.
function sheetShop_(slot, s) {
  if (!s.sync) s.sync = [];
  var shops = groKnownShops_({ shops: LISTS && LISTS.shops }).slice(0, 12); // R60: the 12 newest from the server list
  add(slot, 'p', 'sheet-label', 'Shop').setAttribute('id', 'sheet-shop-label');
  var input = sheetCtl_(s, add(slot, 'input', 'sheet-shop-input'));
  input.setAttribute('type', 'text');
  input.setAttribute('aria-labelledby', 'sheet-shop-label');
  input.setAttribute('maxlength', '40');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('enterkeyhint', 'done');
  input.value = s.draft.shop;
  input.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.shop = input.value;
    sheetSync_(s);
  });
  input.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      closeItemSheet_('close');
    }
  });
  var g = add(slot, 'div', 'sheet-chips');
  g.setAttribute('role', 'group');
  g.setAttribute('aria-labelledby', 'sheet-shop-label');
  var chip = function (label, value) {
    var b = sheetCtl_(s, btn(g, 'schip', label, function () {
      if (SHEET !== s) return;
      s.draft.shop = value;
      input.value = value;
      sheetSync_(s);
    }));
    s.sync.push(function () {
      var k = foldKey_(s.draft.shop);
      b.setAttribute('aria-pressed', (value ? k === foldKey_(value) : !k) ? 'true' : 'false');
    });
  };
  chip('No shop', '');
  shops.forEach(function (n) { chip(n, n); });
  s.finish = function () {
    var was = s.orig ? sheetOneLine_(s.orig.shop) : '';
    if (sheetOneLine_(s.draft.shop) === was) return;
    var c = groShopCanon_(s.draft.shop, groKnownShops_(LISTS));
    s.draft.shop = (was && foldKey_(c) === foldKey_(was)) ? was : c;
  };
}

// ---- start ---------------------------------------------------------------------
$('go').addEventListener('click', submit);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
$('retry').addEventListener('click', function () {
  if (isListScreen_(VIEW.screen)) listsEnter_();
  else loadData(false);
});
window.addEventListener('hashchange', function () {
  if (!TOKEN) return;
  var v = viewFromHash(location.hash);
  if (v.screen === VIEW.screen && v.key === (VIEW.key || null)) return;
  if (v.screen === 'month' && DATA && !monthByKey(v.key)) v = { screen: 'home', key: null };
  go(v, true);
});
// Back online: send what waits now, instead of at the end of the backoff.
window.addEventListener('online', function () {
  if (RETRY_TIMER !== null) {
    clearTimeout(RETRY_TIMER);
    RETRY_TIMER = null;
  }
  listsFlush_();
});

// Another tab wrote kl.queue (R48).
window.addEventListener('storage', listsStorageChanged_);

// Task 7: the To do focus key follows focus; the sheet keeps Tab inside, closes on Escape and on back.
$('todo').addEventListener('focusin', function (e) {
  var t = e && e.target;
  TODO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
// Task 8: the same for Groceries; the 60 s refresh stops while the page is hidden.
$('groceries').addEventListener('focusin', function (e) {
  var t = e && e.target;
  GRO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', groVisibility_);
// A1-T7: the Groceries dock follows the phone keyboard (the visual viewport shrinks or scrolls while it is up).
if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
  window.visualViewport.addEventListener('resize', groDockPlace_);
  window.visualViewport.addEventListener('scroll', groDockPlace_);
}
$('sheet').addEventListener('keydown', sheetKey_);
$('who').addEventListener('keydown', whoKey_);
$('sheet').addEventListener('focusin', function (e) { if (SHEET && e && e.target) SHEET.focusEl = e.target; });
window.addEventListener('popstate', sheetPopState_);
// R58: the page goes away (tab closed, put in the background cache) with the sheet open: save it.
window.addEventListener('pagehide', function () { if (SHEET) closeItemSheet_('hide'); });

listsQueueInit_();
TOKEN = stored();
if (TOKEN) openSession_();
else showCover('gate', '');
</script>

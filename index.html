<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abricot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcf4ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Abricot</title>
<style>
  :root {
    color-scheme: light;
    /* A1-T3 design tokens (mockup direction A "Calm cards", Global Constraints). Light theme only. */
    --page: #fcf4ec;
    --card: #ffffff;
    --radius: 16px;
    --hero: #fbd3b0;
    --action: #a64a18;
    --on-action: #ffffff;
    --ink: #2b1d14;
    --muted: #6b5a4e;
    --gutter: 16px;
    --card-gap: 12px;
    --target: 44px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* Type scale: weight, size and line height. Nothing uses weight 300. */
    --type-numeral: 600 44px/1.1 var(--font);
    --type-title: 700 30px/1.15 var(--font);
    --type-card-title: 600 20px/1.25 var(--font);
    --type-body: 400 17px/1.45 var(--font);
    --type-secondary: 400 15px/1.4 var(--font);
    --type-caption: 500 13px/1.35 var(--font);
    --type-tab: 600 13px/1.2 var(--font);
    /* The names the screens already use, now on the tokens */
    --paper: #fcf4ec;
    --accent: var(--action);
    --cover: var(--hero);
    --rule: #eadfd5;
    --tint: #fde6d2;
    --on-cover: #3a2213;
    --on-cover-muted: #6e4a33;
    --on-cover-line: rgba(58, 34, 19, 0.55);
    --on-cover-fill: rgba(58, 34, 19, 0.08);
    --bar-h: 58px;
    /* Who chips (A1-T7, the mockup's colours): Kev sage, Lili apricot, Couple sand; none of them the muted age chip */
    --kev-bg: #e1eae0;
    --kev-ink: #46664c;
    --lili-bg: #fde0c8;
    --lili-ink: #9c4615;
    --couple-bg: #efe6cf;
    --couple-ink: #7a6224;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums lining-nums;
    overflow-wrap: anywhere;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }

  /* The cover: the PIN screen and the loading state, on the apricot hero colour. */
  .cover {
    min-height: 100vh;
    background: var(--cover);
    color: var(--on-cover);
    display: flex;
    align-items: center;
  }
  .cover .wrap {
    width: 100%;
    padding-top: calc(32px + env(safe-area-inset-top));
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    padding-left: calc(var(--gutter) + env(safe-area-inset-left));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right));
  }
  .cover h1 { font: var(--type-title); letter-spacing: -0.025em; margin-bottom: 36px; }
  .cover :focus-visible, .hero-card :focus-visible { outline-color: var(--on-cover); }
  .cover label { display: block; font-size: 15px; color: var(--on-cover-muted); margin-bottom: 8px; }
  #pin {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 10px 16px;
    font: inherit;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: var(--on-cover);
    background: var(--on-cover-fill);
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
  }
  #go, #retry {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    color: var(--cover);
    background: var(--on-cover);
  }
  #go:disabled { opacity: 0.55; cursor: default; }
  #msg { margin-top: 16px; min-height: 1.45em; }
  #pulse {
    width: 64px;
    height: 2px;
    margin-bottom: 18px;
    background: var(--on-cover);
    animation: pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; opacity: 0.6; } }

  /* The top of every screen: a large title on the page colour (no header slab), then the hero card. */
  .screen-top { padding-top: 8px; }
  .large-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
  h1.title-big { font: var(--type-title); letter-spacing: -0.025em; color: var(--ink); }
  h1.title-mid { font: var(--type-card-title); letter-spacing: -0.01em; color: var(--ink); margin-top: 4px; }
  .title-note { font: var(--type-secondary); color: var(--muted); }
  .hero-card {
    margin-top: var(--card-gap);
    padding: 16px 18px 18px;
    border-radius: var(--radius);
    background: var(--hero);
    color: var(--on-cover);
  }
  .panel-top { display: flex; align-items: center; min-height: 44px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: var(--target);
    min-width: var(--target);
    margin-left: -4px;
    padding-right: 12px;
    font-size: 17px;
    color: var(--action);
  }
  .back::before {
    content: "";
    width: 9px;
    height: 9px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }
  .hero { font: var(--type-numeral); letter-spacing: -0.03em; margin-top: 6px; }
  .hero-cur { font-size: 20px; font-weight: 600; letter-spacing: 0; margin-right: 8px; color: var(--on-cover-muted); }
  .panel-note { margin-top: 8px; font-size: 15px; }
  .panel-small { margin-top: 8px; font-size: 14px; color: var(--on-cover-muted); }
  .panel-verdict { margin-top: 20px; font-size: 18px; font-weight: 500; line-height: 1.3; }

  section { padding-top: 34px; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .small { font-size: 14px; color: var(--muted); }
  .textbtn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  /* Months: the bars scroll sideways when there are many */
  .scroller { overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .barcol:active { background: var(--tint); }

  /* Balance */
  .month-owes { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .month-owes span:last-child { text-align: right; }
  .why { margin-top: -6px; }
  .why h3 { font-size: 15px; font-weight: 600; margin: 18px 0 2px; }
  .why-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 15px;
  }
  .why-amt { white-space: nowrap; flex: none; }
  .why-total { font-weight: 600; border-bottom: 0; }
  .why-end { margin-top: 12px; font-weight: 500; }

  /* Monthly bars */
  .barsin { display: flex; position: relative; min-width: 100%; width: max-content; }
  .barcol { display: block; flex: 1 0 54px; min-height: 44px; border-radius: 6px; }
  .barplot {
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid var(--muted);
  }
  .barval { position: relative; z-index: 2; padding: 0 3px; margin-bottom: 3px; font-size: 13px; background: var(--paper); border-radius: 3px; }
  .bar { width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-partial { background: var(--tint); border: 1.5px dashed var(--accent); border-bottom: 0; }
  .barlabel { height: 40px; padding-top: 5px; text-align: center; font-size: 13px; line-height: 1.2; }
  .barlabel span { display: block; color: var(--muted); font-size: 13px; }
  .usualline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--ink); z-index: 1; pointer-events: none; }
  .caption { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .caption + .caption { margin-top: 4px; }

  .linkrow {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .linkrow b { display: block; font-weight: 600; font-size: 17px; }
  .chev {
    flex: none;
    width: 9px;
    height: 9px;
    margin-right: 4px;
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    transform: rotate(45deg);
  }
  .foot { padding: 20px 0 48px; }
  .notice { font-size: 15px; }
  .notice b { font-weight: 600; }

  /* A1-T4 Money */
  /* Hero card: the month so far, rupiah big and EUR small, one pace bar against the usual month. */
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: var(--type-caption); font-weight: 600; color: var(--on-cover-muted); }
  .hero-sub { font-size: 15px; color: var(--on-cover-muted); margin-top: 2px; }
  .hero-line { margin-top: 10px; font-size: 15px; color: var(--on-cover-muted); }
  .pace { position: relative; height: 8px; margin: 14px 0 10px; border-radius: 4px; background: rgba(110, 74, 51, 0.16); }
  .pace-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--action); }
  .pace-day { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--on-cover); opacity: 0.5; }
  .hero-foot { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 500; color: var(--on-cover-muted); }
  .hero-pct { color: var(--on-cover); font-weight: 600; }

  /* The cards below the hero */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(58, 34, 19, 0.06), 0 0 0 1px rgba(58, 34, 19, 0.04); }
  .dn-card, .bars-card { padding: 14px 14px 6px; }
  .cat-card, .rows-card { padding: 2px 14px; }
  .bars-card .barval { background: var(--card); }

  /* Balance card: euros big (they settle in euros), rupiah small; Settle up beside the details */
  .bal { display: flex; align-items: center; gap: 10px; margin-top: var(--card-gap); padding: 6px 12px 6px 16px; }
  .bal-open { display: flex; flex: 1; min-width: 0; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px; padding: 6px 0; }
  .bal-words { display: block; min-width: 0; }
  .bal-label, .bal-big, .bal-small, .bal-note { display: block; }
  .bal-label { font-size: 15px; color: var(--muted); }
  .bal-big { font: var(--type-card-title); font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
  .bal-small { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bal-note { font-size: 13px; color: var(--muted); }
  .bal-settle {
    flex: none;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--action);
    background: var(--tint);
    white-space: nowrap;
  }

  /* Segmented control: This month, Last month, All time. Each segment is a 44 px target in a 2 px frame. */
  .seg { display: flex; padding: 2px; margin-bottom: var(--card-gap); border-radius: 12px; background: #f3e6da; }
  .seg-btn {
    flex: 1;
    min-height: 44px;
    padding: 0 8px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .seg-btn[aria-pressed="true"] { color: var(--ink); background: var(--card); box-shadow: 0 1px 3px rgba(58, 34, 19, 0.16); }

  /* Category avatars: the icon in the category colour on a pale disc of the same colour */
  .cav { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; }
  .cav .icon { width: 18px; height: 18px; color: inherit; }
  .cav-need { background: var(--tint); }

  /* Categories on the month screen: a card of rows, the top 5 then Show more */
  .cat {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    padding: 8px 0;
    border-top: 1px solid var(--rule);
  }
  .cat:first-child { border-top: 0; }
  .cat[aria-pressed="true"] { background: var(--tint); margin: 0 -14px; width: calc(100% + 28px); padding: 8px 14px; }
  .cat:active { background: var(--tint); }
  .cat-words { flex: 1; min-width: 0; }
  .cat-name { font-weight: 500; }
  .cat-share { color: var(--muted); font-size: 14px; margin-left: 6px; white-space: nowrap; }
  .cat-amts { flex: none; text-align: right; }
  .cat-big { display: block; font-weight: 600; white-space: nowrap; }
  .cat-small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .cat-more, .dn-more {
    display: block;
    width: 100%;
    min-height: 44px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--action);
  }
  .cat-more:disabled { opacity: 0.55; cursor: default; }

  /* Every expense: one card, rows with their avatar, rupiah big and EUR small */
  .rows-card .day { padding: 14px 0 4px; border-bottom: 0; font-size: 13px; }
  .rows-card .row-wrap { border-bottom: 0; border-top: 1px solid var(--rule); }
  .rows-card .day + .row-wrap { border-top: 0; }
  .rows-card .row { align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; }
  .rows-card .row-open { width: calc(100% + 28px); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .rows-card .row-main { font-weight: 600; }
  .rows-card .row-sub { font-size: 13px; }
  .rows-card .receipt { margin-left: 44px; }
  .rows-card .editor { padding: 4px 0 16px; }
  .rows-card .editor input, .rows-card select { background: var(--page); border-color: var(--rule); border-radius: 12px; }
  /* A1-T4 end */

  /* Donut */
  .dn-head { font-size: 15px; font-weight: 600; }
  .dn-fig { position: relative; width: 200px; height: 200px; margin: 16px auto 12px; }
  .dn-fig svg { display: block; width: 200px; height: 200px; }
  .dn-slice { stroke: var(--card); stroke-width: 2px; stroke-linejoin: round; }
  .dn-centre {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    pointer-events: none;
  }
  .dn-c-big { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .dn-c-long { font-size: 17px; }
  .dn-c-small { margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dn-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    padding: 8px 0;
    border-top: 1px solid var(--rule);
  }
  .dn-tap:active { background: var(--tint); }
  .dn-words { flex: 1; min-width: 0; }
  .dn-name { font-weight: 500; }
  .dn-share { margin-left: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .dn-amts { flex: none; text-align: right; }
  .dn-big { display: block; font-weight: 600; white-space: nowrap; }
  .dn-small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dn-empty { padding: 16px 0 10px; font-size: 15px; color: var(--muted); }

  /* Icons */
  .icon { display: block; flex: none; width: 20px; height: 20px; color: var(--muted); }
  .cat-name-box { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-type { display: flex; align-items: center; gap: 8px; }

  /* Every expense */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 2px; }
  .list-head h2 { margin: 0; }
  .day { font-size: 14px; font-weight: 600; color: var(--muted); padding: 18px 0 4px; border-bottom: 1px solid var(--rule); }
  .row-wrap { border-bottom: 1px solid var(--rule); }
  .row { display: flex; width: 100%; justify-content: space-between; gap: 10px; min-height: 44px; padding: 11px 0; }
  .row-btn:active { background: var(--tint); }
  .back:disabled, .cat:disabled, .textbtn:disabled { opacity: 0.55; cursor: default; }
  .row-btn:disabled { cursor: default; color: inherit; }
  .row-open { width: calc(100% + 16px); margin: 0 -8px; padding-left: 8px; padding-right: 8px; background: var(--tint); }
  .row .icon { margin-top: 1px; }
  .row-left { min-width: 0; flex: 1; }
  .row-right { flex: none; text-align: right; max-width: 52%; }
  .row-item, .row-meta, .row-main, .row-sub { display: block; }
  .row-item { font-weight: 500; }
  .row-meta { font-size: 14px; color: var(--muted); }
  .row-main { font-weight: 500; white-space: nowrap; }
  .row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; }

  /* Fixing an expense */
  .editor { padding: 6px 0 16px; }
  .editor label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .select-line { display: flex; align-items: center; gap: 10px; }
  .type-icon { flex: none; width: 20px; height: 20px; }
  select {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  select:disabled { opacity: 0.55; }
  .editor input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  .editor input:disabled { opacity: 0.55; }
  .editor-delete {
    display: block;
    min-height: 44px;
    margin-top: 10px;
    padding: 0 4px;
    font-size: 14px;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .editor-delete:disabled { opacity: 0.55; cursor: default; }
  .editor-note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .editor-error { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .editor-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-main, .btn-plain {
    flex: 1;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-main { color: var(--on-action); background: var(--accent); }
  .btn-plain { border: 1px solid var(--rule); }
  .btn-main:disabled, .btn-plain:disabled { opacity: 0.55; cursor: default; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: calc(100% - 32px);
    max-width: 520px;
    min-height: 52px;
    padding: 4px 16px;
    border-radius: 10px;
    color: var(--on-cover);
    background: var(--cover);
    border: 1px solid var(--on-cover-line);
  }
  .toast button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 6px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toast button:disabled { opacity: 0.55; cursor: default; }
  .toast :focus-visible { outline-color: var(--on-cover); }
  .list-end { height: 84px; }
  .flag {
    display: inline-block;
    margin: 5px 0 0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--tint);
  }
  .receipt {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: -8px 0 2px 30px;
    font-size: 14px;
    color: var(--accent);
    text-underline-offset: 3px;
  }

  /* Tendencies */
  .lead { font-size: 21px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; }
  .sentence { margin-top: 12px; }
  .units { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .unit { min-height: 44px; min-width: 88px; padding: 0 14px; text-align: center; font-size: 15px; }
  .unit[aria-pressed="true"] { background: var(--accent); color: var(--on-action); font-weight: 600; }
  .tablewrap { margin: 12px calc(var(--gutter) * -1) 0; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; overflow-wrap: normal; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  thead th { vertical-align: bottom; font-weight: 600; font-size: 13px; }
  thead span { display: block; font-weight: 400; color: var(--muted); }
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    padding-left: var(--gutter);
    text-align: left;
    white-space: normal;
    min-width: 112px;
    max-width: 128px;
    background: var(--paper);
    font-weight: 500;
    border-right: 1px solid var(--rule);
  }
  tbody td.col-usual { font-weight: 500; background: var(--tint); }
  thead th.col-usual { background: var(--tint); }
  tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--muted); }
  tfoot td.col-usual { background: var(--tint); }
  td.zero { color: var(--muted); }
  .rolling-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .rolling-row span:last-child { text-align: right; }

  /* The bottom bar: Money, Add, To do, Groceries. Fixed, above the phone's home bar, inside the safe areas.
     Toasts and the dock sit above it. Add is the one rust slot, the same on every tab. */
  #app {
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
  }
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 150px));
    justify-content: center;
    padding: 4px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: rgba(252, 244, 236, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-top: 0.5px solid rgba(58, 34, 19, 0.13);
  }
  .tab {
    min-height: 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font: var(--type-tab);
    color: var(--muted);
    text-align: center;
  }
  .tab-pill { display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; }
  .tab .icon { width: 23px; height: 23px; color: currentColor; stroke-width: 1.8; }
  .tab[aria-current="page"] { color: var(--action); }
  .tab[aria-current="page"] .tab-pill { background: #fde3cc; }
  .tab-add { color: var(--action); }
  .tab-add .tab-pill { width: 50px; border-radius: 12px; color: var(--on-action); background: var(--action); box-shadow: 0 5px 12px -3px rgba(166, 74, 24, 0.5); }
  .tab-add .icon { width: 22px; height: 22px; stroke-width: 2.5; }
  .tab-add:active .tab-pill { opacity: 0.85; }

  /* Screens: a short fade when one comes on show. Browsers with View Transitions cross-fade instead. */
  .screen { animation: screen-in 180ms ease-out; }
  @keyframes screen-in { from { opacity: 0; } to { opacity: 1; } }
  @supports (view-transition-name: none) {
    .screen { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none; }
  }

  /* Lists shell: the header avatar, the "Who uses this phone?" sheet, the settings line and the dock above the bar */
  .avatar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--target);
    height: var(--target);
    margin-right: -6px;
    border-radius: 50%;
  }
  .avatar > span, .avatar-dot {
    display: flex;
    font-size: 13px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }
  .avatar-kev > span, .avatar-dot.avatar-kev { color: #46664c; background: #e1eae0; }
  .avatar-lili > span, .avatar-dot.avatar-lili { color: #9c4615; background: #fde0c8; }
  .avatar-q > span { color: #6b5a4e; background: #efe6dc; }
  .who-title { font: var(--type-card-title); margin: 4px 0 6px; }
  .who-line { font: var(--type-secondary); color: var(--muted); margin-bottom: 14px; }
  .who-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .who-choice {
    min-height: 112px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: 18px;
    background: #faf3ec;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
  }
  .who-choice .avatar-dot { width: 52px; height: 52px; font-size: 21px; }
  .who-choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #dc966a; }
  .who-foot { margin-top: 12px; font: var(--type-caption); color: var(--muted); text-align: center; }

  /* The empty state: one disc, a title, a line. */
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 16px 16px; }
  .empty-disc { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 14px; border-radius: 50%; color: var(--action); background: var(--tint); }
  .empty-disc .icon { width: 30px; height: 30px; color: currentColor; stroke-width: 2; }
  .empty-title { font: var(--type-card-title); }
  .empty-line { max-width: 260px; margin-top: 6px; font: var(--type-secondary); color: var(--muted); }

  /* Swipe on a list row: right ticks, left deletes. The page still scrolls up and down. */
  .todo-row, .gro-row { touch-action: pan-y; }

  /* A1-T7 list cards: a label on the page, then one white card per section; 56 px rows, a hairline between rows
     that starts after the tick, the 28 px tick circle in a 56 px target. Rows slide inside their card. */
  .list-lab { margin: 22px 4px 8px; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .lists-main > .list-lab:first-child, .todo-top + .list-lab { margin-top: 8px; }
  .list-card { padding: 0 14px 0 0; overflow: hidden; }
  .list-card :focus-visible { outline-offset: -2px; }
  .list-card > * + .todo-row::before, .list-card > * + .gro-row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 56px;
    right: 0;
    border-top: 1px solid #f3e9df;
    pointer-events: none;
  }
  .list-card > .todo-day + .todo-row::before, .list-card > .todo-note + .todo-row::before { display: none; }
  .todo-fold-h + .list-card, .gro-more + .list-card { margin-top: 8px; }
  #app:has(#groceries:not([hidden])) .qa-toast { bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom) + var(--gro-dock-h, 150px)); }
  /* A1-T7 end */

  .lists-main { padding-top: 16px; }
  .lists-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 28px; }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 520px;
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .dock-note {
    align-self: flex-start;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: var(--tint);
  }
  .dock-toast {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 52px;
    padding: 4px 16px;
    border-radius: 10px;
    color: var(--on-cover);
    background: var(--cover);
    border: 1px solid var(--on-cover-line);
  }

  /* To do: sections, rows with a wide tick zone, chips, the calm note, the settings lines */
  .todo-top { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .mine {
    min-height: 44px;
    padding: 0 18px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    background: #f6ece2;
  }
  .mine[aria-pressed="true"] { color: #9c4615; background: #fde3cc; box-shadow: inset 0 0 0 1.5px #dc966a; }
  .todo-sec-later, .todo-sec-parked, .todo-sec-done { margin-top: 16px; }
  .todo-fold-h { margin: 0; }
  .todo-fold {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(246, 236, 226, 0.7);
  }
  .todo-fold::after {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
  }
  .todo-fold[aria-expanded="true"]::after { transform: rotate(-135deg); }
  .todo-day { margin-left: 56px; padding: 10px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
  .list-card > * + .todo-day { border-top: 1px solid #f3e9df; }
  .todo-row { position: relative; display: flex; align-items: center; min-height: 56px; background: var(--card); }
  .tick-zone {
    flex: none;
    align-self: stretch;
    width: 56px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  /* The svg is the circle (its round border); its first path, the drawn circle, is not needed. Ticked: rust with a white tick. */
  .tick-zone .icon { width: 28px; height: 28px; border: 2px solid #a38d7b; border-radius: 50%; color: var(--on-action); stroke-width: 2.6; }
  .tick-zone .icon path:first-child { display: none; }
  .tick-zone[aria-pressed="true"] .icon { background: var(--action); border-color: var(--action); }
  .tick-zone:active .icon { background: var(--tint); }
  .tick-zone[aria-pressed="true"]:active .icon { background: var(--action); }
  .todo-open {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-self: stretch;
    flex: 1;
    min-width: 0;
    min-height: 56px;
    padding: 9px 0;
    text-align: left;
  }
  .todo-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 17px;
    line-height: 1.35;
  }
  .is-done .todo-text { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #d9b89c; color: var(--muted); }
  .todo-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tchip {
    display: inline-block;
    max-width: 100%;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 22px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
    background: #f6ece2;
  }
  .tchip-kev { color: var(--kev-ink); background: var(--kev-bg); }
  .tchip-lili { color: var(--lili-ink); background: var(--lili-bg); }
  .tchip-couple { color: var(--couple-ink); background: var(--couple-bg); }
  .tchip-effort { color: var(--muted); background: #f6ece2; }
  .tchip-date { color: var(--muted); background: #f6ece2; }
  .tchip-age { color: var(--muted); background: transparent; padding: 0 2px; font-weight: 500; }
  .tchip-from { color: var(--muted); background: transparent; padding: 0 2px; font-weight: 500; }
  .todo-revive { flex: none; align-self: center; min-height: 44px; padding-left: 10px; font-size: 14px; }
  .todo-note-lead {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .todo-note { margin: 12px 0 6px 14px; padding: 14px 16px; border-radius: 14px; background: var(--tint); font-size: 15px; }
  .todo-note-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .todo-note-actions .btn-plain { flex: 0 0 auto; border: 0; border-radius: 22px; background: var(--card); }
  .lists-settings + .lists-settings { margin-top: 4px; }
  .sep { color: var(--muted); }
  .pause-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .pause-menu .btn-plain { flex: 0 0 auto; }
  .pause-menu input {
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  .pause-error { width: 100%; font-size: 14px; color: var(--accent); font-weight: 500; }

  /* Task 7: Not today, the Undo line, and the item sheet (a dialog from the bottom; closing it saves). A1-T5: the
     To do "+" is gone; the Add slot in the bar opens the quick add. */
  .todo-nottoday { flex: none; align-self: center; min-height: 44px; padding-left: 10px; font-size: 14px; }
  .todo-nottoday-menu { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 12px 56px; }
  .todo-nottoday-menu .btn-plain { flex: 0 0 auto; border: 0; border-radius: 22px; background: #f6ece2; }
  .dock-toast button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 6px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .dock-toast :focus-visible { outline-color: var(--on-cover); }
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(43, 29, 20, 0.5); }
  .sheet-panel {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    max-height: 90dvh;
    margin: 0 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 6px calc(var(--gutter) + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
    border-radius: 22px 22px 0 0;
    color: var(--ink);
    background: var(--card);
    box-shadow: 0 -4px 24px rgba(43, 29, 20, 0.25);
  }
  .sheet-panel:focus { outline: none; }
  .sheet-handle { width: 40px; height: 5px; margin: 4px auto 14px; border-radius: 3px; background: var(--rule); }
  .sheet-text {
    display: block;
    width: 100%;
    min-height: 48px;
    max-height: 40vh;
    padding: 10px 12px;
    font: inherit;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    background: #faf3ec;
    border: 1px solid #eadfd5;
    border-radius: 13px;
    resize: none;
    overflow-y: auto;
    field-sizing: content;
  }
  .sheet-label { margin: 16px 2px 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .sheet-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* A1-T7: soft chips; the picked one is a tint with a ring (a person's colour for Kev, Lili, Couple), never solid rust.
     A1 final fix 5: the ring is 2 px and dark (at least 3:1 against the resting chip), the label bold. */
  .schip {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border: 0;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    background: #f6ece2;
    text-align: center;
  }
  .schip[aria-pressed="true"] { color: #9c4615; font-weight: 700; background: #fde3cc; box-shadow: inset 0 0 0 2px #b4541d; }
  .schip-kev[aria-pressed="true"] { color: var(--kev-ink); background: var(--kev-bg); box-shadow: inset 0 0 0 2px var(--kev-ink); }
  .schip-lili[aria-pressed="true"] { color: var(--lili-ink); background: var(--lili-bg); box-shadow: inset 0 0 0 2px var(--lili-ink); }
  .schip-couple[aria-pressed="true"] { color: var(--couple-ink); background: var(--couple-bg); box-shadow: inset 0 0 0 2px var(--couple-ink); }
  .sheet-day, .sheet-time input {
    min-height: 44px;
    margin-top: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #faf3ec;
    border: 1px solid #eadfd5;
    border-radius: 12px;
  }
  .sheet-time input:disabled { opacity: 0.55; }
  .sheet-time .small { margin-top: 6px; }
  .sheet-more { margin-top: 8px; }
  .sheet-foot { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .sheet-delete { min-height: 44px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .sheet-save { flex: 0 0 auto; min-width: 120px; min-height: 48px; margin-left: auto; border-radius: 14px; }
  .sheet-shop-input {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-bottom: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #faf3ec;
    border: 1px solid #eadfd5;
    border-radius: 12px;
  }

  /* Task 8: Groceries: Bought recently chips, the shop filter, rows; the problems line. A1-T7: the add field and the
     chips dock above the tab bar (near the thumb), inside the safe areas, and ride on the keyboard while it is up. */
  .lists-problem { margin-top: 16px; padding: 10px 14px; border-radius: 10px; font-size: 14px; color: var(--ink); background: var(--tint); }
  .gro-dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    z-index: 5;
    max-width: 560px;
    margin: 0 auto;
    padding: 10px calc(12px + env(safe-area-inset-right)) 2px calc(12px + env(safe-area-inset-left));
    background: var(--page);
    box-shadow: 0 -0.5px 0 rgba(58, 34, 19, 0.13);
  }
  .gro-dock.is-kb { padding-bottom: 0; }
  .gro-dock-slot:empty { display: none; }
  .gro-dock .dock { position: static; transform: none; width: auto; max-width: none; padding-bottom: 8px; }
  .gro-add {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 52px;
    padding: 0 8px 0 8px;
    border-radius: 26px;
    background: var(--card);
    box-shadow: 0 6px 16px rgba(58, 34, 19, 0.13), 0 0 0 1px rgba(58, 34, 19, 0.04);
    cursor: text;
  }
  .gro-add:focus-within { box-shadow: 0 6px 16px rgba(58, 34, 19, 0.13), 0 0 0 2px var(--action); }
  .gro-add-plus { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; color: var(--on-action); background: var(--action); }
  .gro-add-plus .icon { width: 18px; height: 18px; color: currentColor; stroke-width: 2.5; }
  .gro-add input {
    display: block;
    flex: 1;
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 0 4px;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .gro-add input:focus-visible { outline: none; }
  .gro-add input::placeholder { color: var(--muted); opacity: 1; }
  .gro-note { min-height: 22px; padding: 2px 12px 0; font-size: 14px; line-height: 20px; color: var(--muted); }
  .gro-end { height: calc(var(--gro-dock-h, 150px) + 24px); }
  .gro-main { padding-top: 14px; }
  .gro-recent { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
  .gro-label { flex: none; margin: 0 0 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .gro-chips {
    display: flex;
    flex: 1;
    min-width: 0;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 3px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .gchip {
    flex: none;
    max-width: 60vw;
    min-height: 44px;
    padding: 0 14px;
    border: 0;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--card);
    box-shadow: 0 0 0 1px rgba(58, 34, 19, 0.06), 0 1px 2px rgba(58, 34, 19, 0.08);
  }

function group(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function fmtIdr(n) {
  return (n < 0 ? '-' : '') + 'Rp ' + group(Math.abs(Math.round(n)));

function fmtEur(n) {

function dayOfMonth(iso) {
  var y = Number(iso.slice(0, 4));
  var m = Number(iso.slice(5, 7));

}

function dayText(iso) {
  var d = dayOfMonth(iso);
  return 'day ' + d.day + ' of ' + d.days;

function monthName(key) {

function andList(words) {
  if (words.length < 2) return words.join('');

  if (Math.abs(net) < 0.005) return { square: true, who: '', eur: 0 };

// The day after a yyyy-MM-dd day.
function nextDay(iso) {
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)) + 1));
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;

// What a one-line text input holds for a value: browsers drop line breaks from it.
function inputText(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[\r\n]/g, '');

// An item name the server takes: 1 to 100 characters after trimming, no control characters.

  var t = s.replace(/^\s+|\s+$/g, '');
  return t.length >= 1 && t.length <= 100;
}

function currencyOk(c) {
  return c === 'IDR' || c === 'EUR' || c === 'USD';
}

// The edit sheet's typed values, checked: {values} for pendingChanges, or {error} in plain words. Item, amount and
// date are left out when they match the row, so a blank stays blank. Days run from 2020 to tomorrow (the server

function editDraftValues(row, draft, todayIso) {
  var out = { currency: draft.currency, category: draft.category, paidBy: draft.paidBy, paidFor: draft.paidFor };
  var item = String(draft.item === undefined || draft.item === null ? '' : draft.item).replace(/^\s+|\s+$/g, '');
  if (item !== inputText(row.item).replace(/^\s+|\s+$/g, '')) {
    if (!item) return { error: 'Give it a name.' };
    if (item.length > 100) return { error: 'Keep the name to 100 characters.' };
    out.item = item;
  }
  var amount = String(draft.amount === undefined || draft.amount === null ? '' : draft.amount).replace(/\s/g, '');
  var shown = row.amount === null || row.amount === undefined ? '' : String(row.amount);
  if (amount !== shown) {

    if (!/^\d+([.,]\d{1,2})?$/.test(amount)) return { error: digits };

function dateOk(y, m, d) {
  var t = new Date(Date.UTC(y, m - 1, d));

    if (changes[i].field === 'amount' || changes[i].field === 'currency' || changes[i].field === 'date') out.eurUnknown = true;
  }
  return out;
}

// Undo is offered only when the server would take every old value back: the same rules as Edit.gs.
// todayIso and categories are used when given (the day range, and the Type list).
function canUndo(changes, todayIso, categories) {
  for (var i = 0; i < changes.length; i++) {
    var c = changes[i];
    var v = c.old;
    if (c.field === 'amount') {
      if (typeof v !== 'number' || !isFinite(v) || !(v > 0) || v >= 1e12 || Math.round(v * 100) / 100 !== v) return false;
    } else if (c.field === 'currency') {
      if (!currencyOk(v)) return false;
    } else if (c.field === 'date') {
      var m = typeof v === 'string' ? /^(\d{4})-(\d{2})-(\d{2})$/.exec(v) : null;
      if (!m || !dateOk(Number(m[1]), Number(m[2]), Number(m[3])) || v < '2020-01-01') return false;
      if (todayIso && v > nextDay(todayIso)) return false;
    } else if (c.field === 'item') {
      if (!itemOk(v)) return false;
    } else if (c.field === 'category') {
      if (typeof v !== 'string' || v === '' || v.length > 100 || v === 'Settlement') return false;
      if (categories && categories.indexOf(v) < 0) return false;
    } else if (v !== 'Couple' && v !== 'Kev' && v !== 'Lili') {
      return false;
    }
  }
  return true;
}

function saveFailText(doneLabels, failLabel, reason) {
  if (!doneLabels.length) return reason;
  return andList(doneLabels) + (doneLabels.length === 1 ? ' was' : ' were') + ' saved. ' + failLabel + ' was not. ' + reason;
}

function rowByNumber(months, rowNumber) {
  for (var i = 0; i < months.length; i++) {
    for (var j = 0; j < months[i].rows.length; j++) {
      if (months[i].rows[j].rowNumber === rowNumber) return months[i].rows[j];
    }
  }
  return null;
}

// Options as [value, label]. A current value off the list still shows, so the editor never misstates a row.
function editOptions(options, current) {
  for (var i = 0; i < options.length; i++) {
    if (options[i][0] === current) return options;
  }
  return [[current, current === '' ? 'Not set' : current]].concat(options);
}

function partialLabel(m, todayIso) {
  if (!m.partial) return '';
  return m.key >= todayIso.slice(0, 7) ? 'so far' : 'part month';
}

function comparison(m, usual, rate, todayIso) {
  var v = m.vsUsual;
  if (v) {
    if (v.direction === 'same' || v.diffIdr === 0) return { verdict: 'same', text: 'The same as your usual.' };
    var abs = Math.abs(v.diffIdr);
    return { verdict: v.direction, text: fmtIdr(abs) + ' (' + fmtEur(abs / rate) + ') ' + v.direction + ' your usual.' };
  }
  if (m.partial && m.key >= todayIso.slice(0, 7)) {
    return { verdict: null, text: 'So far: ' + dayText(todayIso) + '. No comparison until the month ends.' };
  }
  if (m.partial) return { verdict: null, text: 'Not a full month, so it is not compared with your usual.' };
  return { verdict: null, text: 'Too few full months yet to compare.' };
}

// A1-T4: rupiah big, EUR small (rowIdr_: an IDR row's own amount, others from the stored euros at the rate). A USD
// row also shows what was paid. With no rate, a row that is not in rupiah shows its euros big and no rupiah.
function rowAmounts(r, rate) {
  function paid() {
    if (r.currency === 'IDR') return fmtIdr(r.amount);
    if (r.currency === 'EUR') return fmtEur(r.amount);
    return (r.currency ? r.currency + ' ' : '') + fixed2(r.amount);
  }
  if (r.needsAmount) return { main: r.amount === null ? 'No amount' : paid(), sub: [] };
  var idr = rowIdr_(r, rate);
  if (idr === null) return { main: fmtEur(r.eur), sub: r.currency === 'EUR' ? [] : [paid()] };
  if (r.currency === 'IDR' || r.currency === 'EUR') return { main: fmtIdr(idr), sub: [fmtEur(r.eur)] };
  return { main: fmtIdr(idr), sub: [fmtEur(r.eur), paid()] };
}

function rowsFor(m, filter) {
  if (filter === null) return m.rows;
  return m.rows.filter(function (r) {
    return filter === NEEDS ? r.needsAmount : r.category === filter;
  });
}

function shareText(share) {
  if (share > 0 && share < 0.01) return 'under 1%';
  return Math.round(share * 100) + '%';
}

function trendSentences(p) {
  var t = p.tendencies;
  var rate = t.rate;
  var out = [];
  function both(idr) { return fmtIdr(idr) + ' (' + fmtEur(idr / rate) + ')'; }
  if (t.change) {
    out.push(t.change.sentence + ': ' + (t.change.diffIdr < 0 ? 'down ' : 'up ') + both(Math.abs(t.change.diffIdr)) + '.');
  }
  if (p.usual) {
    out.push('Your usual month is ' + both(p.usual.avgIdr) + ', the average of ' + andList(p.usual.keys.map(monthName)) + '.');
  } else {
    out.push('Your usual month appears once there are 3 full months.');
  }
  if (t.rows.length && t.rows[0].totalIdr > 0) {
    out.push('Over all months, the most went on ' + t.rows[0].category + ': ' + both(t.rows[0].totalIdr) + '.');
  }
  return out;
}

function rateNote(months) {
  var out = [];
  for (var i = 0; i < months.length; i++) {
    if (Math.abs(months[i].totalEur - months[i].comparisonEur) >= 1) {
      out.push(months[i].label + ' is ' + fmtEur(months[i].totalEur) + ' in the sheet, at the rate used that month.');
    }
  }
  return out.join(' ');
}

function viewHash(view) {
  if (view.screen === 'month') return '#month=' + view.key;
  if (view.screen === 'trends') return '#tendencies';
  if (view.screen === 'balance') return '#balance';
  if (view.screen === 'todo') return '#todo';
  if (view.screen === 'groceries') return '#groceries';
  return '';
}

function viewFromHash(hash) {
  var m = /^#month=(\d{4}-\d{2})$/.exec(hash || '');
  if (m) return { screen: 'month', key: m[1] };
  if (hash === '#tendencies') return { screen: 'trends', key: null };
  if (hash === '#balance') return { screen: 'balance', key: null };
  if (hash === '#todo') return { screen: 'todo', key: null };
  if (hash === '#groceries') return { screen: 'groceries', key: null };
  return { screen: 'home', key: null };
}

// The bottom bar tab a screen belongs to: every money screen is under Money.
function tabOf_(screen) {
  if (screen === 'todo' || screen === 'groceries') return screen;
  return 'money';
}

function isListScreen_(screen) {
  return screen === 'todo' || screen === 'groceries';
}

// ---- token: kept in memory, and in browser storage when the browser allows it ----
function store(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function unstore() { try { localStorage.removeItem(KEY); } catch (e) {} }

// ---- page storage: the kl.* keys, each read and write inside try, so the page works without storage ----
var LS_TAB = 'kl.tab';     // the last bottom bar tab: money, todo or groceries
var LS_ME = 'kl.me';       // who this phone is: Kev or Lili
var LS_LISTS = 'kl.lists'; // the last lists reply, as {at, result}
var LS_QUEUE = 'kl.queue'; // the list ops not yet answered, oldest first
var LS_MONEY = 'kl.money'; // A1-T3: the last data reply, as {v, at, data}; drawn first, then refreshed
var LS_KEPT = 'kl.kept';   // A1-T5: expenses the server refused, as [{key, at, draft}], kept until saved again
var MONEY_V = 2;           // A1-T4: version 2, Money reads data.fx; a version 1 snapshot is ignored
function lsGet_(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet_(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel_(k) { try { localStorage.removeItem(k); } catch (e) {} }
function lsJson_(k) {
  var t = lsGet_(k);
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

// ---- DOM helpers: every value goes in as text --------------------------------
function $(id) { return document.getElementById(id); }

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function add(parent, tag, cls, text) {
  return parent.appendChild(el(tag, cls, text));
}

function btn(parent, cls, text, onClick) {
  var b = add(parent, 'button', cls, text);
  b.setAttribute('type', 'button');
  b.addEventListener('click', onClick);
  return b;
}

function icon(name) {
  return svgIcon_(iconPaths(name));
}

// Bottom bar icons. Paths are constant strings in this file, never data. Groceries reuses the cart.
function tabIconPaths_(tab) {
  if (tab === 'todo') return ['M4.5 4.5h15v15h-15z', 'M8.5 12.5l2.5 2.5l4.5-5.5'];
  if (tab === 'groceries') return iconPaths('Groceries');
  return ['M3.5 6.5h17v11h-17z', 'M14.5 12a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0z', 'M6.5 9.5v5', 'M17.5 9.5v5'];
}

var SVG_NS = 'http://www.w3.org/2000/svg';

function svgIcon_(paths) {
  var ns = SVG_NS;
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '20');
  svg.setAttribute('height', '20');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.6');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  paths.forEach(function (d) {
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
  });
  return svg;
}

// True while a save or undo is on its way. Back, filters and rows wait for it.
function busy() {
  return !!((EDIT && EDIT.saving) || (TOAST && TOAST.busy));
}

function monthByKey(key) {
  for (var i = 0; i < DATA.months.length; i++) {
    if (DATA.months[i].key === key) return DATA.months[i];
  }
  return null;
}

// Keeps a currency next to its number when a sentence wraps.
function nb(s) {
  return s.replace(/(Rp|EUR) (?=[-\d])/g, '$1\u00a0');
}

function rateText() {
  return 'Euros at a fixed rate of ' + group(DATA.rate) + ' so months compare fairly.';
}

// ---- talking to the script ------------------------------------------------------
// Every call comes through here. credentials: 'omit' is the point: Google's multi-account cookies are never sent.
// Resolves with the result. Rejects with {code}: NO_SESSION, NOT_CONFIGURED, BAD_REQUEST or SERVER from the
// script, TIMEOUT after 30 seconds, UNREACHED for anything else, such as no connection or a page that is not JSON.
function call_(action, payload) {
  var body = { action: action };
  for (var k in payload) body[k] = payload[k];
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 30000);
  return fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    credentials: 'omit',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(function (res) {
    if (!res.ok) throw { code: 'UNREACHED' };
    return res.json();
  }).then(function (reply) {
    clearTimeout(timer);
    if (reply && reply.ok === true) {
      // Sliding session: keep the fresh token, unless this phone has been locked out meanwhile.
      if (typeof reply.token === 'string' && reply.token && TOKEN) {
        TOKEN = reply.token;
        store(reply.token);
      }
      return reply.result;
    }
    throw { code: (reply && typeof reply.error === 'string') ? reply.error : 'SERVER' };
  }, function (err) {
    clearTimeout(timer);
    if (err && typeof err.code === 'string') throw err;
    throw { code: err && err.name === 'AbortError' ? 'TIMEOUT' : 'UNREACHED' };
  });
}

// True when the reply never arrived, so a save may or may not have landed.
function unreached(err) {
  return !!err && (err.code === 'TIMEOUT' || err.code === 'UNREACHED');
}

var REACH_TEXT = 'Could not reach the server. Try again.';

// ---- cover: PIN, loading and load errors --------------------------------------
function msg(t) { $('msg').textContent = t; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function clock(ms) {
  var d = new Date(ms);
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return d.toDateString() === new Date().toDateString() ? t : 'tomorrow at ' + t;
}

function showCover(mode, text) {
  APP_ON = false;
  $('app').hidden = true;
  $('cover').hidden = false;
  $('gate').hidden = mode !== 'gate';
  $('pulse').hidden = mode !== 'loading';
  $('retry').hidden = mode !== 'error';
  msg(text || '');
}

function submit() {
  var pin = $('pin').value;
  if (!pin) return;
  var go = $('go');
  if (go.disabled) return;
  go.disabled = true;
  $('pin').value = '';
  msg('Checking...');
  call_('unlock', { pin: pin }).then(function (r) {
    go.disabled = false;
    if (r && r.ok) {
      TOKEN = r.token;
      store(r.token);
      openSession_();
    }
    else if (r && r.locked) { msg('Locked until ' + clock(r.untilMs) + '.'); }
    else if (r && r.notReady) { msg('Not set up yet.'); }
    else if (r && r.retry) { msg('Could not check. Try again.'); }
    else { msg('Wrong PIN.'); }
  }, function (err) {
    go.disabled = false;
    msg(unreached(err) ? REACH_TEXT : 'Something went wrong. Try again.');
  });
}

function clearScreens() {
  $('home').textContent = '';
  $('month').textContent = '';
  $('trends').textContent = '';
  $('balance').textContent = '';
  $('todo').textContent = '';
  groClear_();
  $('tabbar').textContent = '';
}

function lockOut() {
  SESSION++;
  LOADING = false;
  TOKEN = null;
  closeItemSheet_('lock'); // Task 7: an open sheet's change goes into the queue, sent after the unlock
  whoShut_();
  QA_DRAFT = null; // A1-T5: an unsaved expense goes with the session; a queued one stays for after the PIN
  // A1 final fix 3: so does one kept as 'unsaved' in kl.kept; refused ones stay, as the queue does.
  if (qaKept_().some(function (e) { return e.why === 'unsaved'; })) {
    qaKeptChange_(function (list) { for (var i = list.length - 1; i >= 0; i--) if (list[i].why === 'unsaved') list.splice(i, 1); });
  }
  qaToastSet_(null);
  DATA = null;
  MONEY_AT = 0;
  MONEY_LIVE = false;
  lsDel_(LS_MONEY); // A1-T3: the Money snapshot goes with the token
  VIEW = { screen: 'home', key: null };
  FILTER = null;
  DONUT_VIEW = 'cur';
  DONUT_MORE = false;
  MONTH_MORE = false;
  EDIT = null;
  TOAST = null;
  FIRST_LOAD = true;
  listsLockOut_();
  todoLeave_();
  groLeave_();
  GRO_DRAFT = '';
  unstore();
  try { location.hash = ''; } catch (e) {}
  clearScreens();
  showCover('gate', 'Please enter your PIN.');
}

function loadFailed(quiet, err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  if (quiet && !DATA && APP_ON) {
    MONEY_FAILED = true;
    render(true);
    return;
  }
  if (quiet && DATA) {
    if (TOAST && TOAST.refreshing) {
      TOAST = { text: (TOAST.after ? TOAST.after + ' ' : '') + 'Could not refresh. These are the last numbers loaded.', key: TOAST.key };
    }
    render(true);
    // A1-T3 fix 1: after a failed refresh, the age of the numbers on show, as the lists say it.
    homeStatus('Could not update. These are the last numbers loaded.' + (MONEY_AT ? ' ' + updatedText_(MONEY_AT, Date.now()) + '.' : ''));
    return;
  }
  if (code === 'NOT_CONFIGURED') {
    showCover('error', 'Your PIN works, but the expenses sheet is not connected yet.');
    return;
  }
  if (unreached(err)) {
    showCover('error', REACH_TEXT);
    return;
  }
  showCover('error', 'Could not load your expenses. Check the connection and try again.');
}

function loadData(quiet) {
  if (LOADING) return;
  LOADING = true;
  if (quiet) homeStatus('Updating...');
  else showCover('loading', 'Opening your expenses. The first load can take a few seconds.');
  var session = SESSION;
  var slow = setTimeout(function () {
    if (LOADING && !quiet) msg('Still working. If nothing changes soon, close this page and open it again.');
  }, 15000);
  call_('data', { token: TOKEN }).then(function (p) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    if (!p || !p.months) { loadFailed(quiet, ''); return; }
    moneySet_(p);
    if (FIRST_LOAD) {
      FIRST_LOAD = false;
      VIEW = viewFromHash(location.hash);
    }
    showApp_();
    // A month emptied by a delete stays while its Undo bar is up.
    var undoHere = TOAST && TOAST.restore && TOAST.key === VIEW.key;
    if (VIEW.screen === 'month' && !monthByKey(VIEW.key) && !undoHere) VIEW = { screen: 'home', key: null };
    if (TOAST && TOAST.refreshing) TOAST = TOAST.after ? { text: TOAST.after, key: TOAST.key } : null;
    render(true);
  }, function (err) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    loadFailed(quiet, err);
  });
}

function homeStatus(text) {
  var s = HOME_STATUS;
  if (s) s.textContent = text;
}
var HOME_STATUS = null;

// ---- the Money snapshot (kl.money, A1-T3): drawn at once on the next visit, then refreshed ---------------
var MONEY_AT = 0; // when the numbers on show were read from the server (ms)
// A1 final fix 2: true once a data reply from the server has been on show in this session (the snapshot alone
// never sets it). Settle up waits for it, so a settlement is never confirmed from figures the server has not just sent.
var MONEY_LIVE = false;

// A1 final fix 8: the session token's first segment is its expiry in ms (Auth.gs signToken_). True only while that
// expiry is ahead; a token that cannot be read counts as expired.
function tokenLive_(t) {
  var m = typeof t === 'string' ? /^([0-9]{1,15})\./.exec(t) : null;
  return !!m && Number(m[1]) > Date.now();
}

// A data reply from the server: on show from now, and kept as the snapshot.
function moneySet_(p) {
  // A1-T4: fx is kept only as a usable rate, else null, so the screens and the snapshot read one shape.
  if (p && typeof p === 'object') p.fx = pageRate_(p) ? p.fx : null;
  DATA = p;
  MONEY_AT = Date.now();
  MONEY_LIVE = true;
  // A write that fails (storage full) drops the older snapshot, so a later visit never draws stale numbers.
  if (!lsSet_(LS_MONEY, JSON.stringify({ v: MONEY_V, at: MONEY_AT, data: p }))) lsDel_(LS_MONEY);
}

// The snapshot's data when it is this version and has the parts every Money screen reads; otherwise null.
function moneyCacheData_(c) {
  if (!c || typeof c !== 'object' || c.v !== MONEY_V || typeof c.at !== 'number' || !isFinite(c.at)) return null;
  var d = c.data;
  if (!d || typeof d !== 'object' || !Array.isArray(d.months)) return null;
  if (typeof d.today !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.today)) return null;
  if (!d.balance || typeof d.balance.net !== 'number') return null;
  if (d.fx !== null && !pageRate_(d)) return null; // A1-T4: fx is null or a usable rate
  return d;
}

// Shows view v from the snapshot, before the server answers. False when there is no usable snapshot: a broken,
// older or unreadable one (one that cannot be drawn) is dropped and nothing of it stays on screen.
function moneyFromCache_(v) {
  if (!tokenLive_(TOKEN)) return false; // A1 final fix 8: an expired session draws nothing; the server decides
  var c = lsJson_(LS_MONEY);
  var d = moneyCacheData_(c);
  if (!d) return false;
  try {
    DATA = d;
    MONEY_AT = c.at;
    FIRST_LOAD = false;
    VIEW = (v.screen === 'month' && !monthByKey(v.key)) ? { screen: 'home', key: null } : v;
    showApp_();
    render(false);
    return true;
  } catch (e) {
    DATA = null;
    MONEY_AT = 0;
    FIRST_LOAD = true;
    VIEW = v;
    lsDel_(LS_MONEY);
    clearScreens();
    return false;
  }
}

// "Updated N min ago" for numbers over 10 minutes old; nothing while they are fresh.
function moneyAgeText_() {
  var now = Date.now();
  return MONEY_AT && now - MONEY_AT > 600000 ? updatedText_(MONEY_AT, now) + '.' : '';
}

// ---- navigation ---------------------------------------------------------------
// The screen lives in the address after #, so the phone's back button steps through screens.
function remember(view) {
  try {
    var h = viewHash(view);
    if (location.hash !== h) location.hash = h;
  } catch (e) {}
}

function go(view, fromHistory) {
  if (SHEET) closeItemSheet_('nav');
  whoShut_();
  var newTab = tabOf_(view.screen) !== tabOf_(VIEW.screen);
  if (VIEW.screen === 'home') HOME_Y = window.scrollY || 0;
  if (VIEW.screen === 'todo' && view.screen !== 'todo') todoLeave_();
  if (VIEW.screen === 'groceries' && view.screen !== 'groceries') groLeave_();
  if (view.screen !== 'month' || view.key !== VIEW.key) { FILTER = null; MONTH_MORE = false; }
  VIEW = view;
  EDIT = null;
  TOAST = null;
  LISTS_TOAST = '';
  listsUndoClear_();
  // Money opened for the first time this session (the page started on a list tab): load its numbers first.
  if (tabOf_(view.screen) === 'money' && !DATA) {
    if (!fromHistory) remember(view);
    // A1-T3: the Money snapshot shows at once, then the numbers refresh quietly.
    if (moneyFromCache_(view)) { loadData(true); return; }
    if (!APP_ON) { loadData(false); return; }
    // M1: the app and its bar stay; the money screen says it is loading, or why it could not.
    MONEY_FAILED = false;
    render(false);
    loadData(true);
    return;
  }
  if (isListScreen_(view.screen)) {
    if (!LISTS_BASE) listsFromCache_();
    showApp_();
  }
  if (view.editRow) {
    var r = rowByNumber(DATA.months, view.editRow);
    if (r) startEdit(r);
  }
  if (!fromHistory) remember(view);
  if (newTab && !view.editRow) withTransition_(function () { render(false); });
  else render(false);
  if (view.editRow && EDIT_EL) EDIT_EL.scrollIntoView({ block: 'center' });
  if (isListScreen_(view.screen)) listsLoad_(false);
}

// A1-T3: a tab switch through the View Transitions API (a cross-fade) when the browser has it and motion is
// welcome; otherwise paint at once and the CSS fade on .screen plays. A refusing API still paints.
function withTransition_(paint) {
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && typeof document.startViewTransition === 'function') {
    var t = null;
    try { t = document.startViewTransition(paint); } catch (e) { t = null; }
    if (t) {
      ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) {
        if (t[k] && typeof t[k].then === 'function') t[k].then(null, function () {});
      });
      return;
    }
  }
  paint();
}

// ---- To do screen (Task 6) -------------------------------------------------------------------
// Days are 'yyyy-MM-dd' text in Bali time. Every section and age comes from the server's today, never the
// phone clock. The pure helpers below take everything they use as arguments.

// iso plus n days, as 'yyyy-MM-dd'.
function isoAddDays_(iso, n) {
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)) + n));
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// True for a real calendar day as 'yyyy-MM-dd' (2026-02-30 and 2026-13-01 are not).
function todoValidDay_(v) {
  return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && isoAddDays_(v, 0) === v;
}

// The Bali day ('yyyy-MM-dd') at ms on the phone's clock: Asia/Makassar is UTC+8 all year (no DST). '' for a bad clock.
function baliDay_(ms) {
  var d = new Date(Number(ms) + 8 * 3600000);
  if (isNaN(d.getTime())) return '';
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

// R70: the page's today, the later of the lists' server day (maybe from the cache) and the Bali day of the phone's
// clock. A cache from yesterday moves on at Bali midnight; a phone clock behind the server never moves it back.
function listsToday_(lists) {
  var server = lists && todoValidDay_(lists.today) ? lists.today : '';
  var phone = baliDay_(Date.now());
  if (!todoValidDay_(phone)) return server;
  return phone > server ? phone : server;
}

// 'Fri 14'; the month is added when the day is not in today's month: 'Tue 1 Dec'.
function todoDayLabel_(iso, today) {
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))));
  var out = days[d.getUTCDay()] + ' ' + d.getUTCDate();
  if (iso.slice(0, 7) !== String(today || '').slice(0, 7)) out += ' ' + months[d.getUTCMonth()];
  return out;
}

// The muted age chip: nothing under 7 days, then '7 days' to '13 days', then '2+ weeks' and no higher.
function todoAgeText_(ageDays) {
  var n = Math.floor(Number(ageDays) || 0);
  if (n < 7) return '';
  if (n < 14) return n + ' days';
  return '2+ weeks';
}

// The who chip. Either (and the old stored Both) is the default and shows no chip.
function todoWho_(who) {
  return (who === 'Kev' || who === 'Lili' || who === 'Couple') ? who : '';
}

// The first step still worth offering, or ''. R70: an item whose text already is its first step (it was made
// smaller to it) is already small: no chip, never named by the note, no "Make it smaller".
function todoStep_(it) {
  var step = String((it && it.firstStep) || '');
  if (!step || foldKey_(it.text) === foldKey_(step)) return '';
  return step;
}

// '5 min' for a quick item, 'First step: ...' for a bigger one that is not already small, else nothing.
function todoEffortText_(it) {
  var mins = Number(it.minutes);
  if (it.kind === 'quick') return (isFinite(mins) && mins > 0) ? mins + ' min' : '';
  var step = todoStep_(it);
  if (it.kind === 'bigger' && step) return 'First step: ' + step;
  return '';
}

// Soonest due first; on one day a set time comes first (earliest first), then the one that waited longest.
function todoCmpDue_(a, b) {
  if (a.due !== b.due) return a.due < b.due ? -1 : 1;
  var ta = a.time || '';
  var tb = b.time || '';
  if (ta !== tb) {
    if (!ta) return 1;
    if (!tb) return -1;
    return ta < tb ? -1 : 1;
  }
  return todoCmpAge_(a, b);
}

// Oldest first: the most days waited, then the earliest added, then by id. The id makes the order total, so a
// row unticked here (restore puts it at the end of the list) comes back to the same place.
function todoCmpAge_(a, b) {
  var d = (Number(b.ageDays) || 0) - (Number(a.ageDays) || 0);
  if (d) return d;
  var x = a.added || '';
  var y = b.added || '';
  if (x !== y) return x < y ? -1 : 1;
  var i = String(a.id);
  var j = String(b.id);
  return i === j ? 0 : (i < j ? -1 : 1);
}

// The five To do sections. today: due on or before today (the earlier days folded in); week: the next 7 days,
// grouped by day as {due, label, items}; later: after that; anytime: no date, under 30 days; parked: no date,
// 30 days or more. A due that is not a real 'yyyy-MM-dd' day counts as no date. items is not changed.
function todoSections_(items, today) {
  var end = isoAddDays_(today, 7);
  var out = { today: [], week: [], later: [], anytime: [], parked: [] };
  var week = [];
  (items || []).forEach(function (it) {
    var due = todoValidDay_(it.due) ? it.due : '';
    if (!due) {
      if ((Number(it.ageDays) || 0) >= 30) out.parked.push(it);
      else out.anytime.push(it);
    } else if (due <= today) {
      out.today.push(it);
    } else if (due <= end) {
      week.push(it);
    } else {
      out.later.push(it);
    }
  });
  out.today.sort(todoCmpDue_);
  week.sort(todoCmpDue_);
  out.later.sort(todoCmpDue_);
  out.anytime.sort(todoCmpAge_);
  out.parked.sort(todoCmpAge_);
  week.forEach(function (it) {
    var g = out.week[out.week.length - 1];
    if (!g || g.due !== it.due) {
      g = { due: it.due, label: todoDayLabel_(it.due, today), items: [] };
      out.week.push(g);
    }
    g.items.push(it);
  });
  return out;
}

// The one item the note names: of those that waited 7 days or more, the oldest quick one, else the oldest. An item
// already made small (todoStep_) is never named (R70).
function todoNotePick_(items) {
  var waited = (items || []).filter(function (it) {
    return (Number(it.ageDays) || 0) >= 7 && !(it.firstStep && !todoStep_(it));
  }).sort(todoCmpAge_);
  for (var i = 0; i < waited.length; i++) if (waited[i].kind === 'quick') return waited[i];
  return waited[0] || null;
}

// The note as [lead, rest]: '<text> has waited a while.' (a trailing punctuation mark of the text dropped) and the
// first step and minutes when known, else ''. Minutes only for a quick item: a bigger item's minutes are the
// whole task, not its first step (R70).
function todoNoteParts_(it) {
  var lead = String(it.text).replace(/[\s.!?,;:\u2026]+$/, '') + ' has waited a while.';
  var mins = Number(it.minutes);
  var hasMins = it.kind === 'quick' && isFinite(mins) && mins > 0;
  var step = todoStep_(it).replace(/[.\s]+$/, '');
  var rest = '';
  if (step) rest = 'First step: ' + step + (hasMins ? ', about ' + mins + ' min.' : '.');
  else if (hasMins) rest = 'About ' + mins + ' min.';
  return [lead, rest];
}

function todoNoteText_(it) {
  var p = todoNoteParts_(it);
  return p[1] ? p[0] + ' ' + p[1] : p[0];
}

// Mine: the items for me, plus Either and Couple. With no phone identity, everything.
function todoMine_(items, me) {
  if (!me) return items.slice();
  return items.filter(function (it) { return it.who === me || it.who === 'Couple' || todoWho_(it.who) === ''; });
}

// ---- To do: screen state. A repaint rebuilds the screen, so what must survive lives here.
var LS_NOTE = 'kl.noteSnooze'; // the Bali day the Anytime note shows again (yyyy-MM-dd)
var NOTE_SNOOZE = null;  // memory copy of kl.noteSnooze, so "Not now" holds for this visit even without storage
var TODO_MINE = false;   // the Mine toggle
var TODO_STRUCK = {};    // id -> {item, at}: ticked here, struck in place (at its old position) until the screen is left
var TODO_OPEN = {};      // the collapsed sections opened on this visit: later, parked, done
var TODO_PAUSE = '';     // the reminders Pause menu: '' closed, 'menu', or 'date' with the day field
var TODO_PAUSE_DAY = ''; // the day typed in that field
var TODO_PAUSE_ERR = '';
var TODO_PAUSE_ERR_NEW = false; // the error was just set: its status line goes on screen empty, then is filled
var TODO_FOCUS = '';     // the control that had focus ('tick:<id>', 'fold:later', 'mine', ...), given back after a repaint
var TODO_FOCUS_EL = null; // that control on the screen being drawn
var TODO_NOTTODAY = '';  // the earlier-day row whose "Not today" choices are open (its id)
var PLUS_PATHS = ['M12 5v14', 'M5 12h14'];
var TICK_OPEN_PATHS = ['M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17z'];
var TICK_DONE_PATHS = ['M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17z', 'M8 12.3l2.8 2.8l5.2-5.8'];

// Leaving To do: struck items go to Done today, the folds close, the Pause menu closes.
function todoLeave_() {
  TODO_STRUCK = {};
  TODO_OPEN = {};
  TODO_PAUSE = '';
  TODO_PAUSE_DAY = '';
  TODO_PAUSE_ERR = '';
  TODO_PAUSE_ERR_NEW = false;
  TODO_FOCUS = '';
  TODO_NOTTODAY = '';
}

// Marks a control with a focus key. Tapping it (its handler) or focusing it (the focusin listener on #todo)
// makes it the one a repaint gives focus back to; focusing anything without a key clears the key.
function todoKey_(e, key) {
  e.setAttribute('data-focus', key);
  if (key === TODO_FOCUS) TODO_FOCUS_EL = e;
  if (key === GRO_FOCUS) GRO_FOCUS_EL = e; // Groceries uses the same keys (the dock's Undo is keyed here)
  return e;
}

function todoIsDay_(v) {
  return todoValidDay_(v);
}

function todoSnoozedUntil_() {
  if (NOTE_SNOOZE === null) {
    var v = lsGet_(LS_NOTE);
    NOTE_SNOOZE = todoIsDay_(v) ? v : '';
  }
  return NOTE_SNOOZE;
}

function todoSnooze_(today) {
  NOTE_SNOOZE = isoAddDays_(today, 7);
  lsSet_(LS_NOTE, NOTE_SNOOZE);
  render(true);
}

// Opens the edit sheet (Task 7) on a row tap, or with the text set to the first step ("Make it smaller").
function todoOpen_(it, prefill) {
  openItemSheet_(it, 'todo', prefill);
}

// "Not today": Tomorrow or No date (which clears the time too).
function todoMove_(it, due) {
  TODO_NOTTODAY = '';
  TODO_FOCUS = 'tick:' + it.id;
  var fields = { due: due };
  if (!due && it.time) fields.time = '';
  listsQueue_({ op: 'edit', list: 'todo', id: it.id, fields: fields });
}

function todoCopy_(it) {
  var c = JSON.parse(JSON.stringify(it));
  c.fp = '';
  return c;
}

function todoTick_(it) {
  var at = 0;
  var open = (LISTS && LISTS.todo) || [];
  for (var i = 0; i < open.length; i++) if (open[i].id === it.id) at = i;
  TODO_STRUCK[it.id] = { item: todoCopy_(it), at: at };
  listsQueue_({ op: 'tick', list: 'todo', id: it.id });
}

// Unticks a struck item, or brings one back from Done today.
function todoUntick_(it) {
  delete TODO_STRUCK[it.id];
  listsQueue_({ op: 'restore', list: 'todo', id: it.id, item: todoCopy_(it) });
}

function todoPause_(until) {
  TODO_PAUSE = '';
  TODO_PAUSE_DAY = '';
  TODO_PAUSE_ERR = '';
  listsQueue_({ op: 'pause', fields: { person: whoAmI_(), until: until } });
}

// The day this phone's reminders are paused until, or '' when they are on (a pause that ended is on again).
function todoPausedUntil_(lists, me) {
  var p = lists && lists.prefs && lists.prefs[me];
  var u = p ? p.pausedUntil : '';
  var today = listsToday_(lists);
  return (todoIsDay_(u) && todoIsDay_(today) && u >= today) ? u : '';
}

// What the screen shows: the open items with the struck ones back in their places, Mine applied, in sections.
function todoView_(lists, me, mineOnly) {
  var open = Array.isArray(lists.todo) ? lists.todo : [];
  var openIds = {};
  open.forEach(function (it) { openIds[it.id] = true; });
  var struck = [];
  Object.keys(TODO_STRUCK).forEach(function (id) {
    // Open again (a conflict, or brought back elsewhere): it is not struck any more.
    if (openIds[id]) delete TODO_STRUCK[id];
    else struck.push(TODO_STRUCK[id]);
  });
  struck.sort(function (a, b) { return a.at - b.at; });
  var all = open.slice();
  struck.forEach(function (s) { all.splice(Math.min(s.at, all.length), 0, s.item); });
  var done = (Array.isArray(lists.doneToday) ? lists.doneToday : []).filter(function (it) {
    return it && it.list === 'todo' && !TODO_STRUCK[it.id];
  });
  if (mineOnly && me) {
    all = todoMine_(all, me);
    done = todoMine_(done, me);
  }
  var today = listsToday_(lists);
  var sections = todoSections_(all, today);
  var dueToday = sections.today.filter(function (it) { return !TODO_STRUCK[it.id]; }).length;
  return { today: today, sections: sections, done: done, count: all.length, dueToday: dueToday };
}

function renderTodo_(data, me, mineOnly) {
  var root = $('todo');
  var lists = data === undefined ? LISTS : data;
  if (me === undefined) me = whoAmI_();
  if (mineOnly === undefined) mineOnly = TODO_MINE;
  var view = lists ? todoView_(lists, me, mineOnly) : null;
  TODO_FOCUS_EL = null;
  var title = listsPanel_(root, 'To do', view && view.dueToday > 0 ? 'Today: ' + view.dueToday : '');
  var body = add(root, 'div', 'wrap');
  listsProblems_(body, lists);
  if (!me) renderWhoCard_(body);
  var main = add(body, 'div', 'lists-main');
  if (!view) {
    listsWaiting_(main);
  } else {
    if (me) {
      var top = add(main, 'div', 'todo-top');
      var mine = todoKey_(btn(top, 'mine', 'Mine', function () {
        TODO_FOCUS = 'mine';
        TODO_MINE = !TODO_MINE;
        render(true);
      }), 'mine');
      mine.setAttribute('aria-pressed', mineOnly ? 'true' : 'false');
    }
    todoMain_(main, view);
  }
  if (me) todoSettings_(body, lists, me);
  add(body, 'div', 'list-end');
  var dock = listsDock_(root);
  if (view) {
    var plus = todoKey_(btn(dock, 'todo-add', null, function () {
      TODO_FOCUS = 'add';
      openItemSheet_(null, 'todo');
    }), 'add');
    plus.setAttribute('aria-label', 'Add a to-do');
    plus.appendChild(svgIcon_(PLUS_PATHS));
  }
  // An open sheet keeps focus: a repaint behind it never moves focus (iOS would close the keyboard).
  if (TODO_FOCUS_EL && !SHEET) TODO_FOCUS_EL.focus({ preventScroll: true });
  return title;
}

function todoMain_(main, view) {
  var s = view.sections;
  var today = view.today;
  if (!view.count) add(main, 'p', 'todo-empty', 'Nothing here. Tap + or tell the bot.');
  if (s.today.length) {
    var t = todoSection_(main, 'today', 'Today');
    s.today.forEach(function (it) { todoRow_(t, it, today, 'today'); });
  }
  if (s.week.length) {
    var w = todoSection_(main, 'week', 'This week');
    s.week.forEach(function (g) {
      add(w, 'p', 'todo-day', g.label);
      g.items.forEach(function (it) { todoRow_(w, it, today, 'week'); });
    });
  }
  if (s.later.length) {
    var l = add(main, 'div', 'todo-sec todo-sec-later');
    if (todoFold_(l, 'later', 'Later · ' + s.later.length + ' · next ' + todoDayLabel_(s.later[0].due, today))) {
      s.later.forEach(function (it) { todoRow_(l, it, today, 'later'); });
    }
  }
  if (s.anytime.length) {
    var a = todoSection_(main, 'anytime', 'Anytime');
    var pick = todoSnoozedUntil_() && today < todoSnoozedUntil_() ? null
      : todoNotePick_(s.anytime.filter(function (it) { return !TODO_STRUCK[it.id]; }));
    if (pick) todoNote_(a, pick, today);
    s.anytime.forEach(function (it) { todoRow_(a, it, today, 'anytime'); });
  }
  if (s.parked.length) {
    var p = add(main, 'div', 'todo-sec todo-sec-parked');
    if (todoFold_(p, 'parked', 'Parked · ' + s.parked.length)) {
      s.parked.forEach(function (it) { todoRow_(p, it, today, 'parked'); });
    }
  }
  if (view.done.length) {
    var d = add(main, 'div', 'todo-sec todo-sec-done');
    if (todoFold_(d, 'done', 'Done today')) {
      view.done.forEach(function (it) { todoRow_(d, it, today, 'done'); });
    }
  }
}

function todoSection_(main, key, heading) {
  var sec = add(main, 'div', 'todo-sec todo-sec-' + key);
  add(sec, 'h2', '', heading);
  return sec;
}

// A collapsed section's header. True when it is open.
function todoFold_(sec, key, label) {
  var h = add(sec, 'h2', 'todo-fold-h');
  var b = todoKey_(btn(h, 'todo-fold', label, function () {
    TODO_FOCUS = 'fold:' + key;
    TODO_OPEN[key] = !TODO_OPEN[key];
    render(true);
  }), 'fold:' + key);
  b.setAttribute('aria-expanded', TODO_OPEN[key] ? 'true' : 'false');
  return !!TODO_OPEN[key];
}

// One row: the tick zone, the text (2 lines at most), then the chips. where says which section it is in.
function todoRow_(parent, it, today, where) {
  var done = where === 'done' || !!TODO_STRUCK[it.id];
  var row = add(parent, 'div', 'todo-row' + (done ? ' is-done' : ''));
  var tick = todoKey_(btn(row, 'tick-zone', null, function () {
    TODO_FOCUS = 'tick:' + it.id;
    if (done) todoUntick_(it);
    else todoTick_(it);
  }), 'tick:' + it.id);
  tick.setAttribute('aria-label', 'Done: ' + it.text);
  tick.setAttribute('aria-pressed', done ? 'true' : 'false');
  tick.appendChild(svgIcon_(done ? TICK_DONE_PATHS : TICK_OPEN_PATHS));
  var main = done ? add(row, 'div', 'todo-open') : todoKey_(btn(row, 'todo-open', null, function () {
    TODO_FOCUS = 'open:' + it.id;
    todoOpen_(it);
  }), 'open:' + it.id);
  add(main, 'span', 'todo-text', it.text);
  // Rows from earlier days: "Not today" opens two choices under the row, Tomorrow and No date.
  if (where === 'today' && !done && todoValidDay_(today) && it.due < today) {
    var later = todoKey_(btn(row, 'textbtn todo-nottoday', 'Not today', function () {
      TODO_FOCUS = 'nottoday:' + it.id;
      TODO_NOTTODAY = TODO_NOTTODAY === it.id ? '' : it.id;
      render(true);
    }), 'nottoday:' + it.id);
    later.setAttribute('aria-expanded', TODO_NOTTODAY === it.id ? 'true' : 'false');
    if (TODO_NOTTODAY === it.id) {
      var menu = add(parent, 'div', 'todo-nottoday-menu');
      menu.setAttribute('role', 'group');
      menu.setAttribute('aria-label', 'Not today');
      btn(menu, 'btn-plain', 'Tomorrow', function () { todoMove_(it, isoAddDays_(today, 1)); });
      btn(menu, 'btn-plain', 'No date', function () { todoMove_(it, ''); });
    }
  }
  // R53: a parked item comes back with today's date (the page's day, R70), which puts it under Today.
  if (where === 'parked' && !done && todoValidDay_(today)) {
    btn(row, 'textbtn todo-revive', 'Bring back', function () {
      TODO_FOCUS = 'tick:' + it.id;
      listsQueue_({ op: 'edit', list: 'todo', id: it.id, fields: { due: today } });
    });
  }
  var chips = [];
  var who = todoWho_(it.who);
  if (who) chips.push([who, 'tchip-who tchip-' + who.toLowerCase()]);
  var effort = todoEffortText_(it);
  if (effort) chips.push([effort, 'tchip-effort']);
  var age = todoAgeText_(it.ageDays);
  if (age) chips.push([age, 'tchip-age']);
  if (where === 'today' && today && it.due < today) chips.push(['from ' + todoDayLabel_(it.due, today), 'tchip-from']);
  else if (where === 'later') chips.push([todoDayLabel_(it.due, today) + (it.time ? ' ' + it.time : ''), 'tchip-date']);
  else if (it.time && (where === 'today' || where === 'week')) chips.push([it.time, 'tchip-date']);
  if (!chips.length) return;
  var box = add(main, 'span', 'todo-chips');
  chips.forEach(function (c) { add(box, 'span', 'tchip ' + c[1], c[0]); });
}

// The calm note at the top of Anytime: one item, its first step, two ways out.
function todoNote_(parent, it, today) {
  var n = add(parent, 'div', 'todo-note');
  n.setAttribute('role', 'note');
  var parts = todoNoteParts_(it);
  add(n, 'p', 'todo-note-lead', parts[0]);
  if (parts[1]) add(n, 'p', '', parts[1]);
  var actions = add(n, 'div', 'todo-note-actions');
  // R55: only with a first step to make it smaller to; R70: never for an item already made small.
  var step = todoStep_(it);
  if (step) btn(actions, 'btn-plain', 'Make it smaller', function () { todoOpen_(it, { text: step }); });
  btn(actions, 'btn-plain', 'Not now', function () { todoSnooze_(today); });
}

// The two lines at the bottom: this phone, and its reminders.
function todoSettings_(body, lists, me) {
  var phone = add(body, 'p', 'lists-settings small');
  phone.appendChild(document.createTextNode('This phone: ' + me));
  add(phone, 'span', 'sep', '·').setAttribute('aria-hidden', 'true');
  btn(phone, 'textbtn', 'Change', function () {
    TODO_FOCUS = '';
    setWhoAmI_('');
    TODO_MINE = false;
    render(true);
  });
  var today = lists ? listsToday_(lists) : '';
  if (!todoIsDay_(today)) return;
  var until = todoPausedUntil_(lists, me);
  var line = add(body, 'p', 'lists-settings small');
  line.appendChild(document.createTextNode(until ? 'Reminders: paused until ' + todoDayLabel_(until, today) : 'Reminders: on'));
  add(line, 'span', 'sep', '·').setAttribute('aria-hidden', 'true');
  if (until) {
    todoKey_(btn(line, 'textbtn', 'Resume', function () {
      TODO_FOCUS = 'pause';
      todoPause_('');
    }), 'resume');
    return;
  }
  var pause = todoKey_(btn(line, 'textbtn', 'Pause', function () {
    TODO_FOCUS = 'pause';
    TODO_PAUSE = TODO_PAUSE ? '' : 'menu';
    TODO_PAUSE_ERR = '';
    render(true);
  }), 'pause');
  pause.setAttribute('aria-expanded', TODO_PAUSE ? 'true' : 'false');
  if (!TODO_PAUSE) return;
  var menu = add(body, 'div', 'pause-menu');
  if (TODO_PAUSE === 'menu') {
    btn(menu, 'btn-plain', '1 week', function () {
      TODO_FOCUS = 'resume';
      todoPause_(isoAddDays_(today, 7));
    });
    btn(menu, 'btn-plain', '2 weeks', function () {
      TODO_FOCUS = 'resume';
      todoPause_(isoAddDays_(today, 14));
    });
    btn(menu, 'btn-plain', 'Until a date', function () {
      TODO_FOCUS = 'pause-day';
      TODO_PAUSE = 'date';
      render(true);
    });
    return;
  }
  var field = todoKey_(add(menu, 'input', ''), 'pause-day');
  field.setAttribute('type', 'date');
  field.setAttribute('min', isoAddDays_(today, 1));
  field.setAttribute('max', isoAddDays_(today, 60));
  field.setAttribute('aria-label', 'Pause reminders until');
  field.value = TODO_PAUSE_DAY;
  var keep = function () { TODO_PAUSE_DAY = field.value; };
  field.addEventListener('input', keep);
  field.addEventListener('change', keep);
  btn(menu, 'btn-plain', 'Pause until then', function () {
    var day = field.value;
    if (!todoIsDay_(day) || day <= today || day > isoAddDays_(today, 60)) {
      TODO_PAUSE_DAY = day;
      TODO_PAUSE_ERR = 'Pick a day in the next 60 days.';
      TODO_PAUSE_ERR_NEW = true;
      TODO_FOCUS = 'pause-day';
      render(true);
      return;
    }
    TODO_FOCUS = 'resume';
    todoPause_(day);
  });
  // The status line is always there while the field is. A fresh error goes in after it is on screen, so screen
  // readers announce it; a repaint after that draws it filled, with no second announcement.
  var status = add(menu, 'p', 'pause-error');
  status.setAttribute('role', 'status');
  if (TODO_PAUSE_ERR_NEW) {
    TODO_PAUSE_ERR_NEW = false;
    var msgText = TODO_PAUSE_ERR;
    setTimeout(function () { status.textContent = msgText; }, 100);
  } else {
    status.textContent = TODO_PAUSE_ERR;
  }
}

// ---- the item sheet (Task 7): edit or add one item; closing it saves ------------------------------
// One sheet for both lists. The list decides the fields: To do has text, When, Who and More > Time; Groceries
// has text and a Shop slot (Task 8 fills it through sheetShop_). The sheet lives in the static #sheet, outside
// the screens, so a repaint behind it never rebuilds it or moves its focus. Closing it (tap outside, Escape,
// back, swipe down, Save, Enter in the text) sends the change as one edit or one add through the queue; no
// change sends nothing; a new item with no text is dropped.
var SHEET_FIELDS = { todo: ['text', 'who', 'due', 'time'], grocery: ['text', 'shop'] }; // the user fields each list edits
var SHEET = null;          // the open sheet: {list, id, orig, draft, today, chips, pick, more, returnKey, els, ctls, focusEl}
var SHEET_IN_HISTORY = false; // the open sheet added a history step, so the phone's back closes it
var SHEET_POPS = 0;        // our own history.back() calls whose popstate has not arrived yet
var LISTS_UNDO = null;     // {list, item}: the "Deleted. Undo" line, for 6 s
var LISTS_UNDO_TIMER = null;
var LISTS_UNDO_SAY = null; // the "Deleted." status line on screen now

// Who as the sheet shows it: the old stored Both, blank and anything unknown read as Either.
function sheetWho_(who) {
  return (who === 'Kev' || who === 'Lili' || who === 'Couple') ? who : 'Either';
}

// The When day chips from the server's Bali day: Today, Tomorrow, then the next 5 weekday names.
function sheetWhenChips_(today) {
  if (!todoValidDay_(today)) return [];
  var out = [{ label: 'Today', due: today }, { label: 'Tomorrow', due: isoAddDays_(today, 1) }];
  for (var n = 2; n < 7; n++) {
    var d = isoAddDays_(today, n);
    out.push({ label: todoDayLabel_(d, d).split(' ')[0], due: d });
  }
  return out;
}

// The sheet's starting values: the item's, or for a new item no text, this phone's Who (else Either), no
// date. prefill.text ("Make it smaller") replaces the starting text and keeps the rest.
function sheetDraft_(list, it, prefill, me) {
  var d = it
    ? { text: String(it.text || ''), who: sheetWho_(it.who), due: String(it.due || ''), time: String(it.time || ''), shop: String(it.shop || '') }
    : { text: '', who: sheetWho_(me), due: '', time: '', shop: '' };
  if (prefill && typeof prefill.text === 'string') d.text = prefill.text;
  return d;
}

// M4: pasted line breaks (and the spaces around them) become one space; the ends are trimmed.
function sheetOneLine_(v) {
  return String(v === undefined || v === null ? '' : v).replace(/\s*[\r\n]+\s*/g, ' ').trim();
}

// The fields of an edit: only those the list allows and the draft changed, or null for no change. Text is
// trimmed; an emptied text keeps the old one (the server needs 1 to 500 characters). Text is compared before the
// 500 cut (R71), so an untouched long item is never sent and never shortened; edited text goes cut to 500 (R70).
function sheetDiff_(list, orig, draft) {
  var out = {};
  var any = false;
  (SHEET_FIELDS[list] || []).forEach(function (k) {
    var was = String(orig[k] === undefined || orig[k] === null ? '' : orig[k]);
    var now = String(draft[k] === undefined || draft[k] === null ? '' : draft[k]);
    if (k === 'text' || k === 'shop') {
      was = sheetOneLine_(was);
      now = sheetOneLine_(now);
      if (k === 'text' && !now) return;
    }
    if (k === 'who') {
      was = sheetWho_(was);
      now = sheetWho_(now);
    }
    var send = k === 'text' ? now.slice(0, 500).trim() : now;
    if (now !== was && send !== was) { // a cut that lands on the stored text is no change either
      out[k] = send;
      any = true;
    }
  });
  return any ? out : null;
}

// The fields of an add, or null when there is no text (the new item is dropped). A time goes only with a day.
function sheetAddFields_(list, d) {
  var text = sheetOneLine_(d.text).slice(0, 500).trim(); // R70: 500 at most, as the Groceries add field
  if (!text) return null;
  if (list === 'grocery') {
    var shop = sheetOneLine_(d.shop);
    return shop ? { text: text, shop: shop } : { text: text };
  }
  var f = { text: text, who: sheetWho_(d.who) };
  if (todoValidDay_(d.due)) {
    f.due = d.due;
    if (/^\d{2}:\d{2}$/.test(d.time || '')) f.time = d.time;
  }
  return f;
}

// item null opens an empty sheet for a new item. prefill: {text} sets the starting text.
function openItemSheet_(it, list, prefill) {
  list = list === 'grocery' ? 'grocery' : 'todo';
  if (SHEET) closeItemSheet_('replace');
  var cur = it && it.id ? (listsItem_(list, it.id) || it) : null;
  var orig = cur ? JSON.parse(JSON.stringify(cur)) : null;
  var today = LISTS ? listsToday_(LISTS) : '';
  var s = {
    list: list, id: orig ? orig.id : '', orig: orig, draft: sheetDraft_(list, orig, prefill, whoAmI_()),
    today: today, chips: sheetWhenChips_(today), more: false, pick: false,
    returnKey: orig ? 'open:' + orig.id : 'add', els: {}, ctls: [], focusEl: null, touch: null,
  };
  s.more = !!s.draft.time;
  s.pick = !!s.draft.due && !s.chips.some(function (c) { return c.due === s.draft.due; });
  SHEET = s;
  sheetBuild_(s);
  sheetInert_(true);
  if (!SHEET_IN_HISTORY) {
    var h = window.history;
    if (h && typeof h.pushState === 'function') {
      try {
        h.pushState({ sheet: 1 }, '');
        SHEET_IN_HISTORY = true;
      } catch (e) {}
    }
  }
  // A new item or a smaller first step: straight into the text. An edit: the dialog itself, so the phone
  // keyboard does not cover the chips.
  s.focusEl = (orig && !prefill) ? s.els.panel : s.els.text;
  s.focusEl.focus({ preventScroll: true });
}

// how: 'close' (tap outside, Escape, swipe, Save, Enter), 'back' (the phone's back), 'nav' (the screen changes),
// 'lock' (lock-out), 'replace' (another sheet opens), 'hide' (pagehide, R58). Every one saves; only close and back give focus back.
function closeItemSheet_(how) {
  var s = SHEET;
  if (!s) return null;
  sheetShut_(how);
  var op = sheetOp_(s);
  var quiet = how === 'nav' || how === 'lock' || how === 'replace' || how === 'hide';
  if (!quiet && s.list === 'todo') TODO_FOCUS = s.returnKey;
  if (!quiet && s.list === 'grocery') GRO_FOCUS = s.returnKey;
  if (op) listsQueue_(op);
  else if (!quiet) listsPaint_();
  return op;
}

function sheetShut_(how) {
  SHEET = null;
  var root = $('sheet');
  root.textContent = '';
  root.hidden = true;
  sheetInert_(false);
  if (!SHEET_IN_HISTORY || how === 'replace') return;
  SHEET_IN_HISTORY = false;
  // Closed by a tap: remove the history step it added. Back already removed it; a screen change or a
  // lock-out leaves it, as a step back that does nothing.
  if (how !== 'close') return;
  var h = window.history;
  if (h && typeof h.back === 'function') {
    SHEET_POPS++;
    h.back();
  }
}

// The op the closed sheet sends, or null. When the item changed elsewhere while the sheet was open, the edit
// goes with the fp from when it opened, so the server refuses it ("This item changed. Refreshed.") instead
// of writing over the other change.
function sheetOp_(s) {
  if (typeof s.finish === 'function') s.finish(); // Task 8: the shop as typed becomes a known shop's spelling
  if (!s.orig) {
    var fields = sheetAddFields_(s.list, s.draft);
    return fields ? { op: 'add', list: s.list, fields: fields } : null;
  }
  var diff = sheetDiff_(s.list, s.orig, s.draft);
  if (!diff) return null;
  var op = { op: 'edit', list: s.list, id: s.id, fields: diff };
  var cur = listsItem_(s.list, s.id);
  if (cur && s.orig.fp && sheetDiff_(s.list, s.orig, sheetDraft_(s.list, cur))) op.fp = s.orig.fp;
  return op;
}

// Delete: one delete through the queue, and "Deleted. Undo" for 6 s. The draft is dropped.
function sheetDelete_() {
  var s = SHEET;
  if (!s || !s.orig) return;
  sheetShut_('close');
  var cur = listsItem_(s.list, s.id) || s.orig;
  listsUndoStart_(s.list, todoCopy_(cur));
  if (s.list === 'todo') TODO_FOCUS = 'undo';
  else GRO_FOCUS = 'undo';
  listsQueue_({ op: 'delete', list: s.list, id: s.id });
}

function listsUndoStart_(list, snap) {
  listsUndoClear_();
  LISTS_UNDO = { list: list, item: snap };
  LISTS_UNDO_TIMER = setTimeout(function () {
    LISTS_UNDO_TIMER = null;
    LISTS_UNDO = null;
    if (TODO_FOCUS === 'undo') TODO_FOCUS = 'add';
    if (GRO_FOCUS === 'undo') GRO_FOCUS = '';
    listsPaint_();
  }, 6000);
}

function listsUndoClear_() {
  if (LISTS_UNDO_TIMER !== null) clearTimeout(LISTS_UNDO_TIMER);
  LISTS_UNDO_TIMER = null;
  LISTS_UNDO = null;
  LISTS_UNDO_SAY = null;
}

// Undo: a restore with the item as it was, so it shows again at once.
function listsUndo_() {
  var u = LISTS_UNDO;
  if (!u) return;
  listsUndoClear_();
  if (u.list === 'todo') TODO_FOCUS = 'tick:' + u.item.id;
  else GRO_FOCUS = 'tick:' + u.item.id;
  listsQueue_({ op: 'restore', list: u.list, id: u.item.id, item: u.item });
}

// Everything behind the sheet is inert while it is open.
function sheetInert_(on) {
  ['home', 'month', 'trends', 'balance', 'todo', 'groceries', 'tabbar'].forEach(function (id) { $(id).inert = on; });
}

// A control in the sheet, in screen order, for the Tab loop. shown says when it is on screen.
function sheetCtl_(s, e, shown) {
  s.ctls.push({ e: e, shown: shown || null });
  return e;
}

function sheetFocusables_(s) {
  return s.ctls.filter(function (c) { return !c.e.disabled && (!c.shown || c.shown()); }).map(function (c) { return c.e; });
}

function sheetKey_(e) {
  var s = SHEET;
  if (!s || !e) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeItemSheet_('close');
    return;
  }
  if (e.key !== 'Tab') return;
  var list = sheetFocusables_(s);
  if (!list.length) return;
  var i = list.indexOf(e.target);
  if (e.shiftKey && i <= 0) {
    e.preventDefault();
    list[list.length - 1].focus();
  } else if (!e.shiftKey && (i === -1 || i === list.length - 1)) {
    e.preventDefault();
    list[0].focus();
  }
}

function sheetPopState_() {
  if (SHEET_POPS > 0) { SHEET_POPS--; return; }
  if (!SHEET) return;
  SHEET_IN_HISTORY = false;
  closeItemSheet_('back');
}

// After a repaint: focus stays in the sheet (it normally never left; this is the fallback).
function sheetClaimFocus_() {
  var s = SHEET;
  if (!s) return;
  var a = document.activeElement;
  var root = $('sheet');
  if (a && typeof root.contains === 'function' && root.contains(a)) return;
  var t = s.focusEl || s.els.panel;
  if (t) t.focus({ preventScroll: true });
}

function sheetGrow_(ta) {
  ta.style.height = 'auto';
  if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px';
}

function sheetTitle_(s) {
  if (s.list === 'grocery') return s.orig ? 'Edit item' : 'New item';
  return s.orig ? 'Edit to-do' : 'New to-do';
}

function sheetBuild_(s) {
  var root = $('sheet');
  root.textContent = '';
  var shade = add(root, 'div', 'sheet-backdrop');
  shade.addEventListener('click', function () { if (SHEET === s) closeItemSheet_('close'); });
  var p = add(root, 'div', 'sheet-panel');
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-modal', 'true');
  p.setAttribute('aria-label', sheetTitle_(s));
  p.setAttribute('tabindex', '-1');
  s.els.panel = p;
  // A swipe down closes it; a short or sideways one, or one while the sheet is scrolled, does not.
  p.addEventListener('touchstart', function (e) {
    // M1: a drag that starts in a text or date field is selecting or scrolling there, never a close.
    for (var n = e && e.target; n && n !== p; n = n.parentNode) {
      if (/^(TEXTAREA|INPUT|SELECT)$/.test(String(n.tagName || ''))) {
        s.touch = null;
        return;
      }
    }
    var t = e && e.touches && e.touches[0];
    s.touch = t ? { x: t.clientX, y: t.clientY, top: p.scrollTop || 0 } : null;
  }, { passive: true });
  p.addEventListener('touchend', function (e) {
    var a = s.touch;
    var t = e && e.changedTouches && e.changedTouches[0];
    s.touch = null;
    if (!a || !t || SHEET !== s || a.top > 0) return;
    var dy = t.clientY - a.y;
    var dx = t.clientX - a.x;
    if (dy > 80 && dy > Math.abs(dx) * 1.5) closeItemSheet_('close');
  }, { passive: true });
  add(p, 'div', 'sheet-handle').setAttribute('aria-hidden', 'true');
  var ta = sheetCtl_(s, add(p, 'textarea', 'sheet-text'));
  ta.setAttribute('aria-label', s.list === 'grocery' ? 'Item' : 'To-do');
  ta.setAttribute('maxlength', '500');
  ta.setAttribute('rows', '1');
  ta.setAttribute('enterkeyhint', 'done');
  ta.value = s.draft.text;
  ta.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.text = ta.value;
    sheetGrow_(ta);
  });
  // Enter saves and closes; a to-do is one line.
  ta.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      closeItemSheet_('close');
    }
  });
  s.els.text = ta;
  if (s.list === 'todo') sheetTodoFields_(p, s);
  else {
    s.els.shop = add(p, 'div', 'sheet-shop');
    if (typeof sheetShop_ === 'function') sheetShop_(s.els.shop, s); // Task 8
  }
  var foot = add(p, 'div', 'sheet-foot');
  if (s.orig) sheetCtl_(s, btn(foot, 'textbtn sheet-delete', 'Delete', sheetDelete_));
  sheetCtl_(s, btn(foot, 'btn-main sheet-save', 'Save', function () { if (SHEET === s) closeItemSheet_('close'); }));
  root.hidden = false;
  sheetSync_(s);
  sheetGrow_(ta);
}

// To do: When (day chips, Pick a day, No date), Who, and More with Time.
function sheetTodoFields_(p, s) {
  s.sync = [];
  var group = function (id, label) {
    add(p, 'p', 'sheet-label', label).setAttribute('id', id);
    var g = add(p, 'div', 'sheet-chips');
    g.setAttribute('role', 'group');
    g.setAttribute('aria-labelledby', id);
    return g;
  };
  var chip = function (g, label, onTap, isOn) {
    var b = sheetCtl_(s, btn(g, 'schip', label, function () {
      if (SHEET !== s) return;
      onTap();
      sheetSync_(s);
    }));
    s.sync.push(function () { b.setAttribute('aria-pressed', isOn() ? 'true' : 'false'); });
    return b;
  };
  var when = group('sheet-when', 'When');
  s.chips.forEach(function (c) {
    chip(when, c.label, function () {
      s.draft.due = c.due;
      s.pick = false;
    }, function () { return !s.pick && s.draft.due === c.due; });
  });
  chip(when, 'Pick a day', function () { s.pick = true; }, function () { return s.pick; });
  chip(when, 'No date', function () {
    s.draft.due = '';
    s.draft.time = '';
    s.pick = false;
  }, function () { return !s.pick && !s.draft.due; });
  var day = sheetCtl_(s, add(p, 'input', 'sheet-day'), function () { return s.pick; });
  day.setAttribute('type', 'date');
  day.setAttribute('aria-label', 'Pick a day');
  if (s.today) day.setAttribute('min', s.today);
  // I1: the field always shows the day that will be saved. A partial or cleared entry keeps the day; the
  // field shows it again once the entry is done (change), never in the middle of typing (input).
  var takeDay = function (resync) {
    if (SHEET !== s) return;
    var ok = todoValidDay_(day.value);
    if (ok) s.draft.due = day.value;
    if (ok || resync) sheetSync_(s);
  };
  day.addEventListener('input', function () { takeDay(false); });
  day.addEventListener('change', function () { takeDay(true); });
  s.sync.push(function () {
    day.hidden = !s.pick;
    if (s.pick) day.value = todoValidDay_(s.draft.due) ? s.draft.due : '';
  });
  var who = group('sheet-who', 'Who');
  ['Kev', 'Lili', 'Either', 'Couple'].forEach(function (name) {
    chip(who, name, function () { s.draft.who = name; }, function () { return sheetWho_(s.draft.who) === name; });
  });
  var more = sheetCtl_(s, btn(p, 'textbtn sheet-more', 'More', function () {
    if (SHEET !== s) return;
    s.more = !s.more;
    sheetSync_(s);
  }));
  var box = add(p, 'div', 'sheet-time');
  add(box, 'p', 'sheet-label', 'Time').setAttribute('aria-hidden', 'true');
  var time = sheetCtl_(s, add(box, 'input', ''), function () { return s.more; });
  time.setAttribute('type', 'time');
  time.setAttribute('aria-label', 'Time');
  time.value = s.draft.time;
  var takeTime = function () {
    if (SHEET !== s) return;
    var v = String(time.value || '');
    s.draft.time = /^\d{2}:\d{2}/.test(v) ? v.slice(0, 5) : '';
  };
  time.addEventListener('input', takeTime);
  time.addEventListener('change', takeTime);
  var needDay = add(box, 'p', 'small', 'Set a day to add a time.');
  s.sync.push(function () {
    var hasDay = todoValidDay_(s.draft.due);
    more.setAttribute('aria-expanded', s.more ? 'true' : 'false');
    box.hidden = !s.more;
    time.disabled = !hasDay;
    time.value = s.draft.time; // M3: shown is saved; No date clears draft.time itself
    needDay.hidden = hasDay;
  });
}

function sheetSync_(s) {
  (s.sync || []).forEach(function (f) { f(); });
}

// ---- Groceries screen (Task 8) -----------------------------------------------------------------
// A plain list: no shop names unless a shop is picked. The pinned "Add an item" field is built once per visit
// and kept through every repaint (only the parts above and below it are rebuilt), so a reply or the 60 s
// refresh never takes the phone keyboard away while someone types the next item.

// The compare key for item and shop names: lowercase, accents removed, the typographic apostrophe as a
// plain one, ends trimmed, inner spaces collapsed ("Pépito " is "pepito").
function foldKey_(s) {
  var t = String(s === undefined || s === null ? '' : s);
  if (typeof t.normalize === 'function') t = t.normalize('NFD');
  return t.replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, '\u0027').toLowerCase().replace(/\s+/g, ' ').trim();
}

// The shops known to this phone, one per folded name: the server's list (newest spelling first), then any
// shop on an open item that it does not have yet.
function groKnownShops_(lists) {
  var out = [];
  var seen = {};
  var take = function (v) {
    if (typeof v !== 'string') return;
    var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
    var k = foldKey_(t);
    if (!k || seen[k]) return;
    seen[k] = true;
    out.push(t);
  };
  (lists && Array.isArray(lists.shops) ? lists.shops : []).forEach(take);
  (lists && Array.isArray(lists.groceries) ? lists.groceries : []).forEach(function (it) { if (it) take(it.shop); });
  return out;
}

// How many open items each shop has, in the order of shops.
function groShopCounts_(items, shops) {
  return shops.map(function (shop) {
    var k = foldKey_(shop);
    return { shop: shop, n: items.filter(function (it) { return !!k && foldKey_(it.shop) === k; }).length };
  });
}

// The filtered view: that shop's items, then items with no shop, then the rest. Order is kept in each part.
function groSplit_(items, shop) {
  var k = foldKey_(shop);
  var out = { here: [], any: [], elsewhere: [] };
  items.forEach(function (it) {
    var s = foldKey_(it.shop);
    if (!s) out.any.push(it);
    else if (s === k) out.here.push(it);
    else out.elsewhere.push(it);
  });
  return out;
}

// The shop in a stored kl.shop value ({shop, at}), or '' when there is none, it is malformed, or it was set
// more than 3 hours before now (a time well ahead of the clock is not trusted either).
function groShopFrom_(raw, now) {
  if (!raw || typeof raw !== 'string') return '';
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { return ''; }
  if (!o || typeof o.shop !== 'string' || typeof o.at !== 'number') return '';
  var shop = sheetOneLine_(o.shop);
  if (!shop || shop.length > 40) return '';
  var age = now - o.at;
  return (age >= -60000 && age <= 3 * 3600 * 1000) ? shop : '';
}

// A shop as typed: one line, inner spaces collapsed, 40 characters at most; a known shop that matches it
// without case or accents gives its own spelling.
function groShopCanon_(v, shops) {
  var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
  var k = foldKey_(t);
  if (!k) return '';
  for (var i = 0; i < shops.length; i++) if (foldKey_(shops[i]) === k) return String(shops[i]).slice(0, 40);
  return t;
}

var LS_SHOP = 'kl.shop';  // the shop filter, as {shop, at}; ignored 3 hours after it was set
var GRO_SHOP_RAW = null;  // memory copy of kl.shop, so the filter holds for this visit even without storage
var GRO = null;           // the screen's kept parts on show now: {head, box, field, note, rest}
var GRO_DRAFT = '';       // what is typed in the add field, kept in memory across visits (never stored)
var GRO_NOTE = '';        // the line under the add field ("Already on the list")
var GRO_STRUCK = {};      // id -> {item}: ticked here, struck in place until the screen is left
var GRO_POS = {};         // id -> place on this visit, so an item ticked and unticked comes back in its place
var GRO_SEQ = 0;
var GRO_MENU = false;     // the Shop menu is open
var GRO_ELSEWHERE = false; // the "N more elsewhere" items are shown
var GRO_DONE_OPEN = false; // the collapsed Bought today section is open
var GRO_FOCUS = '';       // the keyed control that had focus, given back after a repaint
var GRO_FOCUS_EL = null;
var GRO_TIMER = null;     // the 60 s refresh while Groceries is on show and the page is visible

// Leaving Groceries: struck items go to Bought today, the menu and folds close, the refresh stops.
function groLeave_() {
  GRO_STRUCK = {};
  GRO_POS = {};
  GRO_SEQ = 0;
  GRO_MENU = false;
  GRO_ELSEWHERE = false;
  GRO_DONE_OPEN = false;
  GRO_FOCUS = '';
  GRO_NOTE = '';
  groTimerStop_();
}

// clearScreens: a repaint of Groceries keeps the add field (and its focus and text); anything else empties it.
function groClear_() {
  if (GRO && VIEW.screen === 'groceries' && TOKEN) {
    GRO.head.textContent = '';
    GRO.rest.textContent = '';
    return;
  }
  $('groceries').textContent = '';
  GRO = null;
}

function groKey_(e, key) {
  e.setAttribute('data-focus', key);
  if (key === GRO_FOCUS) GRO_FOCUS_EL = e;
  return e;
}

function groShop_() {
  if (GRO_SHOP_RAW === null) GRO_SHOP_RAW = lsGet_(LS_SHOP) || '';
  var shop = groShopFrom_(GRO_SHOP_RAW, Date.now());
  if (!shop && GRO_SHOP_RAW) {
    GRO_SHOP_RAW = '';
    GRO_ELSEWHERE = false;
    lsDel_(LS_SHOP);
  }
  return shop;
}

function groSetShop_(shop) {
  GRO_ELSEWHERE = false;
  if (shop) {
    GRO_SHOP_RAW = JSON.stringify({ shop: shop, at: Date.now() });
    lsSet_(LS_SHOP, GRO_SHOP_RAW);
  } else {
    GRO_SHOP_RAW = '';
    lsDel_(LS_SHOP);
  }
}

function groSay_(t) {
  GRO_NOTE = t;
  if (GRO && GRO.note) GRO.note.textContent = t;
}

// One add, unless that text (without case or accents) is already on the list.
function groAdd_(raw) {
  var text = sheetOneLine_(raw).slice(0, 500).trim();
  if (!text) return false;
  var key = foldKey_(text);
  var open = (LISTS && Array.isArray(LISTS.groceries)) ? LISTS.groceries : [];
  if (open.some(function (it) { return foldKey_(it.text) === key; })) {
    groSay_('Already on the list');
    return false;
  }
  groSay_('');
  listsQueue_({ op: 'add', list: 'grocery', fields: { text: text } });
  return true;
}

function groTick_(it) {
  GRO_STRUCK[it.id] = { item: todoCopy_(it) };
  listsQueue_({ op: 'tick', list: 'grocery', id: it.id });
}

function groUntick_(it) {
  delete GRO_STRUCK[it.id];
  listsQueue_({ op: 'restore', list: 'grocery', id: it.id, item: todoCopy_(it) });
}

// The open items with the struck ones back in their places, in the order first seen on this visit.
function groItems_(lists) {
  var open = Array.isArray(lists.groceries) ? lists.groceries : [];
  var ids = {};
  open.forEach(function (it) { ids[it.id] = true; });
  var all = open.slice();
  Object.keys(GRO_STRUCK).forEach(function (id) {
    if (ids[id]) delete GRO_STRUCK[id]; // open again (a conflict, or brought back elsewhere)
    else all.push(GRO_STRUCK[id].item);
  });
  all.forEach(function (it) {
    if (!Object.prototype.hasOwnProperty.call(GRO_POS, it.id)) GRO_POS[it.id] = GRO_SEQ++;
  });
  return all.map(function (it, i) { return { it: it, i: i }; }).sort(function (a, b) {
    return (GRO_POS[a.it.id] - GRO_POS[b.it.id]) || (a.i - b.i);
  }).map(function (x) { return x.it; });
}

// ---- the 60 s refresh: only while Groceries is on show and the page is visible, always through the shell
function groVisible_() {
  return document.visibilityState !== 'hidden';
}

function groOnShow_() {
  return VIEW.screen === 'groceries' && !!TOKEN && APP_ON;
}

function groTimerEnsure_() {
  if (GRO_TIMER === null && groOnShow_() && groVisible_()) GRO_TIMER = setTimeout(groRefresh_, 60000);
}

function groTimerStop_() {
  if (GRO_TIMER !== null) clearTimeout(GRO_TIMER);
  GRO_TIMER = null;
}

function groRefresh_() {
  GRO_TIMER = null;
  if (!groOnShow_() || !groVisible_()) return;
  listsLoad_(true);
  groTimerEnsure_();
}

// Hidden: no refresh. On show again: refreshed at once (unless this page loaded under 15 s ago), then every 60 s.
function groVisibility_() {
  if (!groVisible_()) { groTimerStop_(); return; }
  if (!groOnShow_()) return;
  listsLoad_(false);
  groTimerEnsure_();
}

// ---- drawing
function groAddBox_(root) {
  var box = add(root, 'div', 'gro-add');
  var w = add(box, 'div', 'wrap');
  var f = add(w, 'input', '');
  f.setAttribute('type', 'text');
  f.setAttribute('aria-label', 'Add an item');
  f.setAttribute('placeholder', 'Add an item');
  f.setAttribute('maxlength', '500');
  f.setAttribute('enterkeyhint', 'enter');
  f.setAttribute('autocomplete', 'off');
  f.setAttribute('data-focus', 'field');
  f.value = GRO_DRAFT;
  var note = add(w, 'p', 'gro-note', GRO_NOTE);
  note.setAttribute('role', 'status');
  f.addEventListener('input', function () {
    GRO_DRAFT = f.value;
    if (GRO_NOTE) groSay_('');
  });
  // Enter adds and keeps the field focused for the next item; lists come in bursts.
  f.addEventListener('keydown', function (e) {
    if (!e || e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (!sheetOneLine_(f.value)) return;
    var v = f.value;
    f.value = '';
    GRO_DRAFT = '';
    groAdd_(v);
  });
  return { box: box, field: f, note: note };
}

function renderGroceries_(data, shopFilter) {
  var root = $('groceries');
  var lists = data === undefined ? LISTS : data;
  if (shopFilter === undefined) shopFilter = groShop_();
  GRO_FOCUS_EL = null;
  if (GRO && lists && !GRO.field) { root.textContent = ''; GRO = null; } // the lists arrived: build the field
  if (!GRO) {
    root.textContent = '';
    GRO = { head: add(root, 'div', ''), box: null, field: null, note: null, rest: null };
    if (lists) {
      var a = groAddBox_(root);
      GRO.box = a.box;
      GRO.field = a.field;
      GRO.note = a.note;
    }
    GRO.rest = add(root, 'div', '');
  }
  var title = listsPanel_(GRO.head, 'Groceries');
  var top = add(GRO.head, 'div', 'wrap');
  listsProblems_(top, lists);
  if (!whoAmI_()) renderWhoCard_(top);
  var body = add(GRO.rest, 'div', 'wrap');
  var main = add(body, 'div', 'lists-main gro-main');
  if (!lists) listsWaiting_(main);
  else groMain_(main, lists, shopFilter);
  add(body, 'div', 'list-end');
  listsDock_(GRO.rest);
  // The add field is never rebuilt, so it is never focused from here (that would raise the keyboard).
  if (GRO_FOCUS_EL && !SHEET) GRO_FOCUS_EL.focus({ preventScroll: true });
  groTimerEnsure_();
  return title;
}

function groMain_(main, lists, shop) {
  var open = Array.isArray(lists.groceries) ? lists.groceries : [];
  var known = groKnownShops_(lists);
  if (shop) shop = groShopCanon_(shop, known);
  // Open items plus the ones struck in place on this visit: what decides the layout, so a tick moves nothing.
  var all = groItems_(lists);
  // Bought recently: one tap adds; what is on the list, or was ticked on this visit (M2), gets no chip.
  var onList = {};
  all.forEach(function (it) { onList[foldKey_(it.text)] = true; });
  var recent = [];
  (Array.isArray(lists.boughtRecently) ? lists.boughtRecently : []).forEach(function (t) {
    var v = typeof t === 'string' ? sheetOneLine_(t) : '';
    if (v && !onList[foldKey_(v)]) {
      onList[foldKey_(v)] = true;
      recent.push(v);
    }
  });
  if (recent.length) {
    var r = add(main, 'div', 'gro-recent');
    add(r, 'p', 'gro-label', 'Bought recently').setAttribute('id', 'gro-recent-label');
    var row = add(r, 'div', 'gro-chips');
    row.setAttribute('role', 'group');
    row.setAttribute('aria-labelledby', 'gro-recent-label');
    recent.forEach(function (t, i) {
      groKey_(btn(row, 'gchip', t, function () {
        var next = recent[i + 1] || recent[i - 1];
        GRO_FOCUS = next ? 'recent:' + foldKey_(next) : '';
        groAdd_(t);
      }), 'recent:' + foldKey_(t));
    });
  }
  // The Shop filter, only once some item on screen has a shop (or a filter is on). I1: struck items count, so
  // ticking the last item with a shop does not remove the button and move every row under the finger.
  if (shop || all.some(function (it) { return !!foldKey_(it.shop); })) {
    var tools = add(main, 'div', 'gro-tools');
    var sb = groKey_(btn(tools, 'gro-shop', 'Shop: ' + (shop || 'all'), function () {
      GRO_FOCUS = 'shop';
      GRO_MENU = !GRO_MENU;
      render(true);
    }), 'shop');
    sb.setAttribute('aria-expanded', GRO_MENU ? 'true' : 'false');
    if (GRO_MENU) groMenu_(main, open, known, shop);
  }
  if (!all.length) add(main, 'p', 'gro-empty', 'Nothing on the list.');
  if (!shop) {
    all.forEach(function (it) { groRow_(main, it, !!GRO_STRUCK[it.id]); });
  } else {
    var sp = groSplit_(all, shop);
    sp.here.forEach(function (it) { groRow_(main, it, !!GRO_STRUCK[it.id]); });
    if (sp.any.length) {
      add(main, 'h2', 'gro-head', 'Any shop');
      sp.any.forEach(function (it) { groRow_(main, it, !!GRO_STRUCK[it.id]); });
    }
    if (sp.elsewhere.length) {
      // M1: the count is of open items, as in the menu; struck ones stay shown, and the line stays without a 0.
      var n = sp.elsewhere.filter(function (it) { return !GRO_STRUCK[it.id]; }).length;
      var more = groKey_(btn(main, 'gro-more', n ? n + ' more elsewhere' : 'More elsewhere', function () {
        GRO_FOCUS = 'elsewhere';
        GRO_ELSEWHERE = !GRO_ELSEWHERE;
        render(true);
      }), 'elsewhere');
      more.setAttribute('aria-expanded', GRO_ELSEWHERE ? 'true' : 'false');
      if (GRO_ELSEWHERE) sp.elsewhere.forEach(function (it) { groRow_(main, it, !!GRO_STRUCK[it.id]); });
    }
  }
  var done = (Array.isArray(lists.doneToday) ? lists.doneToday : []).filter(function (it) {
    return it && it.list === 'grocery' && !GRO_STRUCK[it.id];
  });
  if (done.length) {
    var d = add(main, 'div', 'gro-done');
    var h = add(d, 'h2', 'todo-fold-h');
    var fold = groKey_(btn(h, 'todo-fold', 'Bought today', function () {
      GRO_FOCUS = 'fold:done';
      GRO_DONE_OPEN = !GRO_DONE_OPEN;
      render(true);
    }), 'fold:done');
    fold.setAttribute('aria-expanded', GRO_DONE_OPEN ? 'true' : 'false');
    if (GRO_DONE_OPEN) done.forEach(function (it) { groRow_(d, it, true); });
  }
}

// The Shop menu: All, then each shop with open items and how many (R60), plus the current filter.
function groMenu_(main, open, known, shop) {
  var menu = add(main, 'div', 'gro-menu');
  menu.setAttribute('role', 'group');
  menu.setAttribute('aria-label', 'Shop');
  var cur = foldKey_(shop);
  if (cur && !known.some(function (k) { return foldKey_(k) === cur; })) known = known.concat([shop]);
  var pick = function (name) {
    GRO_MENU = false;
    GRO_FOCUS = 'shop';
    groSetShop_(name);
    render(true);
  };
  var all = groKey_(btn(menu, 'schip', 'All', function () { pick(''); }), 'shopopt:');
  all.setAttribute('aria-pressed', cur ? 'false' : 'true');
  groShopCounts_(open, known).forEach(function (c) {
    var k = foldKey_(c.shop);
    if (!c.n && k !== cur) return; // R60: only shops with open items, plus the current filter
    var b = groKey_(btn(menu, 'schip', c.n ? c.shop + ' · ' + c.n : c.shop, function () { pick(c.shop); }), 'shopopt:' + k);
    b.setAttribute('aria-pressed', k === cur ? 'true' : 'false');
  });
}

// One row: the tick zone, then the text (2 lines at most). No shop name.
function groRow_(parent, it, done) {
  var row = add(parent, 'div', 'gro-row' + (done ? ' is-done' : ''));
  var tick = groKey_(btn(row, 'tick-zone', null, function () {
    GRO_FOCUS = 'tick:' + it.id;
    if (done) groUntick_(it);
    else groTick_(it);
  }), 'tick:' + it.id);
  tick.setAttribute('aria-label', 'Bought: ' + it.text);
  tick.setAttribute('aria-pressed', done ? 'true' : 'false');
  tick.appendChild(svgIcon_(done ? TICK_DONE_PATHS : TICK_OPEN_PATHS));
  var main = done ? add(row, 'div', 'gro-open') : groKey_(btn(row, 'gro-open', null, function () {
    GRO_FOCUS = 'open:' + it.id;
    openItemSheet_(it, 'grocery');
  }), 'open:' + it.id);
  add(main, 'span', 'gro-text', it.text);
}

// The edit sheet's Shop field (called by sheetBuild_): a text field, then No shop and a chip for each of the
// 12 newest shops the server knows.
// Matching ignores case and accents; a typed known shop is saved with its known spelling; the same shop
// typed differently is no change.
function sheetShop_(slot, s) {
  if (!s.sync) s.sync = [];
  var shops = groKnownShops_({ shops: LISTS && LISTS.shops }).slice(0, 12); // R60: the 12 newest from the server list
  add(slot, 'p', 'sheet-label', 'Shop').setAttribute('id', 'sheet-shop-label');
  var input = sheetCtl_(s, add(slot, 'input', 'sheet-shop-input'));
  input.setAttribute('type', 'text');
  input.setAttribute('aria-labelledby', 'sheet-shop-label');
  input.setAttribute('maxlength', '40');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('enterkeyhint', 'done');
  input.value = s.draft.shop;
  input.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.shop = input.value;
    sheetSync_(s);
  });
  input.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      closeItemSheet_('close');
    }
  });
  var g = add(slot, 'div', 'sheet-chips');
  g.setAttribute('role', 'group');
  g.setAttribute('aria-labelledby', 'sheet-shop-label');
  var chip = function (label, value) {
    var b = sheetCtl_(s, btn(g, 'schip', label, function () {
      if (SHEET !== s) return;
      s.draft.shop = value;
      input.value = value;
      sheetSync_(s);
    }));
    s.sync.push(function () {
      var k = foldKey_(s.draft.shop);
      b.setAttribute('aria-pressed', (value ? k === foldKey_(value) : !k) ? 'true' : 'false');
    });
  };
  chip('No shop', '');
  shops.forEach(function (n) { chip(n, n); });
  s.finish = function () {
    var was = s.orig ? sheetOneLine_(s.orig.shop) : '';
    if (sheetOneLine_(s.draft.shop) === was) return;
    var c = groShopCanon_(s.draft.shop, groKnownShops_(LISTS));
    s.draft.shop = (was && foldKey_(c) === foldKey_(was)) ? was : c;
  };
}

// ---- start ---------------------------------------------------------------------
$('go').addEventListener('click', submit);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
$('retry').addEventListener('click', function () {
  if (isListScreen_(VIEW.screen)) listsEnter_();
  else loadData(false);
});
window.addEventListener('hashchange', function () {
  if (!TOKEN) return;
  var v = viewFromHash(location.hash);
  if (v.screen === VIEW.screen && v.key === (VIEW.key || null)) return;
  if (v.screen === 'month' && DATA && !monthByKey(v.key)) v = { screen: 'home', key: null };
  go(v, true);
});
// Back online: send what waits now, instead of at the end of the backoff.
window.addEventListener('online', function () {
  if (RETRY_TIMER !== null) {
    clearTimeout(RETRY_TIMER);
    RETRY_TIMER = null;
  }
  listsFlush_();
});

// Another tab wrote kl.queue (R48).
window.addEventListener('storage', listsStorageChanged_);

// Task 7: the To do focus key follows focus; the sheet keeps Tab inside, closes on Escape and on back.
$('todo').addEventListener('focusin', function (e) {
  var t = e && e.target;
  TODO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
// Task 8: the same for Groceries; the 60 s refresh stops while the page is hidden.
$('groceries').addEventListener('focusin', function (e) {
  var t = e && e.target;
  GRO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', groVisibility_);
$('sheet').addEventListener('keydown', sheetKey_);
$('sheet').addEventListener('focusin', function (e) { if (SHEET && e && e.target) SHEET.focusEl = e.target; });
window.addEventListener('popstate', sheetPopState_);
// R58: the page goes away (tab closed, put in the background cache) with the sheet open: save it.
window.addEventListener('pagehide', function () { if (SHEET) closeItemSheet_('hide'); });

listsQueueInit_();
TOKEN = stored();
if (TOKEN) openSession_();
else showCover('gate', '');
</script>

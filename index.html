<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Papaya">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcf4ec">
<link rel="manifest" href="manifest.json?v=papaya">
<link rel="apple-touch-icon" href="icon-180.png?v=papaya">
<title>Papaya</title>
<style>
  :root {
    color-scheme: light;
    /* A1-T3 design tokens (mockup direction A "Calm cards", Global Constraints). Light theme only. */
    --page: #fcf4ec;
    --card: #ffffff;
    --radius: 16px;
    --hero: #fbd3b0;
    --action: #a64a18;
    --on-action: #ffffff;
    --ink: #2b1d14;
    --muted: #6b5a4e;
    --gutter: 16px;
    --card-gap: 12px;
    --target: 44px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* Type scale: weight, size and line height. Nothing uses weight 300. */
    --type-numeral: 600 44px/1.1 var(--font);
    /* F4: the home hero and balance card (restored, Kevin 2026-11-14). Their look is held in these tokens only, so
       the values from the mockup Kevin picks are set here and nowhere else. */
    --hero-bg: #fffdfa;
    --hero-ink: var(--ink);
    --hero-muted: var(--soft-ink);
    --hero-faint: var(--faint-ink);
    --hero-shadow: 0 1px 0 rgba(43, 29, 20, 0.04), 0 10px 28px -16px rgba(120, 70, 30, 0.3);
    --type-hero: 600 28px/1.05 var(--font);
    --type-hero-cur: 500 14px/1 var(--font);
    --type-bal: 600 20px/1.25 var(--font);
    --pace-track: #f6e9dc;
    --pace-fill: linear-gradient(90deg, #f3b98e, #e8955f);
    /* Kevin's pick B text colours: the soft line and the faint line under a figure */
    --soft-ink: #6f5c4d;
    --faint-ink: #806c5c; /* F4 fix 2: Kevin's faint colour darkened to 4.98:1 on white, 4.90 on the hero, 4.57 on the page */
    --type-title: 700 30px/1.15 var(--font);
    --type-card-title: 600 20px/1.25 var(--font);
    --type-body: 400 17px/1.45 var(--font);
    --type-secondary: 400 15px/1.4 var(--font);
    --type-caption: 500 13px/1.35 var(--font);
    --type-tab: 600 13px/1.2 var(--font);
    /* The names the screens already use, now on the tokens */
    --paper: #fcf4ec;
    --accent: var(--action);
    --cover: var(--hero);
    --rule: #eadfd5;
    --tint: #fde6d2;
    --on-cover: #3a2213;
    --on-cover-muted: #6e4a33;
    --on-cover-line: rgba(58, 34, 19, 0.55);
    --on-cover-fill: rgba(58, 34, 19, 0.08);
    --bar-h: 58px;
    /* Who chips (A1-T7, the mockup's colours): Kev sage, Lili apricot, Couple sand; none of them the muted age chip */
    --kev-bg: #e1eae0;
    --kev-ink: #46664c;
    --lili-bg: #fde0c8;
    --lili-ink: #9c4615;
    --couple-bg: #efe6cf;
    --couple-ink: #7a6224;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums lining-nums;
    overflow-wrap: anywhere;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }

  /* The cover: the PIN screen and the loading state, on the apricot hero colour. */
  .cover {
    min-height: 100vh;
    background: var(--cover);
    color: var(--on-cover);
    display: flex;
    align-items: center;
  }
  .cover .wrap {
    width: 100%;
    padding-top: calc(32px + env(safe-area-inset-top));
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    padding-left: calc(var(--gutter) + env(safe-area-inset-left));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right));
  }
  .cover h1 { font: var(--type-title); letter-spacing: -0.025em; margin-bottom: 36px; }
  .cover :focus-visible { outline-color: var(--on-cover); }
  .cover label { display: block; font-size: 15px; color: var(--on-cover-muted); margin-bottom: 8px; }
  #pin {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 10px 16px;
    font: inherit;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: var(--on-cover);
    background: var(--on-cover-fill);
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
  }
  #go, #retry {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    color: var(--cover);
    background: var(--on-cover);
  }
  #go:disabled { opacity: 0.55; cursor: default; }
  #msg { margin-top: 16px; min-height: 1.45em; }
  #pulse {
    width: 64px;
    height: 2px;
    margin-bottom: 18px;
    background: var(--on-cover);
    animation: pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; opacity: 0.6; } }

  /* The top of every screen: a large title on the page colour (no header slab); Money adds a card of rows (MC). */
  .screen-top { padding-top: 8px; }
  .large-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
  h1.title-big { font: var(--type-title); letter-spacing: -0.025em; color: var(--ink); }
  .title-note { font: var(--type-secondary); color: var(--muted); }
  .panel-top { display: flex; align-items: center; min-height: 44px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: var(--target);
    min-width: var(--target);
    margin-left: -4px;
    padding-right: 12px;
    font-size: 17px;
    color: var(--action);
  }
  .back::before {
    content: "";
    width: 9px;
    height: 9px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }

  section { padding-top: 34px; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .small { font-size: 14px; color: var(--muted); }
  .textbtn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  /* Months: the bars scroll sideways when there are many */
  .scroller { overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .barcol:active { background: var(--tint); }

  /* Balance */
  .month-owes { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .month-owes span:last-child { text-align: right; }
  .why { margin-top: -6px; }
  .why h3 { font-size: 15px; font-weight: 600; margin: 18px 0 2px; }
  .why-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 15px;
  }
  .why-amt { white-space: nowrap; flex: none; }
  .why-total { font-weight: 600; border-bottom: 0; }
  .why-end { margin-top: 12px; font-weight: 500; }
  .bal-act { display: flex; flex-direction: row-reverse; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; }
  .bal-act-note { display: block; flex: 1 1 160px; }

  /* Monthly bars */
  .barsin { display: flex; position: relative; min-width: 100%; width: max-content; }
  .barcol { display: block; flex: 1 0 54px; min-height: 44px; border-radius: 6px; }
  .barplot {
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid var(--muted);
  }
  .barval { position: relative; z-index: 2; padding: 0 3px; margin-bottom: 3px; font-size: 13px; background: var(--paper); border-radius: 3px; }
  .bar { width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-partial { background: var(--tint); border: 1.5px dashed var(--accent); border-bottom: 0; }
  .barlabel { height: 40px; padding-top: 5px; text-align: center; font-size: 13px; line-height: 1.2; }
  .barlabel span { display: block; color: var(--muted); font-size: 13px; }
  .usualline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--ink); z-index: 1; pointer-events: none; }
  .caption { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .caption + .caption { margin-top: 4px; }

  .linkrow {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .linkrow b { display: block; font-weight: 600; font-size: 17px; }
  .chev {
    flex: none;
    width: 9px;
    height: 9px;
    margin-right: 4px;
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    transform: rotate(45deg);
  }
  .foot { padding: 20px 0 48px; }
  .notice { font-size: 15px; }
  .notice b { font-weight: 600; }

  /* A1-T4 Money */
  /* MC: the top of a Money screen is one card of plain rows, like the phone's Settings: label left, value right, all at
     reading size (16 px, the value 500). No number on a Money screen is larger than 20 px. */
  .mrows { margin-top: var(--card-gap); padding: 0 16px; }
  .mrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 12px 0;
    border-top: 1px solid var(--rule);
    font-size: 16px;
    line-height: 1.35;
    text-align: left;
  }
  .mrow:first-child { border-top: 0; }
  .mrow-label { min-width: 0; }
  .mrow-note { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .mrow-val { flex: none; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mrow-soft { font-weight: 400; color: var(--muted); }
  .mrows-foot { padding: 10px 0 14px; border-top: 1px solid var(--rule); }
  /* F4: the home top again (Kevin 2026-11-14): the hero card (the month so far, rupiah big and EUR small, one pace bar
     against the usual month, Day N of M) and the balance card (EUR big, rupiah small, Settle up on the card). The
     month and balance screens keep their rows. Colours, sizes and weights come from the F4 tokens on :root. */
  .hero-card { margin-top: var(--card-gap); padding: 18px 20px; border-radius: 22px; background: var(--hero-bg); color: var(--hero-ink); box-shadow: var(--hero-shadow); }
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--hero-muted); }
  .hero { margin: 10px 0 2px; font: var(--type-hero); letter-spacing: -0.6px; font-variant-numeric: tabular-nums; color: var(--hero-ink); }
  .hero-cur { margin-right: 3px; font: var(--type-hero-cur); vertical-align: 0.38em; opacity: 0.55; }
  .hero-sub { font-size: 14px; color: var(--hero-faint); }
  .pace { position: relative; height: 4px; margin: 18px 0 9px; border-radius: 2px; background: var(--pace-track); }
  .pace-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--pace-fill); }
  .pace-day { position: absolute; top: -5px; width: 1.5px; height: 14px; margin-left: -0.75px; background: var(--hero-ink); opacity: 0.35; }
  .hero-foot { font-size: 13px; color: var(--hero-muted); }
  .bal { display: flex; align-items: center; gap: 10px; margin-top: var(--card-gap); padding: 6px 14px 6px 18px; }
  .bal-open { display: flex; flex: 1; min-width: 0; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px; padding: 8px 0; text-align: left; }
  .bal-words { display: block; min-width: 0; }
  .bal-label, .bal-big, .bal-small, .bal-words .bal-note { display: block; }
  .bal-label { font-size: 14px; color: var(--soft-ink); }
  .bal-big { font: var(--type-bal); letter-spacing: -0.3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bal-small { margin-top: 2px; font-size: 13px; color: var(--faint-ink); white-space: nowrap; }
  .bal .bal-settle { min-height: 44px; padding: 11px 15px; border: 1.5px solid #ecc7ab; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--action); background: transparent; }
  .panel-verdict { font-size: 15px; font-weight: 500; }
  .panel-note { font-size: 15px; color: var(--muted); }
  .panel-small { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .panel-note + .panel-note { margin-top: 6px; }

  /* The cards below the rows */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(58, 34, 19, 0.06), 0 0 0 1px rgba(58, 34, 19, 0.04); }
  .dn-card, .bars-card { padding: 14px 14px 6px; }
  .cat-card, .rows-card { padding: 2px 14px; }
  .bars-card .barval { background: var(--card); }

  /* Settle up: on the balance screen, under The difference (MC: no longer on the home) */
  .bal-note { font-size: 13px; color: var(--muted); }
  .bal-settle:disabled { opacity: 0.55; cursor: default; }
  .bal-settle {
    flex: none;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--action);
    background: var(--tint);
    white-space: nowrap;
  }

  /* Segmented control: This month, Last month, All time. Each segment is a 44 px target in a 2 px frame. */
  .seg { display: flex; padding: 2px; margin-bottom: var(--card-gap); border-radius: 12px; background: #f3e6da; }
  .seg-btn {
    flex: 1;
    min-height: 44px;
    padding: 0 8px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .seg-btn[aria-pressed="true"] { color: var(--ink); background: var(--card); box-shadow: 0 1px 3px rgba(58, 34, 19, 0.16); }

  /* Category avatars: the icon in the category colour on a pale disc of the same colour */
  .cav { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; }
  .cav .icon { width: 18px; height: 18px; color: inherit; }
  .cav-need { background: var(--tint); }

  /* Categories on the month screen: a card of rows, the top 5 then Show more */
  .cat {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    padding: 8px 0;
    border-top: 1px solid var(--rule);
  }
  .cat:first-child { border-top: 0; }
  .cat[aria-pressed="true"] { background: var(--tint); margin: 0 -14px; width: calc(100% + 28px); padding: 8px 14px; }
  .cat:active { background: var(--tint); }
  .cat-words { flex: 1; min-width: 0; }
  .cat-name { font-weight: 500; }
  .cat-share { color: var(--muted); font-size: 14px; margin-left: 6px; white-space: nowrap; }
  .cat-amts { flex: none; text-align: right; }
  .cat-big { display: block; font-weight: 600; white-space: nowrap; }
  .cat-small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .cat-more, .dn-more {
    display: block;
    width: 100%;
    min-height: 44px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--action);
  }
  .cat-more:disabled { opacity: 0.55; cursor: default; }

  /* Every expense: one card, rows with their avatar, rupiah big and EUR small */
  .rows-card .day { padding: 14px 0 4px; border-bottom: 0; font-size: 13px; }
  .rows-card .row-wrap { border-bottom: 0; border-top: 1px solid var(--rule); }
  .rows-card .day + .row-wrap { border-top: 0; }
  .rows-card .row { align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; }
  .rows-card .row-open { width: calc(100% + 28px); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .rows-card .row-main { font-weight: 600; }
  .rows-card .row-sub { font-size: 13px; }
  .rows-card .receipt { margin-left: 44px; }
  /* A1-T4 end */

  /* Donut */
  .dn-head { font-size: 15px; font-weight: 600; }
  .dn-fig { position: relative; width: 176px; height: 176px; margin: 14px auto 10px; }
  .dn-fig svg { display: block; width: 176px; height: 176px; }
  .dn-slice { stroke: var(--card); stroke-width: 2px; stroke-linejoin: round; }
  /* F4 (Kevin's pick B, 2026-11-14): the centre holds the period's total, or the picked category's share and total */
  .dn-slice, .dn-ring { cursor: pointer; transition: opacity 0.2s; }
  .dn-slice:focus, .dn-ring:focus { outline: none; } /* a tap keeps the focus there without a box; the keyboard sees the ink edge */
  .dn-slice:focus-visible { stroke: var(--ink); }
  .dn-ring:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dn-dim { opacity: 0.22; }
  .dn-centre { position: absolute; top: 50%; left: 50%; width: 132px; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
  .dn-c-what { font-size: 13px; line-height: 1.25; color: var(--soft-ink); }
  .dn-c-amt { margin: 2px 0; font-size: 19px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .dn-c-eur { font-size: 13px; color: var(--faint-ink); }
  .dn-row.dn-picked { gap: 0; width: calc(100% + 28px); margin: 0 -14px; padding: 0 14px; background: #fff3ea; border-top-color: transparent; }
  .dn-pick { display: flex; flex: 1; min-width: 0; align-items: center; gap: 12px; min-height: 48px; padding: 10px 0; font-weight: 600; text-align: left; }
  .dn-see { display: inline-flex; flex: none; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px 0 10px; font-size: 14px; font-weight: 600; color: var(--action); }
  @media (prefers-reduced-motion: reduce) { .dn-slice, .dn-ring { transition: none; } }
  .dn-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    font-size: 16px;
    text-align: left;
  }
  .dn-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .dn-sub { padding-left: 22px; }
  .dn-sub .dn-dot { width: 8px; height: 8px; }
  .dn-group .dn-words { display: flex; align-items: center; gap: 10px; }
  .dn-fold { flex: none; width: 7px; height: 7px; margin-top: -4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  .dn-fold-open { margin-top: 3px; transform: rotate(225deg); }
  .dn-tap:active { background: var(--tint); }
  .dn-words { flex: 1; min-width: 0; }
  .dn-name { display: block; }
  .dn-val { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dn-empty { padding: 16px 0 10px; font-size: 15px; color: var(--muted); }

  /* Icons */
  .icon { display: block; flex: none; width: 20px; height: 20px; color: var(--muted); }
  .cat-name-box { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-type { display: flex; align-items: center; gap: 8px; }

  /* Every expense */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 2px; }
  .list-head h2 { margin: 0; }
  .day { font-size: 14px; font-weight: 600; color: var(--muted); padding: 18px 0 4px; border-bottom: 1px solid var(--rule); }
  .row-wrap { border-bottom: 1px solid var(--rule); }
  .row { display: flex; width: 100%; justify-content: space-between; gap: 10px; min-height: 44px; padding: 11px 0; }
  .row-btn:active { background: var(--tint); }
  .back:disabled, .cat:disabled, .textbtn:disabled { opacity: 0.55; cursor: default; }
  .row-btn:disabled { cursor: default; color: inherit; }
  .row-open { width: calc(100% + 16px); margin: 0 -8px; padding-left: 8px; padding-right: 8px; background: var(--tint); }
  .row .icon { margin-top: 1px; }
  .row-left { min-width: 0; flex: 1; }
  .row-right { flex: none; text-align: right; max-width: 52%; }
  .row-item, .row-meta, .row-main, .row-sub { display: block; }
  .row-item { font-weight: 500; }
  .row-meta { font-size: 14px; color: var(--muted); }
  .row-main { font-weight: 500; white-space: nowrap; }
  .row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; }

  /* Fixing an expense: A3-T2B M7, the Edit expense sheet (it reuses the quick add and sheet styles) */
  .editor-note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .editor-error { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .sheet .schip:disabled, .qa-cat:disabled, .qa-type:disabled, .sheet input:disabled, .sheet-delete:disabled { opacity: 0.55; cursor: default; }
  .btn-main, .btn-plain {
    flex: 1;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-main { color: var(--on-action); background: var(--accent); }
  .btn-plain { border: 1px solid var(--rule); }
  .btn-main:disabled, .btn-plain:disabled { opacity: 0.55; cursor: default; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: calc(100% - 32px);
    max-width: 520px;
    min-height: 52px;
    padding: 4px 6px 4px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    color: #fbeee2;
    background: var(--ink);
  }
  /* A3-T2B p3: one toast style everywhere, the dark one (as .qa-toast) */
  .toast button {
    flex: none;
    min-height: 44px;
    min-width: 44px;
    padding: 0 10px;
    font-weight: 700;
    color: #fbcda4;
  }
  .toast button:disabled { opacity: 0.55; cursor: default; }
  .toast :focus-visible { outline-color: #fbcda4; }
  .list-end { height: 84px; }
  .flag {
    display: inline-block;
    margin: 5px 0 0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--tint);
  }
  .receipt {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: -8px 0 2px 30px;
    font-size: 14px;
    color: var(--accent);
    text-underline-offset: 3px;
  }

  /* Tendencies */
  .lead { font-size: 18px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; }
  .sentence { margin-top: 12px; }
  .units { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .unit { min-height: 44px; min-width: 88px; padding: 0 14px; text-align: center; font-size: 15px; }
  .unit[aria-pressed="true"] { background: var(--accent); color: var(--on-action); font-weight: 600; }
  .tablewrap { margin: 12px calc(var(--gutter) * -1) 0; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; overflow-wrap: normal; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  thead th { vertical-align: bottom; font-weight: 600; font-size: 13px; }
  thead span { display: block; font-weight: 400; color: var(--muted); }
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    padding-left: var(--gutter);
    text-align: left;
    white-space: normal;
    min-width: 112px;
    max-width: 128px;
    background: var(--paper);
    font-weight: 500;
    border-right: 1px solid var(--rule);
  }
  tbody td.col-usual { font-weight: 500; background: var(--tint); }
  thead th.col-usual { background: var(--tint); }
  tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--muted); }
  tfoot td.col-usual { background: var(--tint); }
  td.zero { color: var(--muted); }
  .rolling-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .rolling-row span:last-child { text-align: right; }

  /* The bottom bar: Money, Add, To do, Groceries. Fixed, above the phone's home bar, inside the safe areas.
     Toasts and the dock sit above it. Add is the one rust slot, the same on every tab. */
  #app {
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
  }
  /* A3-T2B p13: a page-coloured band behind the status bar, so rows never show above the sticky shop headers */
  #app::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 4;
    height: env(safe-area-inset-top, 0px);
    background: var(--page);
    pointer-events: none;
  }
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 150px));
    justify-content: center;
    padding: 4px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: rgba(252, 244, 236, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-top: 0.5px solid rgba(58, 34, 19, 0.13);
  }
  .tab {
    min-height: 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font: var(--type-tab);
    color: var(--muted);
    text-align: center;
  }
  .tab-pill { display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; }
  .tab .icon { width: 23px; height: 23px; color: currentColor; stroke-width: 1.8; }
  .tab[aria-current="page"] { color: var(--action); }
  .tab[aria-current="page"] .tab-pill { background: #fde3cc; }
  .tab-add { color: var(--action); }
  .tab-add .tab-pill { width: 50px; border-radius: 12px; color: var(--on-action); background: var(--action); box-shadow: 0 5px 12px -3px rgba(166, 74, 24, 0.5); }
  .tab-add .icon { width: 22px; height: 22px; stroke-width: 2.5; }
  .tab-add:active .tab-pill { opacity: 0.85; }
  /* A3-T2B m9: an expense waits in Add */
  .tab-add .tab-pill { position: relative; }
  .tab-dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--page); }

  /* Screens: a short fade when one comes on show. Browsers with View Transitions cross-fade instead. */
  .screen { animation: screen-in 180ms ease-out; }
  @keyframes screen-in { from { opacity: 0; } to { opacity: 1; } }
  @supports (view-transition-name: none) {
    .screen { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none; }
  }

  /* Lists shell: the header avatar, the "Who uses this phone?" sheet, the settings line and the dock above the bar */
  .avatar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--target);
    height: var(--target);
    margin-right: -6px;
    border-radius: 50%;
  }
  .avatar > span, .avatar-dot {
    display: flex;
    font-size: 13px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }
  .avatar-kev > span, .avatar-dot.avatar-kev { color: #46664c; background: #e1eae0; }
  .avatar-lili > span, .avatar-dot.avatar-lili { color: #9c4615; background: #fde0c8; }
  /* A3-T2B m3: before the who choice, a person icon labelled "Who?" in a soft pill */
  .avatar.avatar-who { width: auto; min-height: 44px; height: 44px; gap: 4px; padding: 0 12px 0 9px; margin-right: 0; border-radius: 22px; color: var(--muted); background: #efe6dc; }
  .avatar.avatar-who > span { width: auto; height: auto; font-size: 15px; font-weight: 600; background: none; color: inherit; }
  .avatar-who .icon { width: 20px; height: 20px; color: currentColor; }
  .who-title { font: var(--type-card-title); margin: 4px 0 6px; }
  .who-line { font: var(--type-secondary); color: var(--muted); margin-bottom: 14px; }
  .who-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .who-choice {
    min-height: 112px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: 18px;
    background: #faf3ec;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
  }
  .who-choice .avatar-dot { width: 52px; height: 52px; font-size: 21px; }
  .who-choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #dc966a; }
  .who-foot { margin-top: 12px; font: var(--type-caption); color: var(--muted); text-align: center; }

  /* The empty state: one disc, a title, a line. */
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 16px 16px; }
  .empty-disc { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 14px; border-radius: 50%; color: var(--action); background: var(--tint); }
  .empty-disc .icon { width: 30px; height: 30px; color: currentColor; stroke-width: 2; }
  .empty-title { font: var(--type-card-title); }
  .empty-line { max-width: 260px; margin-top: 6px; font: var(--type-secondary); color: var(--muted); }

  /* Swipe on a list row: right ticks, left deletes. The page still scrolls up and down. */
  .todo-row, .gro-row { touch-action: pan-y; }

  /* A1-T7 list cards: a label on the page, then one white card per section; 56 px rows, a hairline between rows
     that starts after the tick, the 28 px tick circle in a 56 px target. Rows slide inside their card. */
  .list-lab { margin: 22px 4px 8px; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .lists-main > .list-lab:first-child { margin-top: 8px; }
  .list-card { padding: 0 14px 0 0; overflow: hidden; }
  .list-card :focus-visible { outline-offset: -2px; }
  .list-card > * + .todo-row::before, .list-card > * + .gro-row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 56px;
    right: 0;
    border-top: 1px solid #f3e9df;
    pointer-events: none;
  }
  .list-card > .todo-day + .todo-row::before, .list-card > .todo-note + .todo-row::before { display: none; }
  .todo-fold-h + .list-card { margin-top: 8px; }
  #app:has(#groceries:not([hidden])) .qa-toast { bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom) + var(--gro-dock-h, 150px)); }
  /* A1-T7 end */

  .lists-main { padding-top: 16px; }
  .lists-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 28px; }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 520px;
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .dock-note {
    align-self: flex-start;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: var(--tint);
  }
  .dock-toast {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 52px;
    padding: 4px 6px 4px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    color: #fbeee2;
    background: var(--ink);
  }

  /* To do: sections, rows with a wide tick zone, chips, the calm note, the settings lines */
  .large-title .mine { margin-left: auto; } /* A3-T2B m4: Mine on the title row, beside the avatar */
  .mine {
    min-height: 44px;
    padding: 0 18px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    background: #f6ece2;
  }
  .mine[aria-pressed="true"] { color: #9c4615; background: #fde3cc; box-shadow: inset 0 0 0 1.5px #dc966a; }
  .todo-sec-later, .todo-sec-parked, .todo-sec-done, .todo-sec-someday { margin-top: 16px; }
  /* PB-T3: the filter row under the title, one sideways row of two groups; the calm Important mark (papaya, never red) */
  .todo-filters {
    display: flex;
    flex-wrap: nowrap;
    gap: 14px;
    margin: 4px calc(-1 * var(--gutter)) 0;
    padding: 2px var(--gutter);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .todo-filters::-webkit-scrollbar { display: none; }
  .fgroup { display: flex; flex: none; gap: 6px; }
  .fchip {
    flex: none;
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--muted);
    background: #f6ece2;
  }
  .fchip[aria-pressed="true"] { color: #9c4615; font-weight: 700; background: #fde3cc; box-shadow: inset 0 0 0 2px #b4541d; }
  .todo-mark { position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; background: #e8955f; pointer-events: none; }
  .todo-none { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 8px 4px; }
  .todo-none .btn-plain { min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 600; }
  .todo-fold-h { margin: 0; }
  .todo-fold {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(246, 236, 226, 0.7);
  }
  .todo-fold::after {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
  }
  .todo-fold[aria-expanded="true"]::after { transform: rotate(-135deg); }
  .todo-day { margin-left: 56px; padding: 10px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
  .list-card > * + .todo-day { border-top: 1px solid #f3e9df; }
  .todo-row { position: relative; display: flex; align-items: center; min-height: 56px; background: var(--card); }
  .tick-zone {
    flex: none;
    align-self: stretch;
    width: 56px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  /* The svg is the circle (its round border); its first path, the drawn circle, is not needed. Ticked: rust with a white tick. */
  .tick-zone .icon { width: 28px; height: 28px; border: 2px solid #a38d7b; border-radius: 50%; color: var(--on-action); stroke-width: 2.6; }
  .tick-zone .icon path:first-child { display: none; }
  .tick-zone[aria-pressed="true"] .icon { background: var(--action); border-color: var(--action); }
  .tick-zone:active .icon { background: var(--tint); }
  .tick-zone[aria-pressed="true"]:active .icon { background: var(--action); }
  /* A3-T2B: the text button and, under it, the chips (outside the button, so the First step chip is its own button) */
  .todo-main { display: flex; flex-direction: column; justify-content: center; align-self: stretch; flex: 1; min-width: 0; min-height: 56px; }
  .todo-open {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1 0 auto;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 9px 0;
    text-align: left;
  }
  .todo-open:not(:last-child) { padding-bottom: 2px; }
  .todo-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 17px;
    line-height: 1.35;
  }
  .is-done .todo-text { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #d9b89c; color: var(--muted); }
  .todo-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 2px 0 9px; }

  .tchip {
    display: inline-block;
    max-width: 100%;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 22px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
    background: #f6ece2;
  }
  .tchip-kev { color: var(--kev-ink); background: var(--kev-bg); }
  .tchip-lili { color: var(--lili-ink); background: var(--lili-bg); }
  .tchip-couple { color: var(--couple-ink); background: var(--couple-bg); }
  .tchip-effort { color: var(--muted); background: #f6ece2; }
  .tchip-date { color: var(--muted); background: #f6ece2; }
  .tchip-age { color: var(--muted); background: transparent; padding: 0 2px; font-weight: 500; }
  .tchip-from { color: var(--muted); background: transparent; padding: 0 2px; font-weight: 500; }
  /* A3-T2B: the clock on time chips (p2); the First step chip is a 44 px button that unfolds the whole step */
  .tchip .icon { display: inline-block; width: 12px; height: 12px; margin: 0 4px 0 0; vertical-align: -1px; color: currentColor; stroke-width: 2; }
  .todo-step { display: inline-flex; align-items: center; max-width: 100%; min-height: 44px; margin: -6px 0; text-align: left; }
  .todo-step .tchip { max-width: 100%; }
  .todo-step.is-open .tchip { height: auto; padding: 2px 10px; border-radius: 12px; line-height: 18px; white-space: normal; overflow: visible; }
  .todo-revive { flex: none; align-self: center; min-height: 44px; padding-left: 10px; font-size: 14px; }
  .todo-note-lead {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .todo-note { margin: 12px 0 6px 14px; padding: 14px 16px; border-radius: 14px; background: var(--tint); font-size: 15px; }
  .todo-note-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .todo-note-actions .btn-plain { flex: 0 0 auto; border: 0; border-radius: 22px; background: var(--card); }
  .lists-settings + .lists-settings { margin-top: 4px; }
  .lists-settings .pill { min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 600; color: var(--action); background: var(--tint); }
  /* A3-T2B m5: what a swipe does, in the strip the row uncovers while it slides */
  .swipe-under {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    font-size: 15px;
    font-weight: 700;
    pointer-events: none;
  }
  .swipe-done { justify-content: flex-start; padding-left: 18px; color: #2f5233; background: #dfeadd; }
  .swipe-del { justify-content: flex-end; padding-right: 18px; color: #ffffff; background: #a64a18; }
  .dock-undo > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-step { margin: 8px 2px 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .sep { color: var(--muted); }
  .pause-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .pause-menu .btn-plain { flex: 0 0 auto; }
  .pause-menu input {
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  .pause-error { width: 100%; font-size: 14px; color: var(--accent); font-weight: 500; }

  /* Task 7: Not today, the Undo line, and the item sheet (a dialog from the bottom; closing it saves). A1-T5: the
     To do "+" is gone; the Add slot in the bar opens the quick add. */
  .todo-nottoday { flex: none; align-self: center; min-height: 44px; padding-left: 10px; font-size: 14px; }
  .todo-nottoday-menu { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 12px 56px; }
  .todo-nottoday-menu .btn-plain { flex: 0 0 auto; border: 0; border-radius: 22px; background: #f6ece2; }
  .dock-toast button {
    flex: none;
    min-height: 44px;
    min-width: 44px;
    padding: 0 10px;
    font-weight: 700;
    color: #fbcda4;
  }
  .dock-toast :focus-visible { outline-color: #fbcda4; }
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(43, 29, 20, 0.5); }
  .sheet-panel {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    max-height: 90dvh;
    margin: 0 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 6px calc(var(--gutter) + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
    border-radius: 22px 22px 0 0;
    color: var(--ink);
    background: var(--card);
    box-shadow: 0 -4px 24px rgba(43, 29, 20, 0.25);
  }
  .sheet-panel:focus { outline: none; }
  .sheet-handle { width: 40px; height: 5px; margin: 2px auto 8px; border-radius: 3px; background: var(--rule); }
  /* A3-T2A K2: on top of the keyboard while it is up (sheetPlace_); no safe-area gap there */

  .sheet-text::placeholder, .sheet-shop-input::placeholder { color: var(--muted); opacity: 1; } /* A3-T2B p4 */
  .sheet-label { margin: 16px 2px 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .sheet-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* A3-T2A K1: one row per group, its label on the left, the chips scrolling sideways */
  .sheet-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sheet-row .sheet-label { flex: 0 0 44px; margin: 0; }
  .sheet-todo .sheet-row .sheet-label { flex-basis: 60px; } /* PB-T3: When, Time, Who and Priority line up, each on one line */
  .sheet-scroll { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sheet-scroll::-webkit-scrollbar { display: none; }

  .sheet-words-text { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .sheet-words-undo { flex: none; min-height: 44px; min-width: 44px; padding: 0 8px; font-size: 15px; font-weight: 700; color: var(--action); }
  .sheet-discard { flex: none; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .qa-head .sheet-save { min-width: 88px; min-height: 44px; margin-left: 0; }
  .todo-row.is-new, .gro-row.is-new { animation: row-new 2.4s ease-out; }

  /* A1-T7: soft chips; the picked one is a tint with a ring (a person's colour for Kev, Lili, Couple), never solid rust.
     A1 final fix 5: the ring is 2 px and dark (at least 3:1 against the resting chip), the label bold. */
  .schip {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border: 0;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    background: #f6ece2;

    white-space: nowrap;

  }
  .schip[aria-pressed="true"] { color: #9c4615; font-weight: 700; background: #fde3cc; box-shadow: inset 0 0 0 2px #b4541d; }
  .schip-kev[aria-pressed="true"] { color: var(--kev-ink); background: var(--kev-bg); box-shadow: inset 0 0 0 2px var(--kev-ink); }
  .schip-lili[aria-pressed="true"] { color: var(--lili-ink); background: var(--lili-bg); box-shadow: inset 0 0 0 2px var(--lili-ink); }
  .schip-couple[aria-pressed="true"] { color: var(--couple-ink); background: var(--couple-bg); box-shadow: inset 0 0 0 2px var(--couple-ink); }
  .sheet-day, .sheet-time {
    min-height: 44px;
    margin-top: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #faf3ec;
    border: 1px solid #eadfd5;
    border-radius: 12px;
  }
  .sheet-day, .sheet-time { margin-top: 6px; margin-left: 52px; }
  .sheet-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .sheet-delete { min-height: 44px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .sheet-save { flex: 0 0 auto; min-width: 120px; min-height: 48px; margin-left: auto; border-radius: 14px; }
  .sheet-shop-input {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 10px;
    padding: 8px 12px;

    color: var(--ink);
    background: #faf3ec;

  }

  /* Task 8: Groceries: Bought recently chips, the shop filter, rows; the problems line. A1-T7: the add field and the
     chips dock above the tab bar (near the thumb), inside the safe areas, and ride on the keyboard while it is up. */
  .lists-problem { margin-top: 16px; padding: 10px 14px; border-radius: 10px; font-size: 14px; color: var(--ink); background: var(--tint); }
  .gro-dock {

    padding: 10px calc(12px + env(safe-area-inset-right)) 2px calc(12px + env(safe-area-inset-left));

    border-radius: 26px;

  .gro-add-plus .icon { width: 18px; height: 18px; color: currentColor; stroke-width: 2.5; }
  .gro-add input {

  .gro-end { height: calc(var(--gro-dock-h, 150px) + var(--gro-kb, 0px) + 24px); } /* A3-T2A: room to scroll a new row above the keyboard */
  .gro-main { padding-top: 14px; }

  }
  /* PB-T3: "Usually bought around now": chips with a 44 px x each, above the shop sections */
  .gro-staples { margin: 0 0 16px; }
  .gro-staples .gro-label { margin: 0 4px 8px; }
  .gro-staple-row { display: flex; flex-wrap: wrap; gap: 8px; }

    display: inline-flex;
    align-items: center;
    max-width: 100%;
    border-radius: 22px;

  }
  .gro-staple .gchip { padding-right: 2px; background: transparent; box-shadow: none; }
  .gro-staple-x { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: 44px; min-height: 44px; border-radius: 22px; }
  .gro-staple-x .icon { width: 16px; height: 16px; stroke-width: 2; }
  .gro-row { position: relative; display: flex; align-items: center; min-height: 56px; background: var(--card); }
  /* A3-T2B M2: the row is one button (circle and text) that ticks; "..." at its end opens the sheet */
  .gro-tap {

  .gro-edit { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; margin-right: -8px; border-radius: 22px; color: var(--muted); }
  .gro-edit .icon { width: 22px; height: 22px; color: currentColor; stroke-width: 3; }

  /* A2-T3 groceries by shop: a section per shop, its header sticks while the section scrolls under it (opaque page
     colour, a hairline below); a shop header is one 48 px button that opens In the shop. Any shop is a plain heading. */
  .gro-sec + .gro-sec { margin-top: 14px; }

  .gro-sec-n.any { color: var(--muted); background: #efe6dc; }

  /* The item sheet's small New shop: a quiet outlined chip; its field shows only once tapped. */
  .sheet-newshop {
    min-height: 44px;
    padding: 0 14px;
    border-radius: 22px;

    display: flex;
    flex: 1 1 0;

    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;

    padding: 2px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;

  .gro-shop-chips::-webkit-scrollbar { display: none; }
  .gro-shop .schip:not([aria-pressed="true"]) { background: var(--card); box-shadow: 0 0 0 1px rgba(58, 34, 19, 0.06), 0 1px 2px rgba(58, 34, 19, 0.08); }

  .gro-shop .gro-shop-input { flex: 1 0 100%; margin-top: 6px; }
  .sheet-gshop-input { margin-left: 52px; width: calc(100% - 52px); }
  /* A2-T3 end */

  /* A1-T5 quick add */
  .qa-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .qa-title { flex: 1 1 auto; min-width: 0; font: var(--type-card-title); }

  .qa-amount:focus { outline: none; border-bottom-color: var(--action); }
  .qa-amount::placeholder { color: #7a6657; opacity: 1; } /* A3-T2B p4: 5.4:1 on the white sheet */
  .qa-under { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; min-height: 21px; margin-top: 4px; }
  .qa-preview { font: var(--type-secondary); color: var(--muted); font-variant-numeric: tabular-nums; }
  .qa-status { font-size: 15px; font-weight: 600; color: var(--action); }
  .qa-what {
    display: block;
    width: 100%;
    min-height: 48px;
    margin-top: 8px;
    padding: 0 12px;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);

  }
  .qa-what::placeholder { color: var(--muted); opacity: 1; }
  .qa-hint { margin: 4px 2px 0; font: var(--type-caption); color: var(--muted); }
  .qa-hint:empty { display: none; }
  .qa-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qa-label { flex: 0 0 60px; font: var(--type-caption); font-weight: 600; color: var(--muted); }
  .qa-row .sheet-chips { flex: 1; gap: 6px; }
  .qa-row .schip { padding: 0 12px; }
  .qa-type { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 5px; border: 1px solid var(--rule); border-radius: 22px; font-size: 15px; font-weight: 600; }
  .qa-type .chev { margin: -4px 2px 0 4px; transform: rotate(135deg); }
  /* A3-T2A: More types, the last chip of the Add sheet's Type row (its own class: .qa-type is the Edit expense button) */
  .qa-more { min-height: 44px; box-shadow: inset 0 0 0 1px var(--rule); }
  .qa-more[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #b4541d; }
  /* A3-T2A: All types, a small sheet of its own over the expense sheet */
  .qa-types-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80vh; max-height: 80dvh; }
  .qa-types-close { flex: none; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--action); }
  .qa-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
  @media (max-width: 359px) { .qa-segbtn .icon { display: none; } }
  .qa-cat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; padding: 6px 4px; border-radius: 12px; background: var(--paper); font-size: 13px; font-weight: 500; text-align: center; }
  .qa-cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--action); }
  .qa-day { min-height: 44px; margin-top: 10px; padding: 8px 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--muted); border-radius: 8px; }
  .qa-wait { margin-top: 10px; }
  .qa-toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom));

    justify-content: space-between;

  .qa-toast :focus-visible { outline-color: #fbcda4; }
  /* A1-T5 end */

  /* A1-T6 settle up */
  .settle-head { margin-bottom: 8px; }
  .settle-title { font: var(--type-card-title); }
  .settle-who { margin: 0; font-size: 17px; color: var(--muted); }

  .settle-small { min-height: 21px; margin: 2px 0 0; font: var(--type-secondary); color: var(--muted); font-variant-numeric: tabular-nums; }

<body>
<div id="cover" class="cover">
  <div class="wrap">
    <h1>Papaya</h1>
    <div id="pulse" aria-hidden="true" hidden></div>
    <div id="gate" hidden>
      <label for="pin">Your PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <button id="go" type="button">Unlock</button>
    </div>
    <div id="msg" role="status"></div>
    <button id="retry" type="button" hidden>Try again</button>
  </div>
</div>
<div id="app" hidden>
  <div id="home" class="screen"></div>
  <div id="month" class="screen" hidden></div>
  <div id="trends" class="screen" hidden></div>
  <div id="balance" class="screen" hidden></div>
  <div id="todo" class="screen" hidden></div>

  <div id="qa-toast" class="qa-toast" role="status" hidden></div>
</div>
<script>
// Never run inside someone else's frame: show nothing and stop.
if (window.top !== window.self) {
  document.body.textContent = '';
  throw new Error('framed');
}

// Replace with the Apps Script web app's /exec address when publishing. It is set here and nowhere else.
var API_URL = 'https://script.google.com/macros/s/AKfycby_FV1p6a3AS7hn5yWWqyVo5Mb2C8sfaugadaP--16QFkLUx25xFwB3xxBGHEOMaTLIMw/exec';

var NEEDS = '\u0000needs';

// ---- plain helpers ---------------------------------------------------------
function group(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fixed2(n) {
  var s = Math.abs(n).toFixed(2).split('.');
  return group(s[0]) + '.' + s[1];
}

function fmtIdr(n) {
  return (n < 0 ? '-' : '') + 'Rp ' + group(Math.abs(Math.round(n)));
}

function fmtEur(n) {
  return (n < 0 ? '-' : '') + 'EUR ' + fixed2(n);
}

function dayOfMonth(iso) {
  var y = Number(iso.slice(0, 4));
  var m = Number(iso.slice(5, 7));
  return { day: Number(iso.slice(8, 10)), days: new Date(Date.UTC(y, m, 0)).getUTCDate() };
}

function dayText(iso) {
  var d = dayOfMonth(iso);
  return 'day ' + d.day + ' of ' + d.days;
}

function monthName(key) {
  var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return names[Number(key.slice(5, 7)) - 1];
}

function shortMonth(key) {
  return monthName(key).slice(0, 3) + ' ' + key.slice(0, 4);
}

function dateLabel(iso) {
  if (!iso) return 'No date';
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))));
  return days[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + monthName(iso);
}

function andList(words) {
  if (words.length < 2) return words.join('');
  return words.slice(0, -1).join(', ') + ' and ' + words[words.length - 1];
}

function whoText(r) {
  if (!r.paidBy) return 'Payer not set';
  var by = r.paidBy === 'Couple' ? 'Joint money' : r.paidBy + ' paid';
  if (!r.paidFor) return by;
  return by + ', for ' + (r.paidFor === 'Couple' ? 'both' : r.paidFor);
}

// The one balance rule (A1-T4 fix 5): under half a cent is square; otherwise who pays whom, and how many euros.
// net < 0: Lili owes Kev. The balance sentence and the home balance card both read it.
function balanceSide_(net) {
  if (Math.abs(net) < 0.005) return { square: true, who: '', eur: 0 };
  return { square: false, who: net < 0 ? 'Lili pays Kev' : 'Kev pays Lili', eur: Math.abs(net) };
}

function balanceText(net) {
  var b = balanceSide_(net);
  if (b.square) return 'All square';
  return 'To even up: ' + b.who + ' ' + fmtEur(b.eur);
}

// A positive effect moves the balance toward Lili, a negative one toward Kev.
function effectText(effect) {
  var who = effect > 0 ? 'in Lili’s favour' : (effect < 0 ? 'in Kev’s favour' : '');
  return { amount: fmtEur(Math.abs(effect)), who: who };
}

// Fixed icon table. Paths are constant strings in this file, never data. Stroke only, on a 24px grid.
function iconPaths(name) {
  var shapes = {

    cutlery: ['M6 3v6a3 3 0 0 0 6 0V3', 'M9 3v18', 'M18 21V3c-2.5 1-3.5 4-3.5 7.5c0 1.5 1 2.5 3.5 2.5'],
    bolt: ['M13 2.5L5 13.5h6l-1 8l8-11h-6z'],
    car: ['M4 16v-3.5l2-5.5a2 2 0 0 1 1.9-1.3h8.2a2 2 0 0 1 1.9 1.3l2 5.5V16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z', 'M4.5 12h15', 'M6.5 17v2.5', 'M17.5 17v2.5'],
    health: ['M12 20.5S4 15.5 4 9.5a4.5 4.5 0 0 1 8-2.8a4.5 4.5 0 0 1 8 2.8c0 6-8 11-8 11z', 'M12 9.5v5', 'M9.5 12h5'],

    bag: ['M6 8h12l1 12.5H5z', 'M9 8V6.5a3 3 0 0 1 6 0V8'],
    picture: ['M4 5h16v14H4z', 'M4 15.5l4.5-4l3.5 3l3-2.5l5 4', 'M16.5 9a1 1 0 1 1-2 0a1 1 0 1 1 2 0z'],
    chair: ['M7 3.5v9', 'M17 3.5v9', 'M7 7h10', 'M5.5 12.5h13v3h-13z', 'M7 15.5v5', 'M17 15.5v5'],
    house: ['M4 11l8-7l8 7', 'M6 9.5V20h12V9.5', 'M10 20v-5.5h4V20'],

    phone: ['M8 3h8a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 16 21H8a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 8 3z', 'M11 18h2'],
    paw: ['M12 12c-2.5 0-5 2.5-5 5a2.5 2.5 0 0 0 2.5 2.5c1 0 1.5-.5 2.5-.5s1.5.5 2.5.5A2.5 2.5 0 0 0 17 17c0-2.5-2.5-5-5-5z', 'M6.5 10a1.5 1.5 0 1 1-3 0a1.5 1.5 0 1 1 3 0z', 'M11 6a1.5 1.5 0 1 1-3 0a1.5 1.5 0 1 1 3 0z', 'M16 6a1.5 1.5 0 1 1-3 0a1.5 1.5 0 1 1 3 0z', 'M20.5 10a1.5 1.5 0 1 1-3 0a1.5 1.5 0 1 1 3 0z'],
    key: ['M13 9a4 4 0 1 1-8 0a4 4 0 1 1 8 0z', 'M12 12l8 8', 'M17 17l2-2', 'M14.5 14.5l1.5-1.5'],

    dots: ['M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0z', 'M8 12h.01', 'M12 12h.01', 'M16 12h.01'],
    swap: ['M4 8.5h14', 'M14.5 5l3.5 3.5l-3.5 3.5', 'M20 15.5H6', 'M9.5 12L6 15.5l3.5 3.5'],
    tag: ['M3.5 4.5v7.5l8.5 8.5a1.5 1.5 0 0 0 2.1 0l6-6a1.5 1.5 0 0 0 0-2.1L12 4H4a.5.5 0 0 0-.5.5z', 'M8 8h.01'],
    gift: ['M3.5 8h17v3.5h-17z', 'M5 11.5v9h14v-9', 'M12 8v12.5', 'M12 8C10.5 4.5 7 4 7 6.2C7 7.6 9.5 8 12 8', 'M12 8c1.5-3.5 5-4 5-1.8C17 7.6 14.5 8 12 8'],
    briefcase: ['M3.5 8h17v11.5h-17z', 'M9 8V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v2', 'M3.5 13h17', 'M11 12v2h2v-2']
  };
  var byName = {
    'Groceries': 'cart', 'Restaurant': 'cutlery', 'Eating out': 'cutlery', 'Utilities': 'bolt', 'Transport': 'car', 'Health': 'health',
    'Leisure': 'ticket', 'Shopping': 'bag', 'Decoration': 'picture', 'Furniture': 'chair', 'Home': 'house', 'Household': 'house',
    'Subscriptions': 'repeat', 'Phone & subscriptions': 'phone', 'Pets': 'paw', 'Rent': 'key', 'Visa & admin': 'paper', 'Travel': 'plane',
    'Gifts': 'gift', 'Business': 'briefcase', 'Other': 'dots', 'Settlement': 'swap'
  };
  var known = typeof name === 'string' && Object.prototype.hasOwnProperty.call(byName, name);

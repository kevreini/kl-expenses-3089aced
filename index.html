// One row: the tick zone, the text (2 lines at most), then the chips. where says which section it is in.
// A3-T2B: the text is the button that opens the sheet; the chips sit under it, outside that button, so the First
// step chip can be a button of its own (it unfolds the whole step and never ticks or opens the sheet).
var CLOCK_PATHS = ['M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17z', 'M12 7.5v5l3 2'];
function todoRow_(parent, it, today, where) {
  var done = where === 'done' || !!TODO_STRUCK[it.id];
  var row = add(parent, 'div', 'todo-row' + (done ? ' is-done' : ''));
  listsNewMark_(row, it); // A3-T2A M4
  listsSwipe_(row, function () {
    TODO_FOCUS = 'tick:' + it.id;
    if (done) todoUntick_(it);
    else todoTick_(it);
  }, done ? null : function () { listsDelete_('todo', it); }, done ? 'Not done' : 'Done');
  var tick = todoKey_(btn(row, 'tick-zone', null, function () {
    TODO_FOCUS = 'tick:' + it.id;
    if (done) todoUntick_(it);
    else todoTick_(it);
  }), 'tick:' + it.id);
  tick.setAttribute('aria-label', 'Done: ' + it.text);
  tick.setAttribute('aria-pressed', done ? 'true' : 'false');
  tick.appendChild(svgIcon_(done ? TICK_DONE_PATHS : TICK_OPEN_PATHS));
  var body = add(row, 'div', 'todo-main');
  var main = done ? add(body, 'div', 'todo-open') : todoKey_(btn(body, 'todo-open', null, function () {
    TODO_FOCUS = 'open:' + it.id;
    todoOpen_(it);
  }), 'open:' + it.id);
  // PB-T3: an Important row carries a calm mark (the papaya tint, never red); the group heading says what it means.
  if (todoPriority_(it.priority) === 'Important') {
    var mark = add(main, 'span', 'todo-mark');
    mark.setAttribute('aria-hidden', 'true');
  }
  add(main, 'span', 'todo-text', it.text);
  // Rows from earlier days: "Not today" opens two choices under the row, Tomorrow and No date.
  if ((where === 'today' || where === 'important') && !done && todoValidDay_(today) && todoValidDay_(it.due) && it.due < today) { // fix 1: Important too
    var later = todoKey_(btn(row, 'textbtn todo-nottoday', 'Not today', function () {
      TODO_FOCUS = 'nottoday:' + it.id;
      TODO_NOTTODAY = TODO_NOTTODAY === it.id ? '' : it.id;
      render(true);
    }), 'nottoday:' + it.id);
    later.setAttribute('aria-expanded', TODO_NOTTODAY === it.id ? 'true' : 'false');
    if (TODO_NOTTODAY === it.id) {
      var menu = add(parent, 'div', 'todo-nottoday-menu');
      menu.setAttribute('role', 'group');
      menu.setAttribute('aria-label', 'Not today');
      btn(menu, 'btn-plain', 'Tomorrow', function () { todoMove_(it, isoAddDays_(today, 1)); });
      btn(menu, 'btn-plain', 'No date', function () { todoMove_(it, ''); });
    }
  }
  // R53: a parked item comes back with today's date (the page's day, R70), which puts it under Today.
  if (where === 'parked' && !done && todoValidDay_(today)) {
    btn(row, 'textbtn todo-revive', 'Bring back', function () {
      TODO_FOCUS = 'tick:' + it.id;
      listsQueue_({ op: 'edit', list: 'todo', id: it.id, fields: { due: today } });
    });
  }
  var chips = [];
  var who = todoWho_(it.who);
  if (who) chips.push([who, 'tchip-who tchip-' + who.toLowerCase()]);
  var effort = todoEffortText_(it);
  if (effort) chips.push([effort, 'tchip-effort', it.kind === 'bigger']);
  var age = TODO_NOTE_ID === it.id ? '' : todoAgeText_(it.ageDays); // m10: the card already says it waited
  if (age) chips.push([age, 'tchip-age']);
  // p2: a time chip carries a clock icon, so it never reads like the effort chip.
  if (where === 'today' && today && it.due < today) chips.push(['from ' + todoDayLabel_(it.due, today), 'tchip-from']);
  else if (where === 'later') chips.push([todoDayLabel_(it.due, today) + (it.time ? ' ' + it.time : ''), 'tchip-date' + (it.time ? ' tchip-time' : '')]);
  else if (it.time && (where === 'today' || where === 'week')) chips.push([it.time, 'tchip-date tchip-time']);
  else if ((where === 'important' || where === 'someday') && todoValidDay_(it.due)) { // PB-T3: their day, wherever it falls
    if (today && it.due < today) chips.push(['from ' + todoDayLabel_(it.due, today), 'tchip-from']);
    else chips.push([todoWhenLabel_(it.due, today) + (it.time ? ' ' + it.time : ''), 'tchip-date' + (it.time ? ' tchip-time' : '')]);
  }
  if (!chips.length) return;
  var box = add(body, 'div', 'todo-chips');
  // A tap on the chips (not on the First step) opens the sheet, as a tap on the text does.
  if (!done) box.addEventListener('click', function () { TODO_FOCUS = 'open:' + it.id; todoOpen_(it); });
  chips.forEach(function (c) {
    if (c[2]) { todoStepChip_(box, it, c[0]); return; }
    var chip = add(box, 'span', 'tchip ' + c[1]);
    if (/\btchip-time\b/.test(c[1])) chip.appendChild(svgIcon_(CLOCK_PATHS));
    chip.appendChild(document.createTextNode(c[0]));
  });
}

// A3-T2B: the First step chip. One tap unfolds the whole step (aria-expanded), a second folds it. It never ticks
// and never opens the sheet: it is its own 44 px button, outside the row's text button.
function todoStepChip_(box, it, text) {
  var key = 'step:' + it.id;
  var open = !!TODO_STEP_OPEN[it.id];
  var b = todoKey_(btn(box, 'todo-step' + (open ? ' is-open' : ''), null, function (e) {
    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
    TODO_FOCUS = key;
    if (TODO_STEP_OPEN[it.id]) delete TODO_STEP_OPEN[it.id];
    else TODO_STEP_OPEN[it.id] = true;
    render(true);
  }), key);
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  add(b, 'span', 'tchip tchip-effort tchip-step', text);
  return b;
}

// The calm note at the top of Anytime: one item, one sentence, two ways out (F4 fix 4: no first step line).
function todoNote_(parent, it, today) {
  var n = add(parent, 'div', 'todo-note');
  n.setAttribute('role', 'note');
  add(n, 'p', 'todo-note-lead', todoNoteText_(it));
  var actions = add(n, 'div', 'todo-note-actions');
  // R55: only with a first step to make it smaller to; R70: never for an item already made small.
  var step = todoStep_(it);
  if (step) btn(actions, 'btn-plain', 'Make it smaller', function () { todoOpen_(it, { text: step }); });
  btn(actions, 'btn-plain', 'Not now', function () { todoSnooze_(today); });
}

// The line at the bottom: this phone's reminders. (A1-T3: the "This phone" line is gone; the header avatar
// says who this phone is and changes it.)
function todoSettings_(body, lists, me) {
  var today = lists ? listsToday_(lists) : '';
  if (!todoIsDay_(today)) return;
  var until = todoPausedUntil_(lists, me);
  var line = add(body, 'p', 'lists-settings small');
  line.appendChild(document.createTextNode(until ? 'Reminders: paused until ' + todoDayLabel_(until, today) : 'Reminders: on'));
  // A3-T2B m7: Pause and Resume are 44 px pills, not small links.
  if (until) {
    todoKey_(btn(line, 'pill', 'Resume', function () {
      TODO_FOCUS = 'pause';
      todoPause_('');
    }), 'resume');
    return;
  }
  var pause = todoKey_(btn(line, 'pill', 'Pause reminders', function () {
    TODO_FOCUS = 'pause';
    TODO_PAUSE = TODO_PAUSE ? '' : 'menu';
    TODO_PAUSE_ERR = '';
    render(true);
  }), 'pause');
  pause.setAttribute('aria-expanded', TODO_PAUSE ? 'true' : 'false');
  if (!TODO_PAUSE) return;
  var menu = add(body, 'div', 'pause-menu');
  if (TODO_PAUSE === 'menu') {
    btn(menu, 'btn-plain', '1 week', function () {
      TODO_FOCUS = 'resume';
      todoPause_(isoAddDays_(today, 7));
    });
    btn(menu, 'btn-plain', '2 weeks', function () {
      TODO_FOCUS = 'resume';
      todoPause_(isoAddDays_(today, 14));
    });
    btn(menu, 'btn-plain', 'Until a date', function () {
      TODO_FOCUS = 'pause-day';
      TODO_PAUSE = 'date';
      render(true);
    });
    return;
  }
  var field = todoKey_(add(menu, 'input', ''), 'pause-day');
  field.setAttribute('type', 'date');
  field.setAttribute('min', isoAddDays_(today, 1));
  field.setAttribute('max', isoAddDays_(today, 60));
  field.setAttribute('aria-label', 'Pause reminders until');
  field.value = TODO_PAUSE_DAY;
  var keep = function () { TODO_PAUSE_DAY = field.value; };
  field.addEventListener('input', keep);
  field.addEventListener('change', keep);
  btn(menu, 'btn-plain', 'Pause until then', function () {
    var day = field.value;
    if (!todoIsDay_(day) || day <= today || day > isoAddDays_(today, 60)) {
      TODO_PAUSE_DAY = day;
      TODO_PAUSE_ERR = 'Pick a day in the next 60 days.';
      TODO_PAUSE_ERR_NEW = true;
      TODO_FOCUS = 'pause-day';
      render(true);
      return;
    }
    TODO_FOCUS = 'resume';
    todoPause_(day);
  });
  // The status line is always there while the field is. A fresh error goes in after it is on screen, so screen
  // readers announce it; a repaint after that draws it filled, with no second announcement.
  var status = add(menu, 'p', 'pause-error');
  status.setAttribute('role', 'status');
  if (TODO_PAUSE_ERR_NEW) {
    TODO_PAUSE_ERR_NEW = false;
    var msgText = TODO_PAUSE_ERR;
    setTimeout(function () { status.textContent = msgText; }, 100);
  } else {
    status.textContent = TODO_PAUSE_ERR;
  }
}

// ---- the item sheet (Task 7): edit or add one item; closing it saves ------------------------------
// One sheet for both lists. The list decides the fields: To do has text, When, Who and More > Time; Groceries
// has text and a Shop slot (Task 8 fills it through sheetShop_). The sheet lives in the static #sheet, outside
// the screens, so a repaint behind it never rebuilds it or moves its focus. Closing it (tap outside, Escape,
// back, swipe down, Save, Enter in the text) sends the change as one edit or one add through the queue; no
// change sends nothing; a new item with no text is dropped.
var SHEET_FIELDS = { todo: ['text', 'who', 'due', 'time', 'priority'], grocery: ['text', 'shop'] }; // the user fields each list edits
var SHEET = null;          // the open sheet: {list, id, orig, draft, today, chips, pick, more, returnKey, els, ctls, focusEl}
var SHEET_IN_HISTORY = false; // the open sheet added a history step, so the phone's back closes it
var SHEET_POPS = 0;        // our own history.back() calls whose popstate has not arrived yet
var LISTS_UNDO = null;     // {list, item}: the "Deleted. Undo" line, for 6 s
var LISTS_UNDO_TIMER = null;
var LISTS_UNDO_SAY = null; // the "Deleted." status line on screen now

// ---- A3-T2A: day and time words in a to-do ("demain 6h40") ----------------------------------------------------
// A copy of parseWhen_ in Lists.gs (the bot), unchanged: tests/when-cases.json runs both, and a test checks the two are
// the same function line for line. parseWhen_(text, now) -> {text (the words cut), due 'yyyy-MM-dd' or '', time 'HH:mm' or ''}.
function parseWhen_(text, now) {
  if (typeof text !== 'string' || text === '') return { text: typeof text === 'string' ? text : '', due: '', time: '' };
  var ms = (now && typeof now.getTime === 'function' && isFinite(now.getTime())) ? now.getTime() : new Date().getTime();
  var bali = new Date(ms + 8 * 3600000);
  var Y = bali.getUTCFullYear(), M0 = bali.getUTCMonth(), D = bali.getUTCDate(), WD = bali.getUTCDay();
  var nowMin = bali.getUTCHours() * 60 + bali.getUTCMinutes();

  var MONTHS = [
    ['janvier', 'january', 'januari', 'jan'], ['fevrier', 'february', 'februari', 'fevr', 'feb', 'fev'],
    ['mars', 'march', 'maart', 'mar', 'mrt'], ['avril', 'april', 'apr', 'avr'], ['mai', 'may', 'mei'],
    ['juin', 'june', 'juni', 'jun'], ['juillet', 'july', 'juli', 'juil', 'jul'], ['aout', 'august', 'augustus', 'aug'],
    ['septembre', 'september', 'sept', 'sep'], ['octobre', 'october', 'oktober', 'oct', 'okt'],
    ['novembre', 'november', 'nov'], ['decembre', 'december', 'dec']
  ];
  var DAYS = [ // index = getUTCDay(): 0 is Sunday
    ['dimanche', 'sunday', 'zondag'], ['lundi', 'monday', 'maandag'], ['mardi', 'tuesday', 'dinsdag'],
    ['mercredi', 'wednesday', 'woensdag'], ['jeudi', 'thursday', 'donderdag'], ['vendredi', 'friday', 'vrijdag'],
    ['samedi', 'saturday', 'zaterdag']
  ];
  var SHORT = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  // Folded copy f; map[j] is the index in text of folded character j.
  var f = '', map = [], i, j, k;
  for (i = 0; i < text.length; i++) {
    var g = text.charAt(i).toLowerCase();
    if (g.normalize) g = g.normalize('NFD');
    g = g.replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019\u02bc\u00b4\u0060]/g, "'");
    for (k = 0; k < g.length; k++) { f += g.charAt(k); map.push(i); }
  }

  function isWord(ch) {
    return ch !== '' && (/[0-9a-z_]/.test(ch) || (ch > '\u007f' && ch.toLowerCase() !== ch.toUpperCase()));
  }
  function isDigit(ch) { return ch !== '' && ch >= '0' && ch <= '9'; }
  // Free on the left: no letter or digit before, and not the tail of a number like 1,5 or 10:30.
  function freeLeft(s) {
    var p = f.charAt(s - 1);
    return s === 0 || (!isWord(p) && !(/[.,:\/]/.test(p) && isDigit(f.charAt(s - 2))));
  }
  // Free on the right: no letter, digit or apostrophe after ("today's"), and not the head of 10:30:45.
  function freeRight(e) {
    var n = f.charAt(e);
    return !isWord(n) && n !== "'" && !(/[.,:\/]/.test(n) && isDigit(f.charAt(e + 1)));
  }
  function alt(list) { // longest first, so "mars" is tried before "mar"
    var a = list.slice().sort(function (x, y) { return y.length - x.length; });
    return '(?:' + a.join('|') + ')';
  }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(y, m0, d) { // '' when the day does not exist
    var t = new Date(Date.UTC(y, m0, d));
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m0 || t.getUTCDate() !== d) return '';
    return y + '-' + two(m0 + 1) + '-' + two(d);
  }
  function addDays(n) {
    var t = new Date(Date.UTC(Y, M0, D + n));
    return t.getUTCFullYear() + '-' + two(t.getUTCMonth() + 1) + '-' + two(t.getUTCDate());
  }
  function inYear(m0, d, yText) { // a day and month: the given year, else this year or next if past
    if (m0 < 0 || m0 > 11 || d < 1) return '';
    if (yText) return ymd(parseInt(yText, 10), m0, d);
    var past = m0 < M0 || (m0 === M0 && d < D);
    return (!past && ymd(Y, m0, d)) || ymd(Y + 1, m0, d);
  }
  function monthOf(word) {
    for (var a = 0; a < MONTHS.length; a++) {
      for (var b = 0; b < MONTHS[a].length; b++) if (MONTHS[a][b] === word) return a;
    }
    return -1;
  }

  // ---- the time: the first free clock time in the text ----
  var TIME_FORMS = [
    { re: /^(\d{1,2})[.:h](\d{2})\s?(am|pm)/, ap: true },
    { re: /^(\d{1,2})\s?(am|pm)/, ap: true, noMin: true },
    { re: /^(\d{1,2})\s?uur/, noMin: true },
    { re: /^(\d{1,2})[h:u](\d{2})/ },
    { re: /^(\d{1,2})[hu]/, noMin: true }
  ];
  var MORNING = /^\s+(?:du\s+matin|in\s+the\s+morning|'?s\s+(?:ochtends|morgens))/;
  var LATER = /^\s+(?:du\s+soir|de\s+l'?\s?apres[\s-]?midi|in\s+the\s+(?:afternoon|evening)|'?s\s+(?:avonds|middags))/;
  // A bare hour (6h, 8u, 8 uur) with no qualifier is a duration, not a clock time, before de/d'/of/van
  // ("2h de menage") or after pendant/for/during/il y a/gedurende/in/dans/binnen/over ("in 2h"). A time inside
  // a range (9h-17h, de 6h a 8h, from 9 to 5pm, van 9u tot 17u) is never taken, so the range stays whole.
  // Final fix: an hour 0 to 5 (1h, 1h30, 4:30) with no am/pm, no qualifier and no a/at/om/vers right before it
  // is a duration too ("sport 1h" is not 01:00); "a 4h30", "5h du matin" and "3am" stay clock times.
  var DUR_AFTER = /^\s+(?:d'|(?:de|of|van)(?![a-z]))/;
  var DUR_BEFORE = /(?:^|[^a-z])(?:pendant|for|during|il\s+y\s+a|gedurende|in|dans|binnen|over)\s+$/;
  var LEAD = /(?:a|at|om|vers)\s+$/;
  var RANGE_AFTER = /^(?:\s*-\s*\d|\s+(?:a|to|tot|jusqu'a)\s+\d)/;
  var NUM_BEFORE = '(?:^|[^0-9\\/.,:])\\d{1,2}';
  var RANGE_BEFORE = [
    new RegExp(NUM_BEFORE + '(?:[h:.u]\\d{0,2})?(?:\\s?(?:am|pm))?\\s*-\\s*$'),
    new RegExp(NUM_BEFORE + '(?:[h:.u]\\d{0,2})?(?:\\s?(?:am|pm))?\\s+(?:to|tot)\\s+$'),
    new RegExp('(?:' + NUM_BEFORE + '[h:u]\\d{0,2}|(?:^|[^a-z])de\\s+\\d{1,2})\\s+(?:a|jusqu\'a)\\s+$')
  ];
  var tm = null;
  for (i = 0; i < f.length && !tm; i++) {
    if (!isDigit(f.charAt(i)) || !freeLeft(i)) continue;
    var rest = f.slice(i), before = f.slice(0, i);
    for (k = 0; k < TIME_FORMS.length && !tm; k++) {
      var x = TIME_FORMS[k].re.exec(rest);
      if (!x || !freeRight(i + x[0].length)) continue;
      var h = parseInt(x[1], 10);
      var mi = TIME_FORMS[k].noMin ? 0 : parseInt(x[2], 10);
      var ap = TIME_FORMS[k].ap ? x[TIME_FORMS[k].noMin ? 2 : 3] : '';
      if (mi > 59 || (ap ? (h < 1 || h > 12) : h > 23)) continue;
      var end = i + x[0].length, after = f.slice(end);
      var q = MORNING.exec(after) || LATER.exec(after);
      if (q && !freeRight(end + q[0].length)) q = null;
      if (!ap && TIME_FORMS[k].noMin && !q && (DUR_AFTER.test(after) || DUR_BEFORE.test(before))) continue;
      var lead = LEAD.exec(before);
      if (lead && !freeLeft(lead.index)) lead = null;
      if (!ap && !q && !lead && h <= 5) continue;
      if (RANGE_AFTER.test(after) || RANGE_BEFORE[0].test(before) || RANGE_BEFORE[1].test(before) || RANGE_BEFORE[2].test(before)) continue;
      if (ap === 'pm' && h < 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      if (q && !ap && LATER.test(after) && h >= 1 && h <= 11) h += 12;
      tm = { s: lead ? lead.index : i, e: end + (q ? q[0].length : 0), h: h, mi: mi, fixed: !!ap || !!q };
    }
  }

  // ---- the day: the first free day phrase that does not overlap the time ----
  var ORD = '(?:er|st|nd|rd|th)?';
  var MON = '(' + alt([].concat.apply([], MONTHS)) + ')';
  var DAY_FORMS = [
    { kind: 'dmy', re: /^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/ },
    { kind: 'dm', re: new RegExp('^(?:(?:le|on|op)\\s+)?(\\d{1,2})' + ORD + '\\s+' + MON + '\\.?(?:\\s+(\\d{4}))?') },
    { kind: 'md', re: new RegExp('^(?:(?:on|op)\\s+)?' + MON + '\\.?\\s+(\\d{1,2})' + ORD + '(?:,?\\s+(\\d{4}))?') },
    { kind: 'le', re: /^le\s+(\d{1,2})(?:er)?/ },
    { kind: 'rel', re: /^(?:(?:the\s+)?day\s+after\s+tomorrow|apres[\s-]?demain|overmorgen|aujourd'?\s?hui|auj|today|tonight|ce\s+soir|vandaag|vanavond|demain|tomorrow|tmrw|morgen)/ },
    { kind: 'wd', re: new RegExp('^(?:(on|op)\\s+)?(?:(next|volgende)\\s+)?(' + alt([].concat.apply([], DAYS)) + '|' + alt(SHORT) + ')(?:\\s+prochaine?)?') }
  ];
  var REL = { 'aujourd': 0, 'aujourdhui': 0, 'auj': 0, 'today': 0, 'tonight': 0, 'ce': 0, 'vandaag': 0, 'vanavond': 0,
    'demain': 1, 'tomorrow': 1, 'tmrw': 1, 'morgen': 1 };
  var dy = null;
  for (i = 0; i < f.length && !dy; i++) {
    if (!freeLeft(i) || (tm && i >= tm.s && i < tm.e)) continue;
    var rest2 = f.slice(i);
    for (k = 0; k < DAY_FORMS.length && !dy; k++) {
      var y = DAY_FORMS[k].re.exec(rest2);
      if (!y) continue;
      var e = i + y[0].length;
      var form = DAY_FORMS[k].kind;
      if (form === 'wd' && SHORT.indexOf(y[3]) >= 0) { // a short form: no "prochain", and only before nothing, punctuation or the time
        e = i + y[0].lastIndexOf(y[3]) + y[3].length;
        var tail = f.slice(e).replace(/^\s+/, '');
        var nextAt = f.length - tail.length;
        if (!y[1] && !y[2] && !(tail === '' || /^[,.;:!?)]/.test(tail) || (tm && nextAt === tm.s))) continue;
      }
      if (!freeRight(e) || (tm && i < tm.e && e > tm.s)) continue;
      var due = '';
      if (form === 'dmy') due = (y[0] === '24/7') ? '' : inYear(parseInt(y[2], 10) - 1, parseInt(y[1], 10), y[3]); // 24/7 is never a date
      else if (form === 'dm') due = inYear(monthOf(y[2]), parseInt(y[1], 10), y[3]);
      else if (form === 'md') due = inYear(monthOf(y[1]), parseInt(y[2], 10), y[3]);
      else if (form === 'le') {
        var dd = parseInt(y[1], 10);
        for (j = 0; j <= 12 && !due; j++) {
          var t = new Date(Date.UTC(Y, M0 + j, dd));
          if (dd >= 1 && t.getUTCDate() === dd && (j > 0 || dd >= D)) due = ymd(t.getUTCFullYear(), t.getUTCMonth(), dd);
        }
      } else if (form === 'rel') {
        var w0 = /^[a-z]+/.exec(y[0])[0];
        due = addDays(REL.hasOwnProperty(w0) ? REL[w0] : 2);
      } else {
        var name = y[3];
        var wd = SHORT.indexOf(name);
        for (j = 0; j < DAYS.length && wd < 0; j++) if (DAYS[j].indexOf(name) >= 0) wd = j;
        var delta = (wd - WD + 7) % 7;
        due = addDays(delta === 0 ? 7 : delta);
      }
      if (!due) continue;
      dy = { s: i, e: e, due: due, evening: form === 'rel' && /^(?:tonight|ce\s|vanavond)/.test(y[0]) };
    }
  }

  if (!tm && !dy) return { text: text, due: '', time: '' };
  if (tm && dy && dy.evening && !tm.fixed && tm.h >= 1 && tm.h <= 11) tm.h += 12;
  var out = { text: text, due: '', time: '' };
  if (tm) out.time = two(tm.h) + ':' + two(tm.mi);
  out.due = dy ? dy.due : addDays(tm.h * 60 + tm.mi > nowMin ? 0 : 1);

  // Cut the phrases from the text as typed; a comma or . ! ? ) after a cut joins the word before it.
  var cuts = [tm, dy].filter(function (c) { return !!c; }).sort(function (a, b) { return a.s - b.s; });
  var pieces = [], from = 0;
  for (i = 0; i < cuts.length; i++) {
    pieces.push(text.slice(from, map[cuts[i].s]));
    from = cuts[i].e < f.length ? map[cuts[i].e] : text.length;
  }
  pieces.push(text.slice(from));
  var joined = '';
  for (i = 0; i < pieces.length; i++) {
    var p = pieces[i].replace(/^\s+|\s+$/g, '');
    if (p === '') continue;
    // A connector left alone at the end after a cut ("rdv demain a" -> "rdv") goes with the phrase.
    var lw = p.toLowerCase();
    if (lw.normalize) lw = lw.normalize('NFD');
    if (i > 0 && i === pieces.length - 1 && /^(?:a|at|om|vers)$/.test(lw.replace(/[\u0300-\u036f]/g, ''))) continue;
    joined = joined === '' ? p : (/^[,;.!?)]/.test(p) ? joined + p : joined + ' ' + p);
  }
  joined = joined.replace(/\s*\(\s*\)/g, '').replace(/\s+/g, ' ').replace(/^[\s,;:\-]+|[\s,;:\-]+$/g, ''); // "pain (demain)" leaves no ()
  if (joined !== '') out.text = joined;
  return out;
}

// Who as the sheet shows it: the old stored Both, blank and anything unknown read as Either.
function sheetWho_(who) {
  return (who === 'Kev' || who === 'Lili' || who === 'Couple') ? who : 'Either';
}

// The When day chips from the page's Bali day (A3-T2A K1): Today, Tomorrow, This week. The weekday chips are gone
// from the row; Pick a day opens the native date field. F4 fix 1 (ruling): This week is the coming Sunday, or today
// when today is Sunday, never beyond this week, so the item shows under This week (Today on a Sunday). On Saturday it
// is tomorrow's day and on Sunday today's: the chip tapped stays the pressed one (s.whenChip), never its twin.
function sheetWhenChips_(today) {
  if (!todoValidDay_(today)) return [];
  var wd = new Date(Date.UTC(Number(today.slice(0, 4)), Number(today.slice(5, 7)) - 1, Number(today.slice(8, 10)))).getUTCDay();
  return [
    { label: 'Today', due: today },
    { label: 'Tomorrow', due: isoAddDays_(today, 1) },
    { label: 'This week', due: isoAddDays_(today, wd === 0 ? 0 : 7 - wd) }
  ];
}

// The Time chips (A3-T2A K1): No time, three usual times, Pick time (the native time field).
var SHEET_TIMES = ['08:00', '12:00', '18:00'];

// Minutes since midnight in Bali on the phone's clock.
function baliMinutes_(ms) {
  var d = new Date(Number(ms) + 8 * 3600000);
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}

// The day a time alone goes on: today when that time is still ahead in Bali, else tomorrow.
function sheetDayFor_(time, today, nowMin) {
  if (!todoValidDay_(today) || !/^\d{2}:\d{2}$/.test(time || '')) return '';
  var t = Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5));
  return t > nowMin ? today : isoAddDays_(today, 1);
}

// The next quarter hour after nowMin, as 'HH:mm' (23:50 gives 00:00).
function sheetNextQuarter_(nowMin) {
  var q = (Math.floor(nowMin / 15) + 1) * 15 % 1440;
  var h = Math.floor(q / 60);
  var m = q % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

// What the words line says: the parts the words decide (a part picked by hand is not theirs), or '' for no line.
function sheetWordsText_(w, hand, today) {
  if (!w || !w.due) return '';
  var parts = [];
  if (!hand.when) parts.push(todoWhenLabel_(w.due, today));
  if (!hand.time && w.time) parts.push(w.time);
  return parts.length ? parts.join(' ') + ', from your words' : '';
}

// PB-T3: the whole words line: the priority the words set (unless picked by hand), then the day and time parts.
function sheetWordsLine_(w, pw, hand, today) {
  var parts = [];
  if (pw && !hand.priority) parts.push(pw.priority === 'Later' ? 'Someday' : 'Important');
  var d = sheetWordsText_(w, hand, today);
  if (d) parts.push(d.replace(/, from your words$/, ''));
  return parts.length ? parts.join(', ') + ', from your words' : '';
}

// A3-T2A M4: where a new to-do landed, in words: "Added for Lili, tomorrow 06:40." or "Added to Anytime."
function todoAddedText_(f, today) {
  var who = { Kev: 'Kev', Lili: 'Lili', Couple: 'you both' }[f.who] || '';
  // PB-T3: an Important to-do lands in Important (its day said after), a Someday one in Someday.
  if (f.priority === 'Later') return 'Added to Someday' + (who ? ', for ' + who : '') + '.';
  if (f.priority === 'Important') {
    var when = '';
    if (todoValidDay_(f.due)) {
      when = todoWhenLabel_(f.due, today);
      if (when === 'Today' || when === 'Tomorrow') when = when.toLowerCase();
      when = ', ' + when + (f.time ? ' ' + f.time : '');
    }
    return 'Added to Important' + (who ? ', for ' + who : '') + when + '.';
  }
  if (!todoValidDay_(f.due)) return 'Added to Anytime' + (who ? ', for ' + who : '') + '.';
  var day = todoWhenLabel_(f.due, today);
  if (day === 'Today' || day === 'Tomorrow') day = day.toLowerCase();
  return 'Added for ' + (who ? who + ', ' : '') + day + (f.time ? ' ' + f.time : '') + '.';
}

// The sheet's starting values: the item's, or for a new item no text, this phone's Who (else Either), no
// date. prefill.text ("Make it smaller") replaces the starting text and keeps the rest.
function sheetDraft_(list, it, prefill, me) {
  var d = it
    ? { text: String(it.text || ''), who: sheetWho_(it.who), due: String(it.due || ''), time: String(it.time || ''), shop: String(it.shop || ''),
      priority: todoPriority_(it.priority) }
    : { text: '', who: sheetWho_(me), due: '', time: '', shop: '', priority: '' };
  if (prefill && typeof prefill.text === 'string') d.text = prefill.text;
  return d;
}

// M4: pasted line breaks (and the spaces around them) become one space; the ends are trimmed.
function sheetOneLine_(v) {
  return String(v === undefined || v === null ? '' : v).replace(/\s*[\r\n]+\s*/g, ' ').trim();
}

// The fields of an edit: only those the list allows and the draft changed, or null for no change. Text is
// trimmed; an emptied text keeps the old one (the server needs 1 to 500 characters). Text is compared before the
// 500 cut (R71), so an untouched long item is never sent and never shortened; edited text goes cut to 500 (R70).
function sheetDiff_(list, orig, draft) {
  var out = {};
  var any = false;
  (SHEET_FIELDS[list] || []).forEach(function (k) {
    var was = String(orig[k] === undefined || orig[k] === null ? '' : orig[k]);
    var now = String(draft[k] === undefined || draft[k] === null ? '' : draft[k]);
    if (k === 'text' || k === 'shop') {
      was = sheetOneLine_(was);
      now = sheetOneLine_(now);
      if (k === 'text' && !now) return;
    }
    if (k === 'who') {
      was = sheetWho_(was);
      now = sheetWho_(now);
    }
    if (k === 'priority') {
      was = todoPriority_(was);
      now = todoPriority_(now);
    }
    var send = k === 'text' ? now.slice(0, 500).trim() : now;
    if (now !== was && send !== was) { // a cut that lands on the stored text is no change either
      out[k] = send;
      any = true;
    }
  });
  return any ? out : null;
}

// The fields of an add, or null when there is no text (the new item is dropped). A time goes only with a day.
function sheetAddFields_(list, d) {
  var text = sheetOneLine_(d.text).slice(0, 500).trim(); // R70: 500 at most, as the Groceries add field
  if (!text) return null;
  if (list === 'grocery') {
    var shop = sheetOneLine_(d.shop);
    return shop ? { text: text, shop: shop } : { text: text };
  }
  var f = { text: text, who: sheetWho_(d.who) };
  if (todoValidDay_(d.due)) {
    f.due = d.due;
    if (/^\d{2}:\d{2}$/.test(d.time || '')) f.time = d.time;
  }
  if (todoPriority_(d.priority)) f.priority = d.priority; // PB-T3: Normal sends none
  return f;
}

// item null opens an empty sheet for a new item. prefill: {text} sets the starting text. quick (A1-T5): a new item
// from the Add slot, with the Expense / To-do / Grocery segments on top.
function openItemSheet_(it, list, prefill, quick) {
  list = list === 'grocery' ? 'grocery' : 'todo';
  whoShut_();
  if (SHEET) closeItemSheet_('replace');
  var cur = it && it.id ? (listsItem_(list, it.id) || it) : null;
  var orig = cur ? JSON.parse(JSON.stringify(cur)) : null;
  var today = listsToday_(LISTS); // A3-T2A: the phone's Bali day when the lists are not in yet
  var s = {
    list: list, id: orig ? orig.id : '', orig: orig, draft: sheetDraft_(list, orig, prefill, whoAmI_()),
    today: today, chips: sheetWhenChips_(today), pickTap: false, pickTimeTap: false,
    returnKey: orig ? 'open:' + orig.id : 'add', els: {}, ctls: [], focusEl: null, touch: null,
    hand: { when: false, time: false, priority: false, shop: false }, words: null, priWords: null, wordsOff: false, kept: '', done: false,
  };
  s.quick = !orig && !!quick;
  // A3-T2A M3: a new item closed without Add waits in kl.kept; the next Add of that list opens it again.
  var words = prefill && typeof prefill.text === 'string' ? sheetOneLine_(prefill.text) : '';
  var keep = !orig && !words ? qaKeptNext_(list) : null;
  if (keep) {
    var kd = keep.draft || {};
    ['text', 'who', 'due', 'time', 'shop', 'priority'].forEach(function (k) { if (typeof kd[k] === 'string') s.draft[k] = kd[k]; });
    s.draft.who = sheetWho_(s.draft.who);
    s.draft.priority = todoPriority_(s.draft.priority);
    s.hand = { when: !!(kd.hand && kd.hand.when), time: !!(kd.hand && kd.hand.time), priority: !!(kd.hand && kd.hand.priority), shop: !!(kd.hand && kd.hand.shop) };
    s.wordsOff = !!kd.wordsOff;
    s.kept = keep.key;
  }
  s.base = orig ? { due: s.draft.due, time: s.draft.time, priority: s.draft.priority } : { due: '', time: '', priority: '' }; // what the chips go back to
  // A new item's words (typed, carried from another segment, or kept) are read at once; an edit's only once typed.
  if (!orig && list === 'todo') sheetWordsRead_(s);
  // A3-T2B: an edit shows the item's whole first step under the text (not when the text was just set to it).
  s.step = list === 'todo' && orig && !(prefill && typeof prefill.text === 'string') ? todoStep_(orig) : '';
  SHEET = s;
  sheetBuild_(s);
  sheetInert_(true);
  sheetHistory_();
  // A new item or a smaller first step: straight into the text. An edit: the dialog itself, so the phone
  // keyboard does not cover the chips.
  s.focusEl = (orig && !prefill) ? s.els.panel : s.els.text;
  s.focusEl.focus({ preventScroll: true });
}

// The open sheet adds one history step, so the phone's back closes it (a sheet replacing another adds none).
function sheetHistory_() {
  if (SHEET_IN_HISTORY) return;
  var h = window.history;
  if (h && typeof h.pushState === 'function') {
    try {
      h.pushState({ sheet: 1 }, '');
      SHEET_IN_HISTORY = true;
    } catch (e) {}
  }
}

// how: 'close' (tap outside, Escape, swipe, Save, Enter), 'back' (the phone's back), 'nav' (the screen changes),
// 'lock' (lock-out), 'replace' (another sheet opens), 'hide' (pagehide, R58). An edit saves on every one; only close and back give focus back.
// A3-T2A M3: a new to-do or grocery is added only by Add; every other close keeps it in kl.kept (a lock-out drops it).
// A1-T5: the expense sheet saves only on its Save button; any other close keeps what was typed for the next Add.
// A1 final fix 3: with an amount typed, a close, back, screen change or pagehide keeps it in kl.kept (a reload keeps
// it) and close, back and a screen change say so; an empty one closes silently.
function closeItemSheet_(how) {
  var s = SHEET;
  if (!s) return null;
  if (s.list === 'settle') {
    sheetShut_(how); // nothing typed, nothing kept
    if (how === 'close' || how === 'back') moneyRepaint_();
    return null;
  }
  if (s.list === 'editexp') { // A3-T2B M7: closing saves (the sheet stays while it saves); leaving drops it
    if (how === 'close' || how === 'back') {
      if (how === 'back') SHEET_IN_HISTORY = false;
      editSheetSave_(s);
      if (SHEET === s && how === 'back') sheetHistory_(); // still open (saving, or a value to fix): back closes it again
      return null;
    }
    sheetShut_(how);
    if (EDIT && EDIT.id === s.editId) EDIT = null;
    return null;
  }
  if (s.list === 'expense') {
    sheetShut_(how);
    if (!s.done) qaKeepOnClose_(s, how);
    if (how === 'close' || how === 'back' || how === 'nav') {
      qaKeptToast_(); // fix round 1: a refused (or, final fix 3, unsaved) expense waits in Add; the line says so
      if (how !== 'nav') qaFocusAdd_();
    }
    return null;
  }
  sheetShut_(how);
  var quiet = how === 'nav' || how === 'lock' || how === 'replace' || how === 'hide';
  if (!quiet && s.list === 'todo') TODO_FOCUS = s.returnKey;
  if (!quiet && s.list === 'grocery') GRO_FOCUS = s.returnKey;
  // A3-T2A M3: one close rule. A new item is added only by Add (or the return key); any other close keeps what was
  // typed in kl.kept ("Not added yet. It is in Add." with Open); a lock-out lets it go with the session.
  if (!s.orig) {
    if (!s.done) sheetKeepOnClose_(s, how);
    if (!quiet) listsPaint_();
    if (how === 'close' || how === 'back' || how === 'nav') {
      qaKeptToast_(s.list);
      if (how !== 'nav') qaFocusAdd_();
    }
    return null;
  }
  // An edit saves on close, says "Saved." and offers Undo (the fields as they were).
  var op = sheetOp_(s);
  if (op) {
    listsQueue_(op);
    if (how === 'close' || how === 'back' || how === 'nav') {
      var back = {};
      Object.keys(op.fields).forEach(function (k) {
        var v = s.orig[k];
        back[k] = k === 'who' ? sheetWho_(v) : String(v === undefined || v === null ? '' : v);
      });
      listsToast_('Saved.', { kind: 'edit', list: s.list, id: s.id, fields: back });
    }
  } else if (!quiet) listsPaint_();
  return op;
}

// A3-T2A M3: a new to-do or grocery closed without Add. A reopened kept entry takes the edits, an emptied one leaves
// the list; a new draft joins it (the oldest of a list opens first). A lock-out keeps nothing (an unsaved draft goes with the session, as for expenses).
function sheetKeepOnClose_(s, how) {
  var typed = sheetOneLine_(s.draft.text) !== '';
  var d = {
    text: s.draft.text, who: s.draft.who, due: s.draft.due, time: s.draft.time, shop: s.draft.shop, priority: s.draft.priority || '',
    hand: { when: !!s.hand.when, time: !!s.hand.time, priority: !!s.hand.priority, shop: !!s.hand.shop }, wordsOff: !!s.wordsOff
  };
  if (how === 'lock') {
    if (s.kept) qaKeptDrop_(s.kept);
    return;
  }
  if (s.kept) {
    if (typed) qaKeptPut_(s.kept, d);
    else qaKeptDrop_(s.kept);
    return;
  }
  if (!typed) return;
  // fix 1: words carried from another segment start a new entry; an older kept one of that list stays (it opens first).
  qaKeptChange_(function (list) {
    list.push({ key: 'k' + newId_().slice(1), at: Date.now(), draft: d, why: 'unsaved', list: s.list });
  });
}

// A3-T2A: Add in a new to-do or grocery sheet (or the return key in its text field): adds what the sheet shows,
// the day and time words cut from the text as the bot cuts them. Empty text adds nothing and keeps the sheet.
function sheetAdd_(s) {
  if (SHEET !== s || s.done || s.orig) return;
  var fields = sheetAddFields_(s.list, sheetFinal_(s));
  if (!fields) {
    s.els.text.focus({ preventScroll: true });
    return;
  }
  s.done = true;
  if (s.kept) qaKeptDrop_(s.kept);
  if (s.list === 'todo') TODO_FOCUS = 'add';
  else GRO_FOCUS = 'add';
  sheetShut_('close');
  if (s.list === 'grocery') { // F4: the Shop row's shop (a hand pick, else the shop on show, else none)
    var gs = groShopSend_(s.hand.shop ? { hand: true, shop: s.draft.shop } : null, s.here, LISTS, s.draft.text);
    if (gs) fields.shop = gs;
    else delete fields.shop;
  }
  listsAddNew_(s.list, fields, s.list === 'grocery' ? (s.here || '') : '');
  qaFocusAdd_();
}

// The draft as it will be saved: the words cut from the text while the words line stands. Final fix 2: once any part
// (day or time) is picked by hand, the hand overrules the phrase, so nothing is cut and the phrase stays in the text.
// PB-T3: a priority word the words line stands for is cut too (it is read only while Priority was not picked by hand).
function sheetFinal_(s) {
  var d = JSON.parse(JSON.stringify(s.draft));
  if (s.list !== 'todo' || !sheetWordsShown_(s)) return d;
  if (s.words && !s.hand.when && !s.hand.time && sheetWordsText_(s.words, s.hand, s.today) !== '') d.text = s.words.text;
  else if (s.priWords && !s.hand.priority) d.text = s.priWords.text;
  return d;
}

function sheetWordsShown_(s) {
  return !s.wordsOff && sheetWordsLine_(s.words, s.priWords, s.hand, s.today) !== '';
}

// Discard (A3-T2A M3): a new draft is dropped, kept or not; the sheet closes with nothing added.
function sheetDiscard_(s) {
  if (SHEET !== s || s.done) return;
  s.done = true;
  if (s.kept) qaKeptDrop_(s.kept);
  if (s.list === 'expense') QA_DRAFT = null;
  else if (s.list === 'todo') TODO_FOCUS = 'add';
  else GRO_FOCUS = 'add';
  sheetShut_('close');
  if (s.list === 'expense') moneyRepaint_();
  else listsPaint_();
  qaFocusAdd_();
}

// A3-T2A M4: one add of a new to-do or grocery, from the sheet or the Groceries dock: queued with its id, then the
// dark toast says where it landed, with Undo; the new row is brought into view and briefly marked.
var LISTS_TRIED = {};    // fix 1: uids of list ops sent at least once on this page
var LISTS_NEW = null;    // {list, id, until}: the item just added, marked on its row until 'until'
var LISTS_NEW_EL = null; // its row on show after the latest paint, scrolled into view once
function listsAddNew_(list, fields, here) {
  var id = newId_();
  LISTS_NEW = { list: list, id: id, until: Date.now() + 2500, shown: false };
  var op = listsQueue_({ op: 'add', list: list, id: id, fields: fields });
  var it = listsItem_(list, id) || { due: fields.due, time: fields.time, who: fields.who, shop: fields.shop, priority: fields.priority };
  var text;
  if (list === 'todo') text = todoAddedText_(it, listsToday_(LISTS));
  else if (here && foldKey_(it.shop) === foldKey_(here)) text = 'Added to ' + here + '.';
  else text = 'Added under ' + (sheetOneLine_(it.shop) || 'Any shop') + '.';
  listsToast_(text, { kind: 'add', list: list, id: id, uid: op.uid });
  return op;
}

// The one dark toast for a list add or edit, with Undo. It replaces a "Deleted" line still on show (one at a time).
function listsToast_(text, undo) {
  if (LISTS_UNDO) {
    listsUndoClear_();
    listsPaint_();
  }
  qaToastSet_({ text: text, action: 'undo', listUndo: undo });
}

// Undo from that toast: an add is deleted (it shows as gone at once; the delete waits for the add to land), an edit
// is changed back to the fields it had.
function listsToastUndo_(u) {
  if (u.kind === 'add') {
    // Never sent, not on its way and not the head: it simply leaves the queue. Otherwise it may exist: the delete goes after it
    // (it waits for the add's reply, or a fresh read, and is dropped if the item is gone), lists loaded or not.
    // fix 2: never the head: another tab that adopted kl.queue may be sending it now.
    var q = listsByUid_(u.uid);
    if (q && !LISTS_TRIED[q.uid] && INFLIGHT !== q.uid && QUEUE[0] !== q) {
      listsQueueRemove_(q.uid);
      listsRebuild_();
      listsPaint_();
    } else {
      listsQueue_({ op: 'delete', list: u.list, id: u.id });
    }
    qaToastSet_({ text: 'Removed.' });
    return;
  }
  // Final fix 5: an item no longer listed (deleted or changed elsewhere) is left alone, and the line says so.
  if (!listsItem_(u.list, u.id)) {
    qaToastSet_({ text: 'This item changed.' });
    return;
  }
  listsQueue_({ op: 'edit', list: u.list, id: u.id, fields: u.fields });
  qaToastSet_({ text: 'Changed back.' });
}

// After a paint: the new row comes into view once, smoothly unless the phone asks for less motion. It is centred in
// the part of the screen nothing covers (above the toast, the Groceries dock, the keyboard and the tab bar); a row
// already in that part stays where it is.
function listsNewScroll_() {
  var e = LISTS_NEW_EL;
  LISTS_NEW_EL = null;
  if (!e) return;
  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var how = calm ? 'auto' : 'smooth';
  if (typeof e.getBoundingClientRect !== 'function' || typeof window.scrollBy !== 'function') {
    if (typeof e.scrollIntoView === 'function') e.scrollIntoView({ block: 'center', behavior: how });
    return;
  }
  var low = (Number(window.innerHeight) || 0) - GRO_KB;
  ['qa-toast', 'tabbar'].forEach(function (id) {
    var n = $(id);
    if (n && !n.hidden) low = Math.min(low, n.getBoundingClientRect().top);
  });
  if (GRO && GRO.box && VIEW.screen === 'groceries') low = Math.min(low, GRO.box.getBoundingClientRect().top);
  var r = e.getBoundingClientRect();
  var high = 64; // under a sticky shop header or the top of the screen
  if (r.top >= high && r.bottom <= low - 8) return;
  window.scrollBy({ top: r.top - (high + (low - high) / 2 - r.height / 2), behavior: how });
}

// A row being drawn: the item just added gets the brief mark, and the first row drawn for it is the one to show.
function listsNewMark_(row, it) {
  var n = LISTS_NEW;
  if (!n || !it || it.id !== n.id || Date.now() >= n.until) return;
  row.className += ' is-new';
  if (!n.shown) {
    n.shown = true;
    LISTS_NEW_EL = row;
  }
}

function sheetShut_(how) {
  SHEET = null;
  var root = $('sheet');
  root.textContent = '';
  root.hidden = true;
  sheetInert_(false);
  if (!SHEET_IN_HISTORY || how === 'replace') return;
  SHEET_IN_HISTORY = false;
  // Closed by a tap: remove the history step it added. Back already removed it; a screen change or a
  // lock-out leaves it, as a step back that does nothing.
  if (how !== 'close') return;
  var h = window.history;
  if (h && typeof h.back === 'function') {
    SHEET_POPS++;
    h.back();
  }
}

// The op the closed sheet sends, or null. When the item changed elsewhere while the sheet was open, the edit
// goes with the fp from when it opened, so the server refuses it ("This item changed. Refreshed.") instead
// of writing over the other change.
function sheetOp_(s) {
  if (typeof s.finish === 'function') s.finish(); // Task 8: the shop as typed becomes a known shop's spelling
  if (!s.orig) {
    var fields = sheetAddFields_(s.list, s.draft);
    return fields ? { op: 'add', list: s.list, fields: fields } : null;
  }
  var diff = sheetDiff_(s.list, s.orig, sheetFinal_(s)); // A3-T2A: the words cut once they set the day
  if (!diff) return null;
  var op = { op: 'edit', list: s.list, id: s.id, fields: diff };
  var cur = listsItem_(s.list, s.id);
  if (cur && s.orig.fp && sheetDiff_(s.list, s.orig, sheetDraft_(s.list, cur))) op.fp = s.orig.fp;
  return op;
}

// Delete: one delete through the queue, and "Deleted. Undo" for 6 s. The draft is dropped.
function sheetDelete_() {
  var s = SHEET;
  if (!s || !s.orig) return;
  sheetShut_('close');
  listsDelete_(s.list, listsItem_(s.list, s.id) || s.orig);
}

// One item deleted (from the sheet or by a swipe): the delete goes through the queue, "Deleted. Undo" for 6 s.
function listsDelete_(list, it) {
  var cur = listsItem_(list, it.id) || it;
  listsUndoStart_(list, todoCopy_(cur));
  if (list === 'todo') TODO_FOCUS = 'undo';
  else GRO_FOCUS = 'undo';
  listsQueue_({ op: 'delete', list: list, id: it.id });
}

// ---- swipe on a list row (A1-T3): right ticks (a struck row unticks), left deletes; both as their taps do --------
// A sideways move of 80 px or more counts; a mostly up-and-down move is the page scrolling and does nothing.
// onLeft null: no delete by swipe (a struck row). The row follows the finger while it moves sideways.
// A3-T2B m5: while it slides, what the swipe does shows in the strip it uncovers: rightLabel ('Done', 'Bought',
// 'Not done') on the left, 'Delete' on the right. The strip is the row's own child, moved back by as much as the
// row moved, so it stays put in the gap; it is hidden again when the finger lifts.
var SWIPE_MIN = 80;

function listsSwipe_(row, onRight, onLeft, rightLabel) {
  var s = null;
  var under = null;
  var show = function (dx) {
    if (!under) {
      under = add(row, 'span', 'swipe-under');
      under.setAttribute('aria-hidden', 'true');
    }
    var right = dx > 0;
    under.className = 'swipe-under ' + (right ? 'swipe-done' : 'swipe-del');
    under.textContent = right ? (rightLabel || 'Done') : 'Delete';
    under.style.width = Math.abs(dx) + 'px';
    under.style.left = right ? '0' : '';
    under.style.right = right ? '' : '0';
    under.style.transform = 'translateX(' + (-dx) + 'px)';
    under.hidden = false;
  };
  var reset = function () {
    row.style.transform = '';
    if (under) {
      under.hidden = true;
      under.textContent = '';
    }
  };
  row.addEventListener('touchstart', function (e) {
    var t = e && e.touches && e.touches[0];
    s = t && e.touches.length === 1 ? { x: t.clientX, y: t.clientY, side: false } : null;
  }, { passive: true });
  row.addEventListener('touchmove', function (e) {
    var t = e && e.touches && e.touches[0];
    if (!s || !t) return;
    var dx = t.clientX - s.x;
    var dy = t.clientY - s.y;
    if (!s.side) {
      if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { s = null; reset(); return; }
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) s.side = true;
    }
    if (s.side && (dx > 0 ? onRight : onLeft)) {
      var moved = Math.round(dx * 0.6);
      row.style.transform = 'translateX(' + moved + 'px)';
      show(moved);
    } else if (s.side) {
      reset();
    }
  }, { passive: true });
  row.addEventListener('touchend', function (e) {
    var a = s;
    var t = e && e.changedTouches && e.changedTouches[0];
    s = null;
    reset();
    if (!a || !a.side || !t) return;
    var dx = t.clientX - a.x;
    var dy = t.clientY - a.y;
    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx > 0 && onRight) onRight();
    else if (dx < 0 && onLeft) onLeft();
  }, { passive: true });
  row.addEventListener('touchcancel', function () { s = null; reset(); }, { passive: true });
}

function listsUndoStart_(list, snap) {
  listsUndoClear_();
  if (QA_TOAST && QA_TOAST.listUndo) qaToastSet_(null); // A3-T2A: one line at a time, the newest
  LISTS_UNDO = { list: list, item: snap };
  LISTS_UNDO_TIMER = setTimeout(function () {
    LISTS_UNDO_TIMER = null;
    LISTS_UNDO = null;
    if (TODO_FOCUS === 'undo') TODO_FOCUS = 'add';
    if (GRO_FOCUS === 'undo') GRO_FOCUS = '';
    listsPaint_();
  }, 6000);
}

function listsUndoClear_() {
  if (LISTS_UNDO_TIMER !== null) clearTimeout(LISTS_UNDO_TIMER);
  LISTS_UNDO_TIMER = null;
  LISTS_UNDO = null;
  LISTS_UNDO_SAY = null;
}

// Undo: a restore with the item as it was, so it shows again at once.
function listsUndo_() {
  var u = LISTS_UNDO;
  if (!u) return;
  listsUndoClear_();
  if (u.list === 'todo') TODO_FOCUS = 'tick:' + u.item.id;
  else GRO_FOCUS = 'tick:' + u.item.id;
  listsQueue_({ op: 'restore', list: u.list, id: u.item.id, item: u.item });
}

// Everything behind the sheet is inert while it is open.
function sheetInert_(on) {
  ['home', 'month', 'trends', 'balance', 'todo', 'groceries', 'tabbar', 'qa-toast'].forEach(function (id) { $(id).inert = on; });
}

// A control in the sheet, in screen order, for the Tab loop. shown says when it is on screen.
function sheetCtl_(s, e, shown) {
  s.ctls.push({ e: e, shown: shown || null });
  return e;
}

function sheetFocusables_(s) {
  return s.ctls.filter(function (c) {
    if (s.list === 'expense' && s.grid && !sheetInGrid_(s, c.e)) return false; // A3-T2A: All types keeps Tab
    return !c.e.disabled && (!c.shown || c.shown());
  }).map(function (c) { return c.e; });
}

function sheetInGrid_(s, e) {
  for (var n = e; n; n = n.parentNode) if (n === s.els.gridPanel) return true;
  return false;
}

function sheetKey_(e) {
  var s = SHEET;
  if (!s || !e) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    if (s.grid && s.list === 'expense') qaGridClose_(s); // A3-T2A: All types closes first
    else closeItemSheet_('close');
    return;
  }
  if (e.key !== 'Tab') return;
  var list = sheetFocusables_(s);
  if (!list.length) return;
  var i = list.indexOf(e.target);
  if (e.shiftKey && i <= 0) {
    e.preventDefault();
    list[list.length - 1].focus();
  } else if (!e.shiftKey && (i === -1 || i === list.length - 1)) {
    e.preventDefault();
    list[0].focus();
  }
}

function sheetPopState_() {
  if (SHEET_POPS > 0) { SHEET_POPS--; return; }
  if (!SHEET) return;
  SHEET_IN_HISTORY = false;
  closeItemSheet_('back');
}

// After a repaint: focus stays in the sheet (it normally never left; this is the fallback).
function sheetClaimFocus_() {
  var s = SHEET;
  if (!s) return;
  var a = document.activeElement;
  var root = $('sheet');
  if (a && typeof root.contains === 'function' && root.contains(a)) return;
  var t = s.focusEl || s.els.panel;
  if (t) t.focus({ preventScroll: true });
}

function sheetGrow_(ta) {
  ta.style.height = 'auto';
  if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px';
}

function sheetTitle_(s) {
  if (s.list === 'grocery') return s.orig ? 'Edit item' : 'New item';
  return s.orig ? 'Edit to-do' : 'New to-do';
}

// The sheet's frame in the static #sheet: the backdrop (a tap closes), the dialog panel (a swipe down closes) and
// its handle. Shared by the item sheet and the expense sheet (A1-T5). Returns the panel.
function sheetFrame_(s, label) {
  var root = $('sheet');
  root.textContent = '';
  var shade = add(root, 'div', 'sheet-backdrop');
  shade.addEventListener('click', function () { if (SHEET === s) closeItemSheet_('close'); });
  var p = add(root, 'div', 'sheet-panel');
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-modal', 'true');
  p.setAttribute('aria-label', label);
  p.setAttribute('tabindex', '-1');
  s.els.panel = p;
  // A swipe down closes it; a short or sideways one, or one while the sheet is scrolled, does not.
  p.addEventListener('touchstart', function (e) {
    // M1: a drag that starts in a text or date field is selecting or scrolling there, never a close.
    for (var n = e && e.target; n && n !== p; n = n.parentNode) {
      if (/^(TEXTAREA|INPUT|SELECT)$/.test(String(n.tagName || ''))) {
        s.touch = null;
        return;
      }
    }
    var t = e && e.touches && e.touches[0];
    s.touch = t ? { x: t.clientX, y: t.clientY, top: p.scrollTop || 0 } : null;
  }, { passive: true });
  p.addEventListener('touchend', function (e) {
    var a = s.touch;
    var t = e && e.changedTouches && e.changedTouches[0];
    s.touch = null;
    if (!a || !t || SHEET !== s || a.top > 0) return;
    var dy = t.clientY - a.y;
    var dx = t.clientX - a.x;
    if (dy > 80 && dy > Math.abs(dx) * 1.5) closeItemSheet_('close');
  }, { passive: true });
  add(p, 'div', 'sheet-handle').setAttribute('aria-hidden', 'true');
  return p;
}

// A3-T2A K2: the header row, before everything else, so the phone keyboard never covers it: the visible title, then
// Discard (a new draft with content only, M3) and the main button top right (Add for a new item, Save for an edit).
function sheetHead_(p, s, title, mainLabel, mainCls, onMain) {
  var head = add(p, 'div', 'qa-head');
  add(head, 'h2', 'qa-title', title);
  if (!s.orig) {
    var dis = btn(head, 'textbtn sheet-discard', 'Discard', function () { sheetDiscard_(s); });
    s.els.drop = sheetCtl_(s, dis, function () { return !dis.hidden; });
    dis.hidden = true;
  }
  s.els.main = sheetCtl_(s, btn(head, mainCls, mainLabel, onMain));
  return head;
}

function sheetBuild_(s) {
  var root = $('sheet');
  var p = sheetFrame_(s, sheetTitle_(s));
  sheetHead_(p, s, sheetTitle_(s), s.orig ? 'Save' : 'Add', 'btn-main sheet-save', function () {
    if (SHEET !== s) return;
    if (s.orig) closeItemSheet_('close');
    else sheetAdd_(s);
  });
  if (s.quick) qaSegments_(p, s); // A1-T5
  var ta = sheetCtl_(s, add(p, 'textarea', 'sheet-text'));
  ta.setAttribute('aria-label', s.list === 'grocery' ? 'Item' : 'To-do');
  ta.setAttribute('maxlength', '500');
  ta.setAttribute('rows', '1');
  ta.setAttribute('enterkeyhint', s.orig ? 'done' : 'go');
  if (!s.orig) ta.setAttribute('placeholder', s.list === 'grocery' ? 'Add an item' : 'What needs doing?');
  ta.value = s.draft.text;
  ta.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.text = ta.value;
    sheetGrow_(ta);
    if (s.list === 'todo') sheetWordsRead_(s); // A3-T2A K1: the words are read on every keystroke
    sheetSync_(s);
  });
  // Enter: a new item is added with what the sheet shows; an edit saves and closes. A to-do is one line.
  ta.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      if (s.orig) closeItemSheet_('close');
      else sheetAdd_(s);
    }
  });
  s.els.text = ta;
  if (s.step) add(p, 'p', 'sheet-step', 'First step: ' + s.step);
  if (s.list === 'todo') sheetTodoFields_(p, s);
  else if (s.orig) {
    s.els.shop = add(p, 'div', 'sheet-shop');
    if (typeof sheetShop_ === 'function') sheetShop_(s.els.shop, s); // Task 8
  } else sheetGShop_(p, s); // F4: a new grocery item gets the Shop row once it has text
  if (s.orig) {
    var foot = add(p, 'div', 'sheet-foot');
    sheetCtl_(s, btn(foot, 'textbtn sheet-delete', 'Delete', sheetDelete_));
  }
  root.hidden = false;
  sheetSync_(s);
  sheetGrow_(ta);
  groDockPlace_(); // A3-T2A K2: on top of the keyboard when it is up
}

// A3-T2A K1: the words in the text, read with the bot's parser. Unless Undo set them aside for this item, the When
// and Time chips follow them, except a part picked by hand (hand wins). No words: those chips go back to how they
// started. A time always comes with a day: one alone goes on today when it is still ahead in Bali, else tomorrow.
// PB-T3: a priority word at the start or end is read first (not once Priority is picked by hand); the date words are
// then read on what is left. A today word with no other date phrase sets today.
function sheetWordsRead_(s) {
  var w = null;
  var pw = null;
  if (!s.wordsOff) {
    if (!s.hand.priority) pw = sheetPriWords_(s.draft.text);
    var rest = pw ? pw.text : s.draft.text;
    try { w = parseWhen_(rest, new Date()); } catch (e) { w = null; }
    if (!(w && w.due) && pw && pw.today && todoValidDay_(s.today)) w = { text: rest, due: s.today, time: '' };
  }
  s.priWords = pw;
  s.words = w && w.due ? w : null;
  s.wordsRead = true; // an edit's words are read once typed (never at open); a chip tap reads them again only after that
  sheetWordsApply_(s);
}

function sheetWordsApply_(s) {
  var w = s.wordsOff ? null : s.words;
  if (!s.hand.priority) s.draft.priority = (!s.wordsOff && s.priWords) ? s.priWords.priority : (s.base.priority || '');
  if (!s.hand.when) {
    s.draft.due = w ? w.due : s.base.due;
    s.dayByTime = false;
  }
  if (!s.hand.time) s.draft.time = w ? w.time : s.base.time;
  sheetTimeNeedsDay_(s);
}

// A3-T2A fix 1: a day set by a time alone (never by hand or by the words) follows the next time picked.
function sheetTimeNeedsDay_(s) {
  if (!s.draft.time) return;
  if (todoValidDay_(s.draft.due) && !s.dayByTime) return; // fix 2: No date is not a day picked by hand
  s.draft.due = sheetDayFor_(s.draft.time, s.today, baliMinutes_(Date.now()));
  s.dayByTime = true;
}

// A label on the left and one row of chips that scrolls sideways (A3-T2A K1, K2).
function sheetRow_(p, id, label, cls) {
  var r = add(p, 'div', 'sheet-row');
  add(r, 'p', 'sheet-label', label).setAttribute('id', id);
  var g = add(r, 'div', 'sheet-chips sheet-scroll' + (cls ? ' ' + cls : ''));
  g.setAttribute('role', 'group');
  g.setAttribute('aria-labelledby', id);
  return g;
}

function sheetScrollRow_(s, g) {
  if (!s.scrolls) s.scrolls = [];
  s.scrolls.push({ g: g, on: null });
  return g;
}

// A native picker: shown at once where the browser can, else the field takes focus (a tap there opens it).
function sheetPicker_(input) {
  try {
    if (typeof input.showPicker === 'function') { input.showPicker(); return; }
  } catch (e) {}
  input.focus({ preventScroll: true });
}

// To do (A3-T2A K1): the words line, then When, Time and Who, each one row with its label on the left.
function sheetTodoFields_(p, s) {
  s.sync = [];
  p.className += ' sheet-todo'; // PB-T3: its labels get room for "Priority" on one line
  var line = add(p, 'div', 'sheet-words');
  var said = add(line, 'p', 'sheet-words-text');
  said.setAttribute('role', 'status');
  var undo = sheetCtl_(s, btn(line, 'textbtn sheet-words-undo', 'Undo', function () {
    if (SHEET !== s) return;
    s.wordsOff = true;
    s.words = null;
    s.priWords = null;
    sheetWordsApply_(s);
    sheetSync_(s);
    s.els.text.focus({ preventScroll: true });
  }), function () { return !line.hidden; });
  undo.setAttribute('aria-label', 'Undo: do not read the words');
  s.sync.push(function () {
    var t = s.wordsOff ? '' : sheetWordsLine_(s.words, s.priWords, s.hand, s.today);
    line.hidden = !t;
    said.textContent = t;
  });
  var chip = function (g, label, onTap, isOn, cls) {
    var b = sheetCtl_(s, btn(g, 'schip' + (cls ? ' ' + cls : ''), label, function () {
      if (SHEET !== s) return;
      onTap();
      sheetSync_(s);
    }));
    s.sync.push(function () { b.setAttribute('aria-pressed', isOn() ? 'true' : 'false'); });
    return b;
  };
  var isChipDay = function (d) { return s.chips.some(function (c) { return c.due === d; }); };
  var picking = function () { return s.pickTap || (todoValidDay_(s.draft.due) && !isChipDay(s.draft.due)); };
  var firstChip = function (d) {
    for (var i = 0; i < s.chips.length; i++) if (s.chips[i].due === d) return s.chips[i];
    return null;
  };
  var when = sheetScrollRow_(s, sheetRow_(p, 'sheet-when', 'When'));
  s.whenChip = null; // F4: the day chip tapped last; it stays the pressed one while the day is still its day
  s.chips.forEach(function (c) {
    chip(when, c.label, function () {
      s.draft.due = c.due;
      s.whenChip = c;
      s.hand.when = true;
      s.dayByTime = false; // fix 2: a day picked by hand never follows a time
      s.pickTap = false;
    }, function () {
      return !picking() && (s.whenChip && s.whenChip.due === s.draft.due ? s.whenChip === c : firstChip(s.draft.due) === c);
    });
  });
  var day;
  chip(when, 'Pick a day', function () {
    s.hand.when = true;
    s.dayByTime = false;
    s.pickTap = true;
    sheetSync_(s);
    sheetPicker_(day);
  }, picking);
  chip(when, 'No date', function () {
    s.draft.due = '';
    s.draft.time = '';
    s.hand.when = true; // the words leave the day alone; a time picked next still sets (and moves) the day
    s.hand.time = true;
    s.dayByTime = false;
    s.pickTap = false;
    s.pickTimeTap = false;
  }, function () { return !picking() && !s.draft.due; });
  day = sheetCtl_(s, add(p, 'input', 'sheet-day'), function () { return picking(); });
  day.setAttribute('type', 'date');
  day.setAttribute('aria-label', 'Pick a day');
  if (s.today) day.setAttribute('min', s.today);
  // I1: the field always shows the day that will be saved. A partial or cleared entry keeps the day; the
  // field shows it again once the entry is done (change), never in the middle of typing (input).
  var takeDay = function (resync) {
    if (SHEET !== s) return;
    var ok = todoValidDay_(day.value);
    if (ok) {
      s.draft.due = day.value;
      s.hand.when = true;
      s.dayByTime = false;
      s.pickTap = true;
    }
    if (ok || resync) sheetSync_(s);
  };
  day.addEventListener('input', function () { takeDay(false); });
  day.addEventListener('change', function () { takeDay(true); });
  s.sync.push(function () {
    var on = picking();
    day.hidden = !on;
    if (on) day.value = todoValidDay_(s.draft.due) ? s.draft.due : '';
  });

  var timing = function () { return s.pickTimeTap || (!!s.draft.time && SHEET_TIMES.indexOf(s.draft.time) < 0); };
  var times = sheetScrollRow_(s, sheetRow_(p, 'sheet-time-label', 'Time'));
  chip(times, 'No time', function () {
    s.draft.time = '';
    s.hand.time = true;
    s.pickTimeTap = false;
    if (s.dayByTime) { // final fix 3: a day set by the time alone goes with it
      s.draft.due = '';
      s.dayByTime = false;
    }
  }, function () { return !timing() && !s.draft.time; });
  SHEET_TIMES.forEach(function (t) {
    chip(times, t, function () {
      s.draft.time = t;
      s.hand.time = true;
      s.pickTimeTap = false;
      sheetTimeNeedsDay_(s);
    }, function () { return !timing() && s.draft.time === t; }, 'schip-time');
  });
  var time;
  chip(times, 'Pick time', function () {
    if (!s.draft.time || SHEET_TIMES.indexOf(s.draft.time) >= 0) s.draft.time = sheetNextQuarter_(baliMinutes_(Date.now()));
    s.hand.time = true;
    s.pickTimeTap = true;
    sheetTimeNeedsDay_(s);
    sheetSync_(s);
    sheetPicker_(time);
  }, timing);
  time = sheetCtl_(s, add(p, 'input', 'sheet-time'), function () { return timing(); });
  time.setAttribute('type', 'time');
  time.setAttribute('aria-label', 'Time');
  time.setAttribute('step', '300');
  var takeTime = function (resync) {
    if (SHEET !== s) return;
    var v = String(time.value || '');
    if (/^\d{2}:\d{2}/.test(v)) {
      s.draft.time = v.slice(0, 5);
      s.hand.time = true;
      s.pickTimeTap = true;
      sheetTimeNeedsDay_(s);
    }
    if (resync) sheetSync_(s);
  };
  time.addEventListener('input', function () { takeTime(false); });
  time.addEventListener('change', function () { takeTime(true); });
  s.sync.push(function () {
    var on = timing();
    time.hidden = !on;
    if (on && time.value !== s.draft.time) time.value = s.draft.time; // shown is saved
  });

  var who = sheetRow_(p, 'sheet-who', 'Who');
  // A1-T7: Kev, Lili and Couple carry their person's colour when picked (as the row chips); Either stays plain.
  ['Kev', 'Lili', 'Couple', 'Either'].forEach(function (name) {
    chip(who, name, function () { s.draft.who = name; }, function () { return sheetWho_(s.draft.who) === name; },
      name === 'Either' ? '' : 'schip-' + name.toLowerCase());
  });

  // PB-T3: Priority, the same kind of row. Someday is stored as Later. A chip tapped by hand wins over the words.
  var pri = sheetScrollRow_(s, sheetRow_(p, 'sheet-pri', 'Priority'));
  [['Important', 'Important'], ['Normal', ''], ['Someday', 'Later']].forEach(function (c) {
    chip(pri, c[0], function () {
      s.draft.priority = c[1];
      s.hand.priority = true;
      if (s.wordsRead) sheetWordsRead_(s); // the priority word is no longer read: the date words go back to the whole text
    }, function () { return todoPriority_(s.draft.priority) === c[1]; });
  });
}

function sheetSync_(s) {
  (s.sync || []).forEach(function (f) { f(); });
  if (s.els && s.els.drop) s.els.drop.hidden = !sheetHasContent_(s); // A3-T2A M3
  (s.scrolls || []).forEach(function (r) { // A3-T2A: a pick that changed is scrolled into its row's view
    var on = null;
    for (var i = 0; i < r.g.children.length && !on; i++) if (r.g.children[i].getAttribute('aria-pressed') === 'true') on = r.g.children[i];
    if (on && on !== r.on && r.seen) sheetReveal_(r.g, on); // not on open: the row starts at its first chips
    r.on = on;
    r.seen = true;
  });
}

// Scrolls a sideways row just enough to show chip b (the user's own scrolling is left alone otherwise).
function sheetReveal_(g, b) {
  var x = (Number(b.offsetLeft) || 0) - (Number(g.offsetLeft) || 0);
  var w = Number(b.offsetWidth) || 0;
  var cw = Number(g.clientWidth) || 0;
  var at = Number(g.scrollLeft) || 0;
  if (!cw || !w) return;
  if (x < at) g.scrollLeft = Math.max(0, x - 8);
  else if (x + w > at + cw) g.scrollLeft = x + w - cw + 8;
}

// A new draft has content: words typed (a to-do or grocery), an amount or words (an expense).
function sheetHasContent_(s) {
  if (s.list === 'expense') return String(s.draft.amount || '').trim() !== '' || String(s.draft.item || '').trim() !== '';
  return sheetOneLine_(s.draft.text) !== '';
}

// ---- A1-T5 quick add: Expense, To-do, Grocery behind the Add slot ---------------------------------------------
// The expense sheet is a sheet like the item sheet (SHEET.list 'expense', in the static #sheet), so Escape, back,
// a tap outside, a swipe down, a screen change and a lock-out all close it the same way; only Save saves. Save puts
// one 'expense' op on the list queue (kl.queue) with an 'x:' id made at that tap: it is sent on its own through
// addExpense (R-A5), and the server appends at most one row for an id, so a resend after a lost reply, a replay
// after a reload and a double tap are all safe.
var QA_SEGMENTS = [['expense', 'Expense'], ['todo', 'To-do'], ['grocery', 'Grocery']];
var QA_CURRENCIES = ['IDR', 'EUR', 'USD'];
var QA_WHEN = [['today', 'Today'], ['yesterday', 'Yesterday'], ['pick', 'Pick a day']];
var QA_DRAFT = null;       // an expense typed and not saved (closed, switched away, refused); memory only, this visit

  [/^(?![\s\S]*(?:settle|remboursement entre nous))[\s\S]*(?:lemon ?(?:(?:&|\+|and|et|n) ?)?pepper|\bl ?& ?p\b)/i, 'Business'],

  [/cinema|massage|spa\b|yoga|padel|gym|surf|leisure|badminton|tennis|football|foot\b|basket|swim|pool\b|golf|running|(?<!pas)sport|bowling|dance|climb|hike|diving|snorkel/i, 'Leisure'],
  [/cloth|h ?& ?m|zara|stradivarius|shoe|dress|shopping/i, 'Shopping'],
  [/deco\b|decoration|shells|plant\b|vase|candle/i, 'Decoration'],
  [/furniture|meuble|ikea|\btable\b|chair|sofa|mattress/i, 'Furniture'],
  [/spotify|netflix|telekomsel|telkomsel|pulsa|credit|abonnement|subscription|yolla/i, 'Subscriptions'],
  [/vet\b|chico|pet\b|croquettes/i, 'Pets'],
  [/laundry|cleaning|savon|soap|household|sodastream/i, 'Household'],
  [/settle|settlement|remboursement entre nous/i, 'Settlement'],
  // E-R8: tabs the couple added by hand to the sheet's dropdown.
  [/\brent\b(?! (?:a |an )?(?:car|bike|motorbike|motor|scooter|cycle))|\bloyer\b|\bsewa\b/i, 'Rent'],
  [/(?<!(?:by|par|with|avec|carte|card|via) )\bvisa\b(?! ?(?:card|carte|debit|credit))|kitas|kitap|immigration|imigrasi|passport|passeport|notaire|notary|^(?![\s\S]*\b(?:bank|wise|transfer)\b)[\s\S]*\badmin\b(?! ?fees?)/i, 'Visa & admin'],
  [/flight|\bvol\b|avion|airasia|garuda|lion air|hotel|booking\.com|airbnb|ferry|\btrain\b/i, 'Travel'],
  [/cadeau|\bgifts?\b|\bkado\b|hadiah|anniversaire|birthday/i, 'Gifts'],
  [/squarespace|business|\bclients?\b|invoice/i, 'Business'],
  [/fruit|market|gran lucky|island organic|soilfood|grocer|food|veggie|vegetable|legumes|supermarket|pepito|bintang|choco|\blait\b|\bmilk|\bsusu\b|\bpain\b(?! ?killers?)|bread|\broti\b|croissant|baguette|boulangerie|bakery|oeufs?\b|\u0153ufs?\b|\beggs?\b|\btelur\b|\briz\b|\brice\b(?! ?cookers?)|\bberas\b|fromage|cheese|\bkeju\b|yaourt|yogh?o?urt|beurre|\bbutter\b|biscuit|cookie|snack|\bchips\b|cereal|\bpates\b|\bpasta\b|farine|\bflour\b|\bsucre\b|sugar|\bgula\b|\bsel\b|\bsalt\b(?! ?lamps?)|huile|\boil\b|poulet|chicken|\bayam\b|viande|\bmeats?\b|\bdaging\b|poisson|\bfish\b|\bikan\b|banan|pisang|mangue|mango|\btomat|\bjus\b|juice|epicerie|alfamart|alfamidi|indomaret|circle ?k\b|minimart|mini ?market|\beau\b(?! de (?:toilette|parfum|cologne))|water bottles?|bottled water|\bgalon\b|\bminyak\b|\bbawang\b|carrefour|\blotte\b|hypermart|papaya|coco ?mart|frestive|\btofu\b|\btempeh?\b|\blemons?\b|\bcitrons?\b/i, 'Groceries']
`;
var QA_KEYWORDS = null;

// The table as [RegExp, category] pairs, in order. Comment lines are skipped.
function qaKeywords_() {
  if (QA_KEYWORDS) return QA_KEYWORDS;
  var out = [];
  QA_KEYWORDS_SRC.split('\n').forEach(function (line) {
    var m = /^\s*\[\/(.*)\/([a-z]*), '([^']+)'\],?\s*$/.exec(line);
    if (!m) return;
    try { out.push([new RegExp(m[1], m[2]), m[3]]); } catch (e) {}
  });
  QA_KEYWORDS = out;
  return out;
}

// The words as the bot reads them: accents removed, lowercase.
function qaFold_(t) {
  var s = String(t === undefined || t === null ? '' : t);
  if (typeof s.normalize === 'function') s = s.normalize('NFD');
  return s.replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// The category the bot would give these words, among cats. Never Settlement (only Settle up makes one); a category
// the sheet does not have, or no match, gives Other (or the first category when the sheet has no Other).
function qaGuess_(text, cats) {
  var fallback = (!cats || !cats.length || cats.indexOf('Other') >= 0) ? 'Other' : cats[0];
  var t = qaFold_(text);
  var name = fallback;
  if (t.trim()) {
    var rules = qaKeywords_();
    for (var i = 0; i < rules.length; i++) {
      if (rules[i][0].test(t)) { name = rules[i][1]; break; }
    }
  }
  if (name === 'Settlement' || (cats && cats.indexOf(name) < 0)) name = fallback;
  return name;
}

// An amount as typed, or null when it is not one. Spaces are ignored; a trailing k means thousands.
// A mark (dot or comma) is a thousands mark only when the group before it is 1 to 3 digits and not 0, and every
// group after it is exactly 3 digits ("1.500", "85,000", "1.500.000"). Otherwise one mark is the decimal mark
// ("1.5", "0.500", "12,30"). With both marks, the last one is the decimal mark and the other one a thousands mark
// under the same rule ("1,234.50", "1.234,50"). EUR and USD keep at most 2 decimals ("0.500" is 0.5; "0.001" and
// "1234.567" are no amount). IDR is whole rupiah, and under 1000 it means thousands, as with the bot: "85" is 85000
// and "1.5" is 1500; a rupiah amount of 1000 or more with decimals ("1500.5") is no amount.
function qaAmount_(text, currency) {
  if (currency !== 'IDR' && currency !== 'EUR' && currency !== 'USD') return null;
  var t = String(text === undefined || text === null ? '' : text).replace(/\s+/g, '');
  var k = /k$/i.test(t);
  if (k) t = t.slice(0, -1);
  if (!/^\d[\d.,]*$/.test(t) || /[.,]$/.test(t)) return null;
  // Groups joined by mark read as one whole number, or null when they are not thousands groups.
  var thousands = function (str, mark) {
    var g = str.split(mark);
    if (g.length < 2 || !/^[1-9]\d{0,2}$/.test(g[0])) return null;
    for (var i = 1; i < g.length; i++) if (!/^\d{3}$/.test(g[i])) return null;
    return g.join('');
  };
  var marks = t.replace(/\d/g, '');
  var n = null;
  if (!marks) {
    n = Number(t);
  } else if (marks.split('').every(function (c) { return c === marks.charAt(0); })) {
    var whole = thousands(t, marks.charAt(0));
    if (whole !== null) n = Number(whole);
    else if (marks.length === 1) n = Number(t.replace(/[.,]/, '.'));
  } else {
    var last = marks.charAt(marks.length - 1);
    var inner = marks.slice(0, -1);
    var at = t.lastIndexOf(last);
    var head = inner.split('').every(function (c) { return c === inner.charAt(0); }) ? thousands(t.slice(0, at), inner.charAt(0)) : null;
    if (head !== null) n = Number(head + '.' + t.slice(at + 1));
  }
  if (n === null || !isFinite(n)) return null;
  if (k) n *= 1000;
  else if (currency === 'IDR' && n < 1000) n *= 1000;
  n = Math.round(n * 1e6) / 1e6; // drops float noise such as 0.29 * 1000
  if (currency === 'IDR' ? Math.round(n) !== n : Math.round(n * 100) / 100 !== n) return null;
  return n > 0 && n < 1e12 ? n : null;
}

// The line under the amount: what will be saved, then the same in the other currency at the month's rate (fx from
// the payload). Without a rate only the amount. '' while there is no amount.
function qaPreview_(amount, currency, fx) {
  if (typeof amount !== 'number' || !(amount > 0)) return '';
  var num = function (v) { return typeof v === 'number' && isFinite(v) && v > 0 ? v : 0; };
  var rate = fx ? num(fx.idrPerEur) : 0;
  var eurUsd = fx ? num(fx.eurUsd) : 0;
  if (currency === 'IDR') return fmtIdr(amount) + (rate ? ' · ' + fmtEur(amount / rate) : '');
  if (currency === 'EUR') return fmtEur(amount) + (rate ? ' · ' + fmtIdr(Math.round(amount * rate / 1000) * 1000) : '');
  return 'USD ' + fixed2(amount) + (eurUsd ? ' · ' + fmtEur(amount / eurUsd) : '');
}

// The Money numbers to read the rate and the categories from: on show, else the kl.money snapshot.
function qaData_() {
  return DATA || moneyCacheData_(lsJson_(LS_MONEY));
}

// The categories the grid offers: the sheet's own list (Settlement never), else the bot's table plus Other.
function qaCats_() {
  var d = qaData_();
  var out = [];
  var take = function (c) { if (typeof c === 'string' && c && c !== 'Settlement' && out.indexOf(c) < 0) out.push(c); };
  ((d && Array.isArray(d.categories)) ? d.categories : []).forEach(take);
  if (out.length) return out;
  qaKeywords_().forEach(function (r) { take(r[1]); });
  take('Other');
  return out;
}

function qaFresh_() {
  return { amount: '', currency: 'IDR', item: '', category: '', hand: false, paidBy: 'Couple', paidFor: 'Couple', when: 'today', day: '' };
}

// ---- refused expenses (fix round 1): their own list, never the one QA_DRAFT slot, so nothing overwrites them.
// Kept in kl.kept (read and written on every change, so another tab or a reload sees the same list), and only in
// memory while writes to it fail. Each entry: {key, at, draft}; draft.id is the refused op's 'x:' id, used again
// by the next Save of that draft, so an add that landed after all is answered existed and never doubled. An entry
// leaves the list only when its draft is saved again. Lock-out keeps the list, as it keeps the queue.
var QA_KEPT = [];
var QA_KEPT_MEM = false; // the last kl.kept write failed: the list lives only in this page

function qaKeptOk_(e) {
  return !!e && typeof e === 'object' && typeof e.key === 'string' && !!e.draft && typeof e.draft === 'object';
}

function qaKept_() {
  if (QA_KEPT_MEM) return QA_KEPT;
  var v = lsJson_(LS_KEPT);
  QA_KEPT = Array.isArray(v) ? v.filter(qaKeptOk_) : [];
  return QA_KEPT;
}

function qaKeptChange_(change) {
  var list = qaKept_().slice();
  change(list);
  QA_KEPT = list;
  if (!list.length) {
    lsDel_(LS_KEPT);
    QA_KEPT_MEM = false;
  } else {
    QA_KEPT_MEM = !lsSet_(LS_KEPT, JSON.stringify(list));
  }
  qaAddDot_();
}

// why: 'capped', 'invalid' or (A1 final fix 3) 'unsaved', for the line that says so.
function qaKeptAdd_(key, draft, why) {
  qaKeptChange_(function (list) { list.push({ key: key, at: Date.now(), draft: draft, why: why }); });
}

function qaKeptPut_(key, draft) {
  qaKeptChange_(function (list) { list.forEach(function (e) { if (e.key === key) e.draft = draft; }); });
}

function qaKeptDrop_(key) {
  qaKeptChange_(function (list) {
    for (var i = list.length - 1; i >= 0; i--) if (list[i].key === key) list.splice(i, 1);
  });
}

// The entry Add opens next: the oldest refused one, else (A1 final fix 3) the oldest one closed without Save.
// A3-T2A M3: entries carry their list ('todo', 'grocery'; none for an expense); list picks whose entry.
function qaKeptOf_(e) {
  return e.list === 'todo' || e.list === 'grocery' ? e.list : 'expense';
}

function qaKeptNext_(list) {
  var want = list || 'expense';
  var all = qaKept_().filter(function (e) { return qaKeptOf_(e) === want; });
  for (var i = 0; i < all.length; i++) if (all[i].why !== 'unsaved') return all[i];
  return all[0] || null;
}

// The line that says an expense waits in Add, with Open; its words follow the entry Open opens.
// A3-T2B m9: "Not saved yet. It is in Add." is said at most once a Bali day (kl.keptSaid); after that the dot on
// the Add slot says it (qaAddDot_). A refused expense is still said every time.
var LS_KEPT_SAID = 'kl.keptSaid';
var QA_KEPT_SAID = null; // memory copy of kl.keptSaid, so once a day holds for this visit even without storage
function qaKeptToast_(list) {
  var next = qaKeptNext_(list);
  qaAddDot_();
  if (!next) return;
  if (next.why === 'unsaved') {
    var day = baliDay_(Date.now());
    if (QA_KEPT_SAID === null) QA_KEPT_SAID = lsGet_(LS_KEPT_SAID) || '';
    if (day && QA_KEPT_SAID === day) return;
    QA_KEPT_SAID = day;
    lsSet_(LS_KEPT_SAID, day);
  }
  qaToastSet_({ text: QA_KEPT_TEXT[next.why] || QA_KEPT_TEXT.invalid, action: 'open', open: qaKeptOf_(next) });
}

// A3-T2B m9: a small dot on the Add slot while an expense waits in Add (kl.kept).
var ADD_DOT = null;
function qaAddDot_() {
  var kinds = [];
  qaKept_().forEach(function (e) { if (kinds.indexOf(qaKeptOf_(e)) < 0) kinds.push(qaKeptOf_(e)); });
  var on = kinds.length > 0;
  if (ADD_DOT) ADD_DOT.hidden = !on;
  var what = kinds.length > 1 ? 'drafts wait here' : ({ expense: 'an expense', todo: 'a to-do', grocery: 'an item' }[kinds[0]] + ' waits here');
  if (ADD_SLOT) ADD_SLOT.setAttribute('aria-label', on ? 'Add, ' + what : 'Add');
}
var QA_KEPT_TEXT = {
  capped: 'Not saved: the limit of 100 adds today is reached. It is kept in Add.',
  invalid: 'Not saved. It is kept in Add to check.',
  unsaved: 'Not added yet. It is in Add.' // A3-T2A M3: the one close rule, the same words for every new draft
};

// A1 final fix 4: a kept draft keeps the day it was for. Today or Yesterday become that day, picked.
function qaPin_(draft, day) {
  if (draft.when !== 'pick' && todoValidDay_(day)) {
    draft.when = 'pick';
    draft.day = day;
  }
  return draft;
}

// A1 final fix 3: what an expense sheet closed without Save leaves behind. A kept entry takes the edits (an unsaved
// one emptied of its amount leaves the list); a new draft with an amount joins kl.kept as 'unsaved', unless the
// sheet closes for a lock-out or another sheet (then it stays in QA_DRAFT, as before).
function qaKeepOnClose_(s, how) {
  var typed = String(s.draft.amount || '').replace(/\s+/g, '') !== '';
  if (s.kept) {
    var entry = qaKept_().filter(function (e) { return e.key === s.kept; })[0];
    if (entry && entry.why === 'unsaved' && !typed) {
      qaKeptDrop_(s.kept);
      QA_DRAFT = s.draft;
      return;
    }
    qaKeptPut_(s.kept, qaPin_(s.draft, qaDate_(s)));
    return;
  }
  if (typed && (how === 'close' || how === 'back' || how === 'nav' || how === 'hide')) {
    qaKeptAdd_('k' + newId_().slice(1), qaPin_(JSON.parse(JSON.stringify(s.draft)), qaDate_(s)), 'unsaved');
    return;
  }
  QA_DRAFT = s.draft;
}

// Today in Bali, from the phone's clock (Asia/Makassar).
function qaToday_() {
  var d = baliDay_(Date.now());
  if (todoValidDay_(d)) return d;
  return DATA && todoValidDay_(DATA.today) ? DATA.today : '';
}

// The category on show: the one picked by hand, else the guess from the words.
function qaCategory_(s) {
  if (s.draft.hand && s.cats.indexOf(s.draft.category) >= 0) return s.draft.category;
  return qaGuess_(s.draft.item, s.cats);
}

function qaDate_(s) {
  if (s.draft.when === 'yesterday') return isoAddDays_(s.today, -1);
  if (s.draft.when === 'pick' && todoValidDay_(s.draft.day)) return s.draft.day;
  return s.today;
}

function qaFocusAdd_() {
  if (ADD_SLOT && !modalOpen_()) ADD_SLOT.focus({ preventScroll: true });
}

// carry: words from the segment switched away from, as the What.
// A refused expense opens first (the oldest), unless words come along from a segment switch; then the draft
// typed and not saved (QA_DRAFT), else a fresh one.
function openExpenseSheet_(carry) {
  whoShut_();
  if (SHEET) closeItemSheet_('replace');
  var words = sheetOneLine_(carry);

// ---- A1-T4: rupiah first --------------------------------------------------------------------
// The rate the page turns euros into rupiah with: data.fx.idrPerEur (Task 2: the month's ECB average, the
// FX row of this Bali month or the latest one before it). null when the payload has no usable rate.
function pageRate_(d) {
  var fx = d && d.fx;
  if (!fx || typeof fx !== 'object') return null;
  var n = fx.idrPerEur;
  return typeof n === 'number' && isFinite(n) && n > 0 ? n : null;
}

// Rupiah of one row. An IDR row is its own amount, exact. An EUR or USD row is its stored euros (column E) at the
// rate, rounded to the nearest 1000: a display figure only, never written anywhere. null when the row needs an
// amount, or when there is no rate, so the page never shows a rupiah figure it cannot stand behind.
function rowIdr_(r, rate) {
  if (!r || r.needsAmount || typeof r.amount !== 'number' || !isFinite(r.amount)) return null;
  if (r.currency === 'IDR') return Math.round(r.amount);
  if (!rate || typeof r.eur !== 'number' || !isFinite(r.eur)) return null;
  return Math.round(r.eur * rate / 1000) * 1000;
}

// Rupiah total of rows: the sum of each counted row's rupiah (rows needing an amount and settlements are not
// counted, as in every total). null without a rate: the page then shows euros big.
function totalIdr_(rows, rate) {
  if (!rate) return null;
  var sum = 0;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r || r.needsAmount || r.settlement) continue;
    var v = rowIdr_(r, rate);
    if (v === null) return null;
    sum += v;
  }
  return sum;
}

// Categories of rows, largest first by euros, then by name (the order rule of Calc.gs): {name, eur, idr, share}.
// idr is the sum of the rows' rupiah, or null without a rate.
function catsOf_(rows, rate) {
  var by = Object.create(null);
  var list = [];
  var total = 0;
  rows.forEach(function (r) {
    if (!r || r.needsAmount || r.settlement) return;
    var cents = Math.round(r.eur * 100);
    var name = r.category;
    total += cents;
    if (!by[name]) { by[name] = { name: name, cents: 0, idr: 0 }; list.push(by[name]); }
    by[name].cents += cents;
    by[name].idr += rowIdr_(r, rate) || 0;
  });
  var cats = list.map(function (c) {
    return { name: c.name, eur: c.cents / 100, idr: rate ? c.idr : null, share: total > 0 ? Math.round(c.cents / total * 10000) / 10000 : 0 };
  });
  cats.sort(function (a, b) {
    if (b.eur !== a.eur) return b.eur - a.eur;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  return cats;
}

// The big and the small figure of an amount: rupiah big and EUR small, or EUR big alone when there is no rupiah.
function bigSmall_(idr, eur) {
  if (idr === null || idr === undefined) return { big: fmtEur(eur), small: '' };
  return { big: fmtIdr(idr), small: fmtEur(eur) };
}

// The donut centre (A1-T4 fix 2): the ring's hole is about 140 px wide. From 100 million rupiah the big figure
// reads in millions (102.4 M after the Rp); a figure longer than 11 characters is drawn smaller (long).
function donutCentre_(idr, eur) {
  var bs = bigSmall_(idr, eur);
  if (idr !== null && idr !== undefined && Math.abs(idr) >= 100000000) bs.big = (idr < 0 ? '-' : '') + 'Rp ' + millions_(Math.abs(idr)) + ' M';
  return { big: bs.big, small: bs.small, long: bs.big.length > 11 };
}

// Rupiah in millions with one decimal, for the bar labels: 12755000 reads 12.8.
function millions_(n) {
  return (Math.round(n / 100000) / 10).toFixed(1);
}

// The calendar month before a yyyy-MM key.
function monthBefore_(key) {
  var y = Number(key.slice(0, 4));
  var m = Number(key.slice(5, 7)) - 1;
  if (m < 1) { m = 12; y -= 1; }
  return y + '-' + (m < 10 ? '0' : '') + m;
}

// One colour per category name, the same on every screen and in every month (A1-T4). Hues follow the bot's
// CAT_PALETTE in Code.gs, darkened so each is at least 3:1 on the white cards. Other is the warm grey. A name off
// the list gets one of four spare colours, picked from its letters, so it always wears the same one.
function catColour_(name) {
  var map = {
    'Groceries': '#448335', 'Restaurant': '#ba5d1d', 'Eating out': '#ba5d1d', 'Utilities': '#b5820c', 'Transport': '#116d8a',
    'Health': '#b9454c', 'Leisure': '#7555a8', 'Shopping': '#ac4785', 'Decoration': '#9d6762', 'Furniture': '#5d3f35',
    'Subscriptions': '#1b8278', 'Phone & subscriptions': '#1b8278', 'Pets': '#8b551c', 'Household': '#3f602a', 'Home': '#3f602a',
    'Rent': '#42428c', 'Visa & admin': '#7d7728', 'Travel': '#2d78bd', 'Gifts': '#90314e', 'Business': '#364452',
    'Other': '#8c857f', 'Settlement': '#8c857f'
  };
  if (typeof name === 'string' && Object.prototype.hasOwnProperty.call(map, name)) return map[name];
  var spare = ['#6a5f8f', '#4d6f7c', '#8a5b4c', '#5c6b3c'];
  var s = typeof name === 'string' ? name : '';
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return spare[h % spare.length];
}

// A category's avatar: its icon in its colour on a pale disc of the same colour. Drawing only (the name is text).
function catAvatar_(parent, name) {
  var col = catColour_(name);
  var a = add(parent, 'span', 'cav');
  a.setAttribute('aria-hidden', 'true');
  a.style.color = col;
  a.style.background = col + '1f';
  a.appendChild(icon(name));
  return a;
}

// The usual month in the unit on show: the average of the payload's usual months (Calc.gs picks them), each added
// up the same way as every other total on the page. null when there is no usual month yet.
function usualOf_(rate) {
  var u = DATA.usual;
  if (!u || !u.keys || !u.keys.length) return null;
  var sum = 0;
  var n = 0;
  u.keys.forEach(function (k) {
    var m = monthByKey(k);
    if (!m) return;
    var v = rate ? totalIdr_(m.rows, rate) : m.totalEur;
    if (v === null) return;
    sum += v;
    n++;
  });
  if (!n) return null;
  return rate ? Math.round(sum / n) : Math.round(sum / n * 100) / 100;
}

// The big number of a hero card: a small currency, then the figure; EUR small underneath when it is rupiah.
function heroNumber_(w, idr, eur) {
  var h = add(w, 'p', 'hero');
  var v = idr !== null ? idr : eur;
  add(h, 'span', 'hero-cur', idr !== null ? 'Rp' : 'EUR');
  h.appendChild(document.createTextNode((v < 0 ? '-' : '') + (idr !== null ? group(Math.abs(Math.round(idr))) : fixed2(eur))));
  if (idr !== null) add(w, 'p', 'hero-sub', fmtEur(eur));
}

// The hero card: the month's total, rupiah big and EUR small. The current month adds the day of the month and one
// pace bar against the usual month, with the day marked on the same bar. Past the usual month the bar is simply
// full: the same colour, no warning words.
function moneyHero_(wrap, m, label, today, rate) {
  var w = heroCard_(wrap);
  var isCur = m.key === today.slice(0, 7);
  var d = dayOfMonth(today);
  if (label || isCur) {
    var top = add(w, 'div', 'hero-top');
    add(top, 'span', '', label);
    if (isCur) add(top, 'span', '', 'Day ' + d.day + ' of ' + d.days);
  }
  var idr = totalIdr_(m.rows, rate);
  heroNumber_(w, idr, m.totalEur);
  if (!isCur) return w;
  var usual = usualOf_(rate);
  if (usual === null || !(usual > 0)) {
    add(w, 'p', 'hero-line', 'Your usual month appears once there are 3 full months.');
    return w;
  }
  var now = idr !== null ? idr : m.totalEur;
  var pct = Math.round(Math.max(0, now) / usual * 100);
  var bar = add(w, 'div', 'pace');
  bar.setAttribute('aria-hidden', 'true');
  add(bar, 'span', 'pace-fill').style.width = Math.min(100, pct) + '%';
  add(bar, 'span', 'pace-day').style.left = Math.round(d.day / d.days * 100) + '%';
  var foot = add(w, 'div', 'hero-foot');
  add(foot, 'span', '', (rate ? fmtIdr(usual) : fmtEur(usual)) + ' in a usual month');
  add(foot, 'span', 'hero-pct', pct + '%');
  return w;
}

// ---- settle up (A1-T6) ------------------------------------------------------------------------
// The confirm sheet, then one Settlement expense through the same queued op as quick add. A settlement row credits
// its payer in full: the debtor pays, the creditor is paid for. No Undo (the server refuses to delete Settlement
// rows); the sheet is the safety.
var SETTLE_ANIM = null; // {from, at}: a settlement was saved; the card counts down once the balance is square
var SETTLE_EL = null;   // the number on the card that is counting

function settlePending_() {
  return QUEUE.some(function (q) { return q.op === 'expense' && q.settle === true; });
}

// A1 final fix 2: the figures on show are the server's own: a data reply came in this session and no plain expense
// is queued or on its way (it is in QUEUE until answered), so the balance holds every expense typed here.
function settleReady_() {
  return MONEY_LIVE && !QUEUE.some(function (q) { return q.op === 'expense' && q.settle !== true; });
}
var SETTLE_WAIT = 'Checking the latest numbers.';

function openSettle_() {
  if (!DATA || !DATA.balance || settlePending_() || !settleReady_()) return;
  var side = balanceSide_(DATA.balance.net);
  if (side.square) return;
  whoShut_();
  if (SHEET) closeItemSheet_('replace');
  var rate = pageRate_(DATA);
  var s = { list: 'settle', side: side, done: false, els: {}, ctls: [], sync: [], focusEl: null, touch: null };
  var p = sheetFrame_(s, 'Settle up');
  var head = add(p, 'div', 'qa-head settle-head');
  add(head, 'h2', 'settle-title', 'Settle up');
  s.els.who = add(p, 'p', 'settle-who', side.who);
  s.els.big = add(p, 'p', 'settle-big');
  s.els.small = add(p, 'p', 'settle-small');
  settleShow_(s);
  s.els.status = add(p, 'p', 'settle-note');
  s.els.status.setAttribute('role', 'status');
  s.focusEl = sheetCtl_(s, btn(p, 'btn-main settle-go', 'Mark as settled', function () { settleConfirm_(s); }));
  sheetCtl_(s, btn(p, 'settle-later', 'Not now', function () { if (SHEET === s) closeItemSheet_('close'); }));
  SHEET = s;
  $('sheet').hidden = false;
  sheetInert_(true);
  sheetHistory_();
  s.focusEl.focus({ preventScroll: true });
}

// The figures on the sheet, from s.side.
function settleShow_(s) {
  var rate = pageRate_(DATA);
  var eur = settleAmount_(s.side.eur);
  s.els.who.textContent = s.side.who;
  s.els.big.textContent = fmtEur(eur);
  s.els.small.textContent = rate ? fmtIdr(Math.round(eur * rate / 1000) * 1000) : '';
}

function settleAmount_(eur) {
  return Math.round(eur * 100) / 100;
}

// Mark as settled. The balance is read again from the latest data: square or turned round since the sheet opened
// means no row.
function settleConfirm_(s) {
  if (SHEET !== s || s.done) return;
  if (!settleReady_()) { // A1 final fix 2: an expense still waits (another tab), or the numbers are not the server's
    s.els.status.textContent = SETTLE_WAIT;
    return;
  }
  s.done = true;
  var now = DATA && DATA.balance ? balanceSide_(DATA.balance.net) : null;
  if (!now || now.square || now.who !== s.side.who) {
    sheetShut_('close');
    if (now && !now.square) qaToastSet_({ text: 'The balance changed: ' + now.who + ' ' + fmtEur(settleAmount_(now.eur)) + '.' });
    moneyRepaint_();
    return;
  }
  if (settleAmount_(now.eur) !== settleAmount_(s.side.eur)) {
    // Same direction, other figure: show it and wait for one more tap. Never save a figure that was not seen.
    s.side = now;
    settleShow_(s);
    s.els.status.textContent = 'The amount changed. Check it, then confirm.';
    s.done = false;
    return;
  }
  var lili = DATA.balance.net < 0; // net < 0: Lili owes Kev
  var op = expenseOp_({
    amount: settleAmount_(now.eur), currency: 'EUR', item: 'Settle up', category: 'Settlement',
    paidBy: lili ? 'Lili' : 'Kev', paidFor: lili ? 'Kev' : 'Lili', date: qaToday_()
  }, {});
  op.settle = true;
  sheetShut_('close');
  expenseEnqueue_(op);
  moneyRepaint_();
  qaFocusAdd_();
}

// The saved settlement: the card counts the old figure down to zero, then reads All square. (no motion when the
// phone asks for none).
function settleCalm_() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function settleStep_(i) {
  var a = SETTLE_ANIM;
  if (!a) return;
  var n = 12;
  if (i >= n) {
    SETTLE_ANIM = null;
    SETTLE_EL = null;
    moneyRepaint_();
    return;
  }
  var left = a.from * (1 - (i + 1) / n);
  if (SETTLE_EL) SETTLE_EL.textContent = fmtEur(settleAmount_(left));
  setTimeout(function () { settleStep_(i + 1); }, 40);
}

// The balance card: who pays whom, euros big (they settle in euros, exact to the cent), rupiah small at the
// month's rate. The card opens the details; Settle up sits beside it and is gone when the balance is square.
function renderBalanceCard_(parent, rate) {
  var side = balanceSide_(DATA.balance.net);
  var square = side.square;
  var bal = add(parent, 'div', 'card bal');
  var open = btn(bal, 'bal-open', null, function () { go({ screen: 'balance', key: null }); });
  var words = add(open, 'span', 'bal-words');
  if (!square) SETTLE_ANIM = null;
  var counting = square && SETTLE_ANIM && Date.now() - SETTLE_ANIM.at < 20000 && !settleCalm_();
  if (SETTLE_ANIM && (settleCalm_() || (square && !counting))) SETTLE_ANIM = null;
  var pending = !square && settlePending_();
  var waiting = !square && !pending && !settleReady_(); // A1 final fix 2
  if (counting) {
    add(words, 'span', 'bal-label', 'Settled');
    SETTLE_EL = add(words, 'span', 'bal-big', fmtEur(SETTLE_ANIM.from));
    if (!SETTLE_ANIM.running) {
      SETTLE_ANIM.running = true;
      setTimeout(function () { settleStep_(0); }, 40);
    }
  } else if (square) {
    add(words, 'span', 'bal-label', 'All square.');
    add(words, 'span', 'bal-note', 'Nothing to settle. See how it adds up');
  } else {
    add(words, 'span', 'bal-label', 'To even up: ' + side.who);
    add(words, 'span', 'bal-big', fmtEur(side.eur));
    if (rate) add(words, 'span', 'bal-small', fmtIdr(Math.round(side.eur * rate / 1000) * 1000));
    if (pending) add(words, 'span', 'bal-note', 'Settling up. Waiting to be sent.');
    else if (waiting) add(words, 'span', 'bal-note', SETTLE_WAIT);
  }
  add(open, 'span', 'chev').setAttribute('aria-hidden', 'true');
  if (!square && !pending && !waiting) btn(bal, 'bal-settle', 'Settle up', function () { openSettle_(); });
}

// ---- home -----------------------------------------------------------------------
// A1-T4: four cards. The hero (this month so far), the balance, where it goes, month by month. The bars are the
// only month picker.
function renderHome() {
  var root = $('home');
  var today = DATA.today;
  var curKey = today.slice(0, 7);
  var rate = pageRate_(DATA);
  var cur = monthByKey(curKey) || emptyMonth(curKey);

  var top = largeTitleBox_(root, 'Money');
  moneyHero_(top.wrap, cur, monthName(curKey) + ' so far', today, rate);
  // A1-T5: an expense added here that has not reached the sheet yet (offline, or behind another change).
  var waiting = QUEUE.filter(function (q) { return q.op === 'expense' && q.uid !== INFLIGHT; }).length;
  if (waiting) add(top.wrap, 'p', 'title-note qa-wait', waiting === 1 ? '1 new expense is waiting to be sent.' : waiting + ' new expenses are waiting to be sent.');
  renderBalanceCard_(top.wrap, rate);

  var body = add(root, 'div', 'wrap');
  renderDonut_(section(body, 'Where it goes'));
  var barsEl = renderBars(section(body, rate ? 'Month by month' : 'Month by month, in euros'), rate);

  if (DATA.notCountedYet > 0) {
    var nc = section(body);
    add(nc, 'p', 'notice', 'Not counted yet: ' + DATA.notCountedYet);
    add(nc, 'p', 'small', 'Messages the bot kept but did not add to any month.');
  }
  if (DATA.unplacedRows > 0) {
    var un = section(body);
    add(un, 'p', 'notice', DATA.unplacedRows + (DATA.unplacedRows === 1 ? ' row has no date' : ' rows have no date') + ' in the sheet, so no month includes ' + (DATA.unplacedRows === 1 ? 'it.' : 'them.'));
  }

  var ls = section(body);
  var link = btn(ls, 'linkrow', null, function () { go({ screen: 'trends', key: null }); });
  var lt = add(link, 'span');
  add(lt, 'b', '', 'Tendencies');
  add(lt, 'span', 'small', 'Every month by type of expense');
  add(link, 'span', 'chev').setAttribute('aria-hidden', 'true');

  var foot = add(body, 'div', 'foot');
  btn(foot, 'textbtn', 'Refresh', function () { loadData(true); });
  HOME_STATUS = add(foot, 'p', 'small', moneyAgeText_());

  barsEl.scrollLeft = barsEl.scrollWidth; // newest month in view when there are many
}

// ---- where it goes (home donut, ruling R65; A1-T4 segmented control and fixed colours) ---------------
var DONUT_VIEW = 'cur'; // This month ('cur'), Last month ('last') or All time ('all'); for this visit only
var DONUT_MORE = false; // the list past the top 5 is open

// One view: the header, the totals and the list rows. Every figure is added up from the rows, the same way as the
// hero and the month screen, so the numbers match. Each category with a positive total has its own slice in its
// own colour; one at zero or below (refunds) is listed without a slice.
function donutModel_(months, view, todayIso, rate) {
  var cur = todayIso.slice(0, 7);
  var key = view === 'all' ? 'all' : (view === 'last' ? monthBefore_(cur) : cur);
  var rows = [];
  var totalEur = 0;
  var head;
  var emptyText;
  if (key === 'all') {
    var cents = 0;
    months.forEach(function (m) {
      rows = rows.concat(m.rows);
      cents += Math.round(m.totalEur * 100);
    });
    totalEur = cents / 100;
    head = months.length ? 'All, since ' + shortMonth(months[months.length - 1].key) : 'All';
    emptyText = 'Nothing spent yet.';
  } else {
    var m = null;
    for (var i = 0; i < months.length; i++) if (months[i].key === key) m = months[i];
    var part = m ? partialLabel(m, todayIso) : (key === cur ? 'so far' : '');
    if (m) { rows = m.rows; totalEur = m.totalEur; }
    head = monthName(key) + ' ' + key.slice(0, 4) + (part ? ', ' + part : '');
    emptyText = key === cur ? 'Nothing spent yet this month.' : 'Nothing spent this month.';
  }
  var cats = catsOf_(rows, rate);
  var list = cats.filter(function (c) { return c.eur > 0; }).map(function (c) {
    return { name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: catColour_(c.name) };
  }).concat(cats.filter(function (c) { return !(c.eur > 0); }).map(function (c) {
    return { name: c.name, eur: c.eur, idr: c.idr, share: c.share, color: null };
  }));
  return {
    key: key, head: head, emptyText: emptyText, totalEur: totalEur, totalIdr: totalIdr_(rows, rate), rows: list,
    empty: !list.some(function (r) { return r.color; })
  };
}

// Start and end of each slice in degrees, clockwise from the top. The last one ends at exactly 360.
function donutSlices_(values) {
  var total = 0;
  values.forEach(function (v) { total += v; });
  var at = 0;
  return values.map(function (v, i) {
    var start = at;
    at = i === values.length - 1 ? 360 : at + v / total * 360;
    return { start: start, end: at };
  });
}

function donutPoint_(deg, rad, c) {
  var a = deg * Math.PI / 180;
  return String(Math.round((c + rad * Math.sin(a)) * 100) / 100) + ' ' + String(Math.round((c - rad * Math.cos(a)) * 100) / 100);
}

// An annular sector from start to end degrees, outer radius R, inner radius r, centred on (c, c). Each arc is
// drawn in two halves split at the midpoint, so no arc ever starts where it ends (SVG drops such an arc, and a
// slice of nearly 360 degrees would fill the hole).
function donutPath_(start, end, R, r, c) {
  var mid = (start + end) / 2;
  var outer = ' A ' + R + ' ' + R + ' 0 0 1 ';
  var inner = ' A ' + r + ' ' + r + ' 0 0 0 ';
  return 'M ' + donutPoint_(start, R, c) + outer + donutPoint_(mid, R, c) + outer + donutPoint_(end, R, c) +
    ' L ' + donutPoint_(end, r, c) + inner + donutPoint_(mid, r, c) + inner + donutPoint_(start, r, c) + ' Z';
}

function renderDonut_(s) {

function drawDonut_(body, model, repaint) {
  add(body, 'p', 'dn-head', model.head);
  if (model.empty) {
    add(body, 'p', 'dn-empty', model.emptyText);
    return;
  }
  var open = model.key === 'all' ? null : function () { goMonth(model.key); };
  var parts = model.rows.filter(function (r) { return r.color; });
  var fig = add(body, 'div', 'dn-fig');
  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  svg.setAttribute('role', 'img');
  svg.setAttribute('focusable', 'false');
  svg.setAttribute('aria-label', 'Where it goes, ' + model.head + ': ' + parts.slice(0, 3).map(function (r) {
    return r.name + ' ' + shareText(r.share);
  }).join(', ') + '.');
  fig.appendChild(svg);
  var mark;
  var spans = donutSlices_(parts.map(function (r) { return r.eur; }));
  var whole = -1; // a part of 359.5 degrees or more is drawn as the full ring; the rest would vanish under the gaps
  spans.forEach(function (a, i) { if (a.end - a.start >= 359.5) whole = i; });
  if (whole >= 0) {
    mark = document.createElementNS(SVG_NS, 'circle');
    mark.setAttribute('class', 'dn-ring');
    mark.setAttribute('cx', '100');
    mark.setAttribute('cy', '100');
    mark.setAttribute('r', '83');
    mark.setAttribute('fill', 'none');
    mark.setAttribute('stroke', parts[whole].color);
    mark.setAttribute('stroke-width', '26');
    if (open) mark.addEventListener('click', open);
    svg.appendChild(mark);
  } else {
    spans.forEach(function (a, i) {
      mark = document.createElementNS(SVG_NS, 'path');
      mark.setAttribute('class', 'dn-slice');
      mark.setAttribute('d', donutPath_(a.start, a.end, 96, 70, 100));
      mark.setAttribute('fill', parts[i].color);
      if (open) mark.addEventListener('click', open);
      svg.appendChild(mark);
    });
  }
  var mid = add(fig, 'div', 'dn-centre');
  var total = donutCentre_(model.totalIdr, model.totalEur);
  add(mid, 'span', 'dn-c-big' + (total.long ? ' dn-c-long' : ''), total.big);
  if (total.small) add(mid, 'span', 'dn-c-small', total.small);
  var list = add(body, 'div', 'dn-list');
  var many = model.rows.length > 5;
  model.rows.slice(0, many && !DONUT_MORE ? 5 : model.rows.length).forEach(function (r) {
    var line = open ? btn(list, 'dn-row dn-tap', null, open) : add(list, 'div', 'dn-row');
    catAvatar_(line, r.name);
    var words = add(line, 'span', 'dn-words');
    add(words, 'span', 'dn-name', r.name);
    add(words, 'span', 'dn-share', shareText(r.share));
    var amts = add(line, 'span', 'dn-amts');
    var bs = bigSmall_(r.idr, r.eur);
    add(amts, 'span', 'dn-big', bs.big);
    if (bs.small) add(amts, 'span', 'dn-small', bs.small);
  });
  if (many) {
    var more = btn(body, 'dn-more', DONUT_MORE ? 'Show less' : 'Show ' + (model.rows.length - 5) + ' more', function () {
      DONUT_MORE = !DONUT_MORE;
      repaint();
    });
    more.setAttribute('aria-expanded', DONUT_MORE ? 'true' : 'false');
  }
}

function refusalText(res) {
  if (res && res.retry) return 'Could not save. Try again.';
  if (res && res.settlement) return 'A settlement cannot be changed here.';
  if (res && res.invalid && res.reason === 'needsCurrency') return 'Pick a currency.';
  if (res && res.invalid) return 'That choice is not allowed.';
  return 'Could not save. Try again.';
}

function labelsOf(changes) {
  return changes.map(function (c) { return c.label; });
}

function setToast(t, key) {
  t.key = key;
  TOAST = t;
}

// The expense itself: columns A to E, as a (from applyChanges) expects them. Euros are skipped once a change moved them.
function sameExpense(a, b) {
  return !!a && !!b && a.date === b.date && a.item === b.item && a.amount === b.amount && a.currency === b.currency && (!!a.eurUnknown || a.eur === b.eur);
}

// Sends job.changes one after another. Each one needs the fingerprint from the reply before it, and stops
// if a different expense has moved into the row. job: {rowNumber, fingerprint, expect, changes, saved,
// done(saved, fingerprint), failed(saved, change, res, fingerprint), noData(saved, rest), unsure(saved, change, rest)}.
function sendChanges(job) {
  if (!job.changes.length) { job.done(job.saved, job.fingerprint); return; }
  var change = job.changes[0];
  var session = SESSION;
  call_('update', {
    token: TOKEN,
    rowNumber: job.rowNumber,
    fingerprint: job.fingerprint,
    field: change.field,
    value: change.value
  }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) { job.failed(job.saved, change, res, job.fingerprint); return; }
    job.saved = job.saved.concat([change]);
    job.changes = job.changes.slice(1);
    if (!res.data) { job.noData(job.saved, job.changes); return; }
    moneySet_(res.data);
    var now = rowByNumber(DATA.months, job.rowNumber);
    job.fingerprint = sameExpense(applyChanges(job.expect, job.saved), now) ? now.fingerprint : null;
    if (job.fingerprint === null && job.changes.length) {
      job.failed(job.saved, job.changes[0], { conflict: true }, null);
      return;
    }
    sendChanges(job);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    // The save may have landed, so it is never sent again. The page refreshes and says to check.
    if (unreached(err)) { job.unsure(job.saved, change, job.changes.slice(1)); return; }
    job.failed(job.saved, change, null, job.fingerprint);
  });
}

// Closes the editor a reply belongs to, never one opened since.
function closeEdit(editId) {
  if (EDIT && EDIT.id === editId) EDIT = null;
}

function conflictRefresh(saved, label, key, editId) {
  var labels = labelsOf(saved);
  closeEdit(editId);
  setToast({
    text: saveFailText(labels, label, 'This expense changed. Refreshing.'),
    refreshing: true,
    after: labels.length ? saveFailText(labels, label, 'This expense changed.') : null
  }, key);
  render(true);
  loadData(true);
}

function savedNoDataRefresh(saved, rest, key, editId) {
  var labels = labelsOf(saved);
  var text = rest.length
    ? andList(labels) + (labels.length === 1 ? ' was' : ' were') + ' saved. ' + andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.'
    : null;
  closeEdit(editId);
  setToast({ text: (text || 'Saved.') + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

function savedUnsureRefresh(saved, change, rest, key, editId) {
  var parts = [];
  if (saved.length) parts.push(andList(labelsOf(saved)) + (saved.length === 1 ? ' was' : ' were') + ' saved.');
  parts.push('Could not reach the server, so check whether ' + change.label + ' saved.');
  if (rest.length) parts.push(andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.');
  var text = parts.join(' ');
  closeEdit(editId);
  setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

// after: the row as it reads once changes landed (applyChanges), which the undo checks the row against.
function undoFor(rowNumber, fingerprint, after, changes) {
  var cats = DATA && DATA.canChangeType ? DATA.categories : null;
  return (fingerprint && changes.length && canUndo(changes, DATA && DATA.today, cats)) ? { rowNumber: rowNumber, fingerprint: fingerprint, expect: after, changes: changes } : null;
}

function saveEdit(rowNumber, values) {
  var row = rowByNumber(DATA.months, rowNumber);
  var changes = row ? pendingChanges(row, values) : [];
  if (!changes.length) {
    EDIT = null;
    FOCUS_ROW = rowNumber;
    render(true);
    return;
  }
  var key = VIEW.key;
  var editId = EDIT.id;
  EDIT.saving = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  sendChanges({
    rowNumber: rowNumber,
    fingerprint: row.fingerprint,
    expect: row,
    changes: changes,
    saved: [],
    done: function (saved, fingerprint) {
      closeEdit(editId);
      setToast({ text: 'Changed.', undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh(saved, change.label, key, editId); return; }
      var reason = refusalText(res);
      if (saved.length) {
        setToast({ text: saveFailText(labelsOf(saved), change.label, reason), undo: undoFor(rowNumber, fingerprint, applyChanges(row, saved), saved) }, key);
      }
      if (EDIT && EDIT.id === editId) {
        // A saved Type can take the row out of the filtered list. The bar above still says what happened.
        var m = monthByKey(key);
        var listed = m && rowsFor(m, FILTER).some(function (r) { return r.rowNumber === rowNumber; });
        if (listed) {
          EDIT.saving = false;
          EDIT.error = reason;
        } else {
          EDIT = null;
        }
      }
      render(true);
    },
    noData: function (saved, rest) { savedNoDataRefresh(saved, rest, key, editId); },
    unsure: function (saved, change, rest) { savedUnsureRefresh(saved, change, rest, key, editId); }
  });
}

function undoLast() {
  var undo = TOAST.undo;
  var key = TOAST.key;
  TOAST.busy = true;
  render(true);
  var back = undo.changes.slice().reverse().map(function (c) {
    return { field: c.field, label: c.label, old: c.value, value: c.old };
  });
  sendChanges({
    rowNumber: undo.rowNumber,
    fingerprint: undo.fingerprint,
    expect: undo.expect,
    changes: back,
    saved: [],
    done: function () {
      setToast({ text: 'Changed back.' }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh([], change.label, key, null); return; }
      var left = undo.changes.slice(0, undo.changes.length - saved.length);
      var why = res && res.invalid ? 'That choice is not allowed.' : 'Try again.';
      setToast({ text: 'Could not undo. ' + why, undo: undoFor(undo.rowNumber, fingerprint, applyChanges(undo.expect, saved), left) }, key);
      render(true);
    },
    noData: function (saved, rest) {
      if (rest.length) {
        setToast({ text: 'Could not finish the undo. Refreshing.', refreshing: true, after: 'Could not finish the undo.' }, key);
      } else {
        setToast({ text: 'Changed back. Refreshing.', refreshing: true, after: 'Changed back.' }, key);
      }
      render(true);
      loadData(true);
    },
    unsure: function () {
      var text = 'Could not reach the server, so check whether the undo went through.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
    }
  });
}

// ---- deleting an expense ----------------------------------------------------------
// The row moves to the sheet's hidden Deleted tab. "Deleted. Undo" stays 6 seconds; Undo puts it back.
function deletedToast(text, deletedId, key) {
  var t = { text: text, restore: deletedId };
  setToast(t, key);
  setTimeout(function () {
    if (TOAST === t && !t.busy) {
      TOAST = null;
      render(true);
    }
  }, 6000);
}

function deleteExpense(rowNumber) {
  var row = rowByNumber(DATA.months, rowNumber);
  if (!row || !EDIT || EDIT.saving) return;
  var key = VIEW.key;
  var editId = EDIT.id;
  var session = SESSION;
  EDIT.saving = true;
  EDIT.deleting = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  function stay(text) {
    if (EDIT && EDIT.id === editId) {
      EDIT.saving = false;
      EDIT.deleting = false;
      EDIT.error = text;
    }
    render(true);
  }
  call_('deleteExpense', { token: TOKEN, rowNumber: rowNumber, fingerprint: row.fingerprint }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) {
      if (res && res.conflict) { conflictRefresh([], 'Delete', key, editId); return; }
      stay(res && res.settlement ? 'A settlement cannot be deleted here.' : 'Could not delete. Try again.');
      return;
    }
    closeEdit(editId);
    if (res.data) moneySet_(res.data);
    deletedToast('Deleted.', res.deletedId, key);
    render(true);
    if (!res.data) loadData(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it was deleted. If it was, it can be put back from the Deleted tab in the sheet.';
      closeEdit(editId);
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    stay('Could not delete. Try again.');
  });
}

function restoreLast() {
  var t = TOAST;
  var key = t.key;
  var session = SESSION;
  t.busy = true;
  render(true);
  call_('restoreExpense', { token: TOKEN, deletedId: t.restore }).then(function (res) {
    if (session !== SESSION) return;
    if (res && res.ok) {
      if (res.data) {
        moneySet_(res.data);
        setToast({ text: 'Put back.' }, key);
        render(true);
      } else {
        setToast({ text: 'Put back. Refreshing.', refreshing: true, after: 'Put back.' }, key);
        render(true);
        loadData(true);
      }
      return;
    }
    if (res && res.invalid) setToast({ text: 'Could not undo. It is no longer in Deleted.' }, key);
    else deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    if (unreached(err)) {
      var text = 'Could not reach the server, so check whether it came back.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
      return;
    }
    deletedToast('Could not undo. Try again.', t.restore, key);
    render(true);
  });
}

// ---- lists: pure helpers (no page state) ------------------------------------------------------
function updatedText_(at, now) {
  var mins = Math.floor((now - at) / 60000);
  if (!(mins >= 1)) return 'Updated just now';
  if (mins < 60) return 'Updated ' + mins + ' min ago';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return 'Updated ' + hours + ' h ago';
  var days = Math.floor(hours / 24);
  return 'Updated ' + days + (days === 1 ? ' day ago' : ' days ago');
}

// The wait before send attempt n + 1, after n failures in a row.
function backoffMs_(n) {
  if (n <= 1) return 2000;
  if (n === 2) return 5000;
  if (n === 3) return 15000;
  return 30000;
}

// 16 random bytes as a lowercase version 4 uuid.
function uuidFromBytes_(bytes) {
  var b = Array.prototype.slice.call(bytes, 0, 16);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  var hex = b.map(function (x) { return (x < 16 ? '0' : '') + x.toString(16); }).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}

// The lists reply key for an op's list.
function listsKey_(list) {
  return list === 'grocery' ? 'groceries' : 'todo';
}

// Applies one op to a lists object, the way the server will, and returns it. Used for the screens (the
// server's lists plus every queued op) and for keeping the server copy current from op replies. Matching is by
// id only, so applying an op twice changes nothing more.
function listsApplyOp_(lists, op) {
  function at(arr, id) {
    for (var i = 0; i < arr.length; i++) if (arr[i] && arr[i].id === id) return i;
    return -1;
  }
  function copy(o) {
    var out = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }
  if (op.op === 'expense') return lists; // A1-T5: an expense in the queue changes no list
  var f = op.fields || {};
  if (op.op === 'pause') {
    if (!lists.prefs || typeof lists.prefs !== 'object') lists.prefs = {};
    if (f.person === 'Kev' || f.person === 'Lili') lists.prefs[f.person] = { pausedUntil: f.until || '' };
    return lists;
  }
  var arr = lists[listsKey_(op.list)];
  if (!Array.isArray(arr)) return lists;
  if (!Array.isArray(lists.doneToday)) lists.doneToday = [];
  var i = at(arr, op.id);
  var isTodo = op.list === 'todo';
  if (op.op === 'add') {
    if (i < 0) {
      arr.push({
        id: op.id, list: op.list, text: f.text || '', who: isTodo ? (f.who || 'Either') : '', due: isTodo ? (f.due || '') : '',
        time: isTodo ? (f.time || '') : '', shop: isTodo ? '' : (f.shop || ''), added: lists.today || '', ageDays: 0,
        kind: '', minutes: '', firstStep: '', fp: ''
      });
    }
  } else if (op.op === 'edit') {
    if (i >= 0) {
      for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) arr[i][k] = f[k];
    }
  } else if (op.op === 'tick' || op.op === 'delete') {
    if (i >= 0) {
      var gone = arr.splice(i, 1)[0];
      if (op.op === 'tick' && at(lists.doneToday, op.id) < 0) {
        var done = copy(gone);
        done.fp = '';
        lists.doneToday.unshift(done);
      }
    }
  } else if (op.op === 'restore') {
    var d = at(lists.doneToday, op.id);
    var back = d >= 0 ? lists.doneToday.splice(d, 1)[0] : (op.item || null);
    if (back && i < 0) {
      var item = copy(back);
      item.list = op.list;
      arr.push(item);
    }
  }
  return lists;
}

// ---- lists: state -----------------------------------------------------------------------------
// LISTS_BASE is the server's lists as last known (the lists reply, kept current by each op reply). LISTS is what
// the screens show: LISTS_BASE with every queued op applied on top. Screens read LISTS only.
var LISTS = null;
var LISTS_BASE = null;
var LISTS_AT = 0;        // when LISTS_BASE was read from the server (ms); the "Updated N min ago" line
var LISTS_FETCHED = 0;   // when this page itself last loaded the lists (ms); 0 when only the cache is known
var LISTS_LOADING = false;
var LISTS_AGAIN = false; // a forced load asked for while one was on its way
var LISTS_FAILED = false;
var LISTS_TOAST = '';    // one short line in the dock; cleared on every navigation
var LISTS_NOTE = null;   // the dock's "Not saved yet" element on screen now
var QUEUE = [];          // ops not yet answered, oldest first; mirrored in kl.queue, shared with other tabs
var KNOWN = {};          // uids seen in kl.queue: one gone from there was settled by another tab
var QUEUE_UNSAVED = false; // the last kl.queue write failed: the queue lives only in this page
var INFLIGHT = '';       // uid of the op on its way. Ops go strictly one at a time; this outlives a lock-out.
var RETRY_TIMER = null;
var RETRY_N = 0;         // failed sends in a row, for the backoff
// R70: SERVER replies in a row for the queue head (HEAD_FAIL_UID). After HEAD_FAIL_MAX the op is dropped, so one op
// the server can never take does not hold the queue forever. TIMEOUT, UNREACHED and offline never count.
var HEAD_FAIL_UID = '';
var HEAD_FAIL_N = 0;
var HEAD_FAIL_MAX = 8;
// R46: SETTLE_N counts settled ops. A read remembers SETTLE_N when it is sent (READ_N); ops settled while it is
// on its way are kept in SETTLED and applied again onto it when it lands, so an older read never undoes them.
var SETTLE_N = 0;
var READ_N = 0;
var SETTLED = [];
// R47, R50: after an unsure success (saved, but the reply has no item to take fp and id from), or when the queue
// head has no fp, the head waits for a read sent at or after WAIT_KEYS[list + '|' + id] (a SETTLE_N), then takes
// its fp from it. Only the head is ever resolved: an op behind an earlier op for the same item is retargeted by
// that op's reply instead. LANDED_N is the newest landed read's READ_N, -1 before any lands in this session.
var WAIT_KEYS = {};
var LANDED_N = -1;
var WAITING_READ = false; // the head waits for a read: a failed read then retries on the backoff

// Fills in what an older or partial reply leaves out. null when it is not a lists reply at all.
function listsShape_(r) {
  if (!r || typeof r !== 'object' || !Array.isArray(r.todo) || !Array.isArray(r.groceries)) return null;
  ['doneToday', 'boughtRecently', 'shops', 'problems'].forEach(function (k) { if (!Array.isArray(r[k])) r[k] = []; });
  if (!r.prefs || typeof r.prefs !== 'object') r.prefs = { Kev: { pausedUntil: '' }, Lili: { pausedUntil: '' } };
  return r;
}

function listsRebuild_() {
  if (!LISTS_BASE) { LISTS = null; return; }
  var view = JSON.parse(JSON.stringify(LISTS_BASE));
  QUEUE.forEach(function (op) { listsApplyOp_(view, op); });
  LISTS = view;
}

function listsFind_(lists, list, id) {
  var arr = lists ? lists[listsKey_(list)] : null;
  if (!Array.isArray(arr)) return null;
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return null;
}

function listsItem_(list, id) {
  return listsFind_(LISTS, list, id);
}

// ---- lists: cache (kl.lists) -------------------------------------------------------------------
function listsFromCache_() {
  var c = lsJson_(LS_LISTS);
  var r = (c && typeof c.at === 'number') ? listsShape_(c.result) : null;
  if (!r) return;
  LISTS_BASE = r;
  LISTS_AT = c.at;
  listsRebuild_();
}

function listsSaveCache_() {
  if (LISTS_BASE) lsSet_(LS_LISTS, JSON.stringify({ at: LISTS_AT, result: LISTS_BASE }));
}

// ---- lists: loading ------------------------------------------------------------------------
// Every lists call comes through here, with the session token. call_ does the rest.
function listsCall_(action, payload) {
  payload.token = TOKEN;
  return call_(action, payload);
}

// The cached lists show at once when there are any; otherwise the loading cover. Then a refresh.
function listsEnter_() {
  if (!LISTS_BASE) listsFromCache_();
  if (LISTS || APP_ON) {
    showApp_();
    render(false);
  } else {
    showCover('loading', 'Opening your lists. The first load can take a few seconds.');
  }
  listsLoad_(false);
}

// force false: load unless one is on its way or this page loaded the lists under 15 s ago.
// force true: load now, or right after the one on its way.
function listsLoad_(force) {
  if (!TOKEN) return;
  if (!LISTS_BASE) listsFromCache_();
  if (LISTS_LOADING) {
    if (force) LISTS_AGAIN = true;
    return;
  }
  if (!force && LISTS_FETCHED && Date.now() - LISTS_FETCHED < 15000) return;
  LISTS_LOADING = true;
  READ_N = SETTLE_N;
  SETTLED = [];
  var sentN = READ_N;
  var session = SESSION;
  listsCall_('lists', {}).then(function (r) {
    if (session !== SESSION) return;
    LISTS_LOADING = false;
    var shaped = listsShape_(r);
    if (!shaped) { LISTS_AGAIN = false; listsLoadFailed_(null); return; }
    // R46: what settled while this read was on its way goes on top of it again.
    SETTLED.forEach(function (s) { listsSettleInto_(shaped, s.op, s.res); });
    SETTLED = [];
    LISTS_BASE = shaped;
    LISTS_AT = Date.now();
    LISTS_FETCHED = LISTS_AT;
    LISTS_FAILED = false;
    listsSaveCache_();
    if (sentN > LANDED_N) LANDED_N = sentN;
    listsDropIdleWaits_();
    listsRebuild_();
    if (LISTS_AGAIN) {
      LISTS_AGAIN = false;
      listsLoad_(true);
    }
    if (isListScreen_(VIEW.screen)) {
      showApp_();
      render(true);
    }
    listsFlush_();
  }, function (err) {
    if (session !== SESSION) return;
    LISTS_LOADING = false;
    LISTS_AGAIN = false;
    SETTLED = [];
    listsLoadFailed_(err);
  });
}

// With lists on screen, a failed refresh only changes the status line. Without, the cover says why.
function listsLoadFailed_(err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  LISTS_FAILED = true;
  // A head waiting for this read tries again on the backoff (listsFlush_ asks for the read).
  if (WAITING_READ && RETRY_TIMER === null) listsRetryLater_();
  if (!isListScreen_(VIEW.screen)) return;
  if (LISTS || APP_ON) { listsPaint_(); return; }
  if (code === 'NOT_CONFIGURED') showCover('error', 'Your PIN works, but the lists are not connected yet.');
  else if (unreached(err)) showCover('error', REACH_TEXT);
  else showCover('error', 'Could not load your lists. Check the connection and try again.');
}

// Repaints a list screen that is on show. Screen state that must survive (an open sheet, a focused field)
// lives in the screen's own variables, because this rebuilds the screen.
function listsPaint_() {
  if (isListScreen_(VIEW.screen) && APP_ON) render(true);
}

// ---- lists: the queue (kl.queue, shared by every open tab) ----------------------------------------
// Ops that kl.queue holds now, oldest first. An op with no uid (none should exist) gets a fixed one.
function listsReadQueue_() {
  var q = lsJson_(LS_QUEUE);
  if (!Array.isArray(q)) return [];
  return q.filter(function (o) { return !!o && typeof o === 'object' && typeof o.op === 'string'; }).map(function (o) {
    if (typeof o.uid !== 'string' || !o.uid) o.uid = 'u:' + [o.op, o.list, o.id, o.at].join('|');
    return o;
  });
}

// R48: the queue is read, changed and written back on every change, so another tab's ops are never lost.
// change(arr) is applied to this page's queue and to what kl.queue holds now. What is written also carries this
// page's ops that never made it into kl.queue, in their own order.
function listsQueueChange_(change) {
  change(QUEUE);
  var stored = listsReadQueue_();
  change(stored);
  var next = listsMerge_(stored);
  QUEUE_UNSAVED = !lsSet_(LS_QUEUE, JSON.stringify(next));
  if (!QUEUE_UNSAVED) listsAdopt_(next, next);
}

// What the queue should be: kl.queue's ops in its order (this page's copies take its fields; another tab may
// have added or retargeted some), plus this page's ops that never made it into kl.queue, each placed right after
// the op before it here, so the order this page made them in holds. An op this page knew from kl.queue and no
// longer finds there was settled by another tab, so it is left out.
function listsMerge_(stored) {
  var local = {};
  QUEUE.forEach(function (q) { local[q.uid] = q; });
  var there = {};
  stored.forEach(function (s) { there[s.uid] = true; });
  var out = stored.map(function (s) {
    var q = local[s.uid];
    if (!q) return s;
    for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) q[k] = s[k];
    return q;
  });
  var prev = null;
  QUEUE.forEach(function (q) {
    if (there[q.uid]) { prev = q.uid; return; }
    if (KNOWN[q.uid]) return;
    var at = 0;
    if (prev !== null) {
      for (var i = 0; i < out.length; i++) if (out[i].uid === prev) { at = i + 1; break; }
    }
    out.splice(at, 0, q);
    prev = q.uid;
  });
  return out;
}

// Takes next as this page's queue. inStore is what kl.queue holds now: only those ops count as known, so an op
// that never made it there is never mistaken for one another tab settled. The op on its way stays at the front
// until its reply, even when another tab settled it.
function listsAdopt_(next, inStore) {
  var keep = [];
  if (INFLIGHT && !next.some(function (q) { return q.uid === INFLIGHT; })) {
    QUEUE.forEach(function (q) { if (q.uid === INFLIGHT) keep.push(q); });
  }
  inStore.forEach(function (q) { KNOWN[q.uid] = true; });
  QUEUE = keep.concat(next);
}

function listsQueueInit_() {
  QUEUE = [];
  var stored = listsReadQueue_();
  listsAdopt_(listsMerge_(stored), stored);
}

function listsQueueRemove_(uid) {
  listsQueueChange_(function (arr) {
    for (var i = arr.length - 1; i >= 0; i--) if (arr[i].uid === uid) arr.splice(i, 1);
  });
}

// 'd:' + a lowercase uuid, made here so a replayed add is recognised and never duplicates.
function newId_() {
  var c = window.crypto;
  if (c && typeof c.randomUUID === 'function') return 'd:' + String(c.randomUUID()).toLowerCase();
  var bytes = [];
  if (c && typeof c.getRandomValues === 'function') {
    bytes = c.getRandomValues(new Uint8Array(16));
  } else {
    for (var i = 0; i < 16; i++) bytes.push(Math.floor(Math.random() * 256));
  }
  return 'd:' + uuidFromBytes_(bytes);
}

// op: {op, list, id, fp, fields, item}. add gets its id here and, on To do, this phone's Who unless fields
// says one; edit, tick and delete take the fp of the item on screen unless given. item (restore only, never
// sent) is the item to show again when it is not in doneToday, as after a delete. Shows the change at once,
// saves the queue and sends it. Returns the queued op, with its id.
function listsQueue_(input) {
  var op = { op: String(input.op), at: Date.now() };
  if (op.op !== 'pause') {
    op.list = input.list;
    op.id = input.id || (op.op === 'add' ? newId_() : '');
  }
  op.uid = 'u' + newId_().slice(1);
  if (input.fields && typeof input.fields === 'object') {
    op.fields = {};
    for (var k in input.fields) if (Object.prototype.hasOwnProperty.call(input.fields, k)) op.fields[k] = input.fields[k];
  }
  if (op.op === 'add' && op.list === 'todo') {
    if (!op.fields) op.fields = {};
    if (!op.fields.who && whoAmI_()) op.fields.who = whoAmI_();
  }
  // R66b: an add (both lists) says which phone it came from, only as exactly Kev or Lili; nothing else
  // ever carries from (the server refuses it on any other op, and any other value).
  if (op.fields) delete op.fields.from;
  if (op.op === 'add') {
    var me = whoAmI_();
    if (me === 'Kev' || me === 'Lili') {
      if (!op.fields) op.fields = {};
      op.fields.from = me;
    }
  }
  if (op.op === 'edit' || op.op === 'tick' || op.op === 'delete') {
    var cur = listsItem_(op.list, op.id);
    op.fp = (typeof input.fp === 'string' && input.fp) ? input.fp : (cur ? cur.fp : '');
  }
  if (op.op === 'restore' && input.item) op.item = input.item;
  listsQueueChange_(function (arr) { arr.push(op); });
  listsRebuild_();
  setTimeout(listsNoteUpdate_, 10000);
  listsPaint_();
  listsFlush_();
  return op;
}

// What goes over the wire: no queue bookkeeping, and only the keys each op takes.
function listsBody_(op) {
  var b = { op: op.op };
  if (op.op !== 'pause') {
    b.list = op.list;
    b.id = op.id;
  }
  if (op.op === 'edit' || op.op === 'tick' || op.op === 'delete') b.fp = op.fp;
  if (op.op === 'add' || op.op === 'edit' || op.op === 'pause') b.fields = op.fields || {};
  return b;
}

function listsNeedsFp_(op) {
  return op.op === 'edit' || op.op === 'tick' || op.op === 'delete';
}

function listsWaitKey_(op) {
  return op.list + '|' + op.id;
}

// R47, R50: what the queue head needs before it can go. 'go'; 'wait' (a fresh read is asked for); or 'dropped'
// (a tick or delete whose item the fresh read no longer lists is done; an edit of a gone item is dropped as a
// conflict would be). Only ever called for the head with nothing in flight, so no earlier op for its item exists.
function listsHeadReady_(op) {
  if (op.op === 'pause' || op.op === 'expense') return 'go';
  var key = listsWaitKey_(op);
  var blank = listsNeedsFp_(op) && !op.fp;
  if (!Object.prototype.hasOwnProperty.call(WAIT_KEYS, key)) {
    if (!blank) return 'go';
    WAIT_KEYS[key] = SETTLE_N;
  }
  if (!LISTS_BASE || LANDED_N < WAIT_KEYS[key]) {
    WAITING_READ = true;
    if (!(LISTS_LOADING && READ_N >= WAIT_KEYS[key])) listsLoad_(true);
    return 'wait';
  }
  delete WAIT_KEYS[key];
  if (!listsNeedsFp_(op)) return 'go';
  var it = listsFind_(LISTS_BASE, op.list, op.id);
  if (it) {
    listsQueueChange_(function (arr) {
      arr.forEach(function (q) { if (q.uid === op.uid) q.fp = it.fp; });
    });
    return 'go';
  }
  if (op.op === 'edit') LISTS_TOAST = 'This item changed. Refreshed.';
  listsQueueRemove_(op.uid);
  listsRebuild_();
  listsPaint_();
  return 'dropped';
}

// Wait marks for items with no queued op left are dropped once a read sent at or after the mark lands. An older
// read keeps the mark: its fp predates the unsure change, so an op queued later must still wait (case G).
function listsDropIdleWaits_() {
  var used = {};
  QUEUE.forEach(function (q) { if (q.op !== 'pause' && q.op !== 'expense') used[listsWaitKey_(q)] = true; });
  for (var k in WAIT_KEYS) {
    if (Object.prototype.hasOwnProperty.call(WAIT_KEYS, k) && !used[k] && WAIT_KEYS[k] <= LANDED_N) delete WAIT_KEYS[k];
  }
}

function listsByUid_(uid) {
  for (var i = 0; i < QUEUE.length; i++) if (QUEUE[i].uid === uid) return QUEUE[i];
  return null;
}

// Sends the oldest op, one at a time, in order. Called on load, on online, on another tab's queue change, after
// each enqueue, after each read and after each reply.
function listsFlush_() {
  if (INFLIGHT || RETRY_TIMER !== null || !TOKEN || !QUEUE.length) return;
  var ready = listsHeadReady_(QUEUE[0]);
  if (ready === 'dropped') { listsFlush_(); return; }
  if (ready === 'wait') return;
  WAITING_READ = false;
  var op = QUEUE[0];
  if (op.op === 'expense') { expenseSend_(op); return; } // A1-T5 (R-A5): on its own, through addExpense
  var sent = JSON.parse(JSON.stringify(op));
  if (HEAD_FAIL_UID !== op.uid) { HEAD_FAIL_UID = op.uid; HEAD_FAIL_N = 0; } // a new head starts from zero
  INFLIGHT = op.uid;
  var session = SESSION;
  listsCall_('listOp', listsBody_(sent)).then(function (res) {
    INFLIGHT = '';
    // M3: a reply from before a lock-out only frees the line; the op stays queued and goes again.
    if (session !== SESSION) { listsFlush_(); return; }
    listsReply_(sent, res);
  }, function (err) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    var code = err ? err.code : '';
    if (code === 'NO_SESSION') { lockOut(); return; }
    if (code === 'BAD_REQUEST') { listsRefused_(sent, false); return; }
    // R70: a server that fails this op 8 times in a row will not take it; it goes, so the ops behind it can.
    if (code === 'SERVER' && HEAD_FAIL_UID === sent.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { listsRefused_(sent, false); return; }
    listsRetryLater_(); // TIMEOUT, UNREACHED, SERVER, NOT_CONFIGURED: every op is safe to send again
  });
}

function listsReply_(op, res) {
  if (!res || typeof res !== 'object') { listsRetryLater_(); return; }
  if (res.ok === true) {
    var item = (res.item && typeof res.item === 'object') ? res.item : null;
    if (item) listsRetarget_(op, item);
    listsRecord_(op, res);
    var unsure = op.op !== 'pause' && ((Object.prototype.hasOwnProperty.call(res, 'item') && res.item === null) || (op.op === 'add' && res.gone));
    if (unsure) listsWaitFor_(op);
    listsDone_(op, unsure || (op.op === 'pause' && !res.prefs));
    return;
  }
  if (res.conflict) {
    listsRecord_(op, res);
    LISTS_TOAST = 'This item changed. Refreshed.';
    listsDone_(op, false);
    return;
  }
  // A retried restore after a success answers invalid: it is done, but its fp is unknown.
  if (res.invalid && op.op === 'restore') {
    listsRecord_(op, res);
    listsWaitFor_(op);
    listsDone_(op, true);
    return;
  }
  // R70 deploy-order safety net: a server from before R66b refuses an add that says which phone it came from. The
  // add goes once more without from (same id, so it can never duplicate); only that answer is final.
  if (res.invalid && op.op === 'add' && op.fields && Object.prototype.hasOwnProperty.call(op.fields, 'from')) {
    listsQueueChange_(function (arr) {
      arr.forEach(function (q) { if (q.uid === op.uid && q.fields) delete q.fields.from; });
    });
    listsFlush_();
    return;
  }
  if (res.invalid || res.capped) { listsRefused_(op, !!res.capped); return; }
  listsRetryLater_();
}

function listsWaitFor_(op) {
  WAIT_KEYS[listsWaitKey_(op)] = SETTLE_N;
}

// A settled op goes into the server copy, and is kept for a read on its way (R46).
function listsRecord_(op, res) {
  SETTLE_N++;
  if (LISTS_BASE) listsSettleInto_(LISTS_BASE, op, res);
  if (LISTS_LOADING) SETTLED.push({ op: op, res: res });
}

// What a settled op means for a lists object. Matching is by id, so applying it twice changes nothing more.
function listsSettleInto_(base, op, res) {
  var item = (res.item && typeof res.item === 'object') ? res.item : null;
  if (res.conflict) {
    if (op.op === 'pause') return;
    if (item) listsUpsert_(base, op.list, item, op.id);
    else listsRemove_(base, op.list, op.id);
    return;
  }
  if (res.ok !== true) {
    listsApplyOp_(base, op); // a restore answered invalid on replay
    return;
  }
  if (res.gone) {
    if (op.op !== 'pause') listsRemove_(base, op.list, op.id);
    return;
  }
  if (op.op === 'pause') {
    if (res.prefs && typeof res.prefs === 'object') base.prefs = res.prefs;
    else listsApplyOp_(base, op);
    return;
  }
  listsApplyOp_(base, op);
  if (item) listsUpsert_(base, op.list, item, op.id);
}

// Later queued ops for the same item go with the reply's id and fp, so they never trip over the change just saved.
function listsRetarget_(op, item) {
  listsQueueChange_(function (arr) {
    arr.forEach(function (q) {
      if (q.uid === op.uid || q.op === 'pause' || q.list !== op.list || q.id !== op.id) return;
      q.id = item.id;
      if (listsNeedsFp_(q)) q.fp = item.fp;
    });
  });
}

// Puts the server's item where the old one was (found by the op's id, or the item's own), else at the end.
function listsUpsert_(base, list, item, oldId) {
  var arr = base[listsKey_(list)];
  if (!Array.isArray(arr)) return;
  var i = -1;
  for (var j = 0; j < arr.length && i < 0; j++) if (arr[j].id === oldId) i = j;
  for (var k = 0; k < arr.length && i < 0; k++) if (arr[k].id === item.id) i = k;
  if (i >= 0) arr[i] = item;
  else arr.push(item);
}

function listsRemove_(base, list, id) {
  var arr = base[listsKey_(list)];
  if (!Array.isArray(arr)) return;
  for (var i = arr.length - 1; i >= 0; i--) if (arr[i].id === id) arr.splice(i, 1);
}

// The op is answered: off the queue (its own uid only), screens rebuilt, the next one sent. refresh forces a
// lists load first.
function listsDone_(op, refresh) {
  listsQueueRemove_(op.uid);
  RETRY_N = 0;
  HEAD_FAIL_UID = '';
  HEAD_FAIL_N = 0;
  listsSaveCache_();
  listsRebuild_();
  if (refresh) listsLoad_(true);
  listsPaint_();
  listsFlush_();
}

function listsRefused_(op, capped) {
  LISTS_TOAST = capped ? 'Too many new items today. This one was not saved.' : 'That change was not saved.';
  listsDone_(op, true);
}

function listsRetryLater_() {
  RETRY_N++;
  RETRY_TIMER = setTimeout(function () {
    RETRY_TIMER = null;
    listsFlush_();
  }, backoffMs_(RETRY_N));
  listsNoteUpdate_();
}

// True once the oldest op has waited 10 s unsent.
function listsPendingLong_() {
  return QUEUE.length > 0 && Date.now() - (Number(QUEUE[0].at) || 0) >= 10000;
}

function listsNoteUpdate_() {
  if (!LISTS_NOTE) return;
  var late = listsPendingLong_();
  LISTS_NOTE.textContent = late ? 'Not saved yet, retrying' : '';
  LISTS_NOTE.hidden = !late;
}

// Another tab changed kl.queue: take its ops, drop the ones it settled, send what is ours to send.
function listsStorageChanged_(e) {
  if (e && e.key !== LS_QUEUE && e.key !== null) return;
  var stored = listsReadQueue_();
  listsAdopt_(listsMerge_(stored), stored);
  listsRebuild_();
  listsPaint_();
  listsFlush_();
}

// At lock-out: nothing on screen, no read pending. The queue stays, in memory and in kl.queue. A send on its way
// is left to finish (INFLIGHT), so the next one never overtakes it (M3).
function listsLockOut_() {
  if (RETRY_TIMER !== null) clearTimeout(RETRY_TIMER);
  RETRY_TIMER = null;
  RETRY_N = 0;
  LISTS_LOADING = false;
  LISTS_AGAIN = false;
  LISTS_FAILED = false;
  LISTS = null;
  LISTS_BASE = null;
  LISTS_AT = 0;
  LISTS_FETCHED = 0;
  LISTS_TOAST = '';
  listsUndoClear_();
  LISTS_NOTE = null;
  SETTLED = [];
  LANDED_N = -1;     // the next read must land before a waiting head is resolved against anything
  WAITING_READ = false;
}

// ---- lists: screens (Tasks 6 to 8 fill the lists-main container) ---------------------------------
// A1-T3: the large title with this phone's avatar on its right. Under it, line (the Today count), and the age
// of the lists only when they are over 10 minutes old or a refresh failed.
function listsPanel_(root, title, line) {
  var top = largeTitleBox_(root, title, whoAvatar_());
  if (line) add(top.wrap, 'p', 'title-note', line);
  var now = Date.now();
  if (LISTS_AT && (LISTS_FAILED || now - LISTS_AT > 600000)) {
    add(top.wrap, 'p', 'title-note', (LISTS_FAILED ? 'Could not refresh. ' : '') + updatedText_(LISTS_AT, now) + '.');
  }
  return top.h;
}

// ---- who uses this phone (A1-T3): a first-run sheet, then a small avatar in the list headers ------------------
var WHO_ASKED = false;  // the sheet opened on this visit already: the first open of a list tab asks once
var WHO_OPEN = false;
var WHO_AVATAR = null;  // the header avatar on show now; it gets focus back when the sheet closes
var WHO_CTLS = [];      // the two choices, for the Tab loop

function whoAvatar_() {
  var me = whoAmI_();
  var b = el('button', 'avatar avatar-' + (me ? me.toLowerCase() : 'q'));
  b.setAttribute('type', 'button');
  b.setAttribute('aria-label', me ? 'This phone: ' + me + '. Change' : 'Who uses this phone?');
  add(b, 'span', '', me ? me.charAt(0) : '?').setAttribute('aria-hidden', 'true');
  b.addEventListener('click', openWhoSheet_);
  WHO_AVATAR = b;
  return b;
}

// A bottom sheet with two big choices. A choice sets this phone's person (kl.me); a tap outside or Escape
// closes it with no change. It lives in the static #who, so repaints behind it never rebuild it.
function openWhoSheet_() {
  if (SHEET) return;
  WHO_ASKED = true;
  WHO_OPEN = true;
  var root = $('who');
  root.textContent = '';
  add(root, 'div', 'sheet-backdrop').addEventListener('click', function () { closeWhoSheet_(); });
  var p = add(root, 'div', 'sheet-panel');
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-modal', 'true');
  p.setAttribute('aria-labelledby', 'who-title');

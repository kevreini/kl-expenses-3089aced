  var keep = words ? null : qaKeptNext_();
  var draft;
  if (keep) {
    draft = JSON.parse(JSON.stringify(keep.draft));
    if (draft.when === 'pick' && draft.day && draft.day === qaToday_()) draft.when = 'today'; // final fix 4: same day
  } else {
    draft = QA_DRAFT ? JSON.parse(JSON.stringify(QA_DRAFT)) : qaFresh_();
    QA_DRAFT = null;
  }
  if (words) draft.item = words.slice(0, 100);
  var s = { list: 'expense', quick: true, draft: draft, kept: keep ? keep.key : '', cats: qaCats_(), today: qaToday_(), grid: false, done: false, els: {}, ctls: [], sync: [], focusEl: null, touch: null };
  SHEET = s;
  qaBuild_(s);
  qaAmountShow_(s); // A3-T2A (2B minor): a kept "120" shows as 120,000 from the start
  sheetInert_(true);
  sheetHistory_();
  s.focusEl = s.els.amount;
  s.focusEl.focus({ preventScroll: true });
  // Opened from a list tab before Money loaded: the numbers come quietly, for the rate and the categories.
  if (!DATA && TOKEN && !LOADING) loadData(true);
}

// The segments on top of a quick add sheet. A tap on another one switches in place.
function qaSegments_(p, s) {
  var g = add(p, 'div', 'qa-seg');
  g.setAttribute('role', 'group');
  g.setAttribute('aria-label', 'Add');
  QA_SEGMENTS.forEach(function (seg) {
    var b = sheetCtl_(s, btn(g, 'qa-segbtn', null, function () { qaSwitch_(s, seg[0]); }));
    b.setAttribute('aria-pressed', seg[0] === s.list ? 'true' : 'false');
    b.appendChild(svgIcon_(tabIconPaths_(seg[0] === 'expense' ? 'money' : (seg[0] === 'todo' ? 'todo' : 'groceries'))));
    add(b, 'span', '', seg[1]);
  });
}

// Switching segments saves nothing and carries the words. An expense switched away from keeps its amount and
// choices for the next Add (the words go along).
function qaSwitch_(s, to) {
  if (SHEET !== s || to === s.list) return;
  var words = s.list === 'expense' ? s.draft.item : s.draft.text;
  if (s.list === 'expense') {
    if (s.kept) qaKeptPut_(s.kept, s.draft); // a refused one keeps everything, words too
    else {
      s.draft.item = '';
      QA_DRAFT = s.draft;
    }
    s.done = true;
  } else if (s.kept) qaKeptDrop_(s.kept); // A3-T2A: a kept to-do or item moves on with its words
  sheetShut_('replace');
  if (to === 'expense') {
    openExpenseSheet_(words);
    return;
  }
  if (to === 'todo') TODO_FOCUS = 'add';
  else GRO_FOCUS = 'add';
  openItemSheet_(null, to, { text: sheetOneLine_(words) }, true);
}

// The expense sheet. Add sits in the header row, above the amount, so the phone keyboard never covers it.
// A3-T2A B2, K2: the amount, then Paid by right under it (Joint is the default, values stay Couple), then What, then
// one sideways row of the six most used types plus More types (a small sheet of its own), then For and When.
var QA_BY = [['Couple', 'Joint'], ['Kev', 'Kev'], ['Lili', 'Lili']];
var QA_FOR = [['Couple', 'Both'], ['Kev', 'Kev'], ['Lili', 'Lili']];

// The six types used most in the months on hand (Settlement never), the rest in the grid's order.
function qaTopCats_(cats, months) {
  var n = {};
  (Array.isArray(months) ? months : []).forEach(function (m) {
    ((m && Array.isArray(m.rows)) ? m.rows : []).forEach(function (r) {
      if (r && typeof r.category === 'string' && cats.indexOf(r.category) >= 0) n[r.category] = (n[r.category] || 0) + 1;
    });
  });
  return cats.map(function (c, i) { return { c: c, i: i, n: n[c] || 0 }; }).sort(function (a, b) {
    return (b.n - a.n) || (a.i - b.i);
  }).slice(0, 6).map(function (x) { return x.c; });
}

function qaBuild_(s) {
  var p = sheetFrame_(s, 'New expense');
  sheetHead_(p, s, 'New expense', 'Add', 'qa-save btn-main', function () { qaSave_(s); });
  qaSegments_(p, s);

  var line = add(p, 'div', 'qa-amtline');
  s.els.cur = sheetCtl_(s, btn(line, 'qa-cur', s.draft.currency, function () {
    if (SHEET !== s) return;
    var i = QA_CURRENCIES.indexOf(s.draft.currency);
    s.draft.currency = QA_CURRENCIES[(i + 1) % QA_CURRENCIES.length];
    qaSync_(s);
    qaAmountShow_(s);
  }));
  var amount = sheetCtl_(s, add(line, 'input', 'qa-amount'));
  amount.setAttribute('type', 'text');
  amount.setAttribute('inputmode', 'decimal');
  amount.setAttribute('autocomplete', 'off');
  amount.setAttribute('maxlength', '20');
  amount.setAttribute('aria-label', 'Amount');
  amount.setAttribute('placeholder', '0');
  amount.value = s.draft.amount;
  amount.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.amount = amount.value;
    s.els.status.textContent = '';
    qaSync_(s);
  });
  // A3-T2B p12: once the field is left, rupiah shorthand shows its full value ("120" shows "120,000"); back in the
  // field it shows what was typed. The draft keeps the typed text, so a switch to EUR keeps 120 as 120 euros.
  amount.addEventListener('focus', function () { if (SHEET === s) { s.amountIn = true; qaAmountShow_(s); } });
  amount.addEventListener('blur', function () { if (SHEET === s) { s.amountIn = false; qaAmountShow_(s); } });
  s.els.amount = amount;
  var under = add(p, 'div', 'qa-under');
  s.els.preview = add(under, 'p', 'qa-preview');
  s.els.status = add(under, 'p', 'qa-status');
  s.els.status.setAttribute('role', 'status');

  var row = function (id, label) {
    var r = add(p, 'div', 'qa-row');
    add(r, 'p', 'qa-label', label).setAttribute('id', id);
    return r;
  };
  var chips = function (cls, label, options, key) {
    var r = row(cls + '-label', label);
    var g = sheetScrollRow_(s, add(r, 'div', 'sheet-chips sheet-scroll ' + cls));
    g.setAttribute('role', 'group');
    g.setAttribute('aria-labelledby', cls + '-label');
    options.forEach(function (o) {
      var value = o[0];
      var b = sheetCtl_(s, btn(g, 'schip', o[1], function () {
        if (SHEET !== s) return;
        s.draft[key] = value;
        if (key === 'when' && value === 'pick' && !todoValidDay_(s.draft.day)) s.draft.day = s.today;
        qaSync_(s);
      }));
      s.sync.push(function () { b.setAttribute('aria-pressed', s.draft[key] === value ? 'true' : 'false'); });
    });
  };
  chips('qa-by', 'Paid by', QA_BY, 'paidBy');

  var what = sheetCtl_(s, add(p, 'input', 'qa-what'));
  what.setAttribute('type', 'text');
  what.setAttribute('autocomplete', 'off');
  what.setAttribute('maxlength', '100');
  what.setAttribute('enterkeyhint', 'go');
  what.setAttribute('aria-label', 'What');
  what.setAttribute('placeholder', 'What was it?');
  what.value = s.draft.item;
  what.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.item = what.value;
    qaSync_(s);
  });
  what.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      qaSave_(s);
    }
  });
  s.els.hint = add(p, 'p', 'qa-hint');

  var pickCat = function (name) {
    if (SHEET !== s) return;
    s.draft.category = name;
    s.draft.hand = true;
    s.grid = false;
    qaSync_(s);
  };
  var typeRow = row('qa-type-label', 'Type');
  var types = sheetScrollRow_(s, add(typeRow, 'div', 'sheet-chips sheet-scroll qa-types'));
  types.setAttribute('role', 'group');
  types.setAttribute('aria-labelledby', 'qa-type-label');
  var top = qaTopCats_(s.cats, (qaData_() || {}).months);
  top.forEach(function (name) {
    var b = sheetCtl_(s, btn(types, 'schip qa-tchip', name, function () { pickCat(name); }));
    s.sync.push(function () { b.setAttribute('aria-pressed', qaCategory_(s) === name ? 'true' : 'false'); });
  });
  // More types: its label is the type on show when that one is not in the row, so the pick is always visible.
  s.els.type = sheetCtl_(s, btn(types, 'schip qa-more', 'More types', function () {
    if (SHEET !== s) return;
    s.grid = true;
    qaSync_(s);
    var on = s.els.gridBtns.filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; })[0];
    (on || s.els.gridBtns[0] || s.els.gridPanel).focus({ preventScroll: true });
  }));
  s.sync.push(function () {
    var cat = qaCategory_(s);
    var outside = top.indexOf(cat) < 0;
    s.els.type.textContent = outside ? cat : 'More types';
    s.els.type.setAttribute('aria-pressed', outside ? 'true' : 'false');
    s.els.type.setAttribute('aria-label', outside ? 'Type: ' + cat + '. More types' : 'More types');
    s.els.type.setAttribute('aria-expanded', s.grid ? 'true' : 'false');
  });

  chips('qa-for', 'For', QA_FOR, 'paidFor');
  chips('qa-when', 'When', QA_WHEN, 'when');
  var day = sheetCtl_(s, add(p, 'input', 'qa-day'), function () { return s.draft.when === 'pick'; });
  day.setAttribute('type', 'date');
  day.setAttribute('aria-label', 'Pick a day');
  day.setAttribute('min', '2020-01-01');
  if (s.today) day.setAttribute('max', s.today);
  var takeDay = function (resync) {
    if (SHEET !== s) return;
    var v = day.value;
    if (todoValidDay_(v) && v >= '2020-01-01' && (!s.today || v <= s.today)) s.draft.day = v;
    if (resync) qaSync_(s);
  };
  day.addEventListener('input', function () { takeDay(false); });
  day.addEventListener('change', function () { takeDay(true); });
  s.sync.push(function () {
    day.hidden = s.draft.when !== 'pick';
    if (s.draft.when === 'pick') day.value = s.draft.day;
  });

  // All types: a small sheet of its own over the expense sheet. A tap outside, Close or Escape goes back to it.
  var shade = add($('sheet'), 'div', 'sheet-backdrop qa-types-shade');
  shade.addEventListener('click', function () { qaGridClose_(s); });
  var gp = add($('sheet'), 'div', 'sheet-panel qa-types-sheet');
  gp.setAttribute('role', 'dialog');
  gp.setAttribute('aria-modal', 'true');
  gp.setAttribute('aria-label', 'All types');
  gp.setAttribute('tabindex', '-1');
  s.els.gridPanel = gp;
  add(gp, 'div', 'sheet-handle').setAttribute('aria-hidden', 'true');
  var gh = add(gp, 'div', 'qa-head');
  add(gh, 'h2', 'qa-title', 'Type');
  sheetCtl_(s, btn(gh, 'textbtn qa-types-close', 'Close', function () { qaGridClose_(s); }), function () { return s.grid; });
  var grid = add(gp, 'div', 'qa-grid');
  grid.setAttribute('role', 'group');
  grid.setAttribute('aria-label', 'All types');
  s.els.gridBtns = [];
  s.cats.forEach(function (name) {
    var b = sheetCtl_(s, btn(grid, 'qa-cat', null, function () {
      pickCat(name);
      s.els.type.focus({ preventScroll: true });
    }), function () { return s.grid; });
    catAvatar_(b, name);
    add(b, 'span', '', name);
    s.els.gridBtns.push(b);
    s.sync.push(function () { b.setAttribute('aria-pressed', qaCategory_(s) === name ? 'true' : 'false'); });
  });
  s.sync.push(function () {
    shade.hidden = !s.grid;
    gp.hidden = !s.grid;
    s.els.panel.inert = s.grid; // the expense sheet waits behind it
  });
  $('sheet').hidden = false;
  qaSync_(s);
  groDockPlace_(); // A3-T2A K2: on top of the keyboard when it is up
}

// Back from All types to the expense sheet, on its More types chip.
function qaGridClose_(s) {
  if (SHEET !== s || !s.grid) return;
  s.grid = false;
  qaSync_(s);
  s.els.type.focus({ preventScroll: true });
}

// A3-T2B p12: what the amount field shows: the typed text while in it (or when it is not a rupiah amount), the full
// rupiah value once it is left. Only written when it differs, so a caret is never moved for nothing.
function qaAmountShow_(s) {
  var f = s.els.amount;
  if (!f) return;
  var typed = String(s.draft.amount === undefined || s.draft.amount === null ? '' : s.draft.amount);
  var n = s.draft.currency === 'IDR' && !s.amountIn ? qaAmount_(typed, 'IDR') : null;
  var show = n === null ? typed : group(n);
  if (f.value !== show) f.value = show;
}

// Brings the sheet in line with its draft: the currency, the preview, the type chip, the hint, the chips.
function qaSync_(s) {
  if (!s || !s.els.amount) return;
  var e = s.els;
  e.cur.textContent = s.draft.currency;
  e.cur.setAttribute('aria-label', 'Currency: ' + s.draft.currency + '. Change');
  var d = qaData_();
  e.preview.textContent = qaPreview_(qaAmount_(s.draft.amount, s.draft.currency), s.draft.currency, d ? d.fx : null);
  var guessed = !(s.draft.hand && s.cats.indexOf(s.draft.category) >= 0) && !!qaFold_(s.draft.item).trim();
  e.hint.textContent = guessed ? 'Type guessed from the words.' : '';
  sheetSync_(s);
}

// Save: an amount is needed (the sheet says so and stays). Otherwise the expense joins the queue, the sheet closes
// and the toast offers Undo. A second tap finds the sheet closed and does nothing.
function qaSave_(s) {
  if (SHEET !== s || s.done) return;
  var amount = qaAmount_(s.draft.amount, s.draft.currency);
  if (amount === null) {
    s.els.status.textContent = 'Needs an amount';
    s.els.amount.focus({ preventScroll: true });
    return;
  }
  var cat = qaCategory_(s);
  var item = sheetOneLine_(s.draft.item).replace(/[\u0000-\u001f\u007f]/g, '').slice(0, 100).trim() || cat;
  var op = expenseOp_({
    amount: amount, currency: s.draft.currency, item: item, category: cat,
    paidBy: s.draft.paidBy, paidFor: s.draft.paidFor, date: qaDate_(s)
  }, s.draft);
  s.done = true;
  if (s.kept) qaKeptDrop_(s.kept);
  else QA_DRAFT = null;
  sheetShut_('close');
  qaToastSet_({ text: 'Added ' + qaPreview_(amount, op.fields.currency, null) + ' · ' + cat + qaWhoText_(op.fields) + '.', action: 'undo', uid: op.uid });
  expenseEnqueue_(op);
  moneyRepaint_();
  qaFocusAdd_(); // after the repaint, which draws a new Add slot
}

// A1 final fix 5: who paid and who it was for, in the Added line. A3-T2A B2: the payer is always named, joint money
// too: ", joint money." / ", paid by Kev." / ", paid by Kev for Lili." / ", joint money, for Lili."
function qaWhoText_(f) {
  var joint = !f.paidBy || f.paidBy === 'Couple';
  var forWho = f.paidFor && f.paidFor !== 'Couple' ? f.paidFor : '';
  if (joint) return ', joint money' + (forWho ? ', for ' + forWho : '');
  return ', paid by ' + f.paidBy + (forWho ? ' for ' + forWho : '');
}

// The queue op: the fields addExpense takes, its 'x:' id, from (only ever Kev or Lili, else left out), and the
// draft as typed (never sent), so a refused add can be put back in the sheet.
// fix round 1: a draft the server gave back carries its first id (draft.id), and saving it again uses that id.
function expenseOp_(fields, draft) {
  var again = typeof draft.id === 'string' && /^x:[0-9a-f-]{36}$/.test(draft.id);
  var op = { op: 'expense', at: Date.now(), id: again ? draft.id : 'x' + newId_().slice(1), fields: fields, draft: JSON.parse(JSON.stringify(draft)) };
  if (again) op.again = true;
  op.uid = 'u' + newId_().slice(1);
  var me = whoAmI_();
  if (me === 'Kev' || me === 'Lili') op.from = me;
  return op;
}

function expenseEnqueue_(op) {
  listsQueueChange_(function (arr) { arr.push(op); });
  setTimeout(listsNoteUpdate_, 10000);
  listsFlush_();
}

// Sends the queue head when it is an expense: alone, through addExpense, never inside a listOp. tried marks an op
// that went out at least once, so Undo knows the row may exist.
function expenseSend_(op) {
  if (HEAD_FAIL_UID !== op.uid) { HEAD_FAIL_UID = op.uid; HEAD_FAIL_N = 0; }
  if (!op.tried) {
    listsQueueChange_(function (arr) { arr.forEach(function (q) { if (q.uid === op.uid) q.tried = true; }); });
  }
  var sent = JSON.parse(JSON.stringify(op));
  var body = { id: sent.id, fields: sent.fields };
  if (sent.from === 'Kev' || sent.from === 'Lili') body.from = sent.from;
  INFLIGHT = op.uid;
  var session = SESSION;
  listsCall_('addExpense', body).then(function (res) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    expenseReply_(sent, res);
  }, function (err) {
    INFLIGHT = '';
    if (session !== SESSION) { listsFlush_(); return; }
    var code = err ? err.code : '';
    if (code === 'NO_SESSION') { lockOut(); return; }
    if (code === 'BAD_REQUEST') { expenseRefused_(sent, 'invalid'); return; }
    if (code === 'SERVER' && HEAD_FAIL_UID === sent.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { expenseRefused_(sent, 'invalid'); return; }
    expenseRetry_(); // TIMEOUT, UNREACHED, SERVER, NOT_CONFIGURED: the id makes another send safe
  });
}

function expenseRetry_() {
  listsRetryLater_();
  moneyRepaint_();
}

// {rowNumber, fingerprint} from a reply, or null.
function qaRow_(r) {
  if (!r || typeof r !== 'object' || typeof r.rowNumber !== 'number' || !(r.rowNumber >= 2) || typeof r.fingerprint !== 'string' || !r.fingerprint) return null;
  return { rowNumber: r.rowNumber, fingerprint: r.fingerprint };
}

// The op asked for Undo (the toast's Undo came while it was out, or before a reload).
function expenseUndoWanted_(op) {
  var cur = listsByUid_(op.uid);
  return !!((cur && cur.undo) || op.undo);
}

function expenseReply_(op, res) {
  if (!res || typeof res !== 'object') { expenseRetry_(); return; }
  if (res.ok === true) {
    // Saved now, or saved before (existed: a replay): the same success, and the toast already on show stays.
    var undo = expenseUndoWanted_(op);
    var row = qaRow_(res.row);
    expenseDone_(op);
    if (op.settle && op.fields) SETTLE_ANIM = { from: op.fields.amount, at: Date.now(), running: false };
    if (res.data && typeof res.data === 'object' && Array.isArray(res.data.months)) moneySet_(res.data);
    else if (DATA) {
      MONEY_LIVE = false; // A1 final fix 2: the figures on show lack this row until the refresh answers
      loadData(true);
    }
    if (undo) qaDeleteRow_(row);
    else if (QA_TOAST && QA_TOAST.uid === op.uid) {
      QA_TOAST.row = row;
      QA_TOAST.answered = true;
      // A returned draft saved again whose first try had landed after all: the row from then stands.
      if (res.existed && op.again) qaToastSet_({ text: 'It was saved already. Check it in the month.', action: 'undo', uid: op.uid, row: row, answered: true });
    }
    moneyRepaint_();
    return;
  }
  if (res.invalid || res.capped) { expenseRefused_(op, res.capped ? 'capped' : 'invalid'); return; }
  // retry (the sheet was busy), historyFailed, failed: nothing was added. A server that never takes it lets it go.
  if (HEAD_FAIL_UID === op.uid && ++HEAD_FAIL_N >= HEAD_FAIL_MAX) { expenseRefused_(op, 'invalid'); return; }
  expenseRetry_();
}

// The op is answered: off the queue (its own uid only), the next one sent.
function expenseDone_(op) {
  listsQueueRemove_(op.uid);
  RETRY_N = 0;
  HEAD_FAIL_UID = '';
  HEAD_FAIL_N = 0;
  listsNoteUpdate_();
  listsFlush_();
}

// The server will not take it: nothing was saved. What was typed goes back into Add, and one calm line says so.
function expenseRefused_(op, why) {
  if (op.settle) { // A1-T6: nothing was saved, the balance is as it was; nothing goes back into Add
    expenseDone_(op);
    moneyRepaint_();
    qaToastSet_({ text: 'Not settled. The balance is as it was.' });
    if (DATA && TOKEN) loadData(true); // A1 final fix 2: the server may know a newer balance (balanceChanged)
    return;
  }
  var undo = expenseUndoWanted_(op);
  expenseDone_(op);
  moneyRepaint_();
  if (undo) { qaToastSet_({ text: 'Removed.' }); return; }
  var d = op.draft && typeof op.draft === 'object' ? JSON.parse(JSON.stringify(op.draft)) : null;
  if (!d) {
    var f = op.fields || {};
    d = qaFresh_();
    d.amount = String(f.amount || '');
    d.currency = QA_CURRENCIES.indexOf(f.currency) >= 0 ? f.currency : 'IDR';
    d.item = String(f.item || '');
  }
  d.id = op.id; // saved again with this id, so a row that landed after all is never added twice
  qaPin_(d, op.fields && op.fields.date); // A1 final fix 4: never re-dated to a later day
  qaKeptAdd_(op.uid, d, why === 'capped' ? 'capped' : 'invalid');
  qaToastSet_({ text: QA_KEPT_TEXT[why === 'capped' ? 'capped' : 'invalid'], action: 'open' });
}

// Undo from the toast. Never sent: the op is simply dropped. Sent at least once (or on its way): the row may exist,
// so the op is marked, and its reply is followed by the delete. Answered: the delete of the row the reply named.
function qaUndo_() {
  var t = QA_TOAST;
  if (t && t.listUndo) { listsToastUndo_(t.listUndo); return; } // A3-T2A M4: a list add or edit
  if (!t || !t.uid) return;
  var q = listsByUid_(t.uid);
  if (q && !q.tried && INFLIGHT !== q.uid) {
    listsQueueRemove_(q.uid);
    listsNoteUpdate_();
    qaToastSet_({ text: 'Removed.' });
    moneyRepaint_();
    return;
  }
  if (q) {
    listsQueueChange_(function (arr) { arr.forEach(function (o) { if (o.uid === q.uid) o.undo = true; }); });
    qaToastSet_({ text: 'Undoing...' });
    return;
  }
  qaDeleteRow_(t.answered ? t.row : null);
}

// The delete of an added row (deleteExpense with the reply's row and fingerprint). No row, or a delete that does
// not go through: one calm line; the expense stays and can be deleted from its month.
function qaDeleteRow_(row) {
  if (!row || !TOKEN) { qaToastSet_({ text: QA_UNDO_FAIL }); return; }
  qaToastSet_({ text: 'Undoing...' });
  var session = SESSION;
  call_('deleteExpense', { token: TOKEN, rowNumber: row.rowNumber, fingerprint: row.fingerprint }).then(function (res) {
    if (session !== SESSION) return;
    if (res && res.ok) {
      if (res.data && typeof res.data === 'object' && Array.isArray(res.data.months)) moneySet_(res.data);
      else if (DATA) loadData(true);
      qaToastSet_({ text: 'Removed.' });
      moneyRepaint_();
      return;
    }
    qaToastSet_({ text: QA_UNDO_FAIL });
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    qaToastSet_({ text: QA_UNDO_FAIL });
    if (unreached(err) && DATA) loadData(true); // it may have gone through: the numbers say
  });
}

// The toast: one line above the bar on every tab, for 6 s. null takes it away.
function qaToastSet_(t) {
  if (QA_TOAST_TIMER !== null) clearTimeout(QA_TOAST_TIMER);
  QA_TOAST_TIMER = null;
  QA_TOAST = t;
  if (t) {
    QA_TOAST_TIMER = setTimeout(function () {
      QA_TOAST_TIMER = null;
      if (QA_TOAST === t) { QA_TOAST = null; qaToastPaint_(); }
    }, 6000);
  }
  qaToastPaint_();
}

function qaToastPaint_() {
  var root = $('qa-toast');
  root.textContent = '';
  var t = QA_TOAST;
  root.hidden = !t;
  if (!t) return;
  add(root, 'span', '', t.text);
  if (t.action === 'undo') btn(root, '', 'Undo', qaUndo_);
  else if (t.action === 'open') {
    btn(root, '', 'Open', function () {
      qaToastSet_(null);
      if (t.open === 'todo' || t.open === 'grocery') {
        if (t.open === 'todo') TODO_FOCUS = 'add';
        else GRO_FOCUS = 'add';
        openItemSheet_(null, t.open, null, true);
      } else openExpenseSheet_();
    });
  }
}

// Money on show is drawn again (a new expense in its numbers, or the waiting line).
function moneyRepaint_() {
  if (APP_ON && DATA && tabOf_(VIEW.screen) === 'money') render(true);
}

// ---- Groceries screen (Task 8; A2-T3 by shop) -------------------------------------------------------------------
// A2-T3: one section per shop that has items, in the known shops order, Any shop last, each under a sticky header with
// the shop name and its count. A shop header opens "In the shop": that shop alone, until Back, leaving the tab or
// 3 hours. The pinned "Add an item" field is built once per visit and kept through every repaint (only the parts
// above and below it are rebuilt), so a reply or the 60 s refresh never takes the phone keyboard away.

// The compare key for item and shop names: lowercase, accents removed, the typographic apostrophe as a
// plain one, ends trimmed, inner spaces collapsed ("Pépito " is "pepito").
function foldKey_(s) {
  var t = String(s === undefined || s === null ? '' : s);
  if (typeof t.normalize === 'function') t = t.normalize('NFD');
  return t.replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, '\u0027').toLowerCase().replace(/\s+/g, ' ').trim();
}

// The shops known to this phone, one per folded name: the server's list (newest spelling first), then any
// shop on an open item that it does not have yet.
function groKnownShops_(lists) {
  var out = [];
  var seen = {};
  var take = function (v) {
    if (typeof v !== 'string') return;
    var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
    var k = foldKey_(t);
    if (!k || seen[k]) return;
    seen[k] = true;
    out.push(t);
  };
  (lists && Array.isArray(lists.shops) ? lists.shops : []).forEach(take);
  (lists && Array.isArray(lists.groceries) ? lists.groceries : []).forEach(function (it) { if (it) take(it.shop); });
  return out;
}

// A2-T3: the sections, as [{shop, items}]: one per shop that has items, in the order of shops (a shop missing from
// it comes after, in the order first seen), then {shop: ''} for Any shop. Item order is kept in each section.
function groSections_(items, shops) {
  var order = [];                 // the sections in screen order (known shops first, then new ones as first seen)
  var byKey = Object.create(null); // folded shop -> its section (no prototype: any shop name is a plain key)
  var any = { shop: '', items: [] };
  var take = function (k, name) {
    if (!byKey[k]) {
      byKey[k] = { shop: name, items: [] };
      order.push(byKey[k]);
    }
    return byKey[k];
  };
  shops.forEach(function (name) {
    var k = foldKey_(name);
    if (k) take(k, String(name));
  });
  items.forEach(function (it) {
    var k = foldKey_(it.shop);
    if (!k) any.items.push(it);
    else take(k, sheetOneLine_(it.shop).slice(0, 40)).items.push(it);
  });
  var out = order.filter(function (sec) { return sec.items.length; });
  if (any.items.length) out.push(any);
  return out;
}

// A2 final: the known shops in the order this visit first showed them, so a tick (its Done row makes that shop the
// newest) never reorders the sections; a shop not seen yet on this visit comes after the others. The spelling is the
// current one. GRO_SEC is cleared on leaving the tab.
function groSecOrder_(shops) {
  var name = Object.create(null);
  shops.forEach(function (n) {
    var k = foldKey_(n);
    if (k && !(k in name)) name[k] = n;
  });
  var had = Object.create(null);
  GRO_SEC.forEach(function (k) { had[k] = true; });
  shops.forEach(function (n) {
    var k = foldKey_(n);
    if (k && !had[k]) {
      had[k] = true;
      GRO_SEC.push(k);
    }
  });
  return GRO_SEC.filter(function (k) { return k in name; }).map(function (k) { return name[k]; });
}

// A2-T3: an open grocery item with no shop is placed from shopMap (its folded text), as the server would place it
// once a Done row has taught it. Used on the lists the screens show, so an add made here, offline too, sits under
// its shop at once.
function groPlace_(lists) {
  var map = lists && lists.shopMap;
  if (!map || typeof map !== 'object' || !Array.isArray(lists.groceries)) return lists;
  lists.groceries.forEach(function (it) {
    if (!it || sheetOneLine_(it.shop)) return;
    var k = foldKey_(it.text);
    var v = Object.prototype.hasOwnProperty.call(map, k) ? map[k] : '';
    var shop = typeof v === 'string' ? sheetOneLine_(v).slice(0, 40) : '';
    if (!shop) return;
    it.shop = shop;
    it.shopFrom = 'learned';
  });
  return lists;
}

// The shop in a stored kl.shop value ({shop, at}), or '' when there is none, it is malformed, or it was set
// more than 3 hours before now (a time well ahead of the clock is not trusted either).
function groShopFrom_(raw, now) {
  if (!raw || typeof raw !== 'string') return '';
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { return ''; }
  if (!o || typeof o.shop !== 'string' || typeof o.at !== 'number') return '';
  var shop = sheetOneLine_(o.shop);
  if (!shop || shop.length > 40) return '';
  var age = now - o.at;
  return (age >= -60000 && age <= 3 * 3600 * 1000) ? shop : '';
}

// A shop as typed: one line, inner spaces collapsed, 40 characters at most; a known shop that matches it
// without case or accents gives its own spelling.
function groShopCanon_(v, shops) {
  var t = sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim();
  var k = foldKey_(t);
  if (!k) return '';
  for (var i = 0; i < shops.length; i++) if (foldKey_(shops[i]) === k) return String(shops[i]).slice(0, 40);
  return t;
}

var LS_SHOP = 'kl.shop';  // A2-T3: "In the shop", as {shop, at}; ends 3 hours after it began
var GRO_SHOP_RAW = null;  // memory copy of kl.shop, so the mode holds for this visit even without storage
var GRO = null;           // the screen's kept parts on show now: {head, box, field, note, rest}
var GRO_DRAFT = '';       // what is typed in the add field, kept in memory across visits (never stored)
var GRO_NOTE = '';        // the line under the add field ("Already on the list")
var GRO_STRUCK = {};      // id -> {item}: ticked here, struck in place until the screen is left
var GRO_POS = {};         // id -> place on this visit, so an item ticked and unticked comes back in its place
var GRO_SEQ = 0;
var GRO_SEC = [];         // A2 final: folded shop names in section order on this visit (new ones append at the end)
var GRO_DONE_OPEN = false; // the collapsed Bought today section is open
var GRO_FOCUS = '';       // the keyed control that had focus, given back after a repaint
var GRO_FOCUS_EL = null;
var GRO_TIMER = null;     // the 60 s refresh while Groceries is on show and the page is visible

// Leaving Groceries: struck items go to Bought today, the fold closes, "In the shop" ends, the refresh stops.
function groLeave_() {
  GRO_STRUCK = {};
  GRO_POS = {};
  GRO_SEQ = 0;
  GRO_SEC = [];
  GRO_DONE_OPEN = false;
  GRO_FOCUS = '';
  GRO_NOTE = '';
  groPickReset_(); // F4
  groSetHere_('');
  groTimerStop_();
}

// clearScreens: a repaint of Groceries keeps the add field (and its focus and text); anything else empties it.
function groClear_() {
  if (GRO && VIEW.screen === 'groceries' && TOKEN) {
    GRO.head.textContent = '';
    GRO.rest.textContent = '';
    if (GRO.toasts) GRO.toasts.textContent = ''; // A1-T7: the dock keeps the field; its two slots are refilled
    if (GRO.recent) GRO.recent.textContent = '';
    return;
  }
  $('groceries').textContent = '';
  GRO = null;
}

function groKey_(e, key) {
  e.setAttribute('data-focus', key);
  if (key === GRO_FOCUS) GRO_FOCUS_EL = e;
  return e;
}

// A2-T3: the shop "In the shop" shows, or '' for all shops. Forgotten once it is 3 hours old.
function groHere_() {
  if (GRO_SHOP_RAW === null) GRO_SHOP_RAW = lsGet_(LS_SHOP) || '';
  var shop = groShopFrom_(GRO_SHOP_RAW, Date.now());
  if (!shop && GRO_SHOP_RAW) {
    GRO_SHOP_RAW = '';
    lsDel_(LS_SHOP);
  }
  return shop;
}

function groSetHere_(shop) {
  if (shop) {
    GRO_SHOP_RAW = JSON.stringify({ shop: shop, at: Date.now() });
    lsSet_(LS_SHOP, GRO_SHOP_RAW);
  } else {
    if (GRO_SHOP_RAW === null) GRO_SHOP_RAW = lsGet_(LS_SHOP) || '';
    if (GRO_SHOP_RAW) lsDel_(LS_SHOP); // only when one was set: leaving the tab touches no storage otherwise
    GRO_SHOP_RAW = '';
  }
}

// Into "In the shop" (a header tap) and back out (Back): the top of the screen, focus on Back or on that header.
function groEnterHere_(shop) {
  groSetHere_(shop);
  GRO_FOCUS = 'back';
  render(true);
  window.scrollTo(0, 0);
}

function groLeaveHere_(shop) {
  groSetHere_('');
  GRO_FOCUS = 'sec:' + foldKey_(shop);
  render(true); // fix 1: the repaint focuses that header (without scrolling); then it is brought into view
  var head = GRO_FOCUS_EL;
  if (head && typeof head.scrollIntoView === 'function') head.scrollIntoView({ block: 'center' });
  else window.scrollTo(0, 0);
}

function groSay_(t) {
  GRO_NOTE = t;
  if (GRO && GRO.note) GRO.note.textContent = t;
}

// One add, unless that text (without case or accents) is already on the list. No shop given: it is placed by itself.
// F4: shop, when given, is what the dock's Shop row decided ('' sends none); left out (Bought recently, staples), the
// shop on show as before.
function groAdd_(raw, shop) {
  var text = sheetOneLine_(raw).slice(0, 500).trim();
  if (!text) return false;
  var key = foldKey_(text);
  var open = (LISTS && Array.isArray(LISTS.groceries)) ? LISTS.groceries : [];
  if (open.some(function (it) { return foldKey_(it.text) === key; })) {
    groSay_('Already on the list');
    return false;
  }
  groSay_('');
  // A3-T2A m6: in the shop, a new item is for that shop (a hand shop), so it shows right here. M4: the dark toast
  // says where it landed ("Added to Pepito." / "Added under Gran Lucky." / "Added under Any shop."), with Undo.
  var here = groHere_();
  var to = typeof shop === 'string' ? sheetOneLine_(shop).slice(0, 40) : (here ? here.slice(0, 40) : '');
  var fields = to ? { text: text, shop: to } : { text: text };
  listsAddNew_('grocery', fields, here);
  return true;
}

// ---- F4: the shop at add time (Kevin overrides spec decision 7) ----------------------------------------------------
// Once there is text, one sideways row of shop chips: the known shops, Any shop and New shop (a small field). The
// pressed chip is a hand pick, else the guess: the shop on show ("In the shop"), else the learned shop for the text
// (shopMap, folded), else Any shop. An add with no hand pick goes as before (in the shop, that shop; elsewhere no
// shop, so it is placed by itself); a hand pick goes as the item's own shop. Used by the dock and the Add sheet.
function groShopGuess_(text, lists, here) {
  if (here) return sheetOneLine_(here).slice(0, 40);
  return groShopLearned_(text, lists);
}

// The learned shop for a text (shopMap, folded), or ''. F4 fix 3 (ruling): while there is one, Any shop is not offered
// at add time (the server has no hand "none", so the item would land in the learned shop anyway), and an Any shop
// picked earlier does not hold.
function groShopLearned_(text, lists) {
  var map = lists && lists.shopMap;
  var k = foldKey_(text);
  if (!k || !map || typeof map !== 'object') return '';
  var v = Object.prototype.hasOwnProperty.call(map, k) ? map[k] : '';
  return typeof v === 'string' ? sheetOneLine_(v).replace(/\s+/g, ' ').slice(0, 40).trim() : '';
}

// A hand pick that holds: any shop picked by hand, except Any shop while a shop is learned for the text (fix 3).
function groShopHand_(pick, text, lists) {
  return !!(pick && pick.hand && (foldKey_(pick.shop) || !groShopLearned_(text, lists)));
}

// The shop an add sends: a hand pick in its known spelling (Any shop sends none), else the shop on show, else none.
function groShopSend_(pick, here, lists, text) {
  if (groShopHand_(pick, text, lists)) return groShopCanon_(pick.shop, groKnownShops_(lists));
  return here ? sheetOneLine_(here).slice(0, 40) : '';
}

// The shop chips: the 12 newest shops of the server list (as the item sheet), then the guess when it is not among them.
function groShopList_(lists, guess) {
  var shops = groKnownShops_({ shops: lists && lists.shops }).slice(0, 12);
  var g = sheetOneLine_(guess).slice(0, 40);
  if (g && !shops.some(function (n) { return foldKey_(n) === foldKey_(g); })) shops.push(g);
  return shops;
}

// Pressed: the chip whose shop folds to the one in force (Any shop: none in force).
function groShopIsOn_(value, on) {
  var k = foldKey_(on);
  return value ? k === foldKey_(value) : !k;
}

var GRO_PICK = { hand: false, shop: '', open: false, keep: null, on: null }; // the dock's Shop row (memory only)

function groPickReset_() {
  GRO_PICK = { hand: false, shop: '', open: false, keep: null, on: null };
  if (GRO && GRO.shopName) GRO.shopName.value = '';
}

// The dock's Shop row, refilled in place (its box, the chips row and the New shop field are kept, so the sideways
// scroll and the field's text and keyboard stay). Only while the add field has text. Called on every keystroke and
// repaint; the dock is then placed again so it stays on the keyboard.
function groShopPaint_() {
  if (!GRO || !GRO.shopBox) return;
  var text = GRO.field.value;
  var has = !!sheetOneLine_(text);
  GRO.shopBox.hidden = !has;
  GRO.shopChips.textContent = '';
  GRO.shopName.hidden = !(has && GRO_PICK.open);
  if (has) {
    var here = groHere_();
    var guess = groShopGuess_(text, LISTS, here);
    var on = groShopHand_(GRO_PICK, text, LISTS) ? GRO_PICK.shop : guess;
    var pressed = null;
    var chip = function (label, value) {
      var b = groKey_(btn(GRO.shopChips, 'schip', label, function () {
        GRO_PICK.hand = true;
        GRO_PICK.shop = value;
        GRO_PICK.open = false;
        GRO.shopName.value = '';
        GRO_FOCUS = 'field';
        groShopPaint_();
        GRO.field.focus({ preventScroll: true }); // straight back to the field: Enter adds
      }), 'shop:' + (value ? foldKey_(value) : '-'));
      b.addEventListener('mousedown', function (e) { if (e && typeof e.preventDefault === 'function') e.preventDefault(); }); // keeps the keyboard up
      var isOn = groShopIsOn_(value, on);
      b.setAttribute('aria-pressed', isOn ? 'true' : 'false');
      if (isOn) pressed = b;
    };
    groShopList_(LISTS, guess).forEach(function (n) { chip(n, n); });
    if (!groShopLearned_(text, LISTS)) chip('Any shop', ''); // fix 3: only when nothing is learned
    var more = groKey_(btn(GRO.shopChips, 'sheet-newshop', 'New shop', function () {
      if (!GRO_PICK.open) GRO_PICK.keep = { hand: GRO_PICK.hand, shop: GRO_PICK.shop }; // an emptied field gives this back
      GRO_PICK.open = true;
      groShopPaint_();
      GRO.shopName.focus({ preventScroll: true });
    }), 'shop:new');
    more.setAttribute('aria-expanded', GRO_PICK.open ? 'true' : 'false');
    var key = pressed ? pressed.getAttribute('data-focus') : '';
    if (pressed && key !== GRO_PICK.on && GRO_PICK.on !== null) sheetReveal_(GRO.shopChips, pressed);
    GRO_PICK.on = key;
  } else GRO_PICK.on = null;
  groDockPlace_();
}

// An add from the dock (Enter in the add field or in the New shop field): the text with the Shop row's shop.
function groDockAdd_() {
  var f = GRO && GRO.field;
  if (!f || !sheetOneLine_(f.value)) return;
  var v = f.value;
  var shop = groShopSend_(GRO_PICK, groHere_(), LISTS, v);
  f.value = '';
  GRO_DRAFT = '';
  groPickReset_();
  GRO_FOCUS = 'field';
  groAdd_(v, shop);
  groShopPaint_();
  f.focus({ preventScroll: true });
}

// A2-T3: the tick says the shop the item is shown under (hand, learned or guess), so the Done row learns it.
function groTick_(it) {
  GRO_STRUCK[it.id] = { item: todoCopy_(it) };
  var shop = sheetOneLine_(it.shop).slice(0, 40);
  var op = { op: 'tick', list: 'grocery', id: it.id };
  if (shop) op.fields = { shop: shop };
  listsQueue_(op);
}

function groUntick_(it) {
  delete GRO_STRUCK[it.id];
  listsQueue_({ op: 'restore', list: 'grocery', id: it.id, item: todoCopy_(it) });
}

// The open items with the struck ones back in their places, in the order first seen on this visit.
function groItems_(lists) {
  var open = Array.isArray(lists.groceries) ? lists.groceries : [];
  var ids = {};
  open.forEach(function (it) { ids[it.id] = true; });
  var all = open.slice();
  Object.keys(GRO_STRUCK).forEach(function (id) {
    if (ids[id]) delete GRO_STRUCK[id]; // open again (a conflict, or brought back elsewhere)
    else all.push(GRO_STRUCK[id].item);
  });
  all.forEach(function (it) {
    if (!Object.prototype.hasOwnProperty.call(GRO_POS, it.id)) GRO_POS[it.id] = GRO_SEQ++;
  });
  return all.map(function (it, i) { return { it: it, i: i }; }).sort(function (a, b) {
    return (GRO_POS[a.it.id] - GRO_POS[b.it.id]) || (a.i - b.i);
  }).map(function (x) { return x.it; });
}

// ---- the 60 s refresh: only while Groceries is on show and the page is visible, always through the shell
function groVisible_() {
  return document.visibilityState !== 'hidden';
}

function groOnShow_() {
  return VIEW.screen === 'groceries' && !!TOKEN && APP_ON;
}

function groTimerEnsure_() {
  if (GRO_TIMER === null && groOnShow_() && groVisible_()) GRO_TIMER = setTimeout(groRefresh_, 60000);
}

function groTimerStop_() {
  if (GRO_TIMER !== null) clearTimeout(GRO_TIMER);
  GRO_TIMER = null;
}

function groRefresh_() {
  GRO_TIMER = null;
  if (!groOnShow_() || !groVisible_()) return;
  listsLoad_(true);
  groTimerEnsure_();
}

// Hidden: no refresh. On show again: refreshed at once (unless this page loaded under 15 s ago), then every 60 s.
function groVisibility_() {
  if (!groVisible_()) { groTimerStop_(); return; }
  if (!groOnShow_()) return;
  listsLoad_(false);
  groTimerEnsure_();
}

// ---- drawing
// A1-T7: the dock above the tab bar, near the thumb: the lists' lines (Undo, Not saved yet), the Bought recently
// chips, then the add field and its line. It is built once per visit like the field, so a repaint never takes the
// focus or the keyboard away; only the toasts and chips slots are refilled. With the keyboard up it rides on top
// of the keyboard (groDockPlace_). A2-T3: the tab bar Add on Groceries puts the cursor here.
function groAddBox_(root) {
  var box = add(root, 'div', 'gro-dock');
  var toasts = add(box, 'div', 'gro-dock-slot');
  var recent = add(box, 'div', 'gro-dock-slot');
  // F4: the Shop row, above the field, only while there is text (groShopPaint_).
  var shopBox = add(box, 'div', 'gro-shop');
  shopBox.hidden = true;
  add(shopBox, 'p', 'gro-label', 'Shop').setAttribute('id', 'gro-shop-label');
  var shopChips = add(shopBox, 'div', 'gro-shop-chips');
  shopChips.setAttribute('role', 'group');
  shopChips.setAttribute('aria-labelledby', 'gro-shop-label');
  var shopName = add(shopBox, 'input', 'gro-shop-input sheet-shop-input');
  shopName.setAttribute('type', 'text');
  shopName.setAttribute('aria-label', 'New shop');
  shopName.setAttribute('placeholder', 'Shop name');
  shopName.setAttribute('maxlength', '40');
  shopName.setAttribute('autocomplete', 'off');
  shopName.setAttribute('enterkeyhint', 'enter');
  shopName.setAttribute('data-focus', 'shopname');
  shopName.hidden = true;
  shopName.addEventListener('input', function () {
    if (sheetOneLine_(shopName.value)) {
      GRO_PICK.hand = true;
      GRO_PICK.shop = shopName.value;
    } else if (GRO_PICK.keep) { // an emptied field never clears the pick; Any shop does
      GRO_PICK.hand = GRO_PICK.keep.hand;
      GRO_PICK.shop = GRO_PICK.keep.shop;
    }
    groShopPaint_();
  });
  shopName.addEventListener('keydown', function (e) {
    if (!e || e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    groDockAdd_();
  });
  // A label: a tap anywhere on the pill (the plus too) puts the cursor in the field.
  var w = add(box, 'label', 'gro-add');
  var plus = add(w, 'span', 'gro-add-plus');
  plus.setAttribute('aria-hidden', 'true');
  plus.appendChild(svgIcon_(['M12 6v12', 'M6 12h12']));
  var f = add(w, 'input', '');
  f.setAttribute('type', 'text');
  f.setAttribute('aria-label', 'Add an item');
  f.setAttribute('placeholder', 'Add an item');
  f.setAttribute('maxlength', '500');
  f.setAttribute('enterkeyhint', 'enter');
  f.setAttribute('autocomplete', 'off');
  f.setAttribute('data-focus', 'field');
  f.value = GRO_DRAFT;
  var note = add(box, 'p', 'gro-note', GRO_NOTE);
  note.setAttribute('role', 'status');
  f.addEventListener('input', function () {
    GRO_DRAFT = f.value;
    if (GRO_NOTE) groSay_('');
    if (!sheetOneLine_(f.value)) groPickReset_(); // F4: an emptied field starts the Shop row again
    groShopPaint_();
  });
  // Enter adds and keeps the field focused for the next item; lists come in bursts.
  f.addEventListener('keydown', function (e) {
    if (!e || e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    groDockAdd_();
  });
  return { box: box, field: f, note: note, toasts: toasts, recent: recent, shopBox: shopBox, shopChips: shopChips, shopName: shopName };
}

// A1-T7: how much of the layout viewport the phone keyboard covers now, from the visual viewport (0: no keyboard).
// Under 120 px is the browser's own bar moving, never a keyboard. Older browsers without it: always 0.
var GRO_KB = 0;
function groDockPlace_() {
  var vv = window.visualViewport;
  var ih = Number(window.innerHeight) || 0;
  var cover = vv && ih > 0 ? Math.round(ih - (Number(vv.height) || 0) - (Number(vv.offsetTop) || 0)) : 0;
  GRO_KB = cover > 120 ? cover : 0;
  sheetPlace_(vv);
  var toast = $('qa-toast');
  if (!GRO || !GRO.box) {
    toast.style.bottom = '';
    return;
  }
  GRO.box.style.bottom = GRO_KB ? GRO_KB + 'px' : ''; // right on the keyboard; '' is the CSS place above the bar
  GRO.box.className = 'gro-dock' + (GRO_KB ? ' is-kb' : '');
  // The dock's height, so the end of the list and the quick add toast clear it.
  var h = Number(GRO.box.offsetHeight) || 0;
  var rootStyle = document.documentElement && document.documentElement.style;
  if (h > 0 && rootStyle && typeof rootStyle.setProperty === 'function') rootStyle.setProperty('--gro-dock-h', h + 'px');
  if (rootStyle && typeof rootStyle.setProperty === 'function') rootStyle.setProperty('--gro-kb', GRO_KB + 'px');
  // A3-T2A M4: with the keyboard up the toast rides above the dock, so an add from the dock is seen.
  toast.style.bottom = GRO_KB && VIEW.screen === 'groceries' ? (GRO_KB + h + 8) + 'px' : '';
}

// A3-T2A K2, B2: the open sheet sits right on top of the phone keyboard (the same visual viewport reading as the
// Groceries dock), never taller than what is left above it, so its header (Add, Save) always shows.
function sheetPlace_(vv) {
  var root = $('sheet');
  root.style.bottom = GRO_KB ? GRO_KB + 'px' : '';
  root.className = 'sheet' + (GRO_KB ? ' is-kb' : '');
  var room = GRO_KB && vv ? Math.round((Number(vv.height) || 0) - 8) : 0;
  var panels = Array.prototype.filter.call(root.children || [], function (c) { return /(^| )sheet-panel( |$)/.test(c.className || ''); });
  panels.forEach(function (p) { p.style.maxHeight = room > 120 ? room + 'px' : ''; });
}

function renderGroceries_(data) {
  var root = $('groceries');
  var lists = data === undefined ? LISTS : data;
  var here = lists ? groHere_() : '';
  if (here) here = groShopCanon_(here, groKnownShops_(lists));
  GRO_FOCUS_EL = null;
  if (GRO && lists && !GRO.field) { root.textContent = ''; GRO = null; } // the lists arrived: build the field
  if (!GRO) {
    root.textContent = '';
    GRO = { head: add(root, 'div', ''), box: null, field: null, note: null, rest: null, toasts: null, recent: null };
    GRO.rest = add(root, 'div', '');
    if (lists) { // A1-T7: the dock comes after the list, where it shows (at the bottom)
      var a = groAddBox_(root);
      GRO.box = a.box;
      GRO.field = a.field;
      GRO.note = a.note;
      GRO.toasts = a.toasts;
      GRO.recent = a.recent;
      GRO.shopBox = a.shopBox; // F4
      GRO.shopChips = a.shopChips;
      GRO.shopName = a.shopName;
    }
  }
  if (here) { // A2-T3: In the shop: Back to all shops above the shop's name
    var bw = add(GRO.head, 'div', 'wrap gro-back-row');
    groKey_(btn(bw, 'back', 'Back to all shops', function () { groLeaveHere_(here); }), 'back');
  }
  var title = here ? listsPanel_(GRO.head, here, 'In the shop') : listsPanel_(GRO.head, 'Groceries');
  var top = add(GRO.head, 'div', 'wrap');
  listsProblems_(top, lists);
  var body = add(GRO.rest, 'div', 'wrap');
  var main = add(body, 'div', 'lists-main gro-main');
  if (!lists) listsWaiting_(main);
  else if (here) groHereMain_(main, lists, here, GRO.recent);
  else groMain_(main, lists, GRO.recent);
  add(body, 'div', GRO.box ? 'list-end gro-end' : 'list-end');
  listsDock_(GRO.toasts || GRO.rest);
  groShopPaint_(); // F4: the Shop row follows the lists (it also places the dock)
  groDockPlace_();
  if (!GRO_FOCUS_EL && GRO_FOCUS === 'add' && ADD_SLOT) GRO_FOCUS_EL = ADD_SLOT; // A1-T5: back to the Add slot
  // The add field is never rebuilt, so it is never focused from here (that would raise the keyboard).
  if (GRO_FOCUS_EL && !modalOpen_()) GRO_FOCUS_EL.focus({ preventScroll: true });
  listsNewScroll_(); // A3-T2A M4
  groTimerEnsure_();
  return title;
}

// Bought recently: one tap adds; what is on the list, or was ticked on this visit (M2), gets no chip.
function groRecent_(slot, lists, all, staples) {
  var onList = {};
  all.forEach(function (it) { onList[foldKey_(it.text)] = true; });
  (staples || []).forEach(function (k) { onList[k] = true; }); // PB-T3: a staple on show is not offered twice
  var recent = [];
  (Array.isArray(lists.boughtRecently) ? lists.boughtRecently : []).forEach(function (t) {
    var v = typeof t === 'string' ? sheetOneLine_(t) : '';
    if (v && !onList[foldKey_(v)]) {
      onList[foldKey_(v)] = true;
      recent.push(v);
    }
  });
  if (!recent.length || !slot) return;
  var r = add(slot, 'div', 'gro-recent'); // A1-T7: in the dock, above the add field
  add(r, 'p', 'gro-label', 'Bought recently').setAttribute('id', 'gro-recent-label');
  var row = add(r, 'div', 'gro-chips');
  row.setAttribute('role', 'group');
  row.setAttribute('aria-labelledby', 'gro-recent-label');
  recent.forEach(function (t, i) {
    groKey_(btn(row, 'gchip', t, function () {
      var next = recent[i + 1] || recent[i - 1];
      GRO_FOCUS = next ? 'recent:' + foldKey_(next) : '';
      groAdd_(t);
    }), 'recent:' + foldKey_(t));
  });
}

// PB-T3: "Usually bought around now", above the shop sections. The server picks them (most overdue first, at most
// 5); one tap adds it through the usual grocery add (placed in its learned shop, works offline, toast with Undo);
// the x hides it on this phone until its usual gap has passed again (kl.stapleSkip, never sent). Nothing on the
// list already, nothing hidden, and in the shop only that shop's. No strip when none is left.
var LS_STAPLE_SKIP = 'kl.stapleSkip'; // {folded name: the Bali day it shows again}
var GRO_SKIP = null;      // memory copy of kl.stapleSkip, so a dismiss holds for this visit even without storage
var X_PATHS = ['M7 7l10 10', 'M17 7L7 17'];

function groStapleSkipRead_(raw) {
  var v = null;
  try { v = raw ? JSON.parse(raw) : null; } catch (e) { v = null; }
  var out = {};
  if (!v || typeof v !== 'object' || Array.isArray(v)) return out;
  Object.keys(v).forEach(function (k) { if (k && todoValidDay_(v[k])) out[k] = v[k]; });
  return out;
}

function groSkip_() {
  if (GRO_SKIP === null) GRO_SKIP = groStapleSkipRead_(lsGet_(LS_STAPLE_SKIP));
  return GRO_SKIP;
}

function groStapleSkip_(st, today) {
  var gap = Math.ceil(Number(st.gapDays));
  if (!isFinite(gap) || gap < 1) gap = 7;
  var skip = groSkip_();
  var next = {};
  Object.keys(skip).forEach(function (k) { if (skip[k] > today) next[k] = skip[k]; }); // the ones past their day go
  next[foldKey_(st.text)] = isoAddDays_(today, gap);
  GRO_SKIP = next;
  lsSet_(LS_STAPLE_SKIP, JSON.stringify(next));
}

function groStaples_(main, lists, all, here) {
  var today = listsToday_(lists);
  if (!todoValidDay_(today)) return [];
  var onList = {};
  all.forEach(function (it) { onList[foldKey_(it.text)] = true; });
  var skip = groSkip_();
  var hk = here ? foldKey_(here) : '';
  var shown = [];
  (Array.isArray(lists.staples) ? lists.staples : []).forEach(function (st) {
    var t = st && typeof st.text === 'string' ? sheetOneLine_(st.text).slice(0, 500).trim() : '';
    var k = foldKey_(t);
    if (!t || onList[k] || (skip[k] && today < skip[k])) return;
    if (here && foldKey_(st.shop) !== hk) return;
    onList[k] = true;
    shown.push({ text: t, key: k, st: st });
  });
  if (!shown.length) return [];
  var box = add(main, 'div', 'gro-staples');
  add(box, 'p', 'gro-label', 'Usually bought around now').setAttribute('id', 'gro-staples-label');
  var row = add(box, 'div', 'gro-staple-row');
  row.setAttribute('role', 'group');
  row.setAttribute('aria-labelledby', 'gro-staples-label');
  shown.forEach(function (x, i) {
    var near = shown[i + 1] || shown[i - 1];
    var chip = add(row, 'span', 'gro-staple');
    groKey_(btn(chip, 'gchip gro-staple-add', x.text, function () {
      GRO_FOCUS = near ? 'staple:' + near.key : '';
      groAdd_(x.text);
    }), 'staple:' + x.key);
    var no = groKey_(btn(chip, 'gro-staple-x', null, function () {
      GRO_FOCUS = near ? 'staple:' + near.key : '';
      groStapleSkip_(x.st, today);
      render(true);
    }), 'staplex:' + x.key);
    no.setAttribute('aria-label', 'Not now: ' + x.text);
    no.appendChild(svgIcon_(X_PATHS));
  });
  return shown.map(function (x) { return x.key; });
}

// A1-T7: a run of rows is one white card.
function groCardRows_(main, items) {
  if (!items.length) return null;
  var c = listCard_(main);
  items.forEach(function (it) { groRow_(c, it, !!GRO_STRUCK[it.id]); });
  return c;
}

var GRO_STORE_PATHS = ['M4 10h16', 'M5.5 10l1.2-5h10.6l1.2 5', 'M6 10v9h12v-9', 'M10 19v-5h4v5'];

// A2-T3: a section header: an icon, the shop name and the count of its open items (struck ones do not count; no 0).
// A shop's header is one button that opens In the shop; Any shop's is a plain heading. It sticks while its section
// scrolls under it.
function groHead_(sec, shop, n) {
  var h = add(sec, 'h2', 'gro-head');
  var box = h;
  if (shop) {
    box = groKey_(btn(h, 'gro-sec-btn', null, function () { groEnterHere_(shop); }), 'sec:' + foldKey_(shop));
    box.setAttribute('aria-label', shop + ', ' + n + (n === 1 ? ' item' : ' items') + '. Shop here');
  }
  var av = add(box, 'span', shop ? 'gro-sec-av' : 'gro-sec-av any');
  av.setAttribute('aria-hidden', 'true');
  av.appendChild(svgIcon_(shop ? GRO_STORE_PATHS : tabIconPaths_('groceries')));
  add(box, 'span', 'gro-sec-name', shop || 'Any shop');
  var count = add(box, 'span', shop ? 'gro-sec-n' : 'gro-sec-n any', n ? String(n) : '');
  count.hidden = !n;
  if (shop) {
    var go = add(box, 'span', 'gro-sec-go', 'Shop here');
    go.setAttribute('aria-hidden', 'true');
  }
}

function groMain_(main, lists, recentSlot) {
  // Open items plus the ones struck in place on this visit: what decides the layout, so a tick moves nothing.
  var all = groItems_(lists);
  groRecent_(recentSlot, lists, all, groStaples_(main, lists, all, '')); // PB-T3: the staples strip, above the sections
  if (!all.length) emptyState_(main, 'All clear', 'Nothing on the list.'); // A1-T7: the calm empty state
  var shops = groSecOrder_(groKnownShops_({ shops: lists.shops, groceries: all }));
  var secs = groSections_(all, shops);
  if (secs.length === 1 && !secs[0].shop) {
    groCardRows_(main, all); // no shop at all: one plain card, no lone Any shop header
  } else {
    secs.forEach(function (sec) {
      var box = add(main, 'div', 'gro-sec');
      groHead_(box, sec.shop, sec.items.filter(function (it) { return !GRO_STRUCK[it.id]; }).length);
      groCardRows_(box, sec.items);
    });
  }
  var done = (Array.isArray(lists.doneToday) ? lists.doneToday : []).filter(function (it) {
    return it && it.list === 'grocery' && !GRO_STRUCK[it.id];
  });
  if (done.length) {
    var d = add(main, 'div', 'gro-done');
    var h = add(d, 'h2', 'todo-fold-h');
    var fold = groKey_(btn(h, 'todo-fold', 'Bought today', function () {
      GRO_FOCUS = 'fold:done';
      GRO_DONE_OPEN = !GRO_DONE_OPEN;
      render(true);
    }), 'fold:done');
    fold.setAttribute('aria-expanded', GRO_DONE_OPEN ? 'true' : 'false');
    if (GRO_DONE_OPEN) {
      var dc = listCard_(d);
      done.forEach(function (it) { groRow_(dc, it, true); });
    }
  }
}

// A2-T3: In the shop: that shop's items, in one card; A2 final: then the Any shop items (they can be bought anywhere)
// under a small Any shop heading, in a second card. Once none of either is left open: a calm All clear with Back,
// below the struck rows, so nothing moves under the finger and a mistaken tick can still be undone.
function groHereMain_(main, lists, here, recentSlot) {
  var all = groItems_(lists);
  groRecent_(recentSlot, lists, all, groStaples_(main, lists, all, here)); // PB-T3: only this shop's staples
  var k = foldKey_(here);
  var mine = all.filter(function (it) { return foldKey_(it.shop) === k; });
  var any = all.filter(function (it) { return !foldKey_(it.shop); });
  groCardRows_(main, mine);
  if (any.length) {
    var anyBox = add(main, 'div', 'gro-here-any-sec');
    add(anyBox, 'h2', 'gro-here-any', 'Any shop');
    groCardRows_(anyBox, any);
  }
  if (mine.concat(any).some(function (it) { return !GRO_STRUCK[it.id]; })) return;
  var box = add(main, 'div', 'gro-clear');
  emptyState_(box, 'All clear', 'Nothing left to buy here.');
  groKey_(btn(box, 'btn-plain gro-back-all', 'Back to all shops', function () { groLeaveHere_(here); }), 'back2');
}

// One row: the tick zone, then the text (2 lines at most). The section says the shop; the row never does.
// A3-T2B M2: the whole row is one button that ticks (and unticks) it, as in the mockup; editing moves to a 44 px
// "..." button at the end of an open row. The swipe stays.
var DOTS_PATHS = ['M6 12h.01', 'M12 12h.01', 'M18 12h.01'];
function groRow_(parent, it, done) {
  var row = add(parent, 'div', 'gro-row' + (done ? ' is-done' : ''));
  listsNewMark_(row, it); // A3-T2A M4
  listsSwipe_(row, function () {
    GRO_FOCUS = 'tick:' + it.id;
    if (done) groUntick_(it);
    else groTick_(it);
  }, done ? null : function () { listsDelete_('grocery', it); }, done ? 'Not bought' : 'Bought');
  var tap = groKey_(btn(row, 'gro-tap', null, function () {
    GRO_FOCUS = 'tick:' + it.id;
    if (done) groUntick_(it);
    else groTick_(it);
  }), 'tick:' + it.id);
  tap.setAttribute('aria-label', 'Bought: ' + it.text);
  tap.setAttribute('aria-pressed', done ? 'true' : 'false');
  add(tap, 'span', 'tick-zone').appendChild(svgIcon_(done ? TICK_DONE_PATHS : TICK_OPEN_PATHS));
  add(tap, 'span', 'gro-text', it.text);
  if (done) return;
  var more = groKey_(btn(row, 'gro-edit', null, function () {
    GRO_FOCUS = 'open:' + it.id;
    openItemSheet_(it, 'grocery');
  }), 'open:' + it.id);
  more.setAttribute('aria-label', 'Edit ' + it.text);
  more.appendChild(svgIcon_(DOTS_PATHS));
}

// F4: the Add sheet's Shop row for a new grocery item, under the text field, with the dock's rules (groShopGuess_):
// shown once there is text, the guess pressed until a chip is tapped, New shop a small field (Enter there adds).
// The chips are built once; one extra chip carries a guess the server list does not hold, and hides otherwise.
function sheetGShop_(p, s) {
  if (!s.sync) s.sync = [];
  s.here = VIEW.screen === 'groceries' ? groHere_() : '';
  s.gNew = false;
  var has = function () { return SHEET === s && !!sheetOneLine_(s.draft.text); };
  var guess = function () { return groShopGuess_(s.draft.text, LISTS, s.here); };
  var on = function () { return groShopHand_({ hand: s.hand.shop, shop: s.draft.shop }, s.draft.text, LISTS) ? s.draft.shop : guess(); };
  var known = groShopList_(LISTS, '');
  var isKnown = function (v) { return !foldKey_(v) || known.some(function (n) { return foldKey_(n) === foldKey_(v); }); };
  var row = add(p, 'div', 'sheet-row sheet-gshop');
  add(row, 'p', 'sheet-label', 'Shop').setAttribute('id', 'sheet-gshop-label');
  var g = sheetScrollRow_(s, add(row, 'div', 'sheet-chips sheet-scroll'));
  g.setAttribute('role', 'group');
  g.setAttribute('aria-labelledby', 'sheet-gshop-label');
  var input = null;
  var chip = function (label, value, shown) {
    var b = sheetCtl_(s, btn(g, 'schip', label, function () {
      if (SHEET !== s) return;
      s.draft.shop = typeof value === 'function' ? value() : value;
      s.hand.shop = true;
      s.gNew = false;
      input.value = '';
      sheetSync_(s);
    }), function () { return has() && (!shown || shown()); });
    s.sync.push(function () {
      var v = typeof value === 'function' ? value() : value;
      if (shown) b.hidden = !shown();
      if (typeof value === 'function' && !b.hidden) b.textContent = v;
      b.setAttribute('aria-pressed', groShopIsOn_(v, on()) ? 'true' : 'false');
    });
  };
  known.forEach(function (n) { chip(n, n); });
  chip('', guess, function () { return !isKnown(guess()); }); // a learned shop not on the server list yet
  chip('Any shop', '', function () { return !groShopLearned_(s.draft.text, LISTS); }); // fix 3: only when nothing is learned
  var more = sheetCtl_(s, btn(g, 'sheet-newshop', 'New shop', function () {
    if (SHEET !== s) return;
    if (!s.gNew) s.gKeep = { hand: s.hand.shop, shop: s.draft.shop };
    s.gNew = true;
    sheetSync_(s);
    input.focus();
  }), has);
  input = sheetCtl_(s, add(p, 'input', 'sheet-shop-input sheet-gshop-input'), function () { return has() && s.gNew; });
  input.setAttribute('type', 'text');
  input.setAttribute('aria-label', 'New shop');
  input.setAttribute('placeholder', 'Shop name');
  input.setAttribute('maxlength', '40');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('enterkeyhint', 'go');
  input.addEventListener('input', function () {
    if (SHEET !== s) return;
    if (sheetOneLine_(input.value)) {
      s.draft.shop = input.value;
      s.hand.shop = true;
    } else if (s.gKeep) { // an emptied field never clears the pick; Any shop does
      s.draft.shop = s.gKeep.shop;
      s.hand.shop = s.gKeep.hand;
    }
    sheetSync_(s);
  });
  input.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      sheetAdd_(s);
    }
  });
  s.sync.push(function () {
    row.hidden = !has();
    more.setAttribute('aria-expanded', s.gNew ? 'true' : 'false');
    input.hidden = !(has() && s.gNew);
  });
}

// The edit sheet's Shop part (called by sheetBuild_, for an item on the list): a chip for each of the 12 newest
// shops the server knows (plus the item's own shop when it is not among them), Any shop (A3-T2B p7: the list's own
// word; it was No shop), then a small New shop that
// shows a text field only when tapped. The shop the item is shown under is pressed; picking another sends it as
// the item's own (hand) shop. Matching ignores case and accents; a typed known shop is saved with its known
// spelling; the same shop typed differently is no change.
function sheetShop_(slot, s) {
  if (!s.sync) s.sync = [];
  var shops = groKnownShops_({ shops: LISTS && LISTS.shops }).slice(0, 12); // R60: the 12 newest from the server list
  var own = sheetOneLine_(s.draft.shop).slice(0, 40);
  if (own && !shops.some(function (n) { return foldKey_(n) === foldKey_(own); })) shops.push(own);
  s.newShop = false;
  add(slot, 'p', 'sheet-label', 'Shop').setAttribute('id', 'sheet-shop-label');
  var g = add(slot, 'div', 'sheet-chips');
  g.setAttribute('role', 'group');
  g.setAttribute('aria-labelledby', 'sheet-shop-label');
  var input = null;
  var chip = function (label, value) {
    var b = sheetCtl_(s, btn(g, 'schip', label, function () {
      if (SHEET !== s) return;
      s.draft.shop = value;
      s.newShop = false;
      input.value = '';
      sheetSync_(s);
    }));
    s.sync.push(function () {
      var k = foldKey_(s.draft.shop);
      b.setAttribute('aria-pressed', (value ? k === foldKey_(value) : !k) ? 'true' : 'false');
    });
  };
  shops.forEach(function (n) { chip(n, n); });
  // Fix 1 (ruling): a learned or guessed shop cannot be cleared by hand (the next read would place it again), so
  // such an item offers no Any shop; picking another shop makes it a hand shop. A3-T2B p7 (controller ruling): the
  // audit asked to always offer it, but the server has no hand "none", so it stays hidden here; only its words changed.
  var placed = s.orig && (s.orig.shopFrom === 'learned' || s.orig.shopFrom === 'guess') && !!own;
  if (!placed) chip('Any shop', '');
  var more = sheetCtl_(s, btn(g, 'sheet-newshop', 'New shop', function () {
    if (SHEET !== s) return;
    if (!s.newShop) s.shopKeep = s.draft.shop; // fix 1: an emptied field gives this back
    s.newShop = true;
    sheetSync_(s);
    input.focus();
  }));
  input = sheetCtl_(s, add(slot, 'input', 'sheet-shop-input'), function () { return s.newShop; });
  input.setAttribute('type', 'text');
  input.setAttribute('aria-label', 'New shop');
  input.setAttribute('placeholder', 'Shop name');
  input.setAttribute('maxlength', '40');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('enterkeyhint', 'done');
  input.addEventListener('input', function () {
    if (SHEET !== s) return;
    s.draft.shop = sheetOneLine_(input.value) ? input.value : (s.shopKeep || ''); // fix 1: empty never clears; Any shop does
    sheetSync_(s);
  });
  input.addEventListener('keydown', function (e) {
    if (e && e.key === 'Enter' && !e.isComposing && SHEET === s) {
      e.preventDefault();
      closeItemSheet_('close');
    }
  });
  s.sync.push(function () {
    more.setAttribute('aria-expanded', s.newShop ? 'true' : 'false');
    input.hidden = !s.newShop;
  });
  s.finish = function () {
    var was = s.orig ? sheetOneLine_(s.orig.shop) : '';
    if (sheetOneLine_(s.draft.shop) === was) return;
    var c = groShopCanon_(s.draft.shop, groKnownShops_(LISTS));
    s.draft.shop = (was && foldKey_(c) === foldKey_(was)) ? was : c;
  };
}

// ---- start ---------------------------------------------------------------------
$('go').addEventListener('click', submit);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
$('retry').addEventListener('click', function () {
  if (isListScreen_(VIEW.screen)) listsEnter_();
  else loadData(false);
});
window.addEventListener('hashchange', function () {
  if (!TOKEN) return;
  var v = viewFromHash(location.hash);
  if (v.screen === VIEW.screen && v.key === (VIEW.key || null)) return;
  if (v.screen === 'month' && DATA && !monthByKey(v.key)) v = { screen: 'home', key: null };
  go(v, true);
});
// Back online: send what waits now, instead of at the end of the backoff.
window.addEventListener('online', function () {
  if (RETRY_TIMER !== null) {
    clearTimeout(RETRY_TIMER);
    RETRY_TIMER = null;
  }
  listsFlush_();
});

// Another tab wrote kl.queue (R48).
window.addEventListener('storage', listsStorageChanged_);

// Task 7: the To do focus key follows focus; the sheet keeps Tab inside, closes on Escape and on back.
$('todo').addEventListener('focusin', function (e) {
  var t = e && e.target;
  TODO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
// Task 8: the same for Groceries; the 60 s refresh stops while the page is hidden.
$('groceries').addEventListener('focusin', function (e) {
  var t = e && e.target;
  GRO_FOCUS = (t && t.getAttribute && t.getAttribute('data-focus')) || '';
});
if (typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', groVisibility_);
// A1-T7: the Groceries dock follows the phone keyboard (the visual viewport shrinks or scrolls while it is up).
if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
  window.visualViewport.addEventListener('resize', groDockPlace_);
  window.visualViewport.addEventListener('scroll', groDockPlace_);
}
$('sheet').addEventListener('keydown', sheetKey_);
$('who').addEventListener('keydown', whoKey_);
$('sheet').addEventListener('focusin', function (e) { if (SHEET && e && e.target) SHEET.focusEl = e.target; });
window.addEventListener('popstate', sheetPopState_);
// R58: the page goes away (tab closed, put in the background cache) with the sheet open: save it.
window.addEventListener('pagehide', function () { if (SHEET) closeItemSheet_('hide'); });

listsQueueInit_();
TOKEN = stored();
if (TOKEN) openSession_();
else showCover('gate', '');
</script>
</body>
</html>

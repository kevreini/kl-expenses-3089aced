<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#2a3488" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2259" media="(prefers-color-scheme: dark)">
<title>Expenses</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f5f6f9;
    --ink: #171b34;
    --muted: #565b76;
    --rule: #d8dae6;
    --accent: #2a3488;
    --tint: #e3e5f4;
    --cover: #2a3488;
    --on-cover: #f5f6ff;
    --on-cover-muted: #c3c8ee;
    --on-cover-line: rgba(245, 246, 255, 0.42);
    --on-cover-fill: rgba(245, 246, 255, 0.12);
    --gutter: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10121f;
      --ink: #e9eaf4;
      --muted: #a3a7c0;
      --rule: #2b2e47;
      --accent: #a9b2f8;
      --tint: #252950;
      --cover: #1d2259;
      --on-cover: #f0f1ff;
      --on-cover-muted: #bdc2ea;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums lining-nums;
    overflow-wrap: anywhere;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }

  /* The cover: the PIN screen, the loading state and the top of every screen share one indigo panel. */
  .cover {
    min-height: 100vh;
    background: var(--cover);
    color: var(--on-cover);
    display: flex;
    align-items: center;
  }
  .cover .wrap { width: 100%; padding-top: 32px; padding-bottom: 64px; }
  .names { font-size: 15px; color: var(--on-cover-muted); }
  .cover h1 { font-size: 40px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 36px; }
  .cover :focus-visible, .panel :focus-visible { outline-color: var(--on-cover); }
  .cover label { display: block; font-size: 15px; color: var(--on-cover-muted); margin-bottom: 8px; }
  #pin {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 10px 16px;
    font: inherit;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: var(--on-cover);
    background: var(--on-cover-fill);
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
  }
  #go, #retry {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    color: var(--cover);
    background: var(--on-cover);
  }
  #go:disabled { opacity: 0.55; cursor: default; }
  #msg { margin-top: 16px; min-height: 1.45em; }
  #pulse {
    width: 64px;
    height: 2px;
    margin-bottom: 18px;
    background: var(--on-cover);
    animation: pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; opacity: 0.6; } }

  .panel { background: var(--cover); color: var(--on-cover); padding: 16px 0 28px; }
  .panel-top { display: flex; align-items: center; min-height: 44px; margin-bottom: 14px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    min-width: 44px;
    padding-right: 12px;
    color: var(--on-cover);
  }
  .back::before {
    content: "";
    width: 9px;
    height: 9px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }
  .panel h1 { font-size: 17px; font-weight: 500; }
  .panel h1.title-mid { font-size: 26px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.25; }
  .panel h1.title-big { font-size: 40px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; }
  .hero { font-weight: 300; font-size: 54px; line-height: 1.1; letter-spacing: -0.025em; margin-top: 6px; }
  .hero-cur { font-size: 20px; font-weight: 400; letter-spacing: 0; margin-right: 8px; color: var(--on-cover-muted); }
  .hero-idr { font-size: 17px; color: var(--on-cover-muted); margin-top: 2px; }
  .ruler { display: flex; justify-content: space-between; align-items: flex-end; height: 16px; margin-top: 22px; }
  .tick { width: 2px; height: 8px; background: var(--on-cover); opacity: 0.28; }
  .tick-past { opacity: 1; }
  .tick-today { height: 16px; opacity: 1; }
  .panel-note { margin-top: 8px; font-size: 15px; }
  .panel-small { margin-top: 8px; font-size: 14px; color: var(--on-cover-muted); }
  .panel-verdict { margin-top: 20px; font-size: 18px; font-weight: 500; line-height: 1.3; }
  .panel-action {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 16px;
    padding: 0 16px;
    border: 1px solid var(--on-cover-line);
    border-radius: 10px;
    font-size: 15px;
  }

  section { padding-top: 34px; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .small { font-size: 14px; color: var(--muted); }
  .textbtn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  /* Months */
  .scroller { overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .chips {
    display: flex;
    gap: 8px;
    margin: 0 calc(var(--gutter) * -1);
    padding: 0 var(--gutter) 6px;
    scroll-padding: 0 var(--gutter);
  }
  .chip {
    flex: 0 0 auto;
    min-width: 122px;
    min-height: 44px;
    padding: 11px 14px 12px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .chip-month { font-size: 14px; color: var(--muted); }
  .chip-eur { font-size: 17px; font-weight: 500; white-space: nowrap; }
  .chip-part { font-size: 13px; color: var(--muted); }
  .chip:active, .barcol:active { background: var(--tint); }

  /* Balance */
  .balance-line {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    font-size: 21px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.005em;
  }
  .balance-line small { display: block; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .month-owes { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .month-owes span:last-child { text-align: right; }
  .why { margin-top: -6px; }
  .why h3 { font-size: 15px; font-weight: 600; margin: 18px 0 2px; }
  .why-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 15px;
  }
  .why-amt { white-space: nowrap; flex: none; }
  .why-total { font-weight: 600; border-bottom: 0; }
  .why-end { margin-top: 12px; font-weight: 500; }

  /* Monthly bars */
  .barsin { display: flex; position: relative; min-width: 100%; width: max-content; }
  .barcol { display: block; flex: 1 0 54px; min-height: 44px; border-radius: 6px; }
  .barplot {
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid var(--muted);
  }
  .barval { position: relative; z-index: 2; padding: 0 3px; margin-bottom: 3px; font-size: 13px; background: var(--paper); border-radius: 3px; }
  .bar { width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar-partial { background: var(--tint); border: 1.5px dashed var(--accent); border-bottom: 0; }
  .barlabel { height: 40px; padding-top: 5px; text-align: center; font-size: 13px; line-height: 1.2; }
  .barlabel span { display: block; color: var(--muted); font-size: 12px; }
  .usualline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--ink); z-index: 1; pointer-events: none; }
  .caption { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .caption + .caption { margin-top: 4px; }

  .linkrow {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .linkrow b { display: block; font-weight: 600; font-size: 17px; }
  .chev {
    flex: none;
    width: 9px;
    height: 9px;
    margin-right: 4px;
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    transform: rotate(45deg);
  }
  .foot { padding: 20px 0 48px; }
  .notice { font-size: 15px; }
  .notice b { font-weight: 600; }

  /* Categories */
  .cat {
    display: block;
    width: calc(100% + 16px);
    margin: 0 -8px;
    min-height: 44px;
    padding: 10px 8px 11px;
    border-radius: 8px;
  }
  .cat[aria-pressed="true"] { background: var(--tint); }
  .cat:active { background: var(--tint); }
  .cat-top, .cat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .cat-name { font-weight: 500; }
  .cat-share { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .cat-eur { white-space: nowrap; font-weight: 500; flex: none; }
  .cat-bottom { align-items: center; margin-top: 3px; }
  .cat-track { flex: 1; min-width: 0; }
  .catbar { display: block; height: 6px; background: var(--accent); border-radius: 3px; min-width: 2px; }
  .cat-idr { font-size: 14px; color: var(--muted); white-space: nowrap; flex: none; }

  /* Icons */
  .icon { display: block; flex: none; width: 20px; height: 20px; color: var(--muted); }
  .cat-name-box { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-type { display: flex; align-items: center; gap: 8px; }

  /* Every expense */
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 2px; }
  .list-head h2 { margin: 0; }
  .day { font-size: 14px; font-weight: 600; color: var(--muted); padding: 18px 0 4px; border-bottom: 1px solid var(--rule); }
  .row-wrap { border-bottom: 1px solid var(--rule); }
  .row { display: flex; width: 100%; justify-content: space-between; gap: 10px; min-height: 44px; padding: 11px 0; }
  .row-btn:active { background: var(--tint); }
  .back:disabled, .cat:disabled, .textbtn:disabled { opacity: 0.55; cursor: default; }
  .row-btn:disabled { cursor: default; color: inherit; }
  .row-open { width: calc(100% + 16px); margin: 0 -8px; padding-left: 8px; padding-right: 8px; background: var(--tint); }
  .row .icon { margin-top: 1px; }
  .row-left { min-width: 0; flex: 1; }
  .row-right { flex: none; text-align: right; max-width: 52%; }
  .row-item, .row-meta, .row-main, .row-sub { display: block; }
  .row-item { font-weight: 500; }
  .row-meta { font-size: 14px; color: var(--muted); }
  .row-main { font-weight: 500; white-space: nowrap; }
  .row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; }

  /* Fixing an expense */
  .editor { padding: 6px 0 16px; }
  .editor label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .select-line { display: flex; align-items: center; gap: 10px; }
  .type-icon { flex: none; width: 20px; height: 20px; }
  select {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 8px;
  }
  select:disabled { opacity: 0.55; }
  .editor-note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .editor-error { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--accent); }
  .editor-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-main, .btn-plain {
    flex: 1;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-main { color: var(--paper); background: var(--accent); }
  .btn-plain { border: 1px solid var(--rule); }
  .btn-main:disabled, .btn-plain:disabled { opacity: 0.55; cursor: default; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 16px;
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: calc(100% - 32px);
    max-width: 520px;
    min-height: 52px;
    padding: 4px 16px;
    border-radius: 10px;
    color: var(--on-cover);
    background: var(--cover);
    border: 1px solid var(--on-cover-line);
  }
  .toast button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 6px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toast button:disabled { opacity: 0.55; cursor: default; }
  .toast :focus-visible { outline-color: var(--on-cover); }
  .list-end { height: 84px; }
  .flag {
    display: inline-block;
    margin: 5px 0 0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--tint);
  }
  .receipt {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: -8px 0 2px 30px;
    font-size: 14px;
    color: var(--accent);
    text-underline-offset: 3px;
  }

  /* Tendencies */
  .lead { font-size: 21px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; }
  .sentence { margin-top: 12px; }
  .units { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .unit { min-height: 44px; min-width: 88px; padding: 0 14px; text-align: center; font-size: 15px; }
  .unit[aria-pressed="true"] { background: var(--accent); color: var(--paper); font-weight: 600; }
  .tablewrap { margin: 12px calc(var(--gutter) * -1) 0; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; overflow-wrap: normal; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  thead th { vertical-align: bottom; font-weight: 600; font-size: 13px; }
  thead span { display: block; font-weight: 400; color: var(--muted); }
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    padding-left: var(--gutter);
    text-align: left;
    white-space: normal;
    min-width: 112px;
    max-width: 128px;
    background: var(--paper);
    font-weight: 500;
    border-right: 1px solid var(--rule);
  }
  tbody td.col-usual { font-weight: 500; background: var(--tint); }
  thead th.col-usual { background: var(--tint); }
  tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--muted); }
  tfoot td.col-usual { background: var(--tint); }
  td.zero { color: var(--muted); }
  .rolling-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .rolling-row span:last-child { text-align: right; }

  @media (hover: hover) {
    .chip:hover, .barcol:hover, .cat:hover { background: var(--tint); }
    .panel-action:hover, .back:hover { opacity: 0.8; }
  }
</style>
</head>
<body>
<div id="cover" class="cover">
  <div class="wrap">
    <h1>Expenses</h1>
    <div id="pulse" aria-hidden="true" hidden></div>
    <div id="gate" hidden>
      <label for="pin">Your PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <button id="go" type="button">Unlock</button>
    </div>
    <div id="msg" role="status"></div>
    <button id="retry" type="button" hidden>Try again</button>
  </div>
</div>
<div id="app" hidden>
  <div id="home"></div>
  <div id="month" hidden></div>
  <div id="trends" hidden></div>
  <div id="balance" hidden></div>
</div>
<script>
// Never run inside someone else's frame: show nothing and stop.
if (window.top !== window.self) {
  document.body.textContent = '';
  throw new Error('framed');
}

// Replace with the Apps Script web app's /exec address when publishing. It is set here and nowhere else.
var API_URL = 'https://script.google.com/macros/s/AKfycby_FV1p6a3AS7hn5yWWqyVo5Mb2C8sfaugadaP--16QFkLUx25xFwB3xxBGHEOMaTLIMw/exec';
var KEY = 'dashToken';
var NEEDS = '\u0000needs';
var TOKEN = null;
var DATA = null;
var LOADING = false;
var VIEW = { screen: 'home', key: null };
var FILTER = null;
var FOCUS_FILTER = null;
var UNIT = 'eur';
var HOME_Y = 0;
var EDIT = null;   // the expense being fixed: {id, rowNumber, draft, saving, error}
var EDIT_SEQ = 0;  // each editor opening gets its own id, so a late reply can tell it is not its editor
var TOAST = null;  // the line after saving: {text, undo, busy, refreshing}
var FOCUS_ROW = null;
var FIRST_LOAD = true;
var SESSION = 0;   // moves on at lock-out, so a late reply from before it is ignored
var FIELDS = [
  { field: 'category', label: 'Type' },
  { field: 'paidBy', label: 'Paid by' },
  { field: 'paidFor', label: 'Paid for' }
];

// ---- plain helpers ---------------------------------------------------------
function group(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fixed2(n) {
  var s = Math.abs(n).toFixed(2).split('.');
  return group(s[0]) + '.' + s[1];
}

function fmtIdr(n) {
  return (n < 0 ? '-' : '') + 'Rp ' + group(Math.abs(Math.round(n)));
}

function fmtEur(n) {
  return (n < 0 ? '-' : '') + 'EUR ' + fixed2(n);
}

function dayOfMonth(iso) {
  var y = Number(iso.slice(0, 4));
  var m = Number(iso.slice(5, 7));
  return { day: Number(iso.slice(8, 10)), days: new Date(Date.UTC(y, m, 0)).getUTCDate() };
}

function dayText(iso) {
  var d = dayOfMonth(iso);
  return 'day ' + d.day + ' of ' + d.days;
}

function monthName(key) {
  var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return names[Number(key.slice(5, 7)) - 1];
}

function shortMonth(key) {
  return monthName(key).slice(0, 3) + ' ' + key.slice(0, 4);
}

function dateLabel(iso) {
  if (!iso) return 'No date';
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var d = new Date(Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))));
  return days[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + monthName(iso);
}

function andList(words) {
  if (words.length < 2) return words.join('');
  return words.slice(0, -1).join(', ') + ' and ' + words[words.length - 1];
}

function whoText(r) {
  if (!r.paidBy) return 'Payer not set';
  var by = r.paidBy === 'Couple' ? 'Joint money' : r.paidBy + ' paid';
  if (!r.paidFor) return by;
  return by + ', for ' + (r.paidFor === 'Couple' ? 'both' : r.paidFor);
}

function balanceText(net) {
  if (Math.abs(net) < 0.005) return 'All square';
  return 'To even up: ' + (net < 0 ? 'Lili pays Kev ' : 'Kev pays Lili ') + fmtEur(Math.abs(net));
}

// A positive effect moves the balance toward Lili, a negative one toward Kev.
function effectText(effect) {
  var who = effect > 0 ? 'in Lili’s favour' : (effect < 0 ? 'in Kev’s favour' : '');
  return { amount: fmtEur(Math.abs(effect)), who: who };
}

// Fixed icon table. Paths are constant strings in this file, never data. Stroke only, on a 24px grid.

// What Save would send, in a fixed order. old is what Undo sends back.
function pendingChanges(row, draft) {
  var fields = [['category', 'Type'], ['paidBy', 'Paid by'], ['paidFor', 'Paid for']];
  var out = [];
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i][0];
    if (draft[f] !== row[f]) out.push({ field: f, label: fields[i][1], old: row[f], value: draft[f] });
  }
  return out;
}

function saveFailText(doneLabels, failLabel, reason) {
  if (!doneLabels.length) return reason;
  return andList(doneLabels) + (doneLabels.length === 1 ? ' was' : ' were') + ' saved. ' + failLabel + ' was not. ' + reason;
}

function rowByNumber(months, rowNumber) {
  for (var i = 0; i < months.length; i++) {
    for (var j = 0; j < months[i].rows.length; j++) {
      if (months[i].rows[j].rowNumber === rowNumber) return months[i].rows[j];
    }
  }
  return null;
}

// Options as [value, label]. A current value off the list still shows, so the editor never misstates a row.
function editOptions(options, current) {
  for (var i = 0; i < options.length; i++) {
    if (options[i][0] === current) return options;
  }
  return [[current, current === '' ? 'Not set' : current]].concat(options);
}

function partialLabel(m, todayIso) {
  if (!m.partial) return '';
  return m.key >= todayIso.slice(0, 7) ? 'so far' : 'part month';
}

function comparison(m, usual, rate, todayIso) {
  var v = m.vsUsual;
  if (v) {
    if (v.direction === 'same' || v.diffIdr === 0) return { verdict: 'same', text: 'The same as your usual.' };
    var abs = Math.abs(v.diffIdr);
    return { verdict: v.direction, text: fmtIdr(abs) + ' (' + fmtEur(abs / rate) + ') ' + v.direction + ' your usual.' };
  }
  if (m.partial && m.key >= todayIso.slice(0, 7)) {
    return { verdict: null, text: 'So far: ' + dayText(todayIso) + '. No comparison until the month ends.' };
  }
  if (m.partial) return { verdict: null, text: 'Not a full month, so it is not compared with your usual.' };
  return { verdict: null, text: 'Too few full months yet to compare.' };
}

// What was actually paid comes first, the other currency second.
function rowAmounts(r) {
  function paid() {
    if (r.currency === 'IDR') return fmtIdr(r.amount);
    if (r.currency === 'EUR') return fmtEur(r.amount);
    return (r.currency ? r.currency + ' ' : '') + fixed2(r.amount);
  }
  if (r.needsAmount) return { main: r.amount === null ? 'No amount' : paid(), sub: [] };
  if (r.currency === 'IDR') return { main: paid(), sub: [fmtEur(r.eur)] };
  if (r.currency === 'EUR') return { main: paid(), sub: [fmtIdr(r.idr)] };
  return { main: paid(), sub: [fmtIdr(r.idr), fmtEur(r.eur)] };
}

function rowsFor(m, filter) {
  if (filter === null) return m.rows;
  return m.rows.filter(function (r) {
    return filter === NEEDS ? r.needsAmount : r.category === filter;
  });
}

function shareText(share) {
  if (share > 0 && share < 0.01) return 'under 1%';
  return Math.round(share * 100) + '%';
}

function trendSentences(p) {
  var t = p.tendencies;
  var rate = t.rate;
  var out = [];
  function both(idr) { return fmtIdr(idr) + ' (' + fmtEur(idr / rate) + ')'; }
  if (t.change) {
    out.push(t.change.sentence + ': ' + (t.change.diffIdr < 0 ? 'down ' : 'up ') + both(Math.abs(t.change.diffIdr)) + '.');
  }
  if (p.usual) {
    out.push('Your usual month is ' + both(p.usual.avgIdr) + ', the average of ' + andList(p.usual.keys.map(monthName)) + '.');
  } else {
    out.push('Your usual month appears once there are 3 full months.');
  }
  if (t.rows.length && t.rows[0].totalIdr > 0) {
    out.push('Over all months, the most went on ' + t.rows[0].category + ': ' + both(t.rows[0].totalIdr) + '.');
  }
  return out;
}

function rateNote(months) {
  var out = [];
  for (var i = 0; i < months.length; i++) {
    if (Math.abs(months[i].totalEur - months[i].comparisonEur) >= 1) {
      out.push(months[i].label + ' is ' + fmtEur(months[i].totalEur) + ' in the sheet, at the rate used that month.');
    }
  }
  return out.join(' ');
}

function viewHash(view) {
  if (view.screen === 'month') return '#month=' + view.key;
  if (view.screen === 'trends') return '#tendencies';
  if (view.screen === 'balance') return '#balance';
  return '';
}

function viewFromHash(hash) {
  var m = /^#month=(\d{4}-\d{2})$/.exec(hash || '');
  if (m) return { screen: 'month', key: m[1] };
  if (hash === '#tendencies') return { screen: 'trends', key: null };
  if (hash === '#balance') return { screen: 'balance', key: null };
  return { screen: 'home', key: null };
}

// ---- token: kept in memory, and in browser storage when the browser allows it ----
function store(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function unstore() { try { localStorage.removeItem(KEY); } catch (e) {} }

// ---- DOM helpers: every value goes in as text --------------------------------
function $(id) { return document.getElementById(id); }

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function add(parent, tag, cls, text) {
  return parent.appendChild(el(tag, cls, text));
}

function btn(parent, cls, text, onClick) {
  var b = add(parent, 'button', cls, text);
  b.setAttribute('type', 'button');
  b.addEventListener('click', onClick);
  return b;
}

function icon(name) {
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '20');
  svg.setAttribute('height', '20');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.6');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  iconPaths(name).forEach(function (d) {
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
  });
  return svg;
}

// True while a save or undo is on its way. Back, filters and rows wait for it.
function busy() {
  return !!((EDIT && EDIT.saving) || (TOAST && TOAST.busy));
}

function monthByKey(key) {
  for (var i = 0; i < DATA.months.length; i++) {
    if (DATA.months[i].key === key) return DATA.months[i];
  }
  return null;
}

// Keeps a currency next to its number when a sentence wraps.
function nb(s) {
  return s.replace(/(Rp|EUR) (?=[-\d])/g, '$1\u00a0');
}

function rateText() {
  return 'Euros at a fixed rate of ' + group(DATA.rate) + ' so months compare fairly.';
}

// ---- talking to the script ------------------------------------------------------
// Every call comes through here. credentials: 'omit' is the point: Google's multi-account cookies are never sent.
// Resolves with the result. Rejects with {code}: NO_SESSION, NOT_CONFIGURED, BAD_REQUEST or SERVER from the
// script, TIMEOUT after 30 seconds, UNREACHED for anything else, such as no connection or a page that is not JSON.
function call_(action, payload) {
  var body = { action: action };
  for (var k in payload) body[k] = payload[k];
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 30000);
  return fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    credentials: 'omit',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(function (res) {
    if (!res.ok) throw { code: 'UNREACHED' };
    return res.json();
  }).then(function (reply) {
    clearTimeout(timer);
    if (reply && reply.ok === true) {
      // Sliding session: keep the fresh token, unless this phone has been locked out meanwhile.
      if (typeof reply.token === 'string' && reply.token && TOKEN) {
        TOKEN = reply.token;
        store(reply.token);
      }
      return reply.result;
    }
    throw { code: (reply && typeof reply.error === 'string') ? reply.error : 'SERVER' };
  }, function (err) {
    clearTimeout(timer);
    if (err && typeof err.code === 'string') throw err;
    throw { code: err && err.name === 'AbortError' ? 'TIMEOUT' : 'UNREACHED' };
  });
}

// True when the reply never arrived, so a save may or may not have landed.
function unreached(err) {
  return !!err && (err.code === 'TIMEOUT' || err.code === 'UNREACHED');
}

var REACH_TEXT = 'Could not reach the server. Try again.';

// ---- cover: PIN, loading and load errors --------------------------------------
function msg(t) { $('msg').textContent = t; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function clock(ms) {
  var d = new Date(ms);
  var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return d.toDateString() === new Date().toDateString() ? t : 'tomorrow at ' + t;
}

function showCover(mode, text) {
  $('app').hidden = true;
  $('cover').hidden = false;
  $('gate').hidden = mode !== 'gate';
  $('pulse').hidden = mode !== 'loading';
  $('retry').hidden = mode !== 'error';
  msg(text || '');
}

function submit() {
  var pin = $('pin').value;
  if (!pin) return;
  var go = $('go');
  if (go.disabled) return;
  go.disabled = true;
  $('pin').value = '';
  msg('Checking...');
  call_('unlock', { pin: pin }).then(function (r) {
    go.disabled = false;
    if (r && r.ok) {
      TOKEN = r.token;
      store(r.token);
      loadData(false);
    }
    else if (r && r.locked) { msg('Locked until ' + clock(r.untilMs) + '.'); }
    else if (r && r.notReady) { msg('Not set up yet.'); }
    else if (r && r.retry) { msg('Could not check. Try again.'); }
    else { msg('Wrong PIN.'); }
  }, function (err) {
    go.disabled = false;
    msg(unreached(err) ? REACH_TEXT : 'Something went wrong. Try again.');
  });
}

function clearScreens() {
  $('home').textContent = '';
  $('month').textContent = '';
  $('trends').textContent = '';
  $('balance').textContent = '';
}

function lockOut() {
  SESSION++;
  LOADING = false;
  TOKEN = null;
  DATA = null;
  VIEW = { screen: 'home', key: null };
  FILTER = null;
  EDIT = null;
  TOAST = null;
  FIRST_LOAD = true;
  unstore();
  try { location.hash = ''; } catch (e) {}
  clearScreens();
  showCover('gate', 'Please enter your PIN.');
}

function loadFailed(quiet, err) {
  var code = err ? err.code : '';
  if (code === 'NO_SESSION') { lockOut(); return; }
  if (quiet && DATA) {
    if (TOAST && TOAST.refreshing) {
      TOAST = { text: (TOAST.after ? TOAST.after + ' ' : '') + 'Could not refresh. These are the last numbers loaded.', key: TOAST.key };
    }
    render(true);
    homeStatus('Could not update. These are the last numbers loaded.');
    return;
  }
  if (code === 'NOT_CONFIGURED') {
    showCover('error', 'Your PIN works, but the expenses sheet is not connected yet.');
    return;
  }
  if (unreached(err)) {
    showCover('error', REACH_TEXT);
    return;
  }
  showCover('error', 'Could not load your expenses. Check the connection and try again.');
}

function loadData(quiet) {
  if (LOADING) return;
  LOADING = true;
  if (quiet) homeStatus('Updating...');
  else showCover('loading', 'Opening your expenses. The first load can take a few seconds.');
  var session = SESSION;
  var slow = setTimeout(function () {
    if (LOADING && !quiet) msg('Still working. If nothing changes soon, close this page and open it again.');
  }, 15000);
  call_('data', { token: TOKEN }).then(function (p) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    if (!p || !p.months) { loadFailed(quiet, ''); return; }
    DATA = p;
    if (FIRST_LOAD) {
      FIRST_LOAD = false;
      VIEW = viewFromHash(location.hash);
    }
    $('cover').hidden = true;
    $('app').hidden = false;
    if (VIEW.screen === 'month' && !monthByKey(VIEW.key)) VIEW = { screen: 'home', key: null };
    if (TOAST && TOAST.refreshing) TOAST = TOAST.after ? { text: TOAST.after, key: TOAST.key } : null;
    render(true);
  }, function (err) {
    clearTimeout(slow);
    if (session !== SESSION) return;
    LOADING = false;
    loadFailed(quiet, err);
  });
}

function homeStatus(text) {
  var s = HOME_STATUS;
  if (s) s.textContent = text;
}
var HOME_STATUS = null;

// ---- navigation ---------------------------------------------------------------
// The screen lives in the address after #, so the phone's back button steps through screens.
function remember(view) {
  try {
    var h = viewHash(view);
    if (location.hash !== h) location.hash = h;
  } catch (e) {}
}

function go(view, fromHistory) {
  if (VIEW.screen === 'home') HOME_Y = window.scrollY || 0;
  if (view.screen !== 'month' || view.key !== VIEW.key) FILTER = null;
  VIEW = view;
  EDIT = null;
  TOAST = null;
  if (view.editRow) {
    var r = rowByNumber(DATA.months, view.editRow);
    if (r) startEdit(r);
  }
  if (!fromHistory) remember(view);
  render(false);
  if (view.editRow && EDIT_EL) EDIT_EL.scrollIntoView({ block: 'center' });
}

function goHome() { go({ screen: 'home', key: null }); }
function goMonth(key) { go({ screen: 'month', key: key }); }

function render(keepScroll) {
  clearScreens();
  HOME_STATUS = null;
  $('home').hidden = VIEW.screen !== 'home';
  $('month').hidden = VIEW.screen !== 'month';
  $('trends').hidden = VIEW.screen !== 'trends';
  $('balance').hidden = VIEW.screen !== 'balance';
  var title = null;
  EDIT_EL = null;
  if (VIEW.screen === 'month') title = renderMonth();
  else if (VIEW.screen === 'trends') title = renderTrends();
  else if (VIEW.screen === 'balance') title = renderBalanceScreen();
  else renderHome();
  if (!keepScroll) {
    window.scrollTo(0, VIEW.screen === 'home' ? HOME_Y : 0);
    if (title) title.focus({ preventScroll: true });
  }
}

// ---- shared pieces --------------------------------------------------------------
function panel(parent) {
  var p = add(parent, 'div', 'panel');
  return add(p, 'div', 'wrap');
}

function panelBack(w) {
  var top = add(w, 'div', 'panel-top');
  var back = btn(top, 'back', 'Back', function () {
    if (VIEW.from === 'balance') go({ screen: 'balance', key: null });
    else goHome();
  });
  back.disabled = busy();
}

function heroAmount(w, m) {
  var h = add(w, 'p', 'hero');
  add(h, 'span', 'hero-cur', 'EUR');
  h.appendChild(document.createTextNode((m.totalEur < 0 ? '-' : '') + fixed2(m.totalEur)));
  add(w, 'p', 'hero-idr', fmtIdr(m.totalIdr));
}

function dayRuler(w, iso) {
  var d = dayOfMonth(iso);
  var r = add(w, 'div', 'ruler');
  r.setAttribute('aria-hidden', 'true');
  for (var i = 1; i <= d.days; i++) {
    add(r, 'span', 'tick' + (i < d.day ? ' tick-past' : '') + (i === d.day ? ' tick-today' : ''));
  }
}

function section(parent, title) {
  var s = add(parent, 'section');
  if (title) add(s, 'h2', '', title);
  return s;
}

// ---- home -----------------------------------------------------------------------
function renderHome() {
  var root = $('home');
  var today = DATA.today;
  var curKey = today.slice(0, 7);
  var cur = monthByKey(curKey);

  var w = panel(root);
  add(w, 'div', 'panel-top').appendChild(el('p', 'names', 'Kev & Lili'));
  add(w, 'h1', '', monthName(curKey) + ' ' + curKey.slice(0, 4));
  if (cur) heroAmount(w, cur);
  dayRuler(w, today);
  add(w, 'p', 'panel-note', 'So far: ' + dayText(today));
  btn(w, 'panel-action', 'See all of ' + monthName(curKey), function () { goMonth(curKey); });

  var body = add(root, 'div', 'wrap');

  var ms = section(body, 'Every month');
  var chips = add(ms, 'div', 'scroller chips');
  DATA.months.forEach(function (m) {
    var c = btn(chips, 'chip', null, function () { goMonth(m.key); });
    add(c, 'span', 'chip-month', shortMonth(m.key));
    add(c, 'span', 'chip-eur', fmtEur(m.totalEur));
    var part = partialLabel(m, today);
    if (part) add(c, 'span', 'chip-part', part);
  });

  renderBalance(section(body));
  var barsEl = renderBars(section(body, 'Month by month, in euros'));

  if (DATA.notCountedYet > 0) {
    var nc = section(body);
    add(nc, 'p', 'notice', 'Not counted yet: ' + DATA.notCountedYet);
    add(nc, 'p', 'small', 'Messages the bot kept but did not add to any month.');
  }
  if (DATA.unplacedRows > 0) {
    var un = section(body);
    add(un, 'p', 'notice', DATA.unplacedRows + (DATA.unplacedRows === 1 ? ' row has no date' : ' rows have no date') + ' in the sheet, so no month includes ' + (DATA.unplacedRows === 1 ? 'it.' : 'them.'));
  }

  var ls = section(body);
  var link = btn(ls, 'linkrow', null, function () { go({ screen: 'trends', key: null }); });
  var lt = add(link, 'span');
  add(lt, 'b', '', 'Tendencies');
  add(lt, 'span', 'small', 'Every month by type of expense');
  add(link, 'span', 'chev').setAttribute('aria-hidden', 'true');

  var foot = add(body, 'div', 'foot');
  btn(foot, 'textbtn', 'Refresh', function () { loadData(true); });
  HOME_STATUS = add(foot, 'p', 'small');

  barsEl.scrollLeft = barsEl.scrollWidth; // newest month in view when there are many
}

function renderBalance(s) {
  var line = btn(s, 'balance-line', null, function () { go({ screen: 'balance', key: null }); });
  var words = add(line, 'span');
  add(words, 'span', '', nb(balanceText(DATA.balance.net)));
  add(words, 'small', '', 'See how it adds up');
  add(line, 'span', 'chev').setAttribute('aria-hidden', 'true');
}

function renderBars(s) {
  var PLOT = 118; // px height of the tallest bar; the rest of the plot leaves room for its label
  var usual = DATA.usual;
  var max = usual ? usual.avgIdr : 0;
  DATA.months.forEach(function (m) { if (m.totalIdr > max) max = m.totalIdr; });
  function px(idr) { return max > 0 ? Math.max(0, Math.round(idr / max * PLOT)) : 0; }

  var sc = add(s, 'div', 'scroller');
  sc.setAttribute('tabindex', '0');
  sc.setAttribute('role', 'group');
  sc.setAttribute('aria-label', 'Spending by month. Tap a month to open it.');
  var inner = add(sc, 'div', 'barsin');
  if (usual) {
    var line = add(inner, 'div', 'usualline');
    line.style.bottom = (40 + px(usual.avgIdr)) + 'px';
  }
  var today = DATA.today;
  DATA.months.slice().reverse().forEach(function (m) {
    var part = partialLabel(m, today);
    var col = btn(inner, 'barcol', null, function () { goMonth(m.key); });
    col.setAttribute('aria-label', m.label + ': ' + fmtEur(m.comparisonEur) + (part ? ', ' + part : '') + '. Open this month.');
    var plot = add(col, 'div', 'barplot');
    add(plot, 'span', 'barval', group(Math.round(m.comparisonEur)));
    var bar = add(plot, 'div', 'bar' + (m.partial ? ' bar-partial' : ''));
    bar.style.height = px(m.totalIdr) + 'px';
    var lab = add(col, 'div', 'barlabel', monthName(m.key).slice(0, 3));
    if (part) add(lab, 'span', '', part === 'so far' ? 'so far' : 'part');
  });

  add(s, 'p', 'caption', nb(rateText() + ' ' + rateNote(DATA.months)));
  var hasPartial = DATA.months.some(function (m) { return m.partial; });
  var legend = [];
  if (usual) legend.push('The line is your usual month, ' + fmtEur(usual.avgEur) + '.');
  if (hasPartial) legend.push('Dashed bars are not full months.');
  if (legend.length) add(s, 'p', 'caption', nb(legend.join(' ')));
  return sc;
}

  var today = DATA.today;
  var w = panel(root);
  panelBack(w);
  var title = add(w, 'h1', '', m.label);
  title.setAttribute('tabindex', '-1');
  heroAmount(w, m);

  var cmp = comparison(m, DATA.usual, DATA.rate, today);
  if (m.partial && m.key === today.slice(0, 7)) dayRuler(w, today);
  if (cmp.verdict) {
    add(w, 'p', 'panel-verdict', nb(cmp.text));
    add(w, 'p', 'panel-small', nb('Your usual is ' + fmtIdr(DATA.usual.avgIdr) + ' (' + fmtEur(DATA.usual.avgEur) + '), the average of ' + andList(DATA.usual.keys.map(monthName)) + '.'));
    add(w, 'p', 'panel-small', rateText());
  } else {
    add(w, 'p', 'panel-note', cmp.text);
  }
  if (m.needsAmountCount > 0) {

  var body = add(root, 'div', 'wrap');
  function choose(value) {
    var was = FILTER;
    FILTER = FILTER === value ? null : value;

    render(true);
    if (FILTER !== null && was !== FILTER && LIST_TOP) {
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      LIST_TOP.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    }
  }

  if (m.categories.length || m.needsAmountCount > 0) {
    var cs = section(body, 'By type of expense');
    var top = m.categories.length ? m.categories[0].share : 0;
    m.categories.forEach(function (c) {
      var b = btn(cs, 'cat', null, function () { choose(c.name); });
      b.disabled = busy();
      b.setAttribute('aria-pressed', FILTER === c.name ? 'true' : 'false');
      var line1 = add(b, 'span', 'cat-top');
      var nameBox = add(line1, 'span', 'cat-name-box');
      nameBox.appendChild(icon(c.name));
      add(nameBox, 'span', 'cat-name', c.name);
      add(nameBox, 'span', 'cat-share', shareText(c.share));
      add(line1, 'span', 'cat-eur', fmtEur(c.eur));
      var line2 = add(b, 'span', 'cat-bottom');
      var track = add(line2, 'span', 'cat-track');
      var fill = add(track, 'span', 'catbar');
      fill.style.width = (top > 0 ? Math.round(c.share / top * 100) : 0) + '%';
      add(line2, 'span', 'cat-idr', fmtIdr(c.idr));
      if (FOCUS_FILTER === c.name) { b.focus({ preventScroll: true }); FOCUS_FILTER = null; }
    });
    if (m.needsAmountCount > 0) {
      var needBtn = btn(cs, 'cat', null, function () { choose(NEEDS); });
      needBtn.disabled = busy();
      needBtn.setAttribute('aria-pressed', FILTER === NEEDS ? 'true' : 'false');
      var nl = add(needBtn, 'span', 'cat-top');
      add(nl, 'span', 'cat-name', 'Needs an amount');
      add(nl, 'span', 'cat-eur', m.needsAmountCount + (m.needsAmountCount === 1 ? ' expense' : ' expenses'));
      if (FOCUS_FILTER === NEEDS) { needBtn.focus({ preventScroll: true }); FOCUS_FILTER = null; }
    }

  var rows = rowsFor(m, FILTER);
  var ls = add(body, 'section');

  var head = add(ls, 'div', 'list-head');
  var name = FILTER === null ? 'Every expense' : (FILTER === NEEDS ? 'Needs an amount' : FILTER + ' only');
  add(head, 'h2', '', name);
  if (FILTER !== null) btn(head, 'textbtn', 'Show all', function () { FILTER = null; render(true); }).disabled = busy();
  else add(head, 'span', 'small', rows.length + (rows.length === 1 ? ' expense' : ' expenses'));

  if (!rows.length) add(ls, 'p', 'small', FILTER === null ? 'No expenses in this month.' : 'No expenses left here.');
  var lastDate;
  rows.forEach(function (r) {
    if (r.date !== lastDate) {
      add(ls, 'div', 'day', dateLabel(r.date));
      lastDate = r.date;
    }
    renderRow(ls, r);
  });
  add(body, 'div', 'list-end');
  renderToast(root);
  return title;

  var open = editable && EDIT && EDIT.rowNumber === r.rowNumber;
  var row;

    row = btn(wrap, 'row row-btn' + (open ? ' row-open' : ''), null, function () { toggleEdit(r); });
    row.disabled = busy();
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (FOCUS_ROW === r.rowNumber) { row.focus({ preventScroll: true }); FOCUS_ROW = null; }
  } else {
    row = add(wrap, 'div', 'row');
  }
  row.appendChild(icon(r.category));
  var left = add(row, 'span', 'row-left');
  add(left, 'span', 'row-item', r.item || 'No name');
  var who = whoText(r) + '.';
  add(left, 'span', 'row-meta', (FILTER === null || FILTER === NEEDS) ? r.category + '. ' + who : who);
  if (r.needsAmount) add(left, 'span', 'flag', 'Needs an amount');
  var right = add(row, 'span', 'row-right');
  var amt = rowAmounts(r);
  add(right, 'span', 'row-main', amt.main);
  amt.sub.forEach(function (t) { add(right, 'span', 'row-sub', t); });
  if (r.receipt && /^https:\/\/(drive|docs)\.google\.com\//.test(r.receipt)) {
    var a = add(wrap, 'a', 'receipt', 'Receipt');
    a.setAttribute('href', r.receipt);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  }
  if (open) {
    EDIT_EL = wrap;
    renderEditor(wrap, r);
  }
}

// ---- fixing an expense ----------------------------------------------------------
function startEdit(r) {
  EDIT_SEQ++;
  EDIT = { id: EDIT_SEQ, rowNumber: r.rowNumber, draft: { category: r.category, paidBy: r.paidBy, paidFor: r.paidFor }, saving: false, error: '' };
}

function toggleEdit(r) {
  if (EDIT && EDIT.saving) return;
  if (EDIT && EDIT.rowNumber === r.rowNumber) {
    EDIT = null;
    FOCUS_ROW = r.rowNumber;
  } else {
    startEdit(r);
  }
  TOAST = null;
  render(true);
}

function renderEditor(parent, r) {
  var box = add(parent, 'div', 'editor');
  var controls = {};
  function picker(f, options, typeSlot, locked) {
    var id = 'edit-' + f.field;
    var lab = add(box, 'label', '', f.label);
    lab.setAttribute('for', id);
    var line = add(box, 'div', 'select-line');
    var slot = typeSlot ? add(line, 'span', 'type-icon') : null;
    if (slot) slot.appendChild(icon(EDIT.draft[f.field]));
    var sel = add(line, 'select');
    sel.setAttribute('id', id);
    editOptions(options, EDIT.draft[f.field]).forEach(function (o) {
      var opt = add(sel, 'option', '', o[1]);
      opt.value = o[0];
    });
    sel.value = EDIT.draft[f.field];
    sel.disabled = EDIT.saving || !!locked;
    sel.addEventListener('change', function () {
      EDIT.draft[f.field] = sel.value;
      if (slot) {
        slot.textContent = '';
        slot.appendChild(icon(sel.value));
      }
    });
    controls[f.field] = sel;
    return sel;
  }
  var cats = (DATA.categories || []).map(function (c) { return [c, c]; });
  var typeLocked = !DATA.canChangeType;
  picker(FIELDS[0], typeLocked ? [] : cats, true, typeLocked);
  if (typeLocked) add(box, 'p', 'editor-note', 'Type cannot be changed right now.');
  picker(FIELDS[1], [['Couple', 'Joint money'], ['Kev', 'Kev'], ['Lili', 'Lili']]);
  picker(FIELDS[2], [['Couple', 'Both'], ['Kev', 'Kev'], ['Lili', 'Lili']]);
  add(box, 'p', 'editor-note', 'To change the amount, edit the sheet or tell the bot.');
  if (EDIT.error) add(box, 'p', 'editor-error', EDIT.error).setAttribute('role', 'alert');
  var actions = add(box, 'div', 'editor-actions');
  var save = btn(actions, 'btn-main', EDIT.saving ? 'Saving...' : 'Save', function () {
    FIELDS.forEach(function (f) { EDIT.draft[f.field] = controls[f.field].value; });
    saveEdit(r.rowNumber);
  });
  var cancel = btn(actions, 'btn-plain', 'Cancel', function () { toggleEdit(r); });
  save.disabled = EDIT.saving;
  cancel.disabled = EDIT.saving;
}

function refusalText(res) {
  if (res && res.retry) return 'Could not save. Try again.';
  if (res && res.settlement) return 'A settlement cannot be changed here.';
  if (res && res.invalid) return 'That choice is not allowed.';
  return 'Could not save. Try again.';
}

function labelsOf(changes) {
  return changes.map(function (c) { return c.label; });
}

function setToast(t, key) {
  t.key = key;
  TOAST = t;
}

// The expense itself: columns A to E, which an edit here can never change.
function sameExpense(a, b) {
  return !!a && !!b && a.date === b.date && a.item === b.item && a.amount === b.amount && a.currency === b.currency && a.eur === b.eur;
}

// Sends job.changes one after another. Each one needs the fingerprint from the reply before it, and stops
// if a different expense has moved into the row. job: {rowNumber, fingerprint, expect, changes, saved,
// done(saved, fingerprint), failed(saved, change, res, fingerprint), noData(saved, rest), unsure(saved, change, rest)}.
function sendChanges(job) {
  if (!job.changes.length) { job.done(job.saved, job.fingerprint); return; }
  var change = job.changes[0];
  var session = SESSION;
  call_('update', {
    token: TOKEN,
    rowNumber: job.rowNumber,
    fingerprint: job.fingerprint,
    field: change.field,
    value: change.value
  }).then(function (res) {
    if (session !== SESSION) return;
    if (!res || !res.ok) { job.failed(job.saved, change, res, job.fingerprint); return; }
    job.saved = job.saved.concat([change]);
    job.changes = job.changes.slice(1);
    if (!res.data) { job.noData(job.saved, job.changes); return; }
    DATA = res.data;
    var now = rowByNumber(DATA.months, job.rowNumber);
    job.fingerprint = sameExpense(job.expect, now) ? now.fingerprint : null;
    if (job.fingerprint === null && job.changes.length) {
      job.failed(job.saved, job.changes[0], { conflict: true }, null);
      return;
    }
    sendChanges(job);
  }, function (err) {
    if (session !== SESSION) return;
    if (err && err.code === 'NO_SESSION') { lockOut(); return; }
    // The save may have landed, so it is never sent again. The page refreshes and says to check.
    if (unreached(err)) { job.unsure(job.saved, change, job.changes.slice(1)); return; }
    job.failed(job.saved, change, null, job.fingerprint);
  });
}

// Closes the editor a reply belongs to, never one opened since.
function closeEdit(editId) {
  if (EDIT && EDIT.id === editId) EDIT = null;
}

function conflictRefresh(saved, label, key, editId) {
  var labels = labelsOf(saved);
  closeEdit(editId);
  setToast({
    text: saveFailText(labels, label, 'This expense changed. Refreshing.'),
    refreshing: true,
    after: labels.length ? saveFailText(labels, label, 'This expense changed.') : null
  }, key);
  render(true);
  loadData(true);
}

function savedNoDataRefresh(saved, rest, key, editId) {
  var labels = labelsOf(saved);
  var text = rest.length
    ? andList(labels) + (labels.length === 1 ? ' was' : ' were') + ' saved. ' + andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.'
    : null;
  closeEdit(editId);
  setToast({ text: (text || 'Saved.') + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

function savedUnsureRefresh(saved, change, rest, key, editId) {
  var parts = [];
  if (saved.length) parts.push(andList(labelsOf(saved)) + (saved.length === 1 ? ' was' : ' were') + ' saved.');
  parts.push('Could not reach the server, so check whether ' + change.label + ' saved.');
  if (rest.length) parts.push(andList(labelsOf(rest)) + (rest.length === 1 ? ' was' : ' were') + ' not sent.');
  var text = parts.join(' ');
  closeEdit(editId);
  setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
  render(true);
  loadData(true);
}

function undoFor(rowNumber, fingerprint, expect, changes) {
  return (fingerprint && changes.length) ? { rowNumber: rowNumber, fingerprint: fingerprint, expect: expect, changes: changes } : null;
}

function saveEdit(rowNumber) {
  var row = rowByNumber(DATA.months, rowNumber);
  var changes = row ? pendingChanges(row, EDIT.draft) : [];
  if (!changes.length) {
    EDIT = null;
    FOCUS_ROW = rowNumber;
    render(true);
    return;
  }
  var key = VIEW.key;
  var editId = EDIT.id;
  EDIT.saving = true;
  EDIT.error = '';
  TOAST = null;
  render(true);
  sendChanges({
    rowNumber: rowNumber,
    fingerprint: row.fingerprint,
    expect: row,
    changes: changes,
    saved: [],
    done: function (saved, fingerprint) {
      closeEdit(editId);
      setToast({ text: 'Changed.', undo: undoFor(rowNumber, fingerprint, row, saved) }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh(saved, change.label, key, editId); return; }
      var reason = refusalText(res);
      if (saved.length) {
        setToast({ text: saveFailText(labelsOf(saved), change.label, reason), undo: undoFor(rowNumber, fingerprint, row, saved) }, key);
      }
      if (EDIT && EDIT.id === editId) {
        // A saved Type can take the row out of the filtered list. The bar above still says what happened.
        var m = monthByKey(key);
        var listed = m && rowsFor(m, FILTER).some(function (r) { return r.rowNumber === rowNumber; });
        if (listed) {
          EDIT.saving = false;
          EDIT.error = reason;
        } else {
          EDIT = null;
        }
      }
      render(true);
    },
    noData: function (saved, rest) { savedNoDataRefresh(saved, rest, key, editId); },
    unsure: function (saved, change, rest) { savedUnsureRefresh(saved, change, rest, key, editId); }
  });
}

function undoLast() {
  var undo = TOAST.undo;
  var key = TOAST.key;
  TOAST.busy = true;
  render(true);
  var back = undo.changes.slice().reverse().map(function (c) {
    return { field: c.field, label: c.label, old: c.value, value: c.old };
  });
  sendChanges({
    rowNumber: undo.rowNumber,
    fingerprint: undo.fingerprint,
    expect: undo.expect,
    changes: back,
    saved: [],
    done: function () {
      setToast({ text: 'Changed back.' }, key);
      render(true);
    },
    failed: function (saved, change, res, fingerprint) {
      if (res && res.conflict) { conflictRefresh([], change.label, key, null); return; }
      var left = undo.changes.slice(0, undo.changes.length - saved.length);
      var why = res && res.invalid ? 'That choice is not allowed.' : 'Try again.';
      setToast({ text: 'Could not undo. ' + why, undo: undoFor(undo.rowNumber, fingerprint, undo.expect, left) }, key);
      render(true);
    },
    noData: function (saved, rest) {
      if (rest.length) {
        setToast({ text: 'Could not finish the undo. Refreshing.', refreshing: true, after: 'Could not finish the undo.' }, key);
      } else {
        setToast({ text: 'Changed back. Refreshing.', refreshing: true, after: 'Changed back.' }, key);
      }
      render(true);
      loadData(true);
    },
    unsure: function () {
      var text = 'Could not reach the server, so check whether the undo went through.';
      setToast({ text: text + ' Refreshing.', refreshing: true, after: text }, key);
      render(true);
      loadData(true);
    }
  });
}

function renderToast(root) {
  if (!TOAST || TOAST.key !== VIEW.key) return;
  var bar = add(root, 'div', 'toast');
  bar.setAttribute('role', 'status');
  add(bar, 'span', '', TOAST.text);
  if (TOAST.undo) {
    var b = btn(bar, '', 'Undo', undoLast);
    b.disabled = !!TOAST.busy;
    if (!TOAST.busy && !EDIT) b.focus({ preventScroll: true });
  }
}

// ---- tendencies -----------------------------------------------------------------
function renderTrends() {
  var root = $('trends');
  var t = DATA.tendencies;
  var today = DATA.today;
  var w = panel(root);
  panelBack(w);
  var title = add(w, 'h1', 'title-big', 'Tendencies');
  title.setAttribute('tabindex', '-1');

  var body = add(root, 'div', 'wrap');
  var ss = section(body);
  trendSentences(DATA).forEach(function (text, i) {
    add(ss, 'p', i === 0 ? 'lead' : 'sentence', nb(text));
  });
  add(ss, 'p', 'caption', rateText());

  var ts = section(body, 'Month by type of expense');
  var units = add(ts, 'div', 'units');
  function unitBtn(value, label) {

    if (note) add(ts, 'p', 'caption', nb(note));
  } else {

  }

    return UNIT === 'eur' ? fixed2(idr / t.rate) : group(Math.round(idr));
  }
  function cell(tr, idr, cls) {
    var td = add(tr, 'td', cls || '', cellText(idr));

    return td;
  }

  var wrap = add(ts, 'div', 'scroller tablewrap');
  wrap.setAttribute('tabindex', '0');
  wrap.setAttribute('role', 'group');
  wrap.setAttribute('aria-label', 'Table of months by type of expense. It scrolls sideways.');
  var table = add(wrap, 'table');
  var hr = add(add(table, 'thead'), 'tr');
  function th(text, sub, cls) {
    var h = add(hr, 'th', cls || '', text);
    h.setAttribute('scope', 'col');
    if (sub) add(h, 'span', '', sub);
  }
  var hasUsual = !!DATA.usual;
  th('Type');
  if (hasUsual) th('Usual', 'a month', 'col-usual');
  DATA.months.forEach(function (m) { th(shortMonth(m.key), partialLabel(m, today)); });
  th('Total', 'all months');

  var tb = add(table, 'tbody');
  t.rows.forEach(function (r) {
    var tr = add(tb, 'tr');
    var label = add(add(tr, 'td'), 'span', 'cell-type');
    label.appendChild(icon(r.category));
    add(label, 'span', '', r.category);
    if (hasUsual) cell(tr, r.usualIdr === null ? 0 : r.usualIdr, 'col-usual');
    DATA.months.forEach(function (m) {
      var v = r.idrByMonth[m.key];
      cell(tr, v === undefined ? 0 : v);
    });
    cell(tr, r.totalIdr, 'row-total');
  });

  var ftr = add(add(table, 'tfoot'), 'tr');
  add(ftr, 'td', '', 'Total');
  if (hasUsual) cell(ftr, t.totals.usualIdr, 'col-usual');
  DATA.months.forEach(function (m) { cell(ftr, t.totals.idrByMonth[m.key] || 0, 'col-month'); });
  cell(ftr, t.totals.totalIdr, 'row-total');

  var hint = add(ts, 'p', 'caption', 'Swipe the table sideways to see every month.');
  hint.hidden = !(wrap.scrollWidth > wrap.clientWidth);

  if (t.rolling && t.rolling.length) {
    var rs = section(body, 'Average of the 3 months up to each month');
    t.rolling.forEach(function (x) {
      var m = monthByKey(x.key);
      var r = add(rs, 'div', 'rolling-row');
      add(r, 'span', '', m ? m.label : x.key);
      add(r, 'span', '', fmtIdr(x.avgIdr) + ' (' + fmtEur(x.avgEur) + ')');
    });
    add(rs, 'p', 'caption', rateText());
  }

  var foot = add(body, 'div', 'foot');
  foot.setAttribute('aria-hidden', 'true');
  return title;
}

// ---- start ---------------------------------------------------------------------
$('go').addEventListener('click', submit);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
$('retry').addEventListener('click', function () { loadData(false); });
window.addEventListener('hashchange', function () {
  if (!DATA) return;
  var v = viewFromHash(location.hash);
  if (v.screen === VIEW.screen && v.key === (VIEW.key || null)) return;
  if (v.screen === 'month' && !monthByKey(v.key)) v = { screen: 'home', key: null };
  go(v, true);
});

TOKEN = stored();
if (TOKEN) loadData(false);
else showCover('gate', '');
</script>
</body>
</html>
